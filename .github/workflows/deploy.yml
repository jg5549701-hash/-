name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/my-comic-log-app-fx2cvv
  workflow_dispatch:

# gh-pages 브랜치에 푸시해야 하므로 쓰기 권한이 필요하다.
permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # tsc -b 로 타입 체크까지 함께 돈다.
      - run: npm run build

      # Jekyll 처리를 건너뛴다.
      - run: touch dist/.nojekyll

      # 빌드 결과만 담은 단일 커밋으로 gh-pages 브랜치를 덮어쓴다.
      # (Pages 의 "GitHub Actions" 소스는 워크플로 토큰으로 켤 수 없어서
      #  브랜치 배포 방식을 쓴다)
      - name: Publish to gh-pages
        working-directory: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
