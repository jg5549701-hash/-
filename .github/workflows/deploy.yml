name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/my-comic-log-app-fx2cvv
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 진행 중인 배포를 취소하지는 않는다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # tsc -b 로 타입 체크까지 함께 돈다.
      - run: npm run build

      # Pages 는 저장소 Settings → Pages 에서 Source 를 "GitHub Actions" 로
      # 한 번만 켜두면 된다. (워크플로 토큰으로는 켤 수 없다)
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
