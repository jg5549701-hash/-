<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>벤치에서 우승 반지까지</title>
<meta name="description" content="실제 NBA 구단을 맡아 트레이드·훈련·작전으로 한 경기씩 이겨 우승 반지까지, 비공식 농구 단장·감독 시뮬레이션">
<meta name="theme-color" content="#0b0c10">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0c10;--panel:#171a21;--panel2:#232733;--line:#333846;--ink:#f3f4f7;--dim:#aab0be;--org:#ff7a1a;--org2:#ffb347;
  --green:#3ecf8e;--red:#ff5a5f;--blue:#5aa9ff;--gold:#ffd166;--purple:#b48cff;--teal:#2dd4bf}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;-webkit-tap-highlight-color:transparent;font-size:16px;line-height:1.5;word-break:keep-all}
body{min-height:100vh}
button{font-family:inherit;cursor:pointer;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 96px)}
h1,.disp{font-family:'Black Han Sans','Noto Sans KR',sans-serif;font-weight:400}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}
.card h3{font-size:16px;color:var(--ink);font-weight:700;letter-spacing:.04em;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:15px 16px;font-size:16.5px;font-weight:700;width:100%;text-align:center;line-height:1.4}
.btn:active{transform:scale(.98)}
.btn.pri{background:linear-gradient(135deg,var(--org),#ff9d3d);border-color:transparent;color:#1a0d00}
.btn.ghost{background:none}
.btn.gold{background:linear-gradient(135deg,#ffd166,#ffb347);color:#2a1a00;border-color:transparent}
.btn.sm{padding:10px 14px;font-size:14.5px;width:auto;white-space:nowrap;flex-shrink:0}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.btn small{font-weight:400}
.muted{color:var(--dim)}
.small{font-size:14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}
.top .brand{font-family:'Black Han Sans';font-size:20px;color:var(--org);white-space:nowrap}
.top .wk{font-size:13.5px;color:var(--dim);text-align:right}
.pc .nm{font-size:26px;font-weight:900}
.pc .sub{font-size:15px;color:var(--dim);margin-top:2px;line-height:1.5}
.ovr{text-align:center;background:var(--panel2);border-radius:14px;padding:8px 14px;min-width:78px}
.ovr b{display:block;font-size:11px;color:var(--dim);letter-spacing:.1em}
.ovr span{font-family:'Black Han Sans';font-size:34px;line-height:1.05;color:var(--org2)}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.tag{font-size:13.5px;padding:5px 11px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--dim);white-space:nowrap}
.tag.ct{color:var(--teal);border-color:#1f4a45}
.role{font-weight:900;color:#111;border:0}
.role-bench{background:#8d93a3}.role-rot{background:#5aa9ff}.role-sixth{background:#b48cff}.role-start{background:#3ecf8e}.role-ace{background:linear-gradient(135deg,#ffd166,#ff7a1a)}
.inj{background:var(--red);color:#fff;border:0;font-weight:700}
.lv{font-size:12.5px;font-weight:700;padding:2px 7px;border-radius:6px;white-space:nowrap}
.lv-pro{background:rgba(255,122,26,.18);color:var(--org2)}.lv-g{background:rgba(45,212,191,.15);color:var(--teal)}
.lv-col{background:rgba(90,169,255,.15);color:var(--blue)}.lv-hs{background:rgba(255,209,102,.15);color:var(--gold)}.lv-eu{background:rgba(180,140,255,.15);color:var(--purple)}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:80px 1fr 36px;align-items:center;gap:10px;font-size:14px;color:var(--dim)}
.bar i{display:block;height:10px;background:var(--panel2);border-radius:99px;overflow:hidden}
.bar i u{display:block;height:100%;border-radius:99px}
.bar em{font-style:normal;text-align:right;color:var(--ink);font-weight:700}
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.strip div{background:var(--panel2);border-radius:12px;padding:10px 4px}
.strip b{display:block;font-size:22px;font-weight:900}
.strip span{font-size:13px;color:var(--dim)}
.next{margin-top:12px;font-size:15px;color:var(--dim);display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;align-items:center}
.tgl{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--dim);font-weight:500;cursor:pointer}
.tgl input{accent-color:var(--org);width:16px;height:16px}
.train{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tbtn{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:13px 14px;text-align:left}
.tbtn:active{border-color:var(--org)}
.tbtn:disabled{opacity:.4}
.tbtn .r1{display:flex;justify-content:space-between;font-size:16px;font-weight:700;gap:6px}
.tbtn .r1 em{font-style:normal;color:var(--org2)}
.tbtn i{display:block;height:5px;background:#0e1015;border-radius:99px;margin-top:7px;overflow:hidden}
.tbtn i u{display:block;height:100%;background:var(--org);border-radius:99px}

.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.acts .tbtn{text-align:center;font-size:15px;font-weight:700;padding:14px 6px}
.acts .tbtn small{display:block;font-weight:400;color:var(--dim);font-size:12.5px;margin-top:3px}
.hint{font-size:14px;color:var(--dim);margin:10px 0 0;line-height:1.55}
.staff{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.staff .tbtn{font-size:14.5px}
.staff .r1{flex-direction:column;gap:2px}

.glist{display:grid;gap:6px}
.g{display:grid;grid-template-columns:32px 1fr auto;gap:12px;align-items:center;background:var(--panel2);border-radius:12px;padding:11px 12px;font-size:15px}

.wl.W{background:rgba(62,207,142,.2);color:var(--green)}.wl.L{background:rgba(255,90,95,.18);color:var(--red)}
.g .ln{color:var(--dim);font-size:13.5px}
.grade{font-family:'Black Han Sans';font-size:20px}
.gS{color:var(--gold)}.gA{color:var(--org2)}.gB{color:var(--green)}.gC{color:var(--blue)}.gD,.gF{color:var(--dim)}
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl th{color:var(--dim);font-weight:500;font-size:13px;text-align:right;padding:6px 4px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{text-align:right;padding:9px 5px;border-bottom:1px solid #1f222b}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl .l{text-align:left}
.tbl tr.me td{color:var(--org2);font-weight:700}
.tbl tr.cut td{border-bottom:2px dashed #3a3f4c}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(11,12,16,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line);
  display:flex;justify-content:center;padding:6px 8px calc(env(safe-area-inset-bottom) + 6px);z-index:5}
nav .in{display:grid;grid-template-columns:repeat(5,1fr);max-width:720px;width:100%}
nav button{background:none;border:0;padding:8px 0;font-size:13px;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button b{font-size:23px;font-weight:400}
nav button.on{color:var(--org)}
.modal{position:fixed;inset:0;background:#000;display:none;justify-content:center;z-index:10}
.modal.on{display:flex}
.mbox{background:var(--bg);width:100%;max-width:720px;height:100%;overflow:auto;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 34px) 22px 0;animation:up .22s ease-out}
@media (min-width:760px){.mbox{border-left:1px solid var(--line);border-right:1px solid var(--line);background:var(--panel)}}
@keyframes up{from{transform:translateY(18px);opacity:0}}
.mbox h2{font-family:'Black Han Sans';font-weight:400;font-size:30px;margin-bottom:18px;line-height:1.25}
.mbox h2:empty{display:none}
.mbody{font-size:16.5px;line-height:1.7}
.mbody p{margin-bottom:10px}
.mbody h4{font-size:17px;color:var(--ink);margin:24px 0 8px;font-weight:900}
.mbtns{display:grid;gap:10px;margin-top:auto;position:sticky;bottom:0;padding:22px 0 calc(env(safe-area-inset-bottom) + 18px);background:linear-gradient(transparent,var(--bg) 24%)}
@media (min-width:760px){.mbtns{background:linear-gradient(transparent,var(--panel) 24%)}}
.mbtns .btn{font-size:17.5px;padding:17px 16px}

.prog{position:fixed;inset:0;background:#000;display:none;justify-content:center;z-index:9}
.prog.on{display:flex}
.pin{background:var(--bg);width:100%;max-width:720px;height:100%;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 60px) 22px calc(env(safe-area-inset-bottom) + 18px)}
@media (min-width:760px){.pin{background:var(--panel);border-left:1px solid var(--line);border-right:1px solid var(--line)}}
.pin .pk{font-size:16px;color:var(--dim)}
.pin h2{font-family:'Black Han Sans';font-weight:400;font-size:32px;line-height:1.25;margin:8px 0 26px}
.pbar{height:12px;border-radius:99px;background:var(--panel2);overflow:hidden}
.pbar u{display:block;height:100%;background:linear-gradient(90deg,var(--org),var(--org2));border-radius:99px;transition:width .45s ease}
.pm{font-size:15px;color:var(--dim);margin-top:12px;display:flex;justify-content:space-between}
.plog{flex:1;overflow:auto;margin-top:22px;display:grid;align-content:start;gap:8px}
.prow{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;background:var(--panel2);border-radius:14px;padding:12px 14px;animation:up .3s ease-out}
.prow b{display:block;font-size:16px}.prow small{display:block;font-size:14px;color:var(--dim)}
.prow.note2{grid-template-columns:1fr;font-size:15px;border-left:3px solid var(--org)}
.pbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.pbtns .btn{font-size:17px;padding:17px}
.score{display:flex;justify-content:center;align-items:center;gap:14px;margin:6px 0 10px}
.score b{font-family:'Black Han Sans';font-size:48px;font-weight:400}
.score span{font-size:15px;color:var(--dim);text-align:center;max-width:110px;line-height:1.3}
.res{font-family:'Black Han Sans';font-size:22px;text-align:center;margin-bottom:8px}
.res.W{color:var(--green)}.res.L{color:var(--red)}
.qt{width:100%;border-collapse:collapse;font-size:15px;margin-bottom:10px;text-align:center}
.qt th{color:var(--dim);font-weight:500;padding:3px}
.qt td{padding:6px 3px;border-top:1px solid var(--line)}
.qt td:first-child,.qt th:first-child{text-align:left}
.qt td:last-child{font-weight:900}
.statbox{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;margin:8px 0}
.statbox div{background:var(--panel2);border-radius:12px;padding:12px 2px}
.statbox b{display:block;font-size:26px;font-weight:900}
.statbox span{font-size:13px;color:var(--dim)}
.line2{font-size:14px;color:var(--dim);text-align:center}
.pbp{list-style:none;margin:8px 0;font-size:15.5px}
.pbp li{display:grid;grid-template-columns:70px 1fr;gap:8px;padding:9px 0;border-bottom:1px dashed #262a34}
.pbp li span{color:var(--dim);font-size:14px;font-variant-numeric:tabular-nums}
.note{background:var(--panel2);border-radius:12px;padding:13px 15px;font-size:15.5px;margin-top:10px;line-height:1.55}
.note.hot{border-left:3px solid var(--org)}
.note.bad{border-left:3px solid var(--red)}
.note.good{border-left:3px solid var(--green)}
.award{display:flex;gap:14px;align-items:center;background:var(--panel2);border-radius:14px;padding:14px;margin-bottom:8px;font-size:16px}
.award .ic{font-size:26px}
.award b{display:block}
.award small{color:var(--dim)}
.offer{background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:10px}
.offer.re{border-color:#5a4020}
.offer .oh{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.offer .on{font-weight:900;font-size:17px}
.offer .ot{font-size:14px;color:var(--teal);font-weight:700}
.offer .od{font-size:14px;color:var(--dim);margin:6px 0 8px;line-height:1.55}
.offer .om{font-family:'Black Han Sans';font-size:23px;color:var(--gold);white-space:nowrap}
.offer .ob{display:flex;gap:6px;flex-wrap:wrap}
.offer .ob .btn{flex:1}
.offer .ms{font-size:12px;margin-top:6px}
.pick{display:grid;grid-template-columns:38px 1fr;gap:6px;font-size:15px;padding:8px 0;border-bottom:1px solid #22252e}
.pick.me{color:var(--org2);font-weight:900}
.pick small{color:var(--dim)}
.hero{text-align:center;padding:30px 0 20px}
.hero .ball{font-size:64px;display:inline-block;animation:bounce 1.2s infinite cubic-bezier(.5,0,.5,1)}
@keyframes bounce{50%{transform:translateY(-14px)}}
.hero h1{font-size:44px;line-height:1.1;margin:10px 0}
.hero h1 em{font-style:normal;color:var(--org)}
.hero p{color:var(--dim);font-size:14px;line-height:1.6}
label.lb{display:block;font-size:15px;color:var(--dim);margin:4px 0 8px}
input.txt{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px;color:var(--ink);font-family:inherit;margin-bottom:14px}
.posgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:8px}
.posgrid button,.diff button{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 0;font-weight:900;font-size:17px}
.posgrid button small,.diff button small{display:block;font-size:11.5px;color:var(--dim);font-weight:400;margin-top:2px}
.posgrid button.on,.diff button.on{border-color:var(--org);color:var(--org)}
.diff{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:16px}
.posdesc{font-size:14px;color:var(--dim);min-height:36px;margin-bottom:14px;line-height:1.5}
.cab{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cab div{background:var(--panel2);border-radius:12px;text-align:center;padding:10px 4px}
.cab div.off{opacity:.28}
.cab .ic{font-size:22px}
.cab b{display:block;font-size:19px}
.cab span{font-size:12px;color:var(--dim);display:block;line-height:1.3}
.goal{font-size:14px;color:var(--dim);margin-top:10px;text-align:center}
.depth{display:grid;gap:10px}
.depth .pg{display:grid;grid-template-columns:40px 1fr;gap:8px;align-items:start}
.depth .pg b{font-size:14px;color:var(--dim);padding-top:6px}
.depth .pl{display:flex;flex-wrap:wrap;gap:6px}
.depth .pl span{font-size:14px;background:var(--panel2);border-radius:8px;padding:5px 8px}
.depth .pl span.me{background:rgba(255,122,26,.2);color:var(--org2);font-weight:900}
.depth .pl span em{font-style:normal;color:var(--dim);margin-left:4px}
.road{display:flex;gap:4px;flex-wrap:wrap;margin-top:12px}
.road span{font-size:13px;padding:4px 10px;border-radius:99px;background:var(--panel2);color:var(--dim)}
.road span.on{background:rgba(255,122,26,.2);color:var(--org2);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:9px 13px;font-size:15px;font-weight:700}
.chip.on{border-color:var(--org);color:var(--org2);background:rgba(255,122,26,.12)}
.sched{display:grid;gap:6px}
.sched div{display:flex;justify-content:space-between;gap:8px;background:var(--panel2);border-radius:12px;padding:12px 14px;font-size:15.5px}
.sched div span{color:var(--dim);font-size:13.5px;white-space:nowrap}
.sum .big{font-family:'Black Han Sans';font-size:38px;line-height:1.2;margin:4px 0 22px}
.sum .big em{font-style:normal;color:var(--org2)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);font-size:17px}
.kv span{color:var(--dim)}
.kv b .up{color:var(--green)}.kv b .dn{color:var(--red)}
.tour{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);animation:up .3s ease-out}
.tour .ti{width:44px;height:44px;border-radius:50%;background:var(--panel2);display:grid;place-items:center;font-size:21px}
.tour b{display:block;font-size:16.5px}.tour small{color:var(--dim);font-size:14px}
.tour .tr{font-weight:900;white-space:nowrap;font-size:17px}
.feed{display:grid;gap:8px}
.post{background:var(--panel2);border-radius:14px;padding:14px 16px}
.post .ph{display:flex;justify-content:space-between;font-size:14px;color:var(--dim);margin-bottom:4px}
.post .ph b{color:var(--ink)}
.post p{font-size:16px;line-height:1.5}
.post .pl{font-size:12px;color:var(--dim);margin-top:6px}
.shop{display:grid;gap:8px}
.shop .it{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;background:var(--panel2);border-radius:12px;padding:10px 12px}
.shop .it .ic{font-size:28px}.shop .it b{font-size:16px}.shop .it small{display:block;color:var(--dim);font-size:13.5px}
</style>
<style>

.pl{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:11px 13px;text-align:left;width:100%}
.pl .po{font-weight:900;font-size:14px;color:var(--dim);text-align:center}

.b-st{background:rgba(255,179,71,.18);color:var(--org2)}.b-dev{background:rgba(90,169,255,.18);color:var(--blue)}.b-inj{background:rgba(255,90,95,.2);color:var(--red)}

  const p={id:S.nid++,n,pos,age,inj:0,cond:100,st:blankSt(),real:1,off:{pts,reb,ast,gp},sht:sh,pla:pl,ins,def:df,reb:rb};
  for(let i=0;i<4;i++){const dd=o-ovr(p);for(const k in ATT)p[k]=clamp(p[k]+dd,25,99)}
  const ov=ovr(p);p.pot=Math.round(age<=21?ov+rnd(4,10):age<=24?ov+rnd(1,5):ov);
  p.sal=Math.round(salaryFor(ov)*rnd(.9,1.1)*10)/10;p.yrs=ri(1,4);S.P[p.id]=p;return p}
function realRoster(tid){
  const ids=OFF[tid].map(r=>genOff(r).id);
  const have=ids.map(id=>P(id).pos),need=['PG','SG','SF','PF','C'].filter(x=>!have.includes(x));
  while(ids.length<13){const pos=need.shift()||pick(POSL);const p=genPlayer(pos,rnd(61,67),ri(22,31));p.sal=Math.min(p.sal,2);ids.push(p.id)}
  S.R[tid]=ids;
}
function genRoster(tid,base){
  const tpl=['PG','SG','SF','PF','C','PG','SG','SF','PF','C','SF','PG','C'];
  const ids=tpl.map((pos,i)=>{const tg=i<5?base+gauss(0,3):i<9?base-rnd(5,10):base-rnd(10,18);const age=i<5?ri(23,32):ri(20,33);return genPlayer(pos,tg,age).id});
  P(ids[ri(0,4)]).sht+=0;const star=P(ids[ri(0,4)]);const bump=rnd(5,11);for(const k in ATT)star[k]=clamp(star[k]+bump,25,99);star.sal=Math.round(salaryFor(ovr(star))*10)/10;
  S.R[tid]=ids;
}
function newGame(){
  S={v:1,year:2026,week:1,my:null,stage:'pick',flow:null,nid:1,P:{},R:{},teams:TEAM_NAMES.map((n,i)=>({id:i,name:n,w:0,l:0})),
    starters:[],strat:'balance',train:'sht',dev:[],chem:60,owner:60,exp:41,games:[],hist:[],tro:{},feed:[],next:null,po:null,offers:0};

/* ================= ratings ================= */
function lineup(tid){
  const ids=S.R[tid].filter(id=>!P(id).inj);
  if(tid===S.my){const st=S.starters.filter(id=>ids.includes(id));const rest=ids.filter(id=>!st.includes(id)).sort(byOvr);
    while(st.length<5&&rest.length)st.push(rest.shift());return{st,bn:rest.slice(0,4)}}
  const s=[...ids].sort(byOvr);return{st:s.slice(0,5),bn:s.slice(5,9)};
}
function rate(tid,strat){
  const {st,bn}=lineup(tid),mS=strat==='rest'?25:34,mB=bn.length?Math.min(32,(240-mS*st.length)/bn.length):0,mins={};
  st.forEach(id=>mins[id]=mS);bn.forEach(id=>mins[id]=mB);
  let off=0,def=0,tot=0,sh=0,ins=0,reb=0;
  for(const id in mins){const p=P(id),m=mins[id],cf=tid===S.my?(.82+.18*p.cond/100):.97;off+=m*offS(p)*cf;def+=m*defS(p)*cf;sh+=m*p.sht;ins+=m*p.ins;reb+=m*p.reb;tot+=m}
  tot=tot||1;const r={off:off/tot,def:def/tot,sht:sh/tot,ins:ins/tot,reb:reb/tot,mins,st,bn};
  r.R=(r.off+r.def)/2;
  r.style=r.sht>=r.ins+4?'three':r.ins>=r.sht+4?'paint':r.def>=r.off+5?'defense':'pace';
  return r;
}
function teamOvr(tid){const {st,bn}=lineup(tid);const a=[...st,...bn];return a.length?a.reduce((s,id)=>s+ovr(P(id)),0)/a.length:0}

/* ================= game ================= */
function stratEffect(me,op,strat){
  let adj=0,sd=12.5,notes=[];
  if(strat==='three'){adj+=(me.sht-72)*.18;sd=15}
  if(strat==='paint'){adj+=(me.ins-72)*.18-(op.def-72)*.08}
  if(strat==='press')adj+=.8;
  if(strat==='zone')adj+=.3;
  const c=(COUNTER[op.style]||{})[strat]||0;adj+=c;
  if(c>0)notes.push(`✅ 상대의 ${STYLES[op.style]} 운영에 ${STRATS[strat].n}${josa(STRATS[strat].n,'이','가')} 잘 먹혔다 (+${c})`);
  if(c<0)notes.push(`⚠️ ${STRATS[strat].n}${josa(STRATS[strat].n,'은','는')} ${STYLES[op.style]} 팀 상대로 불리했다 (${c})`);
  return{adj,sd,notes};
}
function simGame(oppId,home,strat,interactive,cb,opt){
  opt=opt||{};
  const me=rate(S.my,strat),opS=opt.opS||pick(['balance','balance','press','three','paint']),op=rate(oppId,opS);
  const ef=stratEffect(me,op,strat);
  const Rme=me.R+ef.adj+(S.chem-60)*.06+(home?1.5:-1.5)+(opt.adj||0);
  let margin=(Rme-op.R-.8)*1.0+gauss(0,ef.sd+(opt.sd||0));
  const r={opp:oppId,home,strat,me,op,notes:ef.notes.concat(opt.notes||[]),margin,opt};
  if(interactive&&Math.abs(margin)<=(opt.cth||3.5)&&Math.random()<(opt.cp||.4)){r.margin=-1;r.clutchAt=true}
  finishGame(r);cb(r);
}
function clutchOpts(r){
  const ids=[...r.me.st,...r.me.bn].map(P);
  const sh=[...ids].sort((a,b)=>b.sht-a.sht)[0],sc=[...ids].sort((a,b)=>offS(b)-offS(a))[0],pg=[...ids].sort((a,b)=>b.pla-a.pla)[0],big=[...ids].filter(x=>x!==pg).sort((a,b)=>b.ins-a.ins)[0]||pg;
  const k=r.opt&&r.opt.fin?.94:1;
  return[
    {k:'iso',t:`⭐ ${sc.n}에게 아이솔레이션`,s:`득점력 ${Math.round(offS(sc))}`,pr:(.2+offS(sc)*.0048)*k,who:sc,pts:2},
    {k:'pnr',t:`🤝 ${pg.n}–${big.n} 픽앤롤`,s:`플레이메이킹 ${Math.round(pg.pla)} · 골밑 ${Math.round(big.ins)}`,pr:(.22+(pg.pla+big.ins)*.0023)*k,who:big,ast:pg,pts:2},
    {k:'three',t:`🏹 ${sh.n}의 코너 3점 세트`,s:`슈팅 ${Math.round(sh.sht)}`,pr:(.1+sh.sht*.0036)*k,who:sh,pts:3}];
}
function clutchPick(r,done){
  const opts=clutchOpts(r);
  modal('⏱ 작전 타임!',`<p>4쿼터 종료 <b>${f1(rnd(4,9))}초</b> 전, <b>${esc(short(T(r.opp).name))}</b>에 <b style="color:var(--red)">${r.sc}-${r.os}, 1점 차</b>로 뒤지고 있다.</p>${r.opt&&r.opt.fin?'<p style="color:var(--gold)"><b>NBA 파이널의 무게가 어깨를 누른다…</b></p>':''}<p>마지막 공격, 어떤 작전을 그릴까?</p>`,
    opts.map(o=>({t:`${o.t}<br><small class="muted">${o.s}</small>`,fn:()=>{
      const ok=Math.random()<o.pr;r.clutch={ok,o};
      if(ok){r.sc+=o.pts;r.qa[3]+=o.pts;r.margin=r.sc-r.os;r.win=true;if(r.box[o.who.id])r.box[o.who.id].pts+=o.pts;if(o.ast&&r.box[o.ast.id])r.box[o.ast.id].ast++}
      r.notes.unshift(ok?`⏱ 버저비터! ${o.who.n}의 위닝샷으로 역전승!`:`⏱ ${o.who.n}의 마지막 슛이 빗나갔다…`);
      if(LV)liveShot(r,o,ok,done);else done()}})));
}
function watch(r,label,done){
  const fin=()=>{liveHide();done()};
  const after=()=>{if(r.clutchAt)clutchPick(r,fin);else fin()};
  if(S.liveOn!==false)liveRun(r,label,after);else after();
}
function finishGame(r){
  let m=Math.round(r.margin);if(m===0)m=Math.random()<.5?1:-1;r.margin=m;r.win=m>0;
  const base=Math.round(rnd(104,120));r.sc=Math.round(base+m/2);r.os=r.sc-m;
  // box score
  const mins=r.me.mins,ids=Object.keys(mins).map(Number),box={};
  let wp=0,wr=0,wa=0;const W={};
  const hc=id=>r.opt&&r.opt.hot==id?1.7:r.opt&&r.opt.cold==id?.55:1;
  ids.forEach(id=>{const p=P(id),m=mins[id];W[id]={p:m*Math.pow(offS(p)/65,2.4)*rnd(.7,1.3)*hc(id),r:m*Math.pow(p.reb/60,2)*rnd(.7,1.3),a:m*Math.pow(p.pla/60,3)*rnd(.6,1.4)};wp+=W[id].p;wr+=W[id].r;wa+=W[id].a});
  const treb=Math.round(43+(r.me.reb-r.op.reb)*.3+gauss(0,4)),tast=Math.round(25+gauss(0,4));
  ids.forEach(id=>{const p=P(id),m=Math.round(mins[id]+gauss(0,2));box[id]={min:Math.max(1,m),pts:Math.round(r.sc*W[id].p/wp),reb:Math.round(treb*W[id].r/wr),ast:Math.round(tast*W[id].a/wa),stl:poisson(m/36*(p.def-40)/40),blk:poisson(m/36*Math.max(0,p.ins+p.def-110)/45)}});
  let diff=r.sc-ids.reduce((s,id)=>s+box[id].pts,0);const top=[...ids].sort((a,b)=>box[b].pts-box[a].pts);
  while(diff!==0){const id=top[Math.floor(Math.random()*Math.min(3,top.length))];const d=diff>0?1:-1;if(box[id].pts+d>=0){box[id].pts+=d;diff-=d}else diff=0}
  r.box=box;
  // quarters
  const split=(t)=>{const w=[0,1,2,3].map(()=>rnd(.85,1.15)),s=w.reduce((a,b)=>a+b),q=w.map(x=>Math.round(t*x/s));q[3]+=t-q.reduce((a,b)=>a+b);return q};
  r.qa=split(r.sc);r.qb=split(r.os);
}

/* ================= per-game update ================= */
function ageF(a){return a<=21?1.3:a<=24?1.1:a<=27?.7:a<=30?.3:.05}
function applyGame(r){
  const me=T(S.my),op=T(r.opp);if(r.win){me.w++;op.l++}else{me.l++;op.w++}
  // stats, fatigue, injuries
  const notes=[];const fat=r.strat==='press'?1.5:r.strat==='rest'?.6:1;
  for(const id of S.R[S.my]){const p=P(id),b=r.box[id];
    if(b){const s=p.st;s.gp++;for(const k of['min','pts','reb','ast','stl','blk'])s[k]+=b[k];p.cond-=b.min*.24*fat}
    p.cond=clamp(p.cond+10+(S.train==='rest'?6:0),0,100);
    if(p.inj>0)p.inj--;
    else if(b&&Math.random()<.0022+(p.cond<50?.006:0)){const x=Math.random();p.inj=x<.7?ri(1,4):x<.95?ri(5,15):ri(20,50);notes.push(`🚑 ${p.n} 부상 (${p.inj}경기 결장)`);
      post(`${T(S.my).name} ${p.n} 부상 소식… ${p.inj}경기 결장 예상`,'@hoops_daily')}
  }
  // training
  const f=S.train;
  for(const id of S.R[S.my]){const p=P(id);if(p.inj)continue;const pf=clamp((p.pot-ovr(p))/10,0,1.2),g=.025*ageF(p.age)*pf*(S.dev.includes(id)?2.2:1);
    if(ATT[f])p[f]=Math.min(99,p[f]+g*1.6);for(const k in ATT)if(k!==f)p[k]=Math.min(99,p[k]+g*.12)}
  S.chem=clamp(S.chem+.12+(f==='chem'?.6:0)+(r.win?.1:-.05),0,100);
  // league
  const ids=shuffle(S.teams.map(t=>t.id).filter(i=>i!==S.my&&i!==r.opp)),rt={};
  for(let i=0;i+1<ids.length;i+=2){const a=ids[i],b=ids[i+1];rt[a]=rt[a]||rate(a,'balance').R;rt[b]=rt[b]||rate(b,'balance').R;
    if(Math.random()<1/(1+Math.exp(-(rt[a]-rt[b])/11)))(T(a).w++,T(b).l++);else(T(b).w++,T(a).l++)}
  r.inj=notes;r.g=S.week;
  S.games.push({g:S.week,opp:r.opp,home:r.home,win:r.win,sc:r.sc,os:r.os,strat:r.strat,top:topLine(r)});
  const tl=topLine(r);if(tl&&r.box[tl.id].pts>=35)post(`${tl.n} ${r.box[tl.id].pts}점 폭발! ${short(op.name)} 상대로 원맨쇼`,'@농구중독자');
  if(r.clutch&&r.clutch.ok)post(`${short(me.name)} 버저비터 승리!! ${r.clutch.o.who.n} 미쳤다 ⏱`,'@버저비터맨');
  S.week++;
}
function topLine(r){const ids=Object.keys(r.box).map(Number);if(!ids.length)return null;const id=ids.sort((a,b)=>r.box[b].pts-r.box[a].pts)[0];return{id,n:P(id).n,pts:r.box[id].pts,reb:r.box[id].reb,ast:r.box[id].ast}}
function nextGame(){let o;do o=ri(0,29);while(o===S.my);return{opp:o,home:Math.random()<.5}}

/* ================= decisions during season ================= */
function decisionsAfter(){
  const q=[];
  if(S.week-1===ALLSTAR){const all=allStars();const mine=all.filter(id=>S.R[S.my].includes(id));
    q.push(next=>modal('⭐ 올스타 발표',`<p>${mine.length?`우리 팀에서 <b>${mine.length}명</b>이 올스타에 뽑혔다!`:'아쉽게도 우리 팀에서 올스타가 나오지 않았다.'}</p>${mine.map(id=>`<div class="note">⭐ ${esc(P(id).n)} · ${P(id).pos} · OVR ${Math.round(ovr(P(id)))}</div>`).join('')}`,[{t:'확인',cls:'pri',fn:next}]));
    mine.forEach(id=>post(`${P(id).n}, ${S.year} 올스타 선정!`,'@NBA_소식'))}
  if(S.week-1===DEADLINE)q.push(next=>modal('⏰ 트레이드 마감',`<p>트레이드 마감일이 지났다. 이제 시즌이 끝날 때까지 트레이드할 수 없다.</p>`,[{t:'확인',cls:'pri',fn:next}]));
  if(S.week<=DEADLINE&&Math.random()<.035){const o=aiOffer();if(o)q.push(next=>offerModal(o,next))}
  return q;
}
function allStars(){const all=[];for(const t of S.teams)for(const id of S.R[t.id]){const p=P(id);all.push([id,ovr(p)+(t.w/(t.w+t.l||1)-.5)*8+gauss(0,1.5)])}
  return all.sort((a,b)=>b[1]-a[1]).slice(0,24).map(x=>x[0])}
function runQueue(q,done){const f=q.shift();if(!f){done();return}f(()=>runQueue(q,done))}

/* ================= trades ================= */
function value(p){const o=ovr(p);let v=Math.pow(Math.max(0,o-50),2)/10;
  const am=p.age<=23?1.2+(p.pot-o)*.02:p.age<=28?1:p.age<=31?.8:.55;
  const fair=salaryFor(o),cm=clamp(1+(fair-p.sal)/(fair+10)*.5,.6,1.3);return v*am*cm}
function tradeCheck(give,get,tid){
  const vg=give.reduce((s,id)=>s+value(P(id)),0),vt=get.reduce((s,id)=>s+value(P(id)),0);
  const sOut=give.reduce((s,id)=>s+P(id).sal,0),sIn=get.reduce((s,id)=>s+P(id).sal,0);
  const after=payroll(S.my)-sOut+sIn,myN=S.R[S.my].length-give.length+get.length,thN=S.R[tid].length-get.length+give.length;
  const ratio=vt?vg/(vt*1.08):(vg>0?2:0);
  let err=null;
  if(!give.length||!get.length)err='주고받을 선수를 모두 고르세요.';
  else if(after>CAP&&sIn>sOut*1.25+2)err=`샐러리캡(${money(CAP)}) 초과 상태에선 받는 연봉이 보내는 연봉의 125%를 넘을 수 없어요.`;
  else if(myN<ROSTER_MIN||myN>ROSTER_MAX)err=`우리 로스터는 ${ROSTER_MIN}~${ROSTER_MAX}명이어야 해요. (트레이드 후 ${myN}명)`;
  else if(thN<ROSTER_MIN||thN>ROSTER_MAX)err=`상대 로스터가 ${ROSTER_MIN}~${ROSTER_MAX}명을 벗어나요.`;
  return{vg,vt,ratio,sOut,sIn,after,err};
}
function doTrade(give,get,tid){
  S.R[S.my]=S.R[S.my].filter(id=>!give.includes(id)).concat(get);
  S.R[tid]=S.R[tid].filter(id=>!get.includes(id)).concat(give);
  S.starters=S.starters.filter(id=>!give.includes(id));S.dev=S.dev.filter(id=>!give.includes(id));
  S.chem=clamp(S.chem-6*get.length,0,100);
  post(`[트레이드] ${short(T(S.my).name)} ↔ ${short(T(tid).name)}: ${get.map(id=>P(id).n).join(', ')} 영입, ${give.map(id=>P(id).n).join(', ')} 이적`,'@트레이드루머');
}
function aiOffer(){
  const mine=S.R[S.my].map(P).filter(p=>!p.inj).sort((a,b)=>value(b)-value(a)).slice(2,10);if(!mine.length)return null;
  const y=pick(mine),tid=pick(S.teams.filter(t=>t.id!==S.my)).id;
  const cands=S.R[tid].map(P).filter(p=>value(p)<=value(y)*1.15&&value(p)>=value(y)*.8&&Math.abs(p.sal-y.sal)<y.sal*.4+4);
  if(!cands.length)return null;const x=pick(cands);const c=tradeCheck([y.id],[x.id],tid);if(c.err)return null;
  return{tid,give:[y.id],get:[x.id]};
}
function offerModal(o,next){
  const y=P(o.give[0]),x=P(o.get[0]);
  modal('📞 트레이드 제안',`<p><b>${esc(T(o.tid).name)}</b>에서 트레이드를 제안했다.</p>
   <div class="two"><div class="note"><small class="muted">보낼 선수</small><br><b>${esc(y.n)}</b><br>${y.pos} · ${y.age}세 · OVR ${Math.round(ovr(y))}<br>${money(y.sal)} · ${y.yrs}년</div>
   <div class="note good"><small class="muted">받을 선수</small><br><b>${esc(x.n)}</b><br>${x.pos} · ${x.age}세 · OVR ${Math.round(ovr(x))}<br>${money(x.sal)} · ${x.yrs}년</div></div>
   <p class="small muted" style="margin-top:10px">트레이드하면 팀 케미스트리가 조금 떨어져요.</p>`,
   [{t:'수락',cls:'pri',fn:()=>{doTrade(o.give,o.get,o.tid);save();modal('🔁 트레이드 완료',`<p>${esc(x.n)} 영입 완료!</p>`,[{t:'확인',cls:'pri',fn:next}])}},{t:'거절',fn:next}]);
}

/* ================= play flow ================= */

function offseason(){
  const d=D();d.retired=[];d.changes=[];
  // aging & retirement
  for(const t of S.teams){const keep=[];
    for(const id of S.R[t.id]){const p=P(id),before=ovr(p);p.age++;
      const pf=clamp((p.pot-before)/10,0,1.2);
      for(const k in ATT){let g=p.age<=24?rnd(0,2.6)*pf:p.age<=29?rnd(-.6,1)*pf:p.age<=32?-rnd(0,1.6):-rnd(1,3.2);if(t.id!==S.my&&p.age<=27)g+=rnd(0,1.4)*ageF(p.age)*pf;p[k]=clamp(p[k]+g,25,99)}
      p.yrs--;p.inj=0;p.cond=100;p.st=blankSt();
      if(p.age>=36&&(ovr(p)<72||p.age>=39||Math.random()<.4)){if(t.id===S.my)d.retired.push(p.n);delete S.P[id];continue}
      if(t.id===S.my)d.changes.push([id,ovr(p)-before]);keep.push(id)}
    S.R[t.id]=keep}
  // AI contracts
  d.pool=[];
  for(const t of S.teams){if(t.id===S.my)continue;
    S.R[t.id]=S.R[t.id].filter(id=>{const p=P(id);if(p.yrs>0)return true;if(ovr(p)>=64&&p.age<35&&Math.random()<.75){p.yrs=ri(1,4);p.sal=Math.round(salaryFor(ovr(p))*rnd(.9,1.1)*10)/10;return true}d.pool.push(id);return false})}
  // draft class
  const ord=standings().reverse().map(t=>t.id);d.order=ord;d.myPick=ord.indexOf(S.my)+1;
  d.cls=Array.from({length:40},(_,i)=>{const p=genPlayer(pick(POSL),clamp(gauss(62,5)-i*.15,48,78),ri(19,22));p.pot=Math.round(ovr(p)+rnd(6,20));p.rookie=S.year+1;return p.id});
  d.cls.sort((a,b)=>(ovr(P(b))*.6+P(b).pot*.4)-(ovr(P(a))*.6+P(a).pot*.4));
  // AI picks before mine
  for(let i=0;i<d.myPick-1;i++){const id=d.cls.shift();S.R[ord[i]].push(id);rookieDeal(P(id),i+1)}
  d.left=d.cls;save();
}

function wsel(arr,wf){const ws=arr.map(wf),t=ws.reduce((a,b)=>a+b,0)||1;let x=Math.random()*t;for(let i=0;i<arr.length;i++){x-=ws[i];if(x<=0)return arr[i]}return arr[arr.length-1]}
function tokensFor(pts,tr){const t=[];let p=pts;while(p>0){if(p>=3&&Math.random()<tr){t.push({v:3,k:'3'});p-=3}else if(p>=3&&Math.random()<.1){t.push({v:3,k:'and1'});p-=3}else if(p>=2){t.push({v:2,k:'2'});p-=2}else{t.push({v:1,k:'ft'});p-=1}}return t}
function genPlays(r,myOn,opOn){
  const plays=[],trA=clamp((r.me.sht-58)/55,.18,.55),trB=clamp((r.op.sht-58)/55,.18,.55);
  const rem={};for(const id in r.box)rem[id]=r.box[id].pts;
  const myAll=Object.keys(r.box).map(Number),opAll=Object.keys(r.op.mins).map(Number);
  for(let q=0;q<4;q++){
    const A=shuffle(tokensFor(r.qa[q],trA).concat(Array.from({length:ri(2,5)},()=>({v:0,k:'miss'})))).map(x=>({...x,t:0}));
    const B=shuffle(tokensFor(r.qb[q],trB).concat(Array.from({length:ri(2,5)},()=>({v:0,k:'miss'})))).map(x=>({...x,t:1}));
    const seq=[];let turn=Math.random()<.5?0:1;
    while(A.length||B.length){if(turn===0&&A.length)seq.push(A.shift());else if(turn===1&&B.length)seq.push(B.shift());else seq.push((A.length?A:B).shift());turn^=1}
    seq.forEach((x,k)=>{x.q=q;x.clock=Math.max(0,Math.round(720*(1-(k+1)/seq.length)-rnd(0,8)));
      if(x.t===0){x.who=x.v?wsel(myAll,id=>Math.max(.3,rem[id]||0)):wsel(myAll,id=>r.me.mins[id]*offS(P(id))/60);if(x.v)rem[x.who]=(rem[x.who]||0)-x.v;
        if(x.v>=2&&Math.random()<.6){const o=myAll.filter(id=>id!==x.who);if(o.length)x.ast=wsel(o,id=>Math.pow(P(id).pla/60,3)*r.me.mins[id])}}
      else x.who=wsel(opAll,id=>Math.pow(offS(P(id))/65,3)*r.op.mins[id]);
      x.def=x.t===0?wsel(opAll,id=>r.op.mins[id]):wsel(myAll,id=>r.me.mins[id]);
      plays.push(x)});
  }
  return plays;
}

    <p class="hint">${m.last&&m.last===S.strat?`⚠️ 지난 경기와 같은 작전이에요. 상대가 대비해서 불리해져요(${fin?'-3':'-2'}).`:`상대 성향: ${STYLES[rate(m.opp,'balance').style]}`}</p></div>`,

      root.querySelectorAll('[data-pst]').forEach(b=>b.onclick=()=>{S.strat=b.dataset.pst;save();FLOWS.poPrep()})});

function poOpt(m,fin){
  const o={adj:0,sd:fin?2:0,notes:[],out:[],fin,cp:fin?.85:.6,cth:fin?6:4.5};
  for(const e of m.ev){const c=e.ch?e.ch[e.pick!=null?e.pick:0]:null;
    o.adj+=(e.adj||0)+(c&&c.adj||0);o.sd+=(e.sd||0)+(c&&c.sd||0);
    if(e.hot)o.hot=e.hot;if(c&&c.hot)o.hot=c.hot;if(e.cold)o.cold=e.cold;
    if(c&&c.fx==='rest'){o.out.push(e.pid);o.notes.push(`🚑 ${P(e.pid).n} 결장`)}
    if(c&&c.fx==='play'){P(e.pid).cond=60;o.aggr=e.pid;o.notes.push(`🚑 ${P(e.pid).n} 부상 투혼`)}
    if(c&&c.fx==='gamble'){const g=Math.random()<.5?2.5:-2.5;o.adj+=g;o.notes.push(g>0?'📰 반박이 선수단에 불을 붙였다!':'📰 설전이 오히려 상대를 자극했다…')}
    if(c&&c.fx==='trust'){const g=Math.random()<.5;o.adj+=g?1.5:-1.5;if(g){delete o.cold;o.hot=e.cold;o.notes.push(`🥶→🔥 믿음에 보답한 ${P(e.cold).n}!`)}else o.notes.push(`🥶 ${P(e.cold).n}의 슬럼프가 계속됐다`)}
    if(c&&c.fx==='bench')o.cold=null;
    if(c&&c.fx==='deep')o.deep=1;if(c&&c.fx==='push')o.push=1;
    if(!e.ch&&e.adj&&Math.abs(e.adj)>=1)o.notes.push(`${e.ic} ${e.t} (${e.adj>0?'+':''}${f1(e.adj)})`)}
  if(m.last&&m.last===S.strat){o.adj-=fin?3:2;o.notes.push('🧠 상대가 우리 작전을 읽고 대비했다')}
  return o;
}
function poPlay(auto,cb){
  const po=S.po,c=po.cur,m=c.mine,fin=po.ri===3,home=[0,1,4,6].includes(m.g)?m.hf:!m.hf;
  if(!m.ev)m.ev=poEvents(m,fin,home);
  const o=poOpt(m,fin);o.out.forEach(id=>P(id).inj=Math.max(P(id).inj,1));
  for(const id of S.R[S.my])P(id).cond=clamp(Math.max(P(id).cond,90)-m.fat*3,40,100);
  busy=true;
  simGame(m.opp,home,S.strat,!auto,r=>{
    const end=()=>{poAfter(r,o);if(auto){cb&&cb(r);return}showPoResult(r,()=>{if(m.done)poSeriesEnd();else FLOWS.poPrep()})};
    if(auto){if(r.clutchAt){const op=clutchOpts(r).sort((a,b)=>b.pr-a.pr)[0],ok=Math.random()<op.pr;if(ok){r.sc+=op.pts;r.qa[3]+=op.pts;r.margin=r.sc-r.os;r.win=true;if(r.box[op.who.id])r.box[op.who.id].pts+=op.pts}}end()}
    else watch(r,`${S.year} 플레이오프 · ${c.nm} ${m.g+1}차전`,end);
  },o);
}
function poAfter(r,o){
  const po=S.po,c=po.cur,m=c.mine,fin=po.ri===3;
  o.out.forEach(id=>P(id).inj=Math.max(0,P(id).inj-1));
  r.inj=[];
  if(o.aggr&&Math.random()<.3){P(o.aggr).inj=ri(2,5);r.inj.push(`🚑 ${P(o.aggr).n} 부상 악화! ${P(o.aggr).inj}경기 결장`)}
  for(const id in r.box){const b=r.box[id];const x=po.pst[id]=po.pst[id]||{gp:0,pts:0,reb:0,ast:0};x.gp++;x.pts+=b.pts;x.reb+=b.reb;x.ast+=b.ast}
  if(r.win){m.wa++;m.mom=Math.max(0,m.mom)+1}else{m.wb++;m.mom=Math.min(0,m.mom)-1}m.mom=clamp(m.mom,-3,3);
  m.fat=Math.max(0,m.fat+(fin?1.1:.8)-(o.deep?.9:0)+(o.push?.6:0));
  m.last=r.strat;m.games.push({win:r.win,sc:r.sc,os:r.os,top:topLine(r)});m.g++;m.ev=null;r.g=m.g;
  const tl=topLine(r);if(tl&&tl.pts>=30)post(`${c.nm} ${m.g}차전, ${tl.n} ${tl.pts}점! 시리즈 ${m.wa}-${m.wb}`,'@NBA_소식');
  if(m.wa===4||m.wb===4){m.done=true;if(m.wa===4){po.won++;po.result=fin?'🏆 우승':`${c.nm} 통과`}else{po.out=true;po.result=`${c.nm} 탈락`}}
  save();
}

function finishSeason(){
  const po=S.po,my=S.my,champ=po.br[0],me=T(my),w=me.w,l=me.l,rank=rankOf(my),pst=po.pst,inPo=po.seeds.includes(my);
  const aw=[];
  const cand=[];for(const t of S.teams)for(const id of S.R[t.id]){const p=P(id);if(ovr(p)>=78)cand.push({id,t:t.id,s:ovr(p)+(t.w/(t.w+t.l||1)-.5)*22+gauss(0,1.5)})}
  cand.sort((a,b)=>b.s-a.s);const mvp=cand[0];if(mvp&&mvp.t===my)aw.push('mvp');
  let fmvp=null;if(champ===my){aw.push('ring');const ids=Object.keys(pst).map(Number).filter(id=>S.R[my].includes(id)).sort((a,b)=>pst[b].pts/pst[b].gp-pst[a].pts/pst[a].gp);fmvp=ids[0];aw.push('fmvp')}
  else{fmvp=S.R[champ].slice().sort(byOvr)[0]}
  if(inPo)aw.push('po');if(rank===1)aw.push('best');if(w-S.exp>=12&&w>=45)aw.push('coy');
  const rook=[];for(const t of S.teams)for(const id of S.R[t.id]){const p=P(id);if(p.rookie===S.year)rook.push({id,t:t.id,s:ovr(p)+gauss(0,2)})}
  rook.sort((a,b)=>b.s-a.s);if(rook[0]&&rook[0].t===my)aw.push('roy');
  for(const k of aw)S.tro[k]=(S.tro[k]||0)+1;
  const delta=Math.round((w-S.exp)+(inPo?5:-5)+po.won*5+(champ===my?15:0));
  S.owner=clamp(S.owner+delta,0,100);
  const result=po.result||'플레이오프 진출 실패';
  for(const id of S.R[my])P(id).inj=0;
  S.hist.push({year:S.year,w,l,rank,po:result,aw:aw.filter(k=>k!=='po'),exp:S.exp,best:topPlayerName()});
  if(champ===my)post(`🏆 ${me.name}, ${S.year} NBA 챔피언!!! 우승 반지를 꼈다 💍`,'@NBA_소식');
  else post(`${S.year} NBA 우승은 ${T(champ).name}. ${short(me.name)}는 ${result}.`,'@NBA_소식');
  setFlow('sum',{champ,result,aw,mvp:mvp?{id:mvp.id,t:mvp.t}:null,fmvp,delta,w,l,rank});
}

    {t:dev?'집중 육성 해제':'집중 육성 지정 (최대 2명)',fn:()=>{if(dev)S.dev=S.dev.filter(x=>x!==id);else{if(S.dev.length>=2)S.dev.shift();S.dev.push(id)}save();render()}},
    ...(S.R[S.my].length>ROSTER_MIN?[{t:'방출',cls:'ghost',fn:()=>modal('방출',`<p>${esc(p.n)}을(를) 방출할까요? 남은 연봉은 사라지고 선수는 리그를 떠나요.</p>`,[{t:'방출한다',cls:'pri',fn:()=>{S.R[S.my]=S.R[S.my].filter(x=>x!==id);S.starters=S.starters.filter(x=>x!==id);S.dev=S.dev.filter(x=>x!==id);delete S.P[id];save();render()}},{t:'취소'}])}]:[]),
    {t:'닫기'}]);
}
function tradeHTML(){
  if(S.stage==='season'&&S.week>DEADLINE)return`<div class="card"><h3><span>🔁 트레이드</span></h3><p>트레이드 마감(${DEADLINE}번째 경기)이 지났어요. 시즌이 끝나면 다시 열려요.</p></div>`;
  if(S.stage!=='season')return`<div class="card"><h3><span>🔁 트레이드</span></h3><p>시즌 중에만 트레이드할 수 있어요.</p></div>`;
  if(ui.tTeam===null)return`<div class="card"><h3><span>🔁 트레이드 상대 고르기</span><span class="small" style="font-weight:400">마감 G${DEADLINE}</span></h3><div class="plist">
    ${standings().filter(t=>t.id!==S.my).map(t=>`<button class="teamrow" data-tt="${t.id}">${tb(t.id,1)}<div><b>${esc(t.name)}</b><small>${t.w}승 ${t.l}패 · 연봉 ${money(payroll(t.id))}</small></div><div class="r">${Math.round(teamOvr(t.id))}</div></button>`).join('')}</div></div>`;
  const tid=ui.tTeam;ui.give=ui.give.filter(id=>S.R[S.my].includes(id));ui.get=ui.get.filter(id=>S.R[tid].includes(id));
  const c=tradeCheck(ui.give,ui.get,tid),pr=clamp(c.ratio,0,1.3)/1.3*100;
  return`<div class="card"><h3><span>${esc(T(tid).name)}에서 받을 선수</span><button class="btn sm" id="tBack">← 팀 목록</button></h3><div class="plist">
    ${S.R[tid].slice().sort(byOvr).map(id=>{const p=P(id);return`<button class="pl ${ui.get.includes(id)?'sel':''}" data-get="${id}"><div class="po">${p.pos}</div><div><b>${esc(p.n)}</b><small>${p.age}세 · 잠재 ${p.pot} · ${money(p.sal)}×${p.yrs}년 · 가치 ${Math.round(value(p))}</small></div><div class="ov">${Math.round(ovr(p))}</div></button>`}).join('')}</div></div>
   <div class="card"><h3><span>우리가 보낼 선수</span></h3><div class="plist">
    ${S.R[S.my].slice().sort(byOvr).map(id=>{const p=P(id);return`<button class="pl ${ui.give.includes(id)?'sel':''}" data-give="${id}"><div class="po">${p.pos}</div><div><b>${esc(p.n)}</b><small>${p.age}세 · 잠재 ${p.pot} · ${money(p.sal)}×${p.yrs}년 · 가치 ${Math.round(value(p))}</small></div><div class="ov">${Math.round(ovr(p))}</div></button>`}).join('')}</div></div>
   <div class="card"><h3><span>협상 테이블</span></h3>
    <div class="kv"><span>보내는 가치 / 받는 가치</span><b>${Math.round(c.vg)} / ${Math.round(c.vt)}</b></div>
    <div class="kv"><span>보내는 연봉 / 받는 연봉</span><b>${money(c.sOut)} / ${money(c.sIn)}</b></div>
    <div class="kv"><span>트레이드 후 연봉 총액</span><b>${money(c.after)}</b></div>
    <p class="small" style="margin-top:10px">상대 단장 반응</p><div class="meter"><u style="width:${pr}%;background:${c.ratio>=1?'var(--green)':c.ratio>=.8?'var(--gold)':'var(--red)'}"></u></div>
    <p class="small muted">${c.err||(c.ratio>=1?'"좋습니다, 받아들이죠."':c.ratio>=.8?'"조금만 더 얹어주시면…"':'"말도 안 되는 제안이군요."')}</p>
    <button class="btn pri" id="tGo" ${c.err?'disabled':''} style="margin-top:10px">트레이드 제안하기</button></div>`;
}
function leagueHTML(){
  const st=standings();
  return`<div class="card"><h3><span>${S.year} 순위</span><span class="small" style="font-weight:400">상위 16팀 플레이오프</span></h3><div class="scroll"><table class="tbl">
   <tr><th>#</th><th class="l">팀</th><th>승</th><th>패</th><th>전력</th></tr>
   ${st.map((t,i)=>`<tr class="${t.id===S.my?'me':''}${i===15?' cut':''}"><td>${i+1}</td><td class="l">${tb(t.id)}${esc(short(t.name))}</td><td>${t.w}</td><td>${t.l}</td><td>${Math.round(teamOvr(t.id))}</td></tr>`).join('')}</table></div></div>
   <div class="card"><h3><span>리그 톱 플레이어</span></h3><table class="tbl"><tr><th class="l">선수</th><th>팀</th><th>나이</th><th>OVR</th></tr>
   ${S.teams.flatMap(t=>S.R[t.id].map(id=>[id,t.id])).sort((a,b)=>ovr(P(b[0]))-ovr(P(a[0]))).slice(0,12).map(([id,t])=>`<tr class="${t===S.my?'me':''}"><td class="l">${esc(P(id).n)} <span class="muted small">${P(id).pos}</span></td><td>${esc(short(T(t).name))}</td><td>${P(id).age}</td><td>${Math.round(ovr(P(id)))}</td></tr>`).join('')}</table></div>`;
}
function clubHTML(){
  const H=S.hist,t=S.tro;
  return`${S.stage==='over'?`<div class="card" style="text-align:center"><div style="font-size:46px">📰</div><h1 style="font-size:28px;color:var(--gold)">경질</h1><p class="muted">${H.length}시즌 · 우승 ${t.ring||0}회</p></div>`:''}
   <div class="card"><h3><span>트로피 캐비닛</span></h3><div class="cab">${Object.keys(AWARDS).map(k=>`<div class="${t[k]?'':'off'}"><div class="ic">${AWARDS[k].ic}</div><b>${t[k]||0}</b><span>${AWARDS[k].n}</span></div>`).join('')}</div></div>
   <div class="card"><h3><span>시즌별 기록</span></h3>${H.length?`<div class="scroll"><table class="tbl" style="min-width:480px"><tr><th>시즌</th><th>성적</th><th>순위</th><th>기대</th><th>PO</th><th class="l">에이스</th><th>수상</th></tr>
    ${H.map(x=>`<tr><td>${x.year}</td><td>${x.w}-${x.l}</td><td>${x.rank}</td><td>${x.exp}</td><td>${x.po.replace(' 통과','').replace('플레이오프 진출 실패','-')}</td><td class="l">${esc(x.best)}</td><td>${x.aw.map(k=>AWARDS[k].ic).join('')}</td></tr>`).join('')}</table></div>`:'<p class="small muted">첫 시즌을 마치면 기록이 쌓여요.</p>'}</div>
   <div class="card"><h3><span>💬 반응</span></h3><div class="feed">${S.feed.map(x=>`<div class="post"><div class="ph"><b>${esc(x.who)}</b><span>${x.y}</span></div><p>${esc(x.txt)}</p><div class="pl" style="display:block;background:none;border:0;padding:0;margin-top:4px;font-size:12px;color:var(--dim)">♥ ${x.lk}</div></div>`).join('')||'<p class="small muted">아직 반응이 없어요.</p>'}</div></div>
   <div class="card"><button class="btn ghost" id="reset">${S.stage==='over'?'🏀 새 구단 맡기':'처음부터 다시 시작'}</button></div>`;
}
function startHTML(){
  if(!S)newGame();
  const list=[...S.teams].sort((a,b)=>teamOvr(a.id)-teamOvr(b.id));
  return`<div class="hero"><div class="ball">🏀</div><h1>벤치에서<br><em>우승 반지까지</em></h1><p>실제 NBA 30개 구단 중 하나를 맡아<br>트레이드·훈련·작전으로 한 경기씩 이겨 우승 반지를 끼세요.</p></div>
   <div class="card"><h3><span>맡을 구단 고르기</span><span class="small" style="font-weight:400">약할수록 어려움</span></h3><div class="plist">
   ${list.map((t,i)=>`<button class="teamrow" data-pick="${t.id}">${tb(t.id,1)}<div><b>${esc(t.name)}</b><small>${i<8?'🔥 하위권':i<20?'중위권':'⭐ 우승 후보'} · 연봉 ${money(payroll(t.id))} · 에이스 ${esc(P(S.R[t.id].slice().sort(byOvr)[0]).n)}</small></div><div class="r">${Math.round(teamOvr(t.id))}</div></button>`).join('')}</div>
</div><div class="card small muted" style="line-height:1.7">ℹ️ 비공식 팬 게임이에요. NBA·각 구단과 관계없고 공식 로고는 쓰지 않았어요(팀 컬러 배지). 선수 소속과 기록은 NBA.com 2026-27 시즌 개인 기록(2026년 11월 11일 기준)이고, 능력치는 그 기록(득점·리바운드·어시스트·3점·스틸·블록 등)으로 계산한 게임용 수치예요. 연봉은 게임용 추정치이고, 기록이 적은 일부 벤치 선수(로스터 13명 미달 시)와 드래프트 유망주·FA는 가상 인물이에요.</div>
   <div class="card small muted" style="line-height:1.8">• 한 번 누를 때마다 <b>한 경기</b>. 82경기 정규시즌, 상위 16팀 플레이오프(7전 4선승).<br>• 경기 전 상대 성향을 보고 <b>작전</b>을 고르세요. 상성이 맞으면 보너스.<br>• <b>팀 훈련</b>과 <b>집중 육성</b>으로 선수를 키우고, 선발 라인업을 정하세요.<br>• <b>트레이드</b>(마감 G${DEADLINE})로 전력을 보강하세요. 상대 단장이 가치를 따집니다.<br>• 비시즌: 드래프트 → 재계약 → FA. 구단주 신뢰가 바닥나면 경질!</div>`;
}
function bindStart(){
  document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{S.my=+b.dataset.pick;S.stage='season';S.exp=expWins();S.starters=lineup(S.my).st.slice();S.next=nextGame();
    post(`${T(S.my).name}, 새 단장 겸 감독 선임. 목표는 우승 반지.`,'@NBA_소식');save();tab='home';render();
    modal('',`<div class="sum"><p class="small muted">${S.year} 시즌 · 감독 취임</p><div class="big">${esc(T(S.my).name)}<br><em>지휘봉을 잡다</em></div>
     <div class="kv"><span>팀 전력</span><b>${Math.round(teamOvr(S.my))} · 리그 ${ovrRank(S.my)}위</b></div><div class="kv"><span>구단주 기대 승수</span><b>${S.exp}승</b></div>
     <div class="kv"><span>연봉 총액</span><b>${money(payroll(S.my))} / 캡 ${money(CAP)}</b></div>
     <p class="small muted" style="margin-top:14px">홈에서 작전과 훈련을 정하고 경기를 시작하세요. 로스터 탭에서 선발과 집중 육성 선수를, 트레이드 탭에서 전력 보강을 할 수 있어요.</p></div>`,[{t:'시즌 시작',cls:'pri'}])});
  const rr=$('#reroll');if(rr)rr.onclick=()=>{S=null;render()};
}
function bind(){
  const on=(sel,fn)=>{const e=$(sel);if(e)e.onclick=fn};
  on('#play',playOne);const lo=$('#liveOn');if(lo)lo.onchange=()=>{S.liveOn=lo.checked;save()};on('#auto',autoRun);on('#resume',()=>{busy=true;FLOWS[S.flow.step]()});
  document.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{S.strat=b.dataset.st;save();const y=scrollY;render();scrollTo(0,y)});
  document.querySelectorAll('[data-tr]').forEach(b=>b.onclick=()=>{S.train=b.dataset.tr;save();const y=scrollY;render();scrollTo(0,y)});
  document.querySelectorAll('[data-pl]').forEach(b=>b.onclick=()=>playerModal(+b.dataset.pl));
  on('#autoLine',()=>{S.starters=[...S.R[S.my]].filter(id=>!P(id).inj).sort(byOvr).slice(0,5);save();render()});
  document.querySelectorAll('[data-tt]').forEach(b=>b.onclick=()=>{ui={tTeam:+b.dataset.tt,give:[],get:[]};render();scrollTo(0,0)});
  on('#tBack',()=>{ui={tTeam:null,give:[],get:[]};render()});
  const tog=(arr,id,max)=>arr.includes(id)?arr.filter(x=>x!==id):[...arr,id].slice(-max);
  document.querySelectorAll('[data-get]').forEach(b=>b.onclick=()=>{ui.get=tog(ui.get,+b.dataset.get,2);const y=scrollY;render();scrollTo(0,y)});
  document.querySelectorAll('[data-give]').forEach(b=>b.onclick=()=>{ui.give=tog(ui.give,+b.dataset.give,3);const y=scrollY;render();scrollTo(0,y)});
  on('#tGo',()=>{const tid=ui.tTeam;ui.give=ui.give.filter(id=>S.R[S.my].includes(id));ui.get=ui.get.filter(id=>S.R[tid].includes(id));const c=tradeCheck(ui.give,ui.get,tid);if(c.err)return;
    if(c.ratio*rnd(.95,1.05)>=1){const got=ui.get.map(id=>P(id).n).join(', ');doTrade(ui.give,ui.get,tid);ui={tTeam:null,give:[],get:[]};save();
      modal('🔁 트레이드 성사!',`<p><b>${esc(got)}</b> 영입 완료! 새 선수가 합류해 케미스트리가 조금 떨어졌다.</p>`,[{t:'확인',cls:'pri',fn:()=>{tab='roster';render()}}])}
    else modal('📞 거절',`<p>${esc(T(tid).name)} 단장: "${c.ratio>=.8?'아쉽지만 이 조건으론 어렵습니다. 조금만 더 얹어주세요.':'그 조건이면 대화할 가치가 없네요.'}"</p>`,[{t:'확인'}])});
  on('#reset',()=>modal('새로 시작',`<p>${S.stage==='over'?'새 구단을 맡을까요?':'현재 진행이 삭제됩니다. 정말 처음부터 시작할까요?'}</p>`,[{t:'시작하기',cls:'pri',fn:()=>{wipe();S=null;tab='home';busy=false;render()}},{t:'취소'}]));
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;if(tab==='trade'&&ui.tTeam===null)ui={tTeam:null,give:[],get:[]};render();scrollTo(0,0)});

/* ================= modal ================= */
function closeModal(){$('#modal').classList.remove('on')}
function modal(title,html,buttons,bindFn){
  $('#mTitle').textContent=title;$('#mBody').innerHTML=html;const f=$('#mBtns');f.innerHTML='';f.style.display=buttons.length?'':'none';
  buttons.forEach(b=>{const el=document.createElement('button');el.className='btn '+(b.cls||'');el.innerHTML=b.t;el.onclick=()=>{closeModal();render();b.fn&&b.fn()};f.appendChild(el)});
  if(bindFn)bindFn($('#mBody'));$('#modal').classList.add('on');$('.mbox').scrollTop=0;
}

/* ================= boot ================= */
S=load();if(S&&S.v!==1)S=null;
render();
if(S&&S.stage==='flow'&&S.flow){busy=true;FLOWS[S.flow.step]()}
</script>
</body>
</html>
