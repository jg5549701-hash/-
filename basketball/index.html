<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>벤치에서 MVP까지</title>
<meta name="description" content="고교 졸업반에서 대학·드래프트·G리그를 거쳐 리그 MVP까지, 농구 커리어 시뮬레이션">
<meta name="theme-color" content="#0b0c10">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0c10;--panel:#15171d;--panel2:#1d2029;--line:#2a2e39;--ink:#eceef2;--dim:#8d93a3;--org:#ff7a1a;--org2:#ffb347;
  --green:#3ecf8e;--red:#ff5a5f;--blue:#5aa9ff;--gold:#ffd166;--purple:#b48cff;--teal:#2dd4bf}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{min-height:100vh}
button{font-family:inherit;cursor:pointer;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 96px)}
h1,.disp{font-family:'Black Han Sans','Noto Sans KR',sans-serif;font-weight:400}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.card h3{font-size:14px;color:var(--dim);font-weight:700;letter-spacing:.04em;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:15px;font-weight:700;width:100%;text-align:center;line-height:1.4}
.btn:active{transform:scale(.98)}
.btn.pri{background:linear-gradient(135deg,var(--org),#ff9d3d);border-color:transparent;color:#1a0d00}
.btn.ghost{background:none}
.btn.gold{background:linear-gradient(135deg,#ffd166,#ffb347);color:#2a1a00;border-color:transparent}
.btn.sm{padding:8px 12px;font-size:13px;width:auto;white-space:nowrap;flex-shrink:0}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.btn small{font-weight:400}
.muted{color:var(--dim)}
.small{font-size:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}
.top .brand{font-family:'Black Han Sans';font-size:20px;color:var(--org);white-space:nowrap}
.top .wk{font-size:12px;color:var(--dim);text-align:right}
.pc .nm{font-size:22px;font-weight:900}
.pc .sub{font-size:13px;color:var(--dim);margin-top:2px;line-height:1.5}
.ovr{text-align:center;background:var(--panel2);border-radius:14px;padding:8px 14px;min-width:78px}
.ovr b{display:block;font-size:11px;color:var(--dim);letter-spacing:.1em}
.ovr span{font-family:'Black Han Sans';font-size:34px;line-height:1.05;color:var(--org2)}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.tag{font-size:12px;padding:4px 9px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--dim);white-space:nowrap}
.tag.ct{color:var(--teal);border-color:#1f4a45}
.role{font-weight:900;color:#111;border:0}
.role-bench{background:#8d93a3}.role-rot{background:#5aa9ff}.role-sixth{background:#b48cff}.role-start{background:#3ecf8e}.role-ace{background:linear-gradient(135deg,#ffd166,#ff7a1a)}
.inj{background:var(--red);color:#fff;border:0;font-weight:700}
.lv{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;white-space:nowrap}
.lv-pro{background:rgba(255,122,26,.18);color:var(--org2)}.lv-g{background:rgba(45,212,191,.15);color:var(--teal)}
.lv-col{background:rgba(90,169,255,.15);color:var(--blue)}.lv-hs{background:rgba(255,209,102,.15);color:var(--gold)}.lv-eu{background:rgba(180,140,255,.15);color:var(--purple)}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:72px 1fr 34px;align-items:center;gap:8px;font-size:12px;color:var(--dim)}
.bar i{display:block;height:8px;background:var(--panel2);border-radius:99px;overflow:hidden}
.bar i u{display:block;height:100%;border-radius:99px}
.bar em{font-style:normal;text-align:right;color:var(--ink);font-weight:700}
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.strip div{background:var(--panel2);border-radius:12px;padding:10px 4px}
.strip b{display:block;font-size:19px;font-weight:900}
.strip span{font-size:11px;color:var(--dim)}
.next{margin-top:10px;font-size:13px;color:var(--dim);display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;align-items:center}
.tgl{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dim);font-weight:500;cursor:pointer}
.tgl input{accent-color:var(--org);width:16px;height:16px}
.train{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tbtn{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left}
.tbtn:active{border-color:var(--org)}
.tbtn:disabled{opacity:.4}
.tbtn .r1{display:flex;justify-content:space-between;font-size:14px;font-weight:700;gap:6px}
.tbtn .r1 em{font-style:normal;color:var(--org2)}
.tbtn i{display:block;height:5px;background:#0e1015;border-radius:99px;margin-top:7px;overflow:hidden}
.tbtn i u{display:block;height:100%;background:var(--org);border-radius:99px}
.tbtn.key{border-color:#4a3a2a}
.tbtn.sty{box-shadow:inset 0 0 0 1px rgba(90,169,255,.45)}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.acts .tbtn{text-align:center;font-size:13px;font-weight:700;padding:12px 6px}
.acts .tbtn small{display:block;font-weight:400;color:var(--dim);font-size:11px;margin-top:3px}
.hint{font-size:12px;color:var(--dim);margin:10px 0 0;line-height:1.55}
.staff{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.staff .tbtn{font-size:13px}
.staff .r1{flex-direction:column;gap:2px}
.staff .tbtn.own{border-color:var(--green)}
.glist{display:grid;gap:6px}
.g{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;background:var(--panel2);border-radius:10px;padding:8px 10px;font-size:13px}
.g .wl{font-weight:900;text-align:center;border-radius:6px;padding:2px 0;font-size:12px}
.g .wl.W{background:rgba(62,207,142,.18);color:var(--green)}.g .wl.L{background:rgba(255,90,95,.15);color:var(--red)}
.g .ln{color:var(--dim);font-size:12px}
.grade{font-family:'Black Han Sans';font-size:16px}
.gS{color:var(--gold)}.gA{color:var(--org2)}.gB{color:var(--green)}.gC{color:var(--blue)}.gD,.gF{color:var(--dim)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{color:var(--dim);font-weight:500;font-size:11px;text-align:right;padding:6px 4px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{text-align:right;padding:7px 4px;border-bottom:1px solid #1f222b}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl .l{text-align:left}
.tbl tr.me td{color:var(--org2);font-weight:700}
.tbl tr.cut td{border-bottom:2px dashed #3a3f4c}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(11,12,16,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line);
  display:flex;justify-content:center;padding:6px 8px calc(env(safe-area-inset-bottom) + 6px);z-index:5}
nav .in{display:grid;grid-template-columns:repeat(5,1fr);max-width:720px;width:100%}
nav button{background:none;border:0;padding:8px 0;font-size:12px;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button b{font-size:20px;font-weight:400}
nav button.on{color:var(--org)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:flex-end;justify-content:center;z-index:10;padding:12px}
.modal.on{display:flex}
@media (min-width:600px){.modal{align-items:center}}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:20px;width:100%;max-width:540px;max-height:90vh;overflow:auto;padding:20px;
  margin-bottom:env(safe-area-inset-bottom);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:0}}
.mbox h2{font-family:'Black Han Sans';font-weight:400;font-size:22px;margin-bottom:12px;line-height:1.25}
.mbody{font-size:14px;line-height:1.6}
.mbody p{margin-bottom:8px}
.mbody h4{font-size:13px;color:var(--dim);margin:14px 0 6px}
.mbtns{display:grid;gap:8px;margin-top:16px}
.score{display:flex;justify-content:center;align-items:center;gap:14px;margin:6px 0 10px}
.score b{font-family:'Black Han Sans';font-size:40px;font-weight:400}
.score span{font-size:12px;color:var(--dim);text-align:center;max-width:96px;line-height:1.3}
.res{font-family:'Black Han Sans';font-size:18px;text-align:center;margin-bottom:8px}
.res.W{color:var(--green)}.res.L{color:var(--red)}
.qt{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:10px;text-align:center}
.qt th{color:var(--dim);font-weight:500;padding:3px}
.qt td{padding:3px;border-top:1px solid var(--line)}
.qt td:first-child,.qt th:first-child{text-align:left}
.qt td:last-child{font-weight:900}
.statbox{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;margin:8px 0}
.statbox div{background:var(--panel2);border-radius:10px;padding:8px 2px}
.statbox b{display:block;font-size:22px;font-weight:900}
.statbox span{font-size:11px;color:var(--dim)}
.line2{font-size:12px;color:var(--dim);text-align:center}
.pbp{list-style:none;margin:8px 0;font-size:13px}
.pbp li{display:grid;grid-template-columns:62px 1fr;gap:6px;padding:5px 0;border-bottom:1px dashed #262a34}
.pbp li span{color:var(--dim);font-size:12px;font-variant-numeric:tabular-nums}
.note{background:var(--panel2);border-radius:10px;padding:10px 12px;font-size:13px;margin-top:8px;line-height:1.55}
.note.hot{border-left:3px solid var(--org)}
.note.bad{border-left:3px solid var(--red)}
.note.good{border-left:3px solid var(--green)}
.award{display:flex;gap:12px;align-items:center;background:var(--panel2);border-radius:12px;padding:10px 12px;margin-bottom:6px}
.award .ic{font-size:26px}
.award b{display:block}
.award small{color:var(--dim)}
.offer{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}
.offer.re{border-color:#5a4020}
.offer .oh{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.offer .on{font-weight:900;font-size:15px}
.offer .ot{font-size:12px;color:var(--teal);font-weight:700}
.offer .od{font-size:12px;color:var(--dim);margin:6px 0 8px;line-height:1.55}
.offer .om{font-family:'Black Han Sans';font-size:20px;color:var(--gold);white-space:nowrap}
.offer .ob{display:flex;gap:6px;flex-wrap:wrap}
.offer .ob .btn{flex:1}
.offer .ms{font-size:12px;margin-top:6px}
.pick{display:grid;grid-template-columns:34px 1fr;gap:6px;font-size:13px;padding:5px 0;border-bottom:1px solid #22252e}
.pick.me{color:var(--org2);font-weight:900}
.pick small{color:var(--dim)}
.hero{text-align:center;padding:30px 0 20px}
.hero .ball{font-size:64px;display:inline-block;animation:bounce 1.2s infinite cubic-bezier(.5,0,.5,1)}
@keyframes bounce{50%{transform:translateY(-14px)}}
.hero h1{font-size:44px;line-height:1.1;margin:10px 0}
.hero h1 em{font-style:normal;color:var(--org)}
.hero p{color:var(--dim);font-size:14px;line-height:1.6}
label.lb{display:block;font-size:13px;color:var(--dim);margin:4px 0 8px}
input.txt{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px;color:var(--ink);font-family:inherit;margin-bottom:14px}
.posgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:8px}
.posgrid button,.diff button{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 0;font-weight:900;font-size:15px}
.posgrid button small,.diff button small{display:block;font-size:10px;color:var(--dim);font-weight:400;margin-top:2px}
.posgrid button.on,.diff button.on{border-color:var(--org);color:var(--org)}
.diff{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:16px}
.posdesc{font-size:12px;color:var(--dim);min-height:36px;margin-bottom:14px;line-height:1.5}
.cab{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cab div{background:var(--panel2);border-radius:12px;text-align:center;padding:10px 4px}
.cab div.off{opacity:.28}
.cab .ic{font-size:22px}
.cab b{display:block;font-size:16px}
.cab span{font-size:10px;color:var(--dim);display:block;line-height:1.3}
.goal{font-size:12px;color:var(--dim);margin-top:10px;text-align:center}
.depth{display:grid;gap:10px}
.depth .pg{display:grid;grid-template-columns:40px 1fr;gap:8px;align-items:start}
.depth .pg b{font-size:12px;color:var(--dim);padding-top:6px}
.depth .pl{display:flex;flex-wrap:wrap;gap:6px}
.depth .pl span{font-size:12px;background:var(--panel2);border-radius:8px;padding:5px 8px}
.depth .pl span.me{background:rgba(255,122,26,.2);color:var(--org2);font-weight:900}
.depth .pl span em{font-style:normal;color:var(--dim);margin-left:4px}
.road{display:flex;gap:4px;flex-wrap:wrap;margin-top:12px}
.road span{font-size:11px;padding:3px 8px;border-radius:99px;background:var(--panel2);color:var(--dim)}
.road span.on{background:rgba(255,122,26,.2);color:var(--org2);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:7px 11px;font-size:13px;font-weight:700}
.chip.on{border-color:var(--org);color:var(--org2);background:rgba(255,122,26,.12)}
.sched{display:grid;gap:6px}
.sched div{display:flex;justify-content:space-between;gap:8px;background:var(--panel2);border-radius:10px;padding:9px 12px;font-size:13px}
.sched div span{color:var(--dim);font-size:12px;white-space:nowrap}
.sum .big{font-family:'Black Han Sans';font-size:30px;line-height:1.2;margin:2px 0 14px}
.sum .big em{font-style:normal;color:var(--org2)}
.kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #22252e;font-size:14px}
.kv span{color:var(--dim)}
.kv b .up{color:var(--green)}.kv b .dn{color:var(--red)}
.tour{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid #22252e}
.tour .ti{width:36px;height:36px;border-radius:50%;background:var(--panel2);display:grid;place-items:center;font-size:18px}
.tour b{display:block;font-size:14px}.tour small{color:var(--dim);font-size:12px}
.tour .tr{font-weight:900;white-space:nowrap}
.feed{display:grid;gap:8px}
.post{background:var(--panel2);border-radius:12px;padding:11px 13px}
.post .ph{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-bottom:4px}
.post .ph b{color:var(--ink)}
.post p{font-size:14px;line-height:1.5}
.post .pl{font-size:12px;color:var(--dim);margin-top:6px}
.shop{display:grid;gap:8px}
.shop .it{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;background:var(--panel2);border-radius:12px;padding:10px 12px}
.shop .it .ic{font-size:24px}.shop .it small{display:block;color:var(--dim);font-size:12px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav id="nav" style="display:none"><div class="in">
  <button data-t="home"><b>🏠</b>홈</button>
  <button data-t="team"><b>👥</b>팀</button>
  <button data-t="feed"><b>💬</b>반응</button>
  <button data-t="stats"><b>📊</b>기록</button>
  <button data-t="career"><b>📜</b>커리어</button>
</div></nav>
<div class="modal" id="modal"><div class="mbox"><h2 id="mTitle"></h2><div class="mbody" id="mBody"></div><div class="mbtns" id="mBtns"></div></div></div>

<script>
'use strict';
/* =================== utils =================== */
const $=s=>document.querySelector(s);
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function gauss(m=0,s=1){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return m+s*Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
function poisson(l){if(l<=0)return 0;const L=Math.exp(-l);let k=0,p=1;do{k++;p*=Math.random()}while(p>L);return k-1}
function binom(n,p){let k=0;for(let i=0;i<n;i++)if(Math.random()<p)k++;return k}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const f1=v=>(Math.round(v*10)/10).toFixed(1);
const money=v=>Math.abs(v)<1?'$'+Math.round(v*1000)+'K':'$'+(v>=10?v.toFixed(1):v.toFixed(2))+'M';
const pct=(m,a)=>a?(m/a*100).toFixed(1)+'%':'-';
const stars=n=>'★'.repeat(n)+'☆'.repeat(5-n);

/* =================== data =================== */
const SEASON={col:18,pro:26}, ALLSTAR_WEEK=13, TRADE_DL=16, TWOWAY_GAMES=13;
const AVG={pro:78,g:65,col:52,eu:70,hs:44};
const LVN={pro:'WBL',g:'G리그',col:'대학',eu:'유럽',hs:'고교'};
const ATTR={sht:'미드레인지',tpt:'3점슛',drv:'돌파',pas:'패스',reb:'리바운드',def:'수비',sta:'체력'};
const ICON={sht:'🎯',tpt:'🏹',drv:'⚡',pas:'🤝',reb:'🙌',def:'🛡️',sta:'🫁'};
const POS={
 PG:{n:'포인트가드',d:'경기를 조립하는 야전사령관. 패스·3점·돌파가 핵심.',w:{pas:.3,tpt:.2,drv:.2,sht:.15,def:.15},b:{sht:52,tpt:56,drv:58,pas:60,reb:34,def:48,sta:60},blk:.15,h:[178,192]},
 SG:{n:'슈팅가드',d:'팀의 득점 기계. 3점과 미드레인지로 상대를 무너뜨린다.',w:{tpt:.3,sht:.25,drv:.2,def:.15,pas:.1},b:{sht:58,tpt:60,drv:55,pas:46,reb:38,def:48,sta:58},blk:.25,h:[188,198]},
 SF:{n:'스몰포워드',d:'공수 겸장 올라운더. 모든 능력이 고르게 필요하다.',w:{sht:.2,tpt:.15,drv:.2,def:.2,reb:.15,pas:.1},b:{sht:54,tpt:52,drv:55,pas:45,reb:48,def:54,sta:58},blk:.45,h:[196,204]},
 PF:{n:'파워포워드',d:'골밑의 일꾼. 리바운드와 수비로 팀을 지탱한다.',w:{reb:.3,def:.25,sht:.2,drv:.15,tpt:.1},b:{sht:52,tpt:44,drv:48,pas:40,reb:58,def:56,sta:56},blk:.85,h:[202,209]},
 C:{n:'센터',d:'페인트존의 지배자. 리바운드와 블록으로 승부한다.',w:{reb:.35,def:.35,sht:.2,pas:.1},b:{sht:50,tpt:30,drv:40,pas:40,reb:62,def:60,sta:54},blk:1.35,h:[208,218]},
};

/* =================== roles =================== */
function roleOf(ovr,str,trust){const e=ovr+(trust-50)/10;
  if(e>=str+6)return'ace';if(e>=str-2)return'start';if(e>=str-6)return'sixth';if(e>=str-12)return'rot';return'bench'}
function proRoleFor(tid,trust){
  const t=T('pro',tid),ro=S.R[tid],e=OVR()+(trust-50)/10;
  const same=ro.filter(x=>x.pos===S.p.pos).map(x=>x.o);
  const rank=same.filter(o=>o>e).length,best=Math.max(...ro.map(x=>x.o));
  if(rank===0)return(e>=best+1&&e>=t.str+5)?'ace':'start';
  if(rank===1)return e>=t.str-5?'sixth':'rot';
  if(rank===2)return e>=t.str-10?'rot':'bench';
  return'bench';
}
function roleAt(lv){const p=S.p;return lv==='pro'?proRoleFor(p.c.team,p.trust):roleOf(OVR(),T(lv,p.c.team).str,p.trust)}
function mainLv(){const t=S.p.c.type;return t==='col'?'col':t==='g'?'g':t==='eu'?'eu':'pro'}
function matesFor(lv){const id=S.p.c.team;if(lv==='pro')return S.R[id].map(x=>x.n);const k=lv+id;if(!S.M[k])S.M[k]=Array.from({length:5},rname);return S.M[k]}

/* =================== training / actions =================== */
function ageF(age){return age<=20?1.25:age<=22?1.1:age<=24?.95:age<=27?.65:age<=30?.38:.15}
function trainGain(k){const p=S.p;const potF=clamp((p.pot-p.a[k])/18,.06,1.3);
  let m=.7*ageF(p.age)*potF*(p.svc.trainer?1.3:1)*(has('gym')?1.1:1);
  if(p.c.type==='col'&&STYLES[T('col',p.c.team).style].k.includes(k))m*=1.2;
  return m}
function injuryRoll(extra){const p=S.p;let ch=.006+extra+(p.cond<40?(40-p.cond)*.003:0);if(p.svc.physio)ch*=.5;if(has('shoes'))ch*=.75;
  if(Math.random()<ch){p.injury=Math.random()<.1?ri(5,9):ri(1,3);p.boost=0;return true}return false}
function recentGs(n){const g=S.games.filter(x=>x.L&&x.L.min).slice(-n);if(!g.length)return null;return g.reduce((s,x)=>s+x.L.gs-10*x.L.min/36,0)/g.length}
function doAction(kind,attr){
  const p=S.p;let msg='';
  if(kind==='train'){const hard=S.hard,g=trainGain(attr)*(hard?1.7:1);p.a[attr]=Math.min(99,p.a[attr]+g);p.cond-=hard?15:8;
    msg=`${ICON[attr]} ${ATTR[attr]} ${hard?'고강도 ':''}훈련 <b>+${f1(g)}</b>`;
    if(hard&&injuryRoll(.02))msg+=` — <span style="color:var(--red)">훈련 중 부상! (${p.injury}주)</span>`;}
  else if(kind==='rest'){p.cond+=22;msg='🛌 충분히 쉬었다. 컨디션 회복.'}
  else if(kind==='video'){for(const k in p.a)p.a[k]=Math.min(99,p.a[k]+.12*ageF(p.age));p.trust+=5;p.cond-=3;msg='🎬 코치진과 영상 분석. 전 능력 소폭 상승, 감독 신뢰 +5'}
  else if(kind==='media'){const col=p.c.type==='col',f=(col?3:4)+p.fame*.03,m=(col?.004:.02)+p.fame*(col?.0015:.004);p.fame+=f;p.money+=m;p.trust-=2;p.cond-=6;
    msg=`${col?'📱 NIL 활동':'📺 방송·광고 활동'}. 인기 +${f1(f)}, 수입 ${money(m)}`}
  else if(kind==='study'){p.gpa=Math.min(4,p.gpa+.25);p.cond-=3;msg=`📚 도서관에서 밤샘 공부. 학점 ${p.gpa.toFixed(2)}`}
  else if(kind==='talk'){const rg=recentGs(3);
    if(rg!==null&&rg>3){p.trust+=8;msg='🗣 감독 면담: "요즘 좋아. 더 기회를 주겠다." 감독 신뢰 +8'}
    else if(rg!==null&&rg<-2){p.trust-=4;msg='🗣 감독 면담: "출전 시간은 코트에서 증명해라." 감독 신뢰 -4'}
    else{p.trust+=2;msg='🗣 감독 면담: "지켜보고 있다. 꾸준히 해라." 감독 신뢰 +2'}}
  else if(kind==='rehab'){p.cond+=20;msg=p.susp?'📚 출전 정지 기간. 공부와 개인 훈련으로 버텼다.':'🩹 재활 치료에 전념했다.';if(p.susp)p.gpa=Math.min(4,p.gpa+.2)}
  p.cond=clamp(p.cond,0,100);p.trust=clamp(p.trust,0,100);p.fame=clamp(p.fame,0,100);
  return msg;
}

/* =================== game sim =================== */
function gmsc(L){return L.pts+.4*L.fgm-.7*L.fga-.4*(L.fta-L.ftm)+.5*L.reb+L.stl+.7*L.ast+.7*L.blk-L.tov}
function simLine(role,cf,edge,lvb=1){
  const p=S.p,a=p.a,R={bench:[0,8],rot:[12,20],sixth:[20,28],start:[29,35],ace:[34,39]}[role];
  let min=role==='bench'&&Math.random()<.4?0:rnd(R[0],R[1]);
  min*=.92+a.sta/600;if(p.cond<50)min*=.85;min=Math.round(clamp(min,0,44));
  const L={min,pts:0,fgm:0,fga:0,tpm:0,tpa:0,ftm:0,fta:0,reb:0,ast:0,stl:0,blk:0,tov:0,gs:0};
  if(!min)return L;
  const f=min/36,top=Math.max(a.sht,a.tpt,a.drv),avg=(a.sht+a.tpt+a.drv)/3,skill=top*.5+avg*.5,ed=clamp(edge,-15,15);
  const usage={ace:5,start:2,sixth:1,rot:0,bench:0}[role];
  const fga36=clamp((4+(skill-45)*.3+usage+ed*.08)*lvb,4,26);
  const fga=Math.max(0,Math.round(fga36*f*rnd(.75,1.25)));
  const tr=clamp(a.tpt/(a.sht+a.tpt+a.drv)*1.25-(a.tpt<40?.15:0),.02,.65);
  const tpa=binom(fga,tr),twa=fga-tpa;
  const p2=clamp((.40+((a.sht+a.drv)/2-55)*.0045+ed*.002)*cf,.3,.68),p3=clamp((.30+(a.tpt-55)*.0037+ed*.0015)*cf,.15,.48);
  const twm=binom(twa,p2),tpm=binom(tpa,p3);
  const fta=Math.round(twa*(.12+a.drv/350)*rnd(.6,1.4)),ftm=binom(fta,clamp(.58+a.sht*.0032,.5,.93));
  const em=(1+ed*.006)*(1+(lvb-1)*.6);
  Object.assign(L,{fga,tpa,tpm,fgm:twm+tpm,fta,ftm,pts:twm*2+tpm*3+ftm,
    reb:poisson((1.2+Math.max(0,a.reb-30)*.19)*f*cf*em),ast:poisson((.8+Math.max(0,a.pas-30)*.17)*f*cf*em),
    stl:poisson((.3+Math.max(0,a.def-30)*.025)*f*em),blk:poisson(POS[p.pos].blk*(.4+a.def/100)*f*em),tov:poisson((.8+fga36*.08)*f)});
  L.gs=gmsc(L);return L;
}
function coreGameStr(lv,myStr,oppStr,home,cond){
  const p=S.p;let role=lv==='pro'?proRoleFor(p.c.team,p.trust):roleOf(OVR(),myStr,p.trust);
  if(p.boost>0&&ROLE_ORDER.indexOf(role)<3)role='start';
  const cf=.82+cond/100*.18,L=simLine(role,cf,OVR()-AVG[lv],{pro:1,eu:1.08,g:1.15,col:1.55,hs:1.6}[lv]);
  const imp=L.min?(L.gs-10*L.min/36)*.35:0;
  return{L,role,lv,home,margin:(myStr-oppStr)*.9+(home?2.5:-2.5)+imp+gauss(0,11)};
}
function coreGame(lv,oppId,home,cond){const r=coreGameStr(lv,T(lv,S.p.c.team).str,T(lv,oppId).str,home,cond);r.opp=oppId;return r}
function lvBase(lv){return lv==='hs'?56:lv==='col'?62:lv==='eu'?74:94}
function finishScore(r){if(r.scored)return;let m=clamp(Math.round(r.margin),-35,35);if(m===0)m=Math.random()<.5?1:-1;
  r.margin=m;r.win=m>0;r.sc=Math.round(rnd(lvBase(r.lv),lvBase(r.lv)+24));r.os=r.sc-m;if(Math.abs(m)<=2&&Math.random()<.2)r.ot=true;r.scored=true}
function grade(gs,min){if(!min)return'-';return gs>=30?'S':gs>=22?'A':gs>=15?'B':gs>=9?'C':gs>=4?'D':'F'}
function winP(a,b){return 1/(1+Math.exp(-(a-b)/5))}

function clutchOptions(){const a=S.p.a;return[
  {k:'three',t:`🏹 역전 3점슛 <small class="muted">(3점 ${Math.round(a.tpt)})</small>`},
  {k:'mid',t:`🎯 풀업 점퍼 <small class="muted">(미드 ${Math.round(a.sht)})</small>`},
  {k:'drive',t:`⚡ 림까지 돌파 <small class="muted">(돌파 ${Math.round(a.drv)})</small>`},
  {k:'pass',t:`🤝 빈 동료에게 킥아웃 <small class="muted">(패스 ${Math.round(a.pas)})</small>`}]}
function clutchProb(k){const a=S.p.a;return{three:.12+a.tpt*.0038,mid:.22+a.sht*.0045,drive:.2+a.drv*.0045,pass:.35+a.pas*.003}[k]}
function autoClutch(){return['three','mid','drive','pass'].map(k=>[k,clutchProb(k)]).sort((x,y)=>y[1]-x[1])[0][0]}
function resolveClutch(r,k){
  const p=S.p,L=r.L,base=Math.round(rnd(lvBase(r.lv),lvBase(r.lv)+20));let win=false,txt='',by=1;
  const ok=Math.random()<clutchProb(k),mate=pick(matesFor(r.lv));
  if(k==='three'){L.fga++;L.tpa++;if(ok){L.fgm++;L.tpm++;L.pts+=3;win=true;by=2;txt='🏹 종료 버저와 함께 3점이 꽂혔다!! 경기장이 폭발한다!'}else txt='3점슛이 림을 돌아 나왔다… 아쉬운 패배.'}
  else if(k==='mid'){L.fga++;if(ok){L.fgm++;L.pts+=2;win=true;txt='🎯 스텝백 풀업 점퍼, 깨끗하게 림을 갈랐다! 위닝샷!'}else txt='점퍼가 짧았다. 버저가 울린다.'}
  else if(k==='drive'){if(ok){L.fga++;L.fgm++;L.pts+=2;win=true;txt='⚡ 수비 둘을 찢고 레이업 성공! 역전승!'}
    else if(Math.random()<.4){const ftp=clamp(.58+p.a.sht*.0032,.5,.93),m=binom(2,ftp);L.fta+=2;L.ftm+=m;L.pts+=m;
      if(m===2){win=true;txt='⚡ 파울 유도! 자유투 2개를 모두 넣어 역전승!'}
      else if(m===1){win=Math.random()<.5;by=ri(2,6);r.ot=true;txt=`자유투 1개 성공, 연장전 돌입… ${win?'연장 끝에 승리!':'연장 끝에 패배.'}`}
      else txt='자유투 2개를 모두 놓쳤다…'}
    else{L.fga++;txt='돌파가 블록에 막혔다. 패배.'}}
  else{L.ast++;if(ok){win=true;txt=`🤝 더블팀을 끌어내고 킥아웃! ${esc(mate)}의 위닝샷을 어시스트했다!`}else txt=`${esc(mate)}의 슛이 빗나갔다.`}
  L.gs=gmsc(L);
  if(win){p.fame+=k==='three'?7:k==='pass'?2:4;p.trust+=4}else p.trust-=1;
  r.margin=win?by:-(r.ot?by:ri(1,3));r.win=win;r.sc=base+(win?by:0);r.os=r.sc-r.margin;r.scored=true;r.clutch=txt;
}
/* ---- game detail ---- */
function splitQ(total,n){const w=Array.from({length:n},()=>rnd(.8,1.2)),s=w.reduce((a,b)=>a+b,0),q=w.map(x=>Math.round(total*x/s));q[n-1]+=total-q.reduce((a,b)=>a+b,0);return q}
function quarters(r){
  if(r.ot){const ot=ri(7,14),oo=ot-r.margin,reg=r.sc-ot;return{a:[...splitQ(reg,4),ot],b:[...splitQ(r.os-oo,4),oo],ot:true}}
  return{a:splitQ(r.sc,4),b:splitQ(r.os,4),ot:false}}
const P3=['코너에서 캐치앤슛 3점','탑에서 스텝백 3점','트랜지션 풀업 3점','로고 근처 딥 쓰리','핸드오프 받아 3점'];
const P2D=['원핸드 덩크','유로스텝 레이업','플로터','앨리웁 덩크','베이스라인 돌파 레이업','투핸드 슬램덩크'];
const P2S=['엘보 풀업 점퍼','베이스라인 페이드어웨이','포스트업 훅슛','풋백 레이업','미드레인지 턴어라운드'];
const PAS=['컷인 레이업','코너 3점','앨리웁 덩크','픽앤롤 덩크','속공 레이업'];
function pbp(r){
  const L=r.L,a=S.p.a,mates=matesFor(r.lv),ev=[];if(!L||!L.min)return[];
  for(let i=0;i<L.tpm;i++)ev.push({w:3,t:'🏹 '+pick(P3)});
  for(let i=0;i<L.fgm-L.tpm;i++)ev.push({w:2,t:'🏀 '+pick(Math.random()<a.drv/(a.drv+a.sht)?P2D:P2S)});
  for(let i=0;i<L.ast;i++)ev.push({w:2,t:`🤝 ${esc(pick(mates))}의 ${pick(PAS)} 어시스트`});
  for(let i=0;i<L.blk;i++)ev.push({w:3,t:'🖐 '+pick(['상대 레이업을 그대로 찍어냈다! 블록','림 보호! 블록슛','헬프 디펜스 블록'])});
  for(let i=0;i<L.stl;i++)ev.push({w:3,t:'🦅 '+pick(['패스를 가로채 속공 덩크','스틸 성공','상대 드리블을 털어냈다'])});
  for(let i=0;i<Math.min(L.tov,2);i++)ev.push({w:1,t:'😣 '+pick(['패스 미스로 턴오버','공격자 파울','트래블링 지적'])});
  if(L.fga-L.fgm>=6)ev.push({w:1,t:'🧱 슛 감각이 좋지 않다. 연속 실패'});
  const out=shuffle(ev).map(e=>({...e,k:e.w+rnd(-1.2,1.2)})).sort((x,y)=>y.k-x.k).slice(0,7).map(e=>({...e,q:ri(1,4),m:ri(0,11),s:ri(0,59)}));
  out.sort((x,y)=>x.q-y.q||(y.m*60+y.s)-(x.m*60+x.s));
  return out;
}
function topMate(r){const ms=matesFor(r.lv);return{n:ms[0],pts:Math.max(8,Math.round(gauss(r.lv==='col'?15:20,5)))}}

/* =================== leagues weekly =================== */
function simLeague(lv,fixed){
  let ids=S.L[lv].map(t=>t.id);
  if(fixed){const A=T(lv,fixed.a),B=T(lv,fixed.b);if(fixed.aWin){A.w++;B.l++}else{B.w++;A.l++}ids=ids.filter(i=>i!==fixed.a&&i!==fixed.b)}
  shuffle(ids);for(let i=0;i+1<ids.length;i+=2){const A=T(lv,ids[i]),B=T(lv,ids[i+1]);if(Math.random()<winP(A.str,B.str)){A.w++;B.l++}else{B.w++;A.l++}}
}
function standings(lv){return[...S.L[lv]].sort((a,b)=>(b.w/(b.w+b.l||1))-(a.w/(a.w+a.l||1))||b.str-a.str)}
function nextGame(){
  const p=S.p,c=p.c;let lv;
  if(S.kind==='col')lv='col';
  else if(c.type==='g')lv='g';else if(c.type==='eu')lv='eu';
  else if(c.type==='twoway'){const r=proRoleFor(c.team,p.trust);lv=(c.active>0&&(ROLE_ORDER.indexOf(r)>=1||Math.random()<.35))?'pro':'g'}
  else{lv='pro';if(p.age<=23&&c.type!=='tenday'&&proRoleFor(c.team,p.trust)==='bench'&&Math.random()<.3)lv='g'}
  const n=S.L[lv].length;let opp;do opp=ri(0,n-1);while(opp===c.team);
  return{lv,opp,home:Math.random()<.5};
}

/* =================== week =================== */
function playWeek(kind,attr,auto,cb){
  const p=S.p,act=doAction(kind,attr),nx=S.next;let r;
  if(p.injury>0||p.susp>0){
    r={lv:nx.lv,opp:nx.opp,home:nx.home,L:null,out:p.injury>0?'injury':'susp',margin:(T(nx.lv,p.c.team).str-T(nx.lv,nx.opp).str)*.9+(nx.home?2.5:-2.5)-1.5+gauss(0,11)};
    finishScore(r);if(p.injury>0)p.injury--;else p.susp--;S.cur.missed++;return finalize(r,act,auto,cb);
  }
  if(nx.lv==='pro'&&p.c.type==='twoway')p.c.active--;
  r=coreGame(nx.lv,nx.opp,nx.home,p.cond);
  const canClutch=r.L.min>=14&&Math.abs(r.margin)<5&&(r.role==='ace'||r.role==='start'||p.trust>=55)&&Math.random()<.45;
  if(canClutch){
    if(auto){resolveClutch(r,autoClutch());return finalize(r,act,auto,cb)}
    modal('⏱ 클러치 타임!',`<p>4쿼터 종료 <b>${f1(rnd(4,9))}초</b> 전, <b>${esc(short(T(nx.lv,nx.opp).name))}</b>에 <b style="color:var(--red)">1점 차</b>로 뒤지고 있다.</p>
      <p>감독이 타임아웃 후 마지막 공격을 <b>당신</b>에게 맡겼다. 관중이 모두 일어섰다. 어떻게 할까?</p>`,
      clutchOptions().map(o=>({t:o.t,fn:()=>{resolveClutch(r,o.k);finalize(r,act,auto,cb)}})));
    return;
  }
  finalize(r,act,auto,cb);
}
function finalize(r,act,auto,cb){
  const p=S.p,c=p.c,q=[];finishScore(r);
  const lv=r.lv;
  simLeague(lv,{a:c.team,b:r.opp,aWin:r.win});
  if(S.kind==='pro')for(const o of['pro','g','eu'])if(o!==lv)simLeague(o);
  const L=r.L,st=S.cur[lv];
  if(L){
    if(L.min>0){st.gp++;for(const k of['min','pts','reb','ast','stl','blk','tov','fgm','fga','tpm','tpa','ftm','fta','gs'])st[k]+=L[k]}
    st.roles[r.role]=(st.roles[r.role]||0)+1;
    p.trust+=clamp((L.gs-10*L.min/36)/4,-3,4)+(r.win?.5:-.2)+(L.min===0?.3:0);
    p.fame+=Math.max(0,L.gs-12)/(lv==='pro'?8:lv==='col'?10:14)+(r.win&&L.min>20?.2:0);
    p.cond-=L.min*(.6-p.a.sta/250);
    if(p.boost>0)p.boost--;
    if(L.min>0&&injuryRoll(0))r.injured=true;
  }
  p.cond+=14+(p.svc.physio?8:0)+(has('o2')?5:0);
  p.money+=weeklyPay();
  if(S.kind==='col'){p.gpa=Math.max(0,p.gpa-.05);if(p.gpa<1.8&&!p.susp&&!p.injury&&Math.random()<.5){p.susp=2;q.push(next=>modal('📉 학업 경고',`<p>학점이 <b>${p.gpa.toFixed(2)}</b>까지 떨어졌다. 학교 규정에 따라 <b>2경기 출전 정지</b>.</p><p class="small muted">공부 행동으로 학점을 관리하세요.</p>`,[{t:'확인',cls:'pri',fn:next}]))}}
  p.cond=clamp(p.cond,0,100);p.trust=clamp(p.trust,0,100);p.fame=clamp(p.fame,0,100);
  S.games.push({wk:S.week,lv,opp:r.opp,home:r.home,win:r.win,sc:r.sc,os:r.os,L,role:r.role||null,clutch:!!r.clutch,out:r.out||null});
  r.act=act;r.week=S.week;r.notes=[];
  if(L&&L.gs>=22&&Math.random()<.6)post(pick([`${p.name} 오늘 ${L.pts}점 ${L.reb}리바 ${L.ast}어시. 이건 진짜다.`,`${short(T(lv,r.opp).name)} 상대로 ${L.pts}점? ${p.name} 미쳤네ㅋㅋ`,`${p.name} 하이라이트 벌써 조회수 터지는 중 🔥`]));
  else if(L&&L.min===0&&Math.random()<.25)post(`${p.name}은 언제 뛰냐… 벤치에서 박수만 치는 중`,'@벤치석3열');
  if(r.clutch&&r.win)post(`${p.name} 위닝샷!!! ${short(T(lv,r.opp).name)}전 끝내기 ⏱`,'@버저비터맨');
  if(r.injured)post(`${p.name} 부상 소식… ${p.injury}주 결장 예상이라고 합니다.`,'@hoops_daily');
  if(c.type==='tenday'){c.weeks--;if(L){c.gsSum+=L.gs-10*L.min/36;c.gpT++}if(c.weeks<=0)q.push(dTendayEnd)}
  if(c.type==='g'&&lv==='g'&&L&&L.min){const cu=callupTeams();if(cu.length)q.push(next=>dCallup(cu,next))}
  if(p.push>0)p.push--;
  if(c.type==='twoway'&&lv==='pro'&&L&&L.min&&Math.random()<.22){const pg=S.games.filter(x=>x.lv==='pro'&&x.L&&x.L.min).slice(-3);
    if(pg.length>=2&&pg.reduce((s,x)=>s+x.L.gs,0)/pg.length>=9)q.push(dConvert)}
  if(S.kind==='pro'&&S.week===TRADE_DL&&['std','rookie'].includes(c.type)){
    if(p.tradeReq)q.push(next=>dTrade(tradeOffers(ri(2,4)),next,true));
    else if(Math.random()<.08)q.push(dForcedTrade);
  }
  if(S.kind==='pro'&&S.week===ALLSTAR_WEEK&&!S.cur.allstar){if(auto){if(allStarCheck(null,true))r.notes.push('⭐ 올스타에 선정됐다!')}else q.push(n=>allStarCheck(n,false))}
  if(!auto&&S.week<SEASON[S.kind]&&Math.random()<.26)q.push(randomEvent);
  if(!auto&&L&&L.gs>=17&&Math.random()<.25)q.push(next=>interview(r,next));
  S.week++;save();
  cb(r,q);
}
function weeklyPay(){const c=S.p.c;if(['std','rookie','twoway','g','eu'].includes(c.type))return c.salary/SEASON.pro;if(c.type==='tenday')return .07;return 0}
function runQueue(q,done){const f=q.shift();if(!f){done();return}f(()=>runQueue(q,done))}
function week(kind,attr){
  if(busy||S.stage!=='season')return;busy=true;
  playWeek(kind,attr,false,(r,q)=>showResult(r,()=>runQueue(q,endWeek)));
}
function endWeek(){
  if(S.week>SEASON[S.kind]){seasonEnd();return}
  S.next=nextGame();save();busy=false;render();
}

/* ---- result modal ---- */
function lineHTML(L){
  return`<div class="statbox"><div><b>${L.pts}</b><span>득점</span></div><div><b>${L.reb}</b><span>리바운드</span></div><div><b>${L.ast}</b><span>어시스트</span></div><div><b>${L.min}'</b><span>출전</span></div></div>
  <div class="line2">FG ${L.fgm}/${L.fga} · 3P ${L.tpm}/${L.tpa} · FT ${L.ftm}/${L.fta} · 스틸 ${L.stl} · 블록 ${L.blk} · 턴오버 ${L.tov}</div>`}
function headline(r){const L=r.L;if(!L)return'';if(!L.min)return'벤치에서 한 번도 일어나지 못했다. 감독의 눈에 들어야 한다.';
  if(L.pts>=40)return`🔥 ${L.pts}득점 대폭발! 오늘 밤 하이라이트는 당신 차지다.`;
  if(L.pts>=10&&L.reb>=10&&L.ast>=10)return'💎 트리플더블 달성! 리그가 주목하기 시작했다.';
  if(L.pts>=10&&(L.reb>=10||L.ast>=10))return'더블더블 활약. 확실한 존재감을 보여줬다.';
  if(L.gs>=22)return'경기를 지배했다. 감독이 엄지를 치켜세운다.';
  if(L.gs>=14)return'좋은 경기였다. 출전 시간을 늘릴 근거를 만들었다.';
  if(L.gs<3&&L.min>=15)return'부진한 하루. 감독의 표정이 굳었다.';
  return'무난한 경기.'}
function coachSays(r){const L=r.L;
  return{S:'"오늘은 네 날이었다. 이대로만 해."',A:'"훌륭했다. 계속 이렇게 해 줘."',B:'"좋았어. 디테일만 다듬자."',C:'"나쁘지 않았다."',D:'"집중력이 아쉬웠다."',F:'"내일 아침 영상실로 와."'}[grade(L.gs,L.min)]}
function showResult(r,next){
  const p=S.p,me=T(r.lv,p.c.team),op=T(r.lv,r.opp),L=r.L,Q=quarters(r);
  let h=`<p class="small muted">${r.act}</p>

  <div class="res ${r.win?'W':'L'}">${r.win?'승리':'패배'}${Q.ot?' (연장)':''} · ${me.w}승 ${me.l}패</div>
  <table class="qt"><tr><th></th><th>1Q</th><th>2Q</th><th>3Q</th><th>4Q</th>${Q.ot?'<th>OT</th>':''}<th>합계</th></tr>
   <tr><td>${esc(short(me.name))}</td>${Q.a.map(x=>`<td>${x}</td>`).join('')}<td>${r.sc}</td></tr>
   <tr><td>${esc(short(op.name))}</td>${Q.b.map(x=>`<td>${x}</td>`).join('')}<td>${r.os}</td></tr></table>`;
  if(!L)h+=`<div class="note bad">${r.out==='susp'?`📉 학업 문제로 출전 정지 중. (남은 정지 ${p.susp}경기)`:`🩹 부상으로 결장했다. (복귀까지 ${p.injury}주)`}</div>`;
  else{
    h+=`<h4>내 기록 <span class="lv lv-${r.lv}">${LVN[r.lv]}</span> <span class="tag role role-${r.role}" style="font-size:11px">${ROLES[r.role]}</span></h4>`+lineHTML(L);
    if(L.min){const pm=Math.round(r.margin*L.min/48+(L.gs-10*L.min/36)*.3);
      h+=`<div class="line2" style="margin-top:4px">+/- ${pm>0?'+':''}${pm} · 평점 <span class="grade g${grade(L.gs,L.min)}">${grade(L.gs,L.min)}</span></div>`}
    const ev=pbp(r);
    if(ev.length)h+=`<h4>주요 장면</h4><ul class="pbp">${ev.map(e=>`<li><span>${e.q}Q ${e.m}:${String(e.s).padStart(2,'0')}</span><div>${e.t}</div></li>`).join('')}</ul>`;
    const tm=topMate(r);
    h+=`<div class="note">${L.pts>tm.pts?`🏆 팀 최다 득점: <b>${esc(p.name)}</b> ${L.pts}점`:`팀 최다 득점: ${esc(tm.n)} ${tm.pts}점`}</div>`;
    h+=`<div class="note${L.gs>=22?' hot':''}">${headline(r)}${L.min?`<br><span class="muted">감독: ${coachSays(r)}</span>`:''}</div>`;

    if(r.injured)h+=`<div class="note bad">🚑 경기 중 부상! ${p.injury}주 결장 예상.</div>`;
  }
  modal(`${S.kind==='col'?'대학':'프로'} ${r.week}주차 vs ${short(op.name)}`,h,[{t:'계속',cls:'pri',fn:next}]);
}

function allStarCheck(next,silent){
  const c=S.cur.pro,sc=scoreOf(c),p=S.p;

function callupTeams(){
  const p=S.p,c=S.cur.g;if(c.gp<4)return[];
  const sc=scoreOf(c),ch=(p.push>0?.45:.18)+(sc>=26?.1:0);
  if(sc<17||Math.random()>ch)return[];
  const ovr=OVR()+(sc-20)*.25;
  const ts=shuffle(S.L.pro.filter(t=>ovr>=t.str-13));
  const aff=ts.findIndex(t=>t.id===p.c.team);if(aff>0)ts.unshift(ts.splice(aff,1)[0]);
  return ts.slice(0,ri(1,3)).map(t=>t.id);
}

/* =================== auto =================== */
function autoPlan(){
  const p=S.p;if(p.injury>0||p.susp>0)return['rehab'];if(p.cond<45)return['rest'];
  if(S.kind==='col'&&p.gpa<2.4)return['study'];
  const w=POS[p.pos].w;let best='sta',bv=-1;for(const k in w){const v=w[k]*trainGain(k);if(v>bv){bv=v;best=k}}
  if(p.a.sta<60&&Math.random()<.2)best='sta';
  if(p.trust<35&&Math.random()<.5)return['video'];
  if(p.focus&&Math.random()<.75)best=p.focus;
  return['train',best];
}
function autoWeeks(n){
  if(busy||S.stage!=='season')return;busy=true;
  const hard=S.hard;S.hard=false;let w=0,l=0;const lines=[],notes=[];let q=[];
  for(let i=0;i<n&&S.week<=SEASON[S.kind];i++){
    const [k,a]=autoPlan();let res;
    playWeek(k,a,true,(r,qq)=>{res=r;q=qq});
    res.win?w++:l++;if(res.L&&res.L.min)lines.push(res.L);
    if(res.clutch)notes.push(`${res.week}주차 클러치: ${res.clutch}`);if(res.injured)notes.push(`${res.week}주차: 🚑 부상 (${S.p.injury}주)`);
    notes.push(...res.notes);
    if(q.length)break;
    if(S.week<=SEASON[S.kind])S.next=nextGame();
  }
  S.hard=hard;save();
  const avg=k=>lines.length?f1(lines.reduce((s,L)=>s+L[k],0)/lines.length):'-';
  modal('⏩ 자동 진행 결과',`<div class="res ${w>=l?'W':'L'}">${w}승 ${l}패</div>
   <div class="statbox"><div><b>${avg('pts')}</b><span>득점</span></div><div><b>${avg('reb')}</b><span>리바운드</span></div><div><b>${avg('ast')}</b><span>어시스트</span></div><div><b>${avg('min')}</b><span>출전</span></div></div>
   ${notes.map(e=>`<div class="note">${e}</div>`).join('')}${q.length?'<div class="note hot">결정할 일이 생겨 자동 진행을 멈췄어요.</div>':''}
   <p class="small muted" style="margin-top:10px">자동 진행 중에는 컨디션·학점에 맞춰 훈련(집중 육성 위주)·휴식·공부를 알아서 골랐어요.</p>`,
   [{t:'계속',cls:'pri',fn:()=>runQueue(q,endWeek)}]);
}

function hsSeason(){
  const p=S.p,sch=S.school,c=S.cur.hs=blank(),res=[];let W=0,Lo=0,qual=false;
  for(let i=0;i<16;i++){const k=p.focus;p.a[k]=Math.min(99,p.a[k]+trainGain(k)*.55);for(const a in p.a)if(a!==k)p.a[a]=Math.min(99,p.a[a]+.07*ageF(p.age))}
  for(const t of HS_TOURS){
    const tr={n:t.n,ic:t.ic,gp:0,pts:0,reb:0,ast:0,res:''};
    const play=os=>{const r=coreGameStr('hs',sch.str,os,Math.random()<.5,85);finishScore(r);const L=r.L;
      if(L.min){c.gp++;for(const k of['min','pts','reb','ast','stl','blk','tov','fgm','fga','tpm','tpa','ftm','fta','gs'])c[k]+=L[k];tr.gp++;tr.pts+=L.pts;tr.reb+=L.reb;tr.ast+=L.ast}
      c.roles[r.role]=(c.roles[r.role]||0)+1;r.win?W++:Lo++;
      p.trust=clamp(p.trust+clamp((L.gs-10*L.min/36)/6,-2,3),0,100);return r.win};
    if(t.k==='league'){let w=0;const opps=Array.from({length:7},()=>clamp(gauss(48,4),38,60));opps.forEach(o=>{if(play(o))w++});
      const rank=1+opps.map(o=>binom(7,winP(o,48))).filter(x=>x>w||(x===w&&Math.random()<.5)).length;tr.res=rank+'위';if(rank<=2)qual=true}
    else{if(t.q&&!qual){tr.res='진출 실패';res.push(tr);continue}
      let i=0;for(;i<t.R.length;i++)if(!play(clamp(sch.str-4+i*2.5+rnd(-4,4),38,66)))break;
      tr.res=i===t.R.length?'🏆 우승':i===t.R.length-1?'준우승':t.R[i];tr.champ=i===t.R.length}
    res.push(tr);
  }
  const sc=scoreOf(c),aw=[];
  if(c.gp>=10){if(res[3].champ&&sc>=gauss(18,3))aw.push('hsmvp');if(sc>=gauss(24,2.5))aw.push('hsall')}
  for(const k of aw)S.trophies[k]=(S.trophies[k]||0)+1;
  p.fame=clamp(p.fame+sc/5+aw.length*3+res.filter(x=>x.champ).length*3,0,100);
  pushHistory('hs',sch.name,c,{w:W,l:Lo,po:res.find(x=>x.champ)?res.find(x=>x.champ).n+' 우승':'-',aw});
  return{res,aw,sc};
}

function computeColEnd(){
  const p=S.p,c=S.cur.col,me=T('col',p.c.team),wp=me.w/(me.w+me.l||1),sc=scoreOf(c);
  const rank=standings('col').findIndex(t=>t.id===me.id)+1;
  const tour={made:wp>=.6||rank<=3,rounds:[],champ:false};
  if(tour.made){const R=['64강','32강','스위트 식스틴','엘리트 에이트','파이널 포','결승'];
    const pool=shuffle([...S.L.col.filter(t=>t.id!==me.id).map(t=>t.name),...COL_EXTRA]);
    for(let i=0;i<R.length;i++){const os=clamp(me.str-5+i*2.6+rnd(-4,4),42,72),r=coreGameStr('col',me.str,os,i<2,88);finishScore(r);
      tour.rounds.push({nm:R[i],opp:pool[i%pool.length],sc:r.sc,os:r.os,win:r.win,L:r.L});if(!r.win)break;if(i===R.length-1)tour.champ=true}}
  const aw=[];
  if(c.gp>=10){if(p.colYears===0&&sc>=gauss(15,2.5))aw.push('cfrosh');if(sc>=gauss(29,2.5)&&wp>=.55)aw.push('cpoy');
    if(sc>=gauss(23,2))aw.push('caa');else if(sc>=gauss(17,2))aw.push('cconf')}
  if(tour.champ)aw.push('cchamp');
  for(const k of aw)S.trophies[k]=(S.trophies[k]||0)+1;
  p.fame=clamp(p.fame+aw.length*3+(tour.champ?6:0)+tour.rounds.filter(x=>x.win).length,0,100);
  pushHistory('col',me.name,c,{w:me.w,l:me.l,rank,po:tour.made?(tour.champ?'🏆 우승':tour.rounds[tour.rounds.length-1].nm+' 탈락'):'토너먼트 실패',aw});
  p.colYears++;
  const ag=ageUp();evolveLeagues();p.combine=0;
  setFlow('col_po',{tour,aw,sc,ag,rec:[me.w,me.l,rank],from:'col',cls:genClass()});
}

function simPlayoffs(lv){
  const cfg={pro:{n:8,o:[0,7,3,4,2,5,1,6],R:[['1라운드',5],['컨퍼런스 결승',7],['WBL 파이널',7]]},g:{n:4,o:[0,3,1,2],R:[['G리그 준결승',3],['G리그 파이널',3]]},eu:{n:4,o:[0,3,1,2],R:[['유럽리그 준결승',3],['유럽리그 결승',3]]}}[lv];
  const seeds=standings(lv).slice(0,cfg.n).map(t=>t.id),my=S.p.c.team;
  const res={lv,made:seeds.includes(my),seed:seeds.indexOf(my)+1,rounds:[],champ:null,my:{gp:0,pts:0,reb:0,ast:0,gs:0},result:'플레이오프 진출 실패'};
  let br=cfg.o.map(i=>seeds[i]);const last=cfg.R[cfg.R.length-1][0];
  cfg.R.forEach(([nm,bo])=>{
    const need=Math.ceil(bo/2),next=[],rd={nm,mine:null};
    for(let i=0;i<br.length;i+=2){
      const A=br[i],B=br[i+1],mine=A===my||B===my,lines=[];let wa=0,wb=0,g=0;
      while(wa<need&&wb<need){const homeA=[0,1,4,6].includes(g);let aWin;
        if(mine){const meA=A===my,oppId=meA?B:A,r=coreGame(lv,oppId,meA?homeA:!homeA,88);finishScore(r);lines.push(r.L);aWin=meA?r.win:!r.win}
        else aWin=Math.random()<winP(T(lv,A).str+(homeA?2.5:-2.5),T(lv,B).str);
        aWin?wa++:wb++;g++}
      const w=wa>wb?A:B;next.push(w);
      if(mine){const pl=lines.filter(L=>L.min),sum=k=>pl.reduce((x,L)=>x+L[k],0);
        rd.mine={opp:A===my?B:A,my:A===my?wa:wb,op:A===my?wb:wa,won:w===my,gp:pl.length,pts:sum('pts'),reb:sum('reb'),ast:sum('ast'),gs:sum('gs')};
        for(const k of['gp','pts','reb','ast','gs'])res.my[k]+=rd.mine[k];
        res.result=w===my?(nm===last?'🏆 우승':`${nm} 통과`):`${nm} 탈락`}
    }
    res.rounds.push(rd);br=next});
  res.champ=br[0];return res;
}
function pushHistory(lv,teamName,c,extra){
  const avg=k=>c.gp?c[k]/c.gp:0,mr=Object.entries(c.roles).sort((a,b)=>b[1]-a[1])[0];
  S.history.push(Object.assign({year:S.year,age:S.p.age,lv,team:teamName,role:mr?ROLES[mr[0]]:'-',ovr:Math.round(OVR()),gp:c.gp,
    pts:avg('pts'),reb:avg('reb'),ast:avg('ast'),stl:avg('stl'),blk:avg('blk'),min:avg('min'),tot:{pts:c.pts,reb:c.reb,ast:c.ast,gp:c.gp},sc:scoreOf(c),w:0,l:0,rank:null,po:'-',aw:[]},extra));
}
function computeProEnd(){
  const p=S.p,c=p.c,cur=S.cur;
  const proContract=['std','rookie','twoway','tenday'].includes(c.type);
  const ml=['std','rookie'].includes(c.type)?'pro':c.type==='eu'?'eu':'g';
  const myT=T(ml,c.team),rank=standings(ml).findIndex(t=>t.id===c.team)+1,rec=[myT.w,myT.l,rank];
  const po=simPlayoffs(ml);
  const aw=[];let mvp=[];
  const pc=cur.pro,psc=scoreOf(pc),pa=k=>pc.gp?pc[k]/pc.gp:0;
  if(pc.gp>0){
    const proT=T('pro',proContract?c.team:0),wp=proT.w/(proT.w+proT.l||1);
    const cands=S.stars.map(s=>{const t=T('pro',s.team),w=t.w/(t.w+t.l||1),ss=s.base+gauss(0,2.5);return{name:s.name,team:t.name,sc:ss,idx:ss*(.7+.6*w)}});
    if(pc.gp>=18)cands.push({me:true,name:p.name,team:proT.name,sc:psc,idx:psc*(.7+.6*wp)});
    cands.sort((a,b)=>b.idx-a.idx);mvp=cands.slice(0,5);
    if(cands[0].me)aw.push('mvp');
    if(pc.gp>=18&&psc>=40)aw.push('all1');else if(pc.gp>=18&&psc>=34)aw.push('all2');
    if(cur.allstar)aw.push('allstar');
    if(pc.gp>=18&&pa('pts')>gauss(28.5,1.5))aw.push('scoring');
    if(pc.gp>=18&&pa('min')>=24&&p.a.def/30+pa('stl')+pa('blk')>gauss(6.4,.35))aw.push('dpoy');
    if(!S.trophies._royUsed&&pc.gp>=15&&psc>=gauss(22,3))aw.push('roy');
    const mr=Object.entries(pc.roles).sort((a,b)=>b[1]-a[1])[0];
    if(mr&&mr[0]==='sixth'&&pc.gp>=15&&psc>=gauss(24,3))aw.push('sixth');
    const prev=[...S.history].reverse().find(h=>h.lv==='pro');
    if(prev&&pc.gp>=15&&psc-prev.sc>=9)aw.push('mip');
    if(pc.gp>=15)S.trophies._royUsed=1;
  }
  const gc=cur.g,gsc=scoreOf(gc);
  if(gc.gp>=12){if(gsc>=gauss(30,2))aw.push('gmvp');if(gsc>=gauss(23,2))aw.push('gall');if(p.proYears===0&&gsc>=gauss(19,2))aw.push('groy')}
  const ec=cur.eu;if(ec.gp>=15&&scoreOf(ec)>=gauss(28,2))aw.push('eumvp');
  if(po.champ===c.team){aw.push(ml==='pro'?'ring':ml==='g'?'gring':'euchamp');if(ml==='pro'&&po.my.gp&&po.my.gs/po.my.gp>=14)aw.push('fmvp')}
  for(const k of aw)if(k!=='allstar')S.trophies[k]=(S.trophies[k]||0)+1;
  for(const k of aw)if(k!=='allstar')post(`🏆 ${p.name}, ${S.year} ${AWARDS[k].n} 수상!`,'@WBL_소식');
  if(aw.includes('mvp'))p.fame+=15;if(aw.includes('ring'))p.fame+=10;if(aw.some(k=>k.startsWith('all')))p.fame+=4;if(aw.includes('gmvp'))p.fame+=5;
  p.fame=clamp(p.fame,0,100);
  for(const lv of['pro','g','eu']){const st=cur[lv];if(!st.gp&&lv!==ml)continue;
    const tid=(lv==='pro'&&!proContract)?null:c.team,tt=tid===null?null:T(lv,tid);
    pushHistory(lv,tt?tt.name:'-',st,{w:tt?tt.w:0,l:tt?tt.l:0,rank:lv===ml?rank:null,po:lv===ml?po.result:'-',aw:aw.filter(k=>AW_LV[k]===lv)})}
  p.proYears++;
  const mv=marketVal();
  const ag=ageUp();evolveLeagues();
  setFlow('pro_po',{po,aw,mvp,psc,ag,rec,ml,mv});
}

function ageUp(){
  const p=S.p,before=Math.round(OVR()),ab={...p.a};p.age++;S.year++;
  for(const k in p.a){
    if(p.age<=24)p.a[k]+=rnd(.3,1.2)*clamp((p.pot-p.a[k])/18,.1,1);
    if(p.age>=30)p.a[k]-=rnd(.3,1.6)*(p.age-29)*.45*(k==='sta'||k==='drv'?1.3:1);
    p.a[k]=clamp(p.a[k],20,99)}
  const diffs={};for(const k in p.a)diffs[k]=p.a[k]-ab[k];
  return{before,after:Math.round(OVR()),diffs};
}

   <table class="tbl">${Object.keys(ATTR).map(k=>{const d=ag.diffs[k];return`<tr><td>${ICON[k]} ${ATTR[k]}</td><td>${Math.round(p.a[k])}</td><td style="color:${d>=.05?'var(--green)':d<=-.05?'var(--red)':'var(--dim)'}">${d>=0?'+':''}${f1(d)}</td></tr>`}).join('')}</table>`}

function marketVal(){const p=S.p,c=S.cur;
  const sc=c.pro.gp>=10?scoreOf(c.pro):Math.max(scoreOf(c.g),scoreOf(c.eu))*.6;
  return OVR()+p.fame*.04+clamp(sc-15,0,20)*.15-Math.max(0,p.age-31)*1.5}
function yrsFor(age){return age>=33?ri(1,2):age>=29?ri(1,3):ri(2,4)}
function makeFA(undrafted){
  const p=S.p,mv=(D().mv!=null?D().mv:marketVal()),ag=AG[p.agent||0],out=[],prev=p.c;
  for(const t of shuffle(S.L.pro.slice())){
    const loyal=(['std','rookie','twoway'].includes(prev.type)&&prev.team===t.id)?3:0;
    const need=mv-t.str+gauss(0,2)+loyal;let o=null;
    if(!undrafted&&need>=-2)o={type:'std',years:yrsFor(p.age),salary:salaryFor(mv,p.fame)*rnd(.85,1.15)*ag.sal,guar:true};
    else if(!undrafted&&need>=-7&&Math.random()<.6)o={type:'std',years:ri(1,2),salary:rnd(1.1,2.5)*ag.sal,guar:Math.random()<.5};
    else if(need>=-12&&p.proYears<=4&&p.age<=26&&Math.random()<.5)o={type:'twoway',years:ri(1,2),salary:.6};
    else if(need>=-16&&Math.random()<.45)o={type:'ex10',years:1,salary:1.1};
    if(o){o.lv='pro';o.team=t.id;o.re=loyal>0;o.neg=0;out.push(o)}
  }
  const rank={std:3,twoway:2,ex10:1};
  out.sort((a,b)=>(b.re-a.re)||(rank[b.type]-rank[a.type])||(b.salary-a.salary));
  const list=out.slice(0,3+ag.extra);
  if(p.age<33)list.push({lv:'g',type:'g',team:ri(0,15),years:1,salary:.04,neg:0});
  if(mv>=58&&p.age<36)list.push({lv:'eu',type:'eu',team:ri(0,EU_NAMES.length-1),years:1,salary:clamp((mv-55)*.3,.4,7)*rnd(.9,1.2)*ag.sal,neg:0});
  list.forEach(o=>o.id=Math.random().toString(36).slice(2,8));
  return list;
}

       {t:'거절하고 FA를 노린다',fn:()=>{d.extDone=true;save();FLOWS.pro_contract()}}]);return}

    [{t:'잔류한다',cls:'pri',fn:()=>afterSign()},

      <button class="tbtn" data-auto="99">⏭ 시즌 끝까지<small>집중 육성 위주</small></button></div>
      <p class="hint">진한 테두리 = ${POS[p.pos].n} OVR 반영 능력치${sty.length?', 파란 테두리 = 대학 스타일 보너스(+20%)':''}. 고강도는 성장 1.7배지만 컨디션 소모·부상 위험이 큽니다.${S.kind==='pro'?' WBL 출전 시간은 팀 뎁스 차트(팀 탭)에서 같은 포지션 선수들과의 경쟁으로 정해져요.':''}</p>`;
  }
  h+='</div>';
  if(S.kind==='pro')h+=`<div class="card"><h3><span>지원 스태프 <small class="muted" style="font-weight:400">· 이번 시즌</small></span></h3><div class="staff">${Object.entries(STAFF).map(([k,s])=>`<button class="tbtn${p.svc[k]?' own':''}" data-hire="${k}" ${p.svc[k]||p.money<s.cost?'disabled':''}>
    <div class="r1"><span>${s.n}</span><em>${p.svc[k]?'고용 중':money(s.cost)}</em></div><small class="muted">${s.d}</small></button>`).join('')}</div></div>`;
  h+=focusHTML()+extrasHTML();
  h+=`<div class="card"><h3><span>최근 경기</span><span class="small" style="font-weight:400">${S.games.length?'':'아직 없음'}</span></h3><div class="glist">${gamesHTML(S.games.slice(-5).reverse())}</div></div>`;
  return h;
}
function gamesHTML(gs){return gs.map(g=>{const L=g.L,gr=L?grade(L.gs,L.min):'-';
  return`<div class="g"><div class="wl ${g.win?'W':'L'}">${g.win?'W':'L'}</div><div><div><span class="lv lv-${g.lv}">${LVN[g.lv]}</span> ${g.wk}주 ${g.home?'vs':'@'} ${esc(short(T(g.lv,g.opp).name))} <span class="muted">${g.sc}-${g.os}</span>${g.clutch?' ⏱':''}</div>
  <div class="ln">${!L?(g.out==='susp'?'출전 정지':'부상 결장'):!L.min?'출전 없음 (DNP)':`${L.min}분 · ${L.pts}점 ${L.reb}리바 ${L.ast}어시`}</div></div><div class="grade g${gr}">${gr}</div></div>`}).join('')}
function teamHTML(){
  const p=S.p;if(p.c.type==='hs')return`<div class="card"><h3><span>${esc(S.school.name)} 농구부</span><span>전력 ${Math.round(S.school.str)}</span></h3><p class="small muted">고교 시즌은 주말리그 전반기·후반기(각 7경기), 협회장배 전국대회, 왕중왕전으로 진행돼요. 졸업 후엔 대학·드래프트·G리그 중 진로를 고릅니다.</p></div>`+'<div class="card"><h3><span>WBL 스타 (MVP 라이벌)</span></h3><table class="tbl">'+[...S.stars].sort((a,b)=>b.base-a.base).map(s=>`<tr><td>${esc(s.name)}</td><td>${s.age}세</td><td>${esc(short(T('pro',s.team).name))}</td></tr>`).join('')+'</table></div>';
  const proTeam=['std','rookie','twoway','tenday','ex10'].includes(p.c.type);
  let h='';
  if(proTeam){const t=T('pro',p.c.team),ro=S.R[p.c.team];
    h+=`<div class="card"><h3><span>${esc(t.name)} 뎁스 차트</span><span>전력 ${Math.round(t.str)} · ${t.w}승 ${t.l}패</span></h3><div class="depth">
     ${Object.keys(POS).map(pos=>{const list=ro.filter(x=>x.pos===pos).map(x=>({n:x.n,o:x.o}));if(pos===p.pos)list.push({me:true,n:p.name,o:OVR()+(p.trust-50)/10});
       list.sort((a,b)=>b.o-a.o);return`<div class="pg"><b>${pos}</b><div class="pl">${list.map((x,i)=>`<span class="${x.me?'me':''}">${i===0?'⭐ ':''}${esc(x.n)}<em>${Math.round(x.o)}</em></span>`).join('')}</div></div>`}).join('')}
     </div><p class="hint">내 수치는 OVR에 감독 신뢰 보정(±5)을 더한 값이에요. 같은 포지션 1위면 주전, 2위면 식스맨/로테이션.${p.c.type==='twoway'?` 계열 G리그팀: ${esc(T('g',p.c.team).name)}`:''}</p></div>`}
  const sl=proTeam?'pro':mainLv(),st=standings(sl),cut={pro:8,g:4,eu:4,col:3}[sl];
  h+=`<div class="card"><h3><span>${S.year} ${LVN[sl]} 순위</span><span class="small" style="font-weight:400">상위 ${cut}팀 ${sl==='col'?'토너먼트 유력':'플레이오프'}</span></h3><div class="scroll"><table class="tbl">
   <tr><th>#</th><th class="l">팀</th><th>승</th><th>패</th><th>승률</th><th>전력</th></tr>
   ${st.map((t,i)=>`<tr class="${t.id===p.c.team?'me':''}${i===cut-1?' cut':''}"><td>${i+1}</td><td class="l">${esc(t.name)}</td><td>${t.w}</td><td>${t.l}</td><td>${t.w+t.l?(t.w/(t.w+t.l)).toFixed(3).replace(/^0/,''):'-'}</td><td>${Math.round(t.str)}</td></tr>`).join('')}
   </table></div></div>`;
  h+=`<div class="card"><h3><span>WBL 스타 (MVP 라이벌)</span></h3><table class="tbl"><tr><th class="l">선수</th><th>나이</th><th>소속</th></tr>
   ${[...S.stars].sort((a,b)=>b.base-a.base).map(s=>`<tr><td>${esc(s.name)}</td><td>${s.age}</td><td>${esc(short(T('pro',s.team).name))}</td></tr>`).join('')}</table></div>`;
  return h;
}
function statBlock(lv,c){const a=k=>c.gp?f1(c[k]/c.gp):'-';
  return`<div class="card"><h3><span><span class="lv lv-${lv}">${LVN[lv]}</span> ${S.year} 시즌</span><span>${c.gp}경기 출전</span></h3>
   <div class="strip" style="margin-bottom:8px"><div><b>${a('pts')}</b><span>득점</span></div><div><b>${a('reb')}</b><span>리바운드</span></div><div><b>${a('ast')}</b><span>어시스트</span></div><div><b>${a('min')}</b><span>출전</span></div></div>
   <div class="strip"><div><b>${pct(c.fgm,c.fga)}</b><span>야투</span></div><div><b>${pct(c.tpm,c.tpa)}</b><span>3점</span></div><div><b>${a('stl')}</b><span>스틸</span></div><div><b>${a('blk')}</b><span>블록</span></div></div>
   <p class="hint">시즌 지수 ${f1(scoreOf(c))}${lv==='pro'?' — MVP 경쟁권은 대략 45 이상 + 팀 성적':''}</p></div>`}
function statsHTML(){
  const lvs=['pro','g','eu','col','hs'].filter(l=>S.cur[l]&&S.cur[l].gp);let h=lvs.map(l=>statBlock(l,S.cur[l])).join('')||'<div class="card"><p class="muted small">이번 시즌 출전 기록이 없습니다.</p></div>';
  h+=`<div class="card"><h3><span>능력치</span><span>OVR ${Math.round(OVR())}</span></h3><table class="tbl">${Object.keys(ATTR).map(k=>`<tr><td>${ICON[k]} ${ATTR[k]}${POS[S.p.pos].w[k]?` <span class="muted small">×${POS[S.p.pos].w[k]}</span>`:''}</td><td>${f1(S.p.a[k])}</td></tr>`).join('')}</table></div>
   <div class="card"><h3><span>경기 로그</span></h3><div class="glist">${S.games.length?gamesHTML([...S.games].reverse()):'<p class="muted small">아직 경기가 없습니다.</p>'}</div></div>`;
  return h;
}
function careerHTML(){
  const H=S.history,t=S.trophies,L=legacy();
  const pro=H.filter(h=>h.lv==='pro'),tot=pro.reduce((a,h)=>{a.gp+=h.tot.gp;a.pts+=h.tot.pts;a.reb+=h.tot.reb;a.ast+=h.tot.ast;return a},{gp:0,pts:0,reb:0,ast:0});
  let h='';
  if(S.stage==='retired')h+=`<div class="card" style="text-align:center"><div style="font-size:48px">🎤</div><h1 style="font-size:28px;color:var(--gold)">${L.tier[0]}</h1>
    <p class="muted small" style="margin:6px 0 12px">${esc(S.p.name)} · ${S.p.age}세 은퇴 · ${S.retireWhy?esc(S.retireWhy):''}</p><p>${L.tier[1]}</p></div>`;
  const d=S.p.draft;
  h+=`<div class="card"><h3><span>커리어 경로</span></h3><p class="small" style="line-height:1.7">${S.p.colYears?`🎓 대학 ${S.p.colYears}년 · `:''}${d?(d.pick?`📝 ${d.year} 드래프트 ${pickText(d.pick)} (${esc(short(T('pro',d.team).name))})`:`📝 ${d.year} 드래프트 미지명`):'📝 드래프트 전'} · 에이전트: ${S.p.agent===null?'-':AG[S.p.agent].n}</p></div>`;
  const cab=keys=>`<div class="cab">${keys.map(k=>`<div class="${t[k]?'':'off'}"><div class="ic">${AWARDS[k].ic}</div><b>${t[k]||0}</b><span>${AWARDS[k].n}</span></div>`).join('')}</div>`;
  h+=`<div class="card"><h3><span>트로피 캐비닛 · WBL</span><span>레거시 ${L.sc}점</span></h3>${cab(AW_PRO)}</div>
   <div class="card"><h3><span>대학 · G리그 · 유럽</span></h3>${cab(AW_ETC)}</div>
  <div class="card"><h3><span>WBL 통산</span><span>${tot.gp}경기</span></h3><div class="strip"><div><b>${tot.pts}</b><span>득점</span></div><div><b>${tot.reb}</b><span>리바운드</span></div><div><b>${tot.ast}</b><span>어시스트</span></div><div><b>${tot.gp?f1(tot.pts/tot.gp):'-'}</b><span>평균 득점</span></div></div></div>
  <div class="card"><h3><span>시즌별 기록</span></h3>${H.length?`<div class="scroll"><table class="tbl" style="min-width:600px"><tr><th>시즌</th><th class="l">리그</th><th class="l">팀</th><th>역할</th><th>OVR</th><th>G</th><th>PTS</th><th>REB</th><th>AST</th><th>성적</th><th>PO</th><th>수상</th></tr>
   ${H.map(x=>`<tr><td>${x.year} (${x.age})</td><td class="l"><span class="lv lv-${x.lv}">${LVN[x.lv]}</span></td><td class="l">${esc(short(x.team))}</td><td>${x.role}</td><td>${x.ovr}</td><td>${x.gp}</td><td>${f1(x.pts)}</td><td>${f1(x.reb)}</td><td>${f1(x.ast)}</td><td>${x.w}-${x.l}</td><td>${x.po.replace(' 통과','').replace('플레이오프 진출 실패','-')}</td><td>${x.aw.map(k=>AWARDS[k].ic).join('')}</td></tr>`).join('')}</table></div>`:'<p class="muted small">첫 시즌을 마치면 기록이 쌓입니다.</p>'}</div>
  ${S.stage==='season'||S.stage==='hs'?'<div class="card"><button class="btn ghost" id="retireNow">🎤 지금 은퇴하기</button></div>':''}
  <div class="card"><button class="btn ghost" id="reset">${S.stage==='retired'?'🏀 새 커리어 시작':'처음부터 다시 시작'}</button></div>`;
  return h;
}
let selPos='PG',selDiff='normal';
function startHTML(){
  return`<div class="hero"><div class="ball">🏀</div><h1>벤치에서<br><em>MVP까지</em></h1><p>고교 1학년 벤치에서 시작해 대학, 드래프트, G리그,<br>투웨이와 Exhibit 10을 거쳐 리그 MVP까지.</p></div>
  <div class="card"><label class="lb">선수 이름</label><input class="txt" id="nm" maxlength="12" placeholder="이름을 입력하세요">
  <label class="lb">포지션</label><div class="posgrid">${Object.keys(POS).map(k=>`<button data-pos="${k}" class="${k===selPos?'on':''}">${k}<small>${POS[k].n}</small></button>`).join('')}</div>
  <div class="posdesc" id="pd">${POS[selPos].d}</div>
  <label class="lb">출발점</label><div class="diff">${[['easy','유망주','★4 안팎'],['normal','평범','★2~3'],['hard','무명','★1~2']].map(([k,n,s])=>`<button data-diff="${k}" class="${k===selDiff?'on':''}">${n}<small>${s}</small></button>`).join('')}</div>
  <button class="btn pri" id="go">고교 1학년으로 시작</button></div>
  <div class="card small muted" style="line-height:1.75">• 고교 3년: 집중 육성을 정하고 시즌을 보내면 주말리그·전국대회·왕중왕전 결과가 나와요.<br>• 시즌 사이 <b>전환점</b> 선택, <b>국가대표</b> 발탁, <b>상점</b>, 팬·기자 <b>반응</b> 피드.<br>• 고교 졸업 후 <b>대학 진학 / 드래프트 직행 / G리그 직행</b>을 선택.<br>• 대학에선 학점 관리, 전국 토너먼트, 매년 드래프트 참가 여부 결정.<br>• 드래프트: 에이전트 선임 → 컴바인 → 팀 워크아웃 → 지명.<br>• 계약: 루키 스케일, 정규, <b>투웨이</b>, <b>Exhibit 10</b>, G리그, 10일 계약, 해외.<br>• FA 시장에선 여러 구단의 제안을 비교하고 연봉 협상.<br>• 매주 훈련·휴식·면담 등을 고르면 경기가 진행되고, 접전에선 마지막 슛을 직접 선택.</div>`}
function bindStart(){
  document.querySelectorAll('[data-pos]').forEach(b=>b.onclick=()=>{selPos=b.dataset.pos;document.querySelectorAll('[data-pos]').forEach(x=>x.classList.toggle('on',x===b));$('#pd').textContent=POS[selPos].d});
  document.querySelectorAll('[data-diff]').forEach(b=>b.onclick=()=>{selDiff=b.dataset.diff;document.querySelectorAll('[data-diff]').forEach(x=>x.classList.toggle('on',x===b))});
  $('#go').onclick=()=>{const nm=$('#nm').value.trim()||pick(['김','이','박','최','정'])+pick(['준호','민재','태윤','도현','시우']);newGame(nm,selPos,selDiff)};
}
function bindHome(){
  document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>week(b.dataset.act,b.dataset.k));
  document.querySelectorAll('[data-auto]').forEach(b=>b.onclick=()=>autoWeeks(+b.dataset.auto));
  document.querySelectorAll('[data-hire]').forEach(b=>b.onclick=()=>hire(b.dataset.hire));
  document.querySelectorAll('[data-agent]').forEach(b=>b.onclick=()=>agentAction());
  const hd=$('#hard');if(hd)hd.onchange=()=>{S.hard=hd.checked;save()};
  const rf=$('#resumeFlow');if(rf)rf.onclick=()=>resumeFlow();
  const hp=$('#hsPlay');if(hp)hp.onclick=()=>playHsSeason();
  const sb=$('#shopBtn');if(sb)sb.onclick=()=>openShop();
  document.querySelectorAll('[data-focus]').forEach(b=>b.onclick=()=>{S.p.focus=b.dataset.focus;save();const y=window.scrollY;render();window.scrollTo(0,y)});
  const rn=$('#retireNow');if(rn)rn.onclick=()=>modal('🎤 지금 은퇴하기','<p>정말 은퇴할까요? 커리어가 여기서 끝나요.</p>',[{t:'은퇴한다',cls:'pri',fn:()=>retire('스스로 코트를 떠나기로 했다.')},{t:'취소'}]);
  const rs=$('#reset');if(rs)rs.onclick=()=>modal('새로 시작',`<p>${S.stage==='retired'?'새 선수로 커리어를 시작할까요?':'현재 커리어가 삭제됩니다. 정말 처음부터 시작할까요?'}</p>`,
    [{t:'시작하기',cls:'pri',fn:()=>{wipe();S=null;tab='home';busy=false;render()}},{t:'취소'}]);
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render();window.scrollTo(0,0)});

/* =================== modal =================== */
function closeModal(){$('#modal').classList.remove('on')}
function modal(title,html,buttons,bind){
  $('#mTitle').textContent=title;$('#mBody').innerHTML=html;const f=$('#mBtns');f.innerHTML='';
  buttons.forEach(b=>{const el=document.createElement('button');el.className='btn '+(b.cls||'');el.innerHTML=b.t;
    el.onclick=()=>{closeModal();render();b.fn&&b.fn()};f.appendChild(el)});
  if(bind)bind($('#mBody'));
  $('#modal').classList.add('on');$('.mbox').scrollTop=0;
}

/* =================== boot =================== */
S=load();
if(S&&S.v!==2)S=null;
if(S){S.feed=S.feed||[];S.p.items=S.p.items||[];S.p.focus=S.p.focus||'sht';S.cur.hs=S.cur.hs||blank();S.school=S.school||{name:'한빛고',str:48};S.hsYear=S.hsYear||4}
render();
if(S&&S.stage==='flow')resumeFlow();
</script>
</body>
