<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>24초 카드 농구</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="샷클락 24초 안에 카드로 찬스를 만들고 슛 타이밍을 고르는 농구 전략 카드 게임">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&family=Share+Tech+Mono&display=swap">
<style>
/* Layout: arena — score strip on top, court + shot clock on the left, play-by-play on the right, a hand of split attack/defense cards along the bottom */
:root{
  --bg:#e7ecf0; --surface:#ffffff; --raise:#f2f5f8; --ink:#13202b; --dim:#566572; --line:#d2dae1;
  --off:#d9560f; --off-soft:rgba(217,86,15,.10); --def:#0b7a82; --def-soft:rgba(11,122,130,.10);
  --court:#9cafbe; --floor:#f7f9fb; --spot:#eef2f5; --led-bg:#101418; --led:#ff3b2f; --good:#1d8a4b; --bad:#d23a2c; --ball:#ef7a1a;
  --f-disp:'Black Han Sans','Noto Sans KR',sans-serif;
  --f-ui:'Noto Sans KR',system-ui,-apple-system,sans-serif;
  --f-num:'Share Tech Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1115; --surface:#131b21; --raise:#19232b; --ink:#e6ecf0; --dim:#93a1ad; --line:#25313b;
  --off:#ff7c35; --off-soft:rgba(255,124,53,.13); --def:#2ab4bb; --def-soft:rgba(42,180,187,.13);
  --court:#4a5b68; --floor:#10181e; --spot:#18232b; --led-bg:#04070a; --led:#ff4a3d; --good:#45c485; --bad:#ff6a5c; --ball:#ff8a2e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1115; --surface:#131b21; --raise:#19232b; --ink:#e6ecf0; --dim:#93a1ad; --line:#25313b;
  --off:#ff7c35; --off-soft:rgba(255,124,53,.13); --def:#2ab4bb; --def-soft:rgba(42,180,187,.13);
  --court:#4a5b68; --floor:#10181e; --spot:#18232b; --led-bg:#04070a; --led:#ff4a3d; --good:#45c485; --bad:#ff6a5c; --ball:#ff8a2e; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 32px;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--off);outline-offset:2px}
.top{max-width:1180px;margin:0 auto 12px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-disp);font-size:26px;line-height:1;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.brand .led{font-family:var(--f-num);background:var(--led-bg);color:var(--led);padding:2px 8px;border-radius:6px;font-size:22px;letter-spacing:.04em}
.top nav{display:flex;gap:8px}
.ghost{background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--dim)}
.ghost:hover{color:var(--ink);border-color:var(--dim)}
#app{max-width:1180px;margin:0 auto}

/* scoreboard */
.score{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:center;background:var(--led-bg);color:#e9eef2;border-radius:14px;padding:10px 14px;margin-bottom:14px}
.tm{display:flex;align-items:center;gap:12px;min-width:0}
.tm.r{justify-content:flex-end;text-align:right}
.tm .nm{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm .nm small{display:block;font-weight:400;font-size:11.5px;color:#9aa8b4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm .pts{font-family:var(--f-num);font-size:44px;line-height:1;color:var(--led);min-width:2.2ch;text-align:center;font-variant-numeric:tabular-nums}
.tm .me{color:#ffb070}
.per{text-align:center;font-family:var(--f-num);color:#c8d2da;line-height:1.2}
.per b{display:block;font-size:22px;color:#ffd166;font-weight:400}
.per small{font-size:12px}

/* arena */
.arena{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);grid-template-areas:"court pbp" "hand hand";gap:14px;align-items:start}
.arena>.cp{grid-area:court} .arena>.pp{grid-area:pbp} .arena>.handbar{grid-area:hand}
@media (max-width:860px){.arena{grid-template-columns:minmax(0,1fr);grid-template-areas:"court" "hand" "pbp"}}
@media (max-width:560px){.tm .nm small{display:none}.tm .nm{white-space:normal;font-size:12px;line-height:1.25}.tm .pts{font-size:34px}.score{padding:8px 10px}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.court{display:block;width:100%;height:auto;border-radius:10px;background:var(--floor)}
.ledrow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;margin-top:12px}
.clock{background:var(--led-bg);border-radius:10px;padding:6px 12px;text-align:center;min-width:92px}
.clock b{display:block;font-family:var(--f-num);font-weight:400;font-size:46px;line-height:1;color:var(--led);font-variant-numeric:tabular-nums}
.clock small{font-size:10.5px;color:#93a0ab;letter-spacing:.08em}
.clock.low b{animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.meter .lbl{display:flex;justify-content:space-between;font-size:12px;color:var(--dim)}
.pips{display:flex;gap:4px;margin:4px 0 6px}
.pips i{flex:1;height:10px;border-radius:3px;background:var(--raise);border:1px solid var(--line)}
.pips i.on{background:var(--off);border-color:var(--off)}
.readout{font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums}
.readout b{font-family:var(--f-num);font-weight:400;font-size:20px;color:var(--ink)}
.bar{margin-top:12px;border-top:1px dashed var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.bar p{margin:0;max-width:62ch}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:none;border-radius:10px;padding:10px 16px;font-weight:700;font-size:14.5px;background:var(--ink);color:var(--surface)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.shoot{background:var(--off);color:#fff}
.btn.defb{background:var(--def);color:#fff}
.btn.sec{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.grow{flex:1}
.res{font-family:var(--f-disp);font-size:34px;line-height:1.1}
.res.good{color:var(--good)} .res.bad{color:var(--bad)}
.alert{font-weight:700;color:var(--def)}
.alert.o{color:var(--off)}
.hint{color:var(--dim);font-size:13px}

/* play-by-play */
.opp{display:flex;flex-direction:column;gap:6px;padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:12px}
.opp .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.opp b{font-size:15px}
.backs{display:inline-flex;vertical-align:middle;margin-left:6px}
.backs i{width:12px;height:17px;border-radius:3px;background:var(--led-bg);border:1.5px solid var(--surface);margin-left:-3px}
.dtrack{display:flex;flex-wrap:wrap;gap:4px}
.dchip{font-size:11.5px;padding:1px 7px;border-radius:999px;background:var(--def-soft);color:var(--def);font-weight:700;font-variant-numeric:tabular-nums}
.dchip.gone{opacity:.4;text-decoration:line-through}
h3{font-size:12.5px;font-weight:700;margin:0 0 6px;color:var(--dim);letter-spacing:.05em}
.pbp{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:340px;overflow:auto}
.pbp li{display:grid;grid-template-columns:38px minmax(0,1fr);gap:8px;font-size:13px;align-items:start}
.pbp .t{font-family:var(--f-num);color:var(--led);background:var(--led-bg);border-radius:5px;text-align:center;font-size:13px;padding:1px 0}
.pbp .who{font-weight:700}
.pbp .o{color:var(--off)} .pbp .d{color:var(--def)}
.pbp .x{color:var(--dim)}
.games{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--dim);max-height:150px;overflow:auto}
.games li{display:flex;justify-content:space-between;gap:8px}

/* hand */
.handbar{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 12px 4px;min-width:0}
.hh{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline;font-size:13px}
.hand{display:flex;gap:10px;overflow-x:auto;padding:14px 2px 12px}
.card{flex:0 0 156px;width:156px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);padding:0;text-align:left;display:flex;flex-direction:column;overflow:hidden;transition:transform .15s,border-color .15s}
.card:hover{border-color:var(--dim)}
.half{padding:8px 10px;display:flex;flex-direction:column;gap:2px;min-height:92px}
.half .k{font-size:10.5px;font-weight:700;letter-spacing:.04em;display:flex;justify-content:space-between;gap:6px}
.half .n{font-weight:900;font-size:15px;line-height:1.2}
.half .fx{font-size:11.5px;color:var(--dim);line-height:1.35}
.oh{background:var(--off-soft)} .oh .k{color:var(--off)}
.dh{background:var(--def-soft)} .dh .k{color:var(--def)}
.perf{height:0;border-top:2px dashed var(--line)}
.card.mute-o .oh,.card.mute-d .dh{opacity:.38}
.card.dim{opacity:.55}
.card.sel{transform:translateY(-8px);border-color:var(--ink)}
.card.sel.so{border-color:var(--off)} .card.sel.sd{border-color:var(--def)}
@media (prefers-reduced-motion: reduce){.card{transition:none}.clock.low b{animation:none}}

/* solo screens */
.solo{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;max-width:900px;margin:0 auto}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--dim);margin:0 0 4px;font-weight:500}
h2{font-family:var(--f-disp);font-weight:400;font-size:34px;line-height:1.1;margin:0 0 10px;text-wrap:balance}
p{margin:0 0 10px;max-width:66ch}
.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:12px 0}
.team{text-align:left;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.team.on{border-color:var(--off);background:var(--off-soft)}
.team b{font-size:16px}
.team .ps{font-size:12.5px;color:var(--off);font-weight:700}
.team .dk{font-size:12px;color:var(--dim)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:4px 0 12px}
.seg button{border:none;background:var(--surface);padding:8px 14px;font-weight:700;font-size:13px;color:var(--dim)}
.seg button.on{background:var(--ink);color:var(--surface)}
.rules{margin:0 0 12px;padding-left:18px;display:flex;flex-direction:column;gap:5px;max-width:68ch}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:12px 0}
.stat>div{background:var(--raise);border-radius:10px;padding:9px 12px;display:flex;flex-direction:column}
.stat span{font-size:12px;color:var(--dim)} .stat b{font-family:var(--f-num);font-weight:400;font-size:24px;font-variant-numeric:tabular-nums}
.sheet-wrap{position:fixed;inset:0;background:rgba(6,10,14,.5);display:flex;align-items:center;justify-content:center;z-index:20;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--surface);border-radius:14px;max-width:760px;width:100%;max-height:100%;overflow:auto;padding:20px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl td,.tbl th{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{color:var(--dim);font-weight:500;font-size:12px}
.scroll{overflow-x:auto}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="led">24</span>초 카드 농구</div>
  <nav><button class="ghost" type="button" data-act="rules">규칙</button><button class="ghost" type="button" data-act="menu">새 경기</button></nav>
</header>
<main id="app" aria-live="polite"></main>
<div class="sheet-wrap" id="modal" hidden><div class="sheet" id="modalBody" role="dialog" aria-label="규칙"></div></div>

<script>
(() => {
// ---------- rules data ----------
const ZONES = {
  rim:   {n:'림',      base:.60, pts:2, at:[250,64]},
  post:  {n:'포스트',  base:.48, pts:2, at:[160,122]},
  elbow: {n:'엘보',    base:.42, pts:2, at:[330,200]},
  top:   {n:'탑 3점',  base:.33, pts:3, at:[250,322]},
  wing:  {n:'윙 3점',  base:.34, pts:3, at:[74,252]},
  corner:{n:'코너 3점',base:.38, pts:3, at:[456,92]},
};
const INSIDE = z => z==='rim' || z==='post' || z==='elbow';
const OFF = {
  drive:   {n:'돌파',          type:'drive',  sec:5, to:'rim',    gain:2, req:['top','wing','corner','elbow'], fx:'→ 림 · 찬스 +2'},
  swing:   {n:'스윙 패스',     type:'pass',   sec:3, to:'wing',   gain:1, fx:'→ 윙 · 찬스 +1'},
  skip:    {n:'스킵 패스',     type:'pass',   sec:4, to:'corner', gain:2, req:['top','wing'], fx:'탑·윙에서 → 코너 · 찬스 +2'},
  kick:    {n:'킥아웃',        type:'pass',   sec:3, to:'corner', gain:1, inGain:3, fx:'→ 코너 · 찬스 +1, 림·포스트에서 쓰면 +3'},
  pnr:     {n:'픽앤롤',        type:'screen', sec:5, to:'elbow',  gain:2, combo:true, fx:'→ 엘보 · 찬스 +2 · 다음 행동 +1'},
  dho:     {n:'핸드오프',      type:'screen', sec:4, to:'wing',   gain:1, combo:true, fx:'→ 윙 · 찬스 +1 · 다음 행동 +1'},
  entry:   {n:'엔트리 패스',   type:'post',   sec:3, to:'post',   gain:1, req:['top','wing','elbow'], fx:'→ 포스트 · 찬스 +1'},
  postup:  {n:'포스트업',      type:'post',   sec:6, to:'rim',    gain:2, req:['post'], fx:'포스트에서 → 림 · 찬스 +2'},
  backdoor:{n:'백도어 컷',     type:'cut',    sec:4, to:'rim',    gain:3, req:['top','wing'], fx:'탑·윙에서 → 림 · 찬스 +3'},
  iso:     {n:'아이솔레이션',  type:'drive',  sec:8, to:null,     gain:3, fx:'제자리 1대1 · 찬스 +3'},
  flash:   {n:'하이포스트 플래시', type:'cut', sec:3, to:'elbow', gain:1, combo:true, fx:'→ 엘보 · 찬스 +1 · 다음 행동 +1'},
  relocate:{n:'리로케이트',    type:'cut',    sec:3, to:'corner', gain:1, combo:true, fx:'→ 코너 · 찬스 +1 · 다음 행동 +1'},
  stepback:{n:'스텝백 3점',    type:'shot',   sec:2, to:'three',  gain:1, fx:'3점 존에서 바로 슛 · 찬스 +1'},
  floater: {n:'플로터',        type:'shot',   sec:1, to:null,     gain:1, req:['rim','post','elbow'], fx:'안쪽에서 바로 슛 · 찬스 +1 · 블록에 강함'},
  timeout: {n:'작전 타임',     type:'special',sec:0, to:null,     gain:0, fx:'카드 2장 뽑기 · 0초'},
};
const DEFH = {
  deny:    {n:'디나이',     vs:'pass',   fx:'패스 무효 · 30% 스틸'},
  help:    {n:'헬프',       vs:'drive',  fx:'돌파의 찬스 증가 무효'},
  switch:  {n:'스위치',     vs:'screen', fx:'스크린의 찬스·연계 무효'},
  double:  {n:'더블팀',     vs:'post',   fx:'포스트 무효 · 25% 스틸'},
  body:    {n:'바디체크',   vs:'cut',    fx:'컷 무효 · 40% 스틸'},
  rotate:  {n:'로테이션',   vs:'any',    fx:'찬스 −1'},
  press:   {n:'압박',       vs:'any',    fx:'샷클락 −4초 (0초면 바이올레이션)'},
  zone:    {n:'존 수비',    vs:'any',    fx:'이번 포세션 돌파·포스트 찬스 −1'},
  timeout2:{n:'작전 타임',  vs:'any',    fx:'카드 2장 뽑기'},
  contest: {n:'컨테스트',   vs:'shot',   fx:'슛 성공률 −12%p'},
  block:   {n:'블록',       vs:'shot',   fx:'안쪽 슛 −20%p · 3점 −6%p'},
};
const CARDS = {
  drive:['drive','contest'], swing:['swing','deny'], skip:['skip','rotate'], kick:['kick','help'], pnr:['pnr','switch'],
  dho:['dho','press'], entry:['entry','double'], postup:['postup','block'], backdoor:['backdoor','body'], iso:['iso','help'],
  flash:['flash','zone'], relocate:['relocate','deny'], stepback:['stepback','contest'], floater:['floater','rotate'], timeout:['timeout','timeout2'],
};
const TYPE_KO = {pass:'패스', drive:'돌파', screen:'스크린', post:'포스트', cut:'컷', shot:'슛', special:'특수'};
const VS_KO = {pass:'패스를 막음', drive:'돌파를 막음', screen:'스크린을 막음', post:'포스트를 막음', cut:'컷을 막음', any:'언제든', shot:'슛을 막음'};
const TEAMS = {
  splash:{n:'스플래시 슈터스', ps:'3점 슛 성공률 +4%p', dk:'패스와 핸드오프로 외곽 찬스를 만드는 덱. 디나이·로테이션이 많다.',
    deck:{swing:3,skip:2,kick:2,dho:2,relocate:2,stepback:2,pnr:2,drive:2,timeout:1,backdoor:1,flash:1}},
  towers:{n:'트윈 타워스', ps:'림·포스트 슛 +5%p, 블록 효과 +5%p', dk:'엔트리 패스와 포스트업으로 골밑을 두드리는 덱. 더블팀·블록이 많다.',
    deck:{entry:3,postup:3,flash:2,kick:2,pnr:2,swing:2,floater:2,drive:1,timeout:1,backdoor:1,skip:1}},
  run:{n:'런앤건 로켓츠', ps:'모든 공격 카드 −1초, 포세션 첫 행동 찬스 +1', dk:'돌파와 컷으로 빠르게 림을 공략하는 덱. 헬프·압박이 많다.',
    deck:{drive:3,backdoor:2,iso:2,floater:2,kick:2,swing:2,dho:2,pnr:2,stepback:1,timeout:1,relocate:1}},
};
const DIFFS = [{n:'루키', skill:.55, noise:.35}, {n:'프로', skill:.78, noise:.17}, {n:'올스타', skill:.94, noise:.05}];
const KEEP = {drive:2,swing:1,skip:1.5,kick:1.5,pnr:2,dho:1.5,entry:1,postup:2,backdoor:2,iso:1.5,flash:1,relocate:1,stepback:1.5,floater:1.5,timeout:1};
const PER_Q = 3, PER_OT = 2, HAND_MAX = 7, CLOCK = 24;
const KEY = 'shotclock-cards-v1';

let SAVE = {team:'splash', diff:1, rec:{}};
try { const s = JSON.parse(localStorage.getItem(KEY)||'null'); if (s) SAVE = Object.assign(SAVE, s); } catch(e){}
const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(SAVE)); } catch(e){} };

// ---------- helpers ----------
const $ = s => document.querySelector(s);
const rnd = Math.random;
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const pct = x => Math.round(x*100) + '%';
const f2 = x => x.toFixed(2);
const shuffle = a => { for (let i=a.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const wait = ms => new Promise(r => setTimeout(r, reduce ? ms/3 : ms));

let S = {screen:'menu', modal:false, G:null};
let ANSWER = null, TOKEN = 0;

// ---------- game state ----------
function mkSide(team){
  const ids = []; for (const [id,n] of Object.entries(TEAMS[team].deck)) for (let i=0;i<n;i++) ids.push(id);
  return {team, deck: shuffle(ids.map(id => ({uid: ++S.G.uid, id}))), hand:[], disc:[], st:{fga:0, fgm:0, tpm:0, to:0, stl:0, pts:0}};
}
function draw(P, n){
  for (let k=0;k<n;k++){
    if (P.hand.length >= HAND_MAX) return;
    if (!P.deck.length){ if (!P.disc.length) return; P.deck = shuffle(P.disc); P.disc = []; }
    P.hand.push(P.deck.pop());
  }
}
function newGame(){
  TOKEN++;
  const others = Object.keys(TEAMS).filter(t => t!==SAVE.team);
  S.G = {uid:0, q:1, idx:0, side:'off', diff:SAVE.diff, games:[], P:null, phase:'busy', res:null, sel:null, pending:null, msg:''};
  S.G.me = mkSide(SAVE.team); S.G.op = mkSide(others[Math.floor(rnd()*others.length)]);
  draw(S.G.me, 4); draw(S.G.op, 4);
  S.screen = 'game'; S.modal = false;
  startPoss();
}
const perLen = g => g.q<=4 ? PER_Q : PER_OT;
const perLabel = g => g.q<=4 ? g.q+'Q' : (g.q===5 ? 'OT' : 'OT'+(g.q-4));
const att = () => S.G.side==='off' ? S.G.me : S.G.op;
const dfn = () => S.G.side==='off' ? S.G.op : S.G.me;
const isMe = P => P===S.G.me;
const teamName = P => TEAMS[P.team].n;

function startPoss(){
  const g = S.G;
  draw(g.me, 3); draw(g.op, 3);
  g.P = {zone:'top', prev:null, chance:0, clock:CLOCK, combo:false, first:true, zoneD:false, log:[]};
  g.res = null; g.sel = null; g.pending = null; g.msg = '';
  plog('x', null, `${perLabel(g)} 포세션 시작 · 공은 탑에서 출발합니다.`);
  if (g.side==='off'){ g.phase = 'act'; render(); }
  else { g.phase = 'busy'; render(); aiOffense(TOKEN); }
}
function plog(kind, who, text){ S.G.P.log.push({t:Math.max(0,S.G.P.clock), kind, who, text}); }

// ---------- mechanics ----------
const secOf = (id, P) => Math.max(0, OFF[id].sec - (P.team==='run' && OFF[id].sec>0 ? 1 : 0));
function legalOff(id, P){
  const o = OFF[id], st = S.G.P;
  if (o.req && !o.req.includes(st.zone)) return false;
  if (o.type==='special') return true;
  return secOf(id, P) <= st.clock;
}
function shotP(team, zone, chance){
  const Z = ZONES[zone];
  let p = Z.base + .05*Math.min(chance, 8);
  if (team==='splash' && Z.pts===3) p += .04;
  if (team==='towers' && (zone==='rim' || zone==='post')) p += .05;
  return clamp(p, .05, .92);
}
const shotEV = (team, zone, chance) => shotP(team, zone, chance) * ZONES[zone].pts;
function planAction(id, P){
  const o = OFF[id], st = S.G.P;
  let gain = 0;
  if (o.type!=='special'){
    gain = (o.inGain && (st.zone==='rim' || st.zone==='post') ? o.inGain : o.gain) + (st.combo ? 1 : 0) + (P.team==='run' && st.first ? 1 : 0)
         - (st.zoneD && (o.type==='drive' || o.type==='post') ? 1 : 0);
  }
  let to = o.to; if (to==='three') to = ZONES[st.zone].pts===3 ? st.zone : 'top';
  return {id, type:o.type, sec:secOf(id,P), to, gain:Math.max(0,gain), combo:!!o.combo, shot:o.type==='shot', floater:id==='floater'};
}
// apply an attack card after the defense has (or has not) answered it
function commitAction(act, react, A, D){
  const st = S.G.P, out = {steal:false, violation:false, notes:[]};
  st.clock -= act.sec;
  let negate = false, noGain = false, gain = act.gain;
  if (act.type==='special'){ draw(A, 2); out.notes.push('카드 2장을 뽑았습니다.'); }
  if (react){
    const d = DEFH[react];
    if (d.vs===act.type){
      if (react==='deny' || react==='double' || react==='body'){
        negate = true;
        if (rnd() < {deny:.3, double:.25, body:.4}[react]) out.steal = true;
        out.notes.push(out.steal ? '공을 빼앗았습니다!' : '행동을 막아냈습니다.');
      } else { noGain = true; out.notes.push('찬스 증가를 막았습니다.'); }
    }
    if (react==='zone'){ st.zoneD = true; if (act.type==='drive' || act.type==='post'){ gain = Math.max(0, gain-1); } out.notes.push('존 수비로 바꿨습니다.'); }
    if (react==='press'){ st.clock -= 4; out.notes.push('샷클락 4초를 빼앗았습니다.'); }
    if (react==='timeout2'){ draw(D, 2); out.notes.push('수비 측이 카드 2장을 뽑았습니다.'); }
  }
  if (!negate){
    if (act.to){ st.prev = st.zone; st.zone = act.to; }
    if (!noGain) st.chance += gain;
    st.combo = act.combo && !noGain;
  } else st.combo = false;
  if (react==='rotate'){ st.chance = Math.max(0, st.chance-1); out.notes.push('찬스 −1.'); }
  st.first = false;
  if (st.clock < 0 || (react==='press' && st.clock <= 0)) out.violation = true;
  st.clock = Math.max(0, st.clock);
  return out;
}
function reactOptions(P, act){ return P.hand.filter(c => { const v = DEFH[CARDS[c.id][1]].vs; return v===act.type || v==='any'; }); }
function shotOptions(P){ return P.hand.filter(c => DEFH[CARDS[c.id][1]].vs==='shot'); }
function shotDrop(defId, D, zone, floater){
  if (defId==='contest') return .12;
  if (defId==='block') return (INSIDE(zone) ? (floater ? .10 : .20) : .06) + (D.team==='towers' ? .05 : 0);
  return 0;
}
function take(P, uid){ const i = P.hand.findIndex(c => c.uid===uid); return i>=0 ? P.hand.splice(i,1)[0] : null; }

// ---------- AI ----------
function aiReact(act){
  const g = S.G, D = g.op, A = g.me, st = g.P, dif = DIFFS[g.diff];
  if (act.shot) return null;
  const opts = reactOptions(D, act); if (!opts.length) return null;
  const tz = act.to || st.zone, after = shotEV(A.team, tz, st.chance+act.gain), stay = shotEV(A.team, st.zone, st.chance), noG = shotEV(A.team, tz, st.chance);
  let best = null, bs = .12;
  for (const c of opts){
    const d = CARDS[c.id][1];
    let s = 0;
    if (DEFH[d].vs===act.type){
      if (d==='deny' || d==='double' || d==='body') s = (after - stay) + ({deny:.3,double:.25,body:.4}[d])*after;
      else s = after - noG;
    } else if (d==='rotate') s = shotEV(A.team, tz, st.chance+act.gain) - shotEV(A.team, tz, Math.max(0, st.chance+act.gain-1));
    else if (d==='press') s = st.clock - act.sec - 4 <= 0 ? 3 : (st.clock - act.sec <= 10 ? .18 : .04);
    else if (d==='zone') s = st.first && A.team!=='splash' ? .2 : .04;
    else if (d==='timeout2') s = D.hand.length <= 3 ? .16 : .02;
    s -= KEEP[c.id]*.04;
    if (s > bs){ bs = s; best = c; }
  }
  if (!best || rnd() > dif.skill) return null;
  take(D, best.uid); D.disc.push(best);
  return CARDS[best.id][1];
}
function aiShotDef(zone, floater, ev){
  const g = S.G, D = g.op, dif = DIFFS[g.diff], pts = ZONES[zone].pts;
  const opts = shotOptions(D); if (!opts.length || ev < .8) return null;
  let best = null, bs = .14;
  for (const c of opts){ const s = shotDrop(CARDS[c.id][1], D, zone, floater)*pts - KEEP[c.id]*.03; if (s > bs){ bs = s; best = c; } }
  if (!best || rnd() > dif.skill) return null;
  take(D, best.uid); D.disc.push(best);
  return CARDS[best.id][1];
}
// chance that the human answers this action type, from the public make-up of their deck
function counterRisk(type){
  const g = S.G, tot = {}; let n = 0;
  for (const [id,k] of Object.entries(TEAMS[g.me.team].deck)){ const v = DEFH[CARDS[id][1]].vs; tot[v] = (tot[v]||0)+k; n += k; }
  const f = ((tot[type]||0) + (tot.any||0)*.4) / n;
  return (1 - Math.pow(1-f, g.me.hand.length)) * .6;
}
function aiOffChoice(){
  const g = S.G, A = g.op, st = g.P, dif = DIFFS[g.diff];
  const now = shotEV(A.team, st.zone, st.chance) * (1 - Math.min(.5, g.me.hand.length*.05)*.25);
  let best = {kind:'shoot', v: now + (rnd()-.5)*dif.noise*.5};
  const seen = new Set();
  for (const c of A.hand){
    if (seen.has(c.id) || !legalOff(c.id, A)) continue; seen.add(c.id);
    const a = planAction(c.id, A), tz = a.to || st.zone;
    let v;
    if (a.type==='special') v = now + (A.hand.length <= 3 ? .12 : -.05);
    else if (a.shot) v = shotEV(A.team, tz, st.chance + a.gain);
    else {
      const risk = counterRisk(a.type), steal = {pass:.3, post:.25, cut:.4}[a.type] || 0;
      const ev = shotEV(A.team, tz, st.chance + a.gain) + (a.combo ? .08 : 0) + a.gain*.03;
      v = ev*(1-risk) + now*risk*(1-steal);
      v -= a.sec*.01;
      if (st.clock - a.sec < 5) v -= .12;
    }
    v -= KEEP[c.id]*.02;
    v += (rnd()-.5)*dif.noise;
    if (v > best.v + .04) best = {kind:'card', c, v};
  }
  return best;
}
async function aiOffense(tok){
  const g = S.G, A = g.op, D = g.me;
  while (tok===TOKEN){
    await wait(750); if (tok!==TOKEN) return;
    const ch = aiOffChoice();
    if (ch.kind==='shoot'){ plog('o', A, '슛을 시도합니다.'); return doShot(A, D, false, tok); }
    take(A, ch.c.uid); A.disc.push(ch.c);
    const act = planAction(ch.c.id, A);
    g.pending = act;
    plog('o', A, `<b>${OFF[act.id].n}</b> (${act.sec}초)${act.to ? ' → '+ZONES[act.to].n : ''}${act.gain ? ' · 찬스 +'+act.gain : ''}`);
    let react = null;
    if (!act.shot && reactOptions(D, act).length){
      g.phase = 'react'; render();
      const uid = await new Promise(r => ANSWER = r); if (tok!==TOKEN) return;
      if (uid){ const c = take(D, uid); D.disc.push(c); react = CARDS[c.id][1]; }
    }
    const out = commitAction(act, react, A, D);
    if (react) plog('d', D, `<b>${DEFH[react].n}</b> · ${out.notes.join(' ')}`);
    else if (out.notes.length) plog('x', null, out.notes.join(' '));
    g.pending = null; g.phase = 'busy'; render();
    if (out.steal){ D.st.stl++; A.st.to++; return endPoss('steal', 0, null, tok); }
    if (out.violation){ A.st.to++; return endPoss('viol', 0, null, tok); }
    if (act.shot) return doShot(A, D, act.floater, tok);
    if (g.P.clock===0){ plog('o', A, '버저와 함께 슛!'); return doShot(A, D, false, tok); }
  }
}

// ---------- human ----------
async function humanOff(){
  const g = S.G, A = g.me, D = g.op, tok = TOKEN;
  const c = g.me.hand.find(x => x.uid===g.sel); if (!c || g.phase!=='act' || !legalOff(c.id, A)) return;
  take(A, c.uid); A.disc.push(c); g.sel = null;
  const act = planAction(c.id, A);
  plog('o', A, `<b>${OFF[act.id].n}</b> (${act.sec}초)${act.to ? ' → '+ZONES[act.to].n : ''}${act.gain ? ' · 찬스 +'+act.gain : ''}`);
  g.phase = 'busy'; render();
  if (act.shot){ commitAction(act, null, A, D); render(); return doShot(A, D, act.floater, tok); }
  await wait(550); if (tok!==TOKEN) return;
  const react = aiReact(act);
  const out = commitAction(act, react, A, D);
  if (react){ plog('d', D, `<b>${DEFH[react].n}</b> · ${out.notes.join(' ')}`); g.msg = `상대 ${DEFH[react].n}! ${out.notes.join(' ')}`; }
  else { g.msg = ''; if (act.type==='special') plog('x', null, out.notes.join(' ')); }
  if (out.steal){ D.st.stl++; A.st.to++; return endPoss('steal', 0, null, tok); }
  if (out.violation){ A.st.to++; return endPoss('viol', 0, null, tok); }
  g.phase = 'act'; render();
}
function humanShoot(){ const g = S.G; if (g.phase!=='act') return; plog('o', g.me, '슛을 시도합니다.'); g.phase = 'busy'; g.sel = null; render(); doShot(g.me, g.op, false, TOKEN); }
async function doShot(A, D, floater, tok){
  const g = S.G, st = g.P, zone = st.zone, pts = ZONES[zone].pts;
  let p = shotP(A.team, zone, st.chance), def = null;
  if (isMe(D)){
    if (shotOptions(D).length){
      g.pending = {shot:true, zone, p, floater}; g.phase = 'contest'; render();
      const uid = await new Promise(r => ANSWER = r); if (tok!==TOKEN) return;
      if (uid){ const c = take(D, uid); D.disc.push(c); def = CARDS[c.id][1]; }
      g.pending = null;
    }
  } else { await wait(500); if (tok!==TOKEN) return; def = aiShotDef(zone, floater, p*pts); }
  if (def){ const dr = shotDrop(def, D, zone, floater); p = clamp(p - dr, .03, .95); plog('d', D, `<b>${DEFH[def].n}</b> · 성공률 −${Math.round(dr*100)}%p`); }
  A.st.fga++;
  const made = rnd() < p;
  if (made){ A.st.fgm++; if (pts===3) A.st.tpm++; }
  endPoss(made ? 'make' : 'miss', made ? pts : 0, {p, zone, pts}, tok);
}
function endPoss(kind, pts, shot, tok){
  if (tok!==undefined && tok!==TOKEN) return;
  const g = S.G, A = att(), D = dfn(), mine = isMe(A);
  A.st.pts += pts;
  const t = {make:`+${pts} 득점`, miss:'슛 실패', steal:'스틸', viol:'24초 바이올레이션'}[kind];
  plog(kind==='make' ? 'o' : 'x', kind==='make' ? A : null, kind==='make' ? `${ZONES[shot.zone].n}에서 성공! (${pct(shot.p)})` :
       kind==='miss' ? `${ZONES[shot.zone].n}에서 실패. (${pct(shot.p)})` : kind==='steal' ? '스틸! 공격권이 넘어갑니다.' : '샷클락이 끝났습니다.');
  g.res = {kind, pts, shot, mine, title:t};
  g.games.unshift({per:perLabel(g), mine, txt: kind==='make' ? `${shot.pts}점 성공` : t, pts});
  g.phase = 'result'; render();
}
function nextPoss(){
  const g = S.G;
  if (g.side==='off'){ g.side = 'def'; return startPoss(); }
  g.side = 'off'; g.idx++;
  if (g.idx >= perLen(g)){
    if (g.q < 4 || g.me.st.pts===g.op.st.pts){ g.q++; g.idx = 0; }
    else return endGame();
  }
  startPoss();
}
function endGame(){
  const g = S.G, win = g.me.st.pts > g.op.st.pts;
  const k = SAVE.team+'|'+g.diff; const r = SAVE.rec[k] || {w:0,l:0}; win ? r.w++ : r.l++; SAVE.rec[k] = r; persist();
  S.screen = 'over'; render();
}

// ---------- rendering ----------
function render(){
  const h = $('.hand'), sl = h ? h.scrollLeft : 0, p = $('.pbp');
  $('#app').innerHTML = S.screen==='game' ? gameHTML() : `<div class="solo">${S.screen==='menu' ? menuHTML() : overHTML()}</div>`;
  const h2 = $('.hand'); if (h2) h2.scrollLeft = sl;
  const p2 = $('.pbp'); if (p2) p2.scrollTop = p2.scrollHeight;
  $('#modal').hidden = !S.modal; if (S.modal) $('#modalBody').innerHTML = rulesHTML();
}
function courtSVG(){
  const g = S.G, st = g.P, A = att(), mine = isMe(A);
  const zs = Object.entries(ZONES).map(([k,z]) => {
    const on = st.zone===k, p = shotP(A.team, k, on ? st.chance : 0);
    return `<g><circle cx="${z.at[0]}" cy="${z.at[1]}" r="36" fill="${on ? 'var(--off-soft)' : 'var(--spot)'}" stroke="${on ? 'var(--off)' : 'var(--line)'}" stroke-width="${on?3:1.5}"/>
      <text x="${z.at[0]}" y="${z.at[1]-6}" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink)">${z.n}</text>
      <text x="${z.at[0]}" y="${z.at[1]+13}" text-anchor="middle" font-size="15" font-family="Share Tech Mono, monospace" fill="${on ? 'var(--off)' : 'var(--dim)'}">${pct(p)}</text></g>`;
  }).join('');
  const Z = ZONES[st.zone].at;
  const trail = st.prev && st.prev!==st.zone ? `<line x1="${ZONES[st.prev].at[0]}" y1="${ZONES[st.prev].at[1]}" x2="${Z[0]}" y2="${Z[1]}" stroke="var(--off)" stroke-width="3" stroke-dasharray="7 7" opacity=".7"/>` : '';
  return `<svg class="court" viewBox="0 0 500 380" role="img" aria-label="공은 ${ZONES[st.zone].n}에 있습니다">
    <g fill="none" stroke="var(--court)" stroke-width="2.4">
      <rect x="1" y="1" width="498" height="378"/><rect x="170" y="1" width="160" height="189"/>
      <path d="M190 190 A60 60 0 0 0 310 190"/><path d="M210 52 A40 40 0 0 0 290 52"/>
      <path d="M30 1 L30 141.5 A237.5 237.5 0 0 0 470 141.5 L470 1"/>
    </g>
    <line x1="222" y1="40" x2="278" y2="40" stroke="var(--court)" stroke-width="4"/>
    ${trail}${zs}
    <circle cx="${Z[0]+26}" cy="${Z[1]-26}" r="12" fill="var(--ball)"/>
    <path d="M${Z[0]+14} ${Z[1]-26} H${Z[0]+38} M${Z[0]+26} ${Z[1]-38} V${Z[1]-14}" stroke="#7a3410" stroke-width="1.6" opacity=".6"/>
  </svg>
  <p class="hint" style="margin:6px 0 0;font-size:12px">${mine ? '우리 공격' : '상대 공격'} · 각 존의 숫자는 그 자리에서 슛했을 때의 성공률입니다.</p>`;
}

  const g = S.G, st = g.P, A = att(), mine = isMe(A);
  const sp = shotP(A.team, st.zone, st.chance), pts = ZONES[st.zone].pts;
  return `<div class="score">
      <div class="tm"><span class="pts me">${g.me.st.pts}</span><span class="nm">${teamName(g.me)}<small>우리 · ${TEAMS[g.me.team].ps}</small></span></div>
      <div class="per"><b>${perLabel(g)}</b><small>포세션 ${g.idx+1}/${perLen(g)} · ${mine ? '공격' : '수비'}</small></div>
      <div class="tm r"><span class="nm">${teamName(g.op)}<small>${DIFFS[g.diff].n} AI · ${TEAMS[g.op.team].ps}</small></span><span class="pts">${g.op.st.pts}</span></div>
    </div>
    <div class="arena">
      <section class="panel cp" aria-label="코트">
        ${courtSVG()}
        <div class="ledrow">
          <div class="clock${st.clock<=5 && g.phase!=='result' ? ' low' : ''}"><b>${String(st.clock).padStart(2,'0')}</b><small>SHOT CLOCK</small></div>
          <div class="meter">
            <div class="lbl"><span>찬스 ${st.chance}${st.combo ? ' · 연계 +1 대기' : ''}${st.zoneD ? ' · 존 수비 중' : ''}</span><span>최대 효과 8</span></div>
            <div class="pips">${Array.from({length:8},(_,i)=>`<i class="${i<st.chance?'on':''}"></i>`).join('')}</div>
            <div class="readout">지금 슛하면 <b>${pct(sp)}</b> · ${pts}점 · 기대 <b>${f2(sp*pts)}</b></div>
          </div>
        </div>
        <div class="bar">${barHTML()}</div>
      </section>
      <section class="panel pp" aria-label="플레이 기록">
        ${oppHTML()}
        <h3>이번 포세션</h3>
        <ol class="pbp">${st.log.map(l => `<li><span class="t">${String(l.t).padStart(2,'0')}</span><span class="${l.kind}">${l.who ? `<span class="who">${isMe(l.who)?'우리':'상대'}</span> ` : ''}${l.text}</span></li>`).join('')}</ol>
        ${g.games.length ? `<h3 style="margin-top:12px">지난 포세션</h3><ul class="games">${g.games.slice(0,12).map(x=>`<li><span>${x.per} · ${x.mine?'우리 공격':'상대 공격'}</span><span>${x.txt}</span></li>`).join('')}</ul>` : ''}
      </section>
    <section class="handbar" aria-label="내 손패">
      <div class="hh"><b>내 손패 ${g.me.hand.length}장</b><span class="hint">덱 ${g.me.deck.length} · 버림 ${g.me.disc.length} · 포세션마다 3장 뽑기 (최대 ${HAND_MAX}장) · 위는 공격, 아래는 수비</span></div>
      <div class="hand">${handHTML()}</div>
    </section>
    </div>`;
}
function oppHTML(){
  const g = S.G, O = g.op, tot = {}, left = {};
  for (const [id,n] of Object.entries(TEAMS[O.team].deck)){ const d = CARDS[id][1]; tot[d] = (tot[d]||0)+n; }
  [...O.deck, ...O.hand].forEach(c => { const d = CARDS[c.id][1]; left[d] = (left[d]||0)+1; });
  const chips = Object.keys(tot).map(d => `<span class="dchip${left[d]?'':' gone'}">${DEFH[d].n} ${left[d]||0}/${tot[d]}</span>`).join('');
  return `<div class="opp"><div class="row"><b>${teamName(O)}</b><span class="hint">손패 ${O.hand.length}장<span class="backs">${'<i></i>'.repeat(O.hand.length)}</span> · 덱 ${O.deck.length}</span></div>
    <div class="hint" style="font-size:12px">상대 수비 카드 (덱+손패에 남은 수)</div><div class="dtrack">${chips}</div></div>`;
}
function canO(c){ const g = S.G; return g.phase==='act' && legalOff(c.id, g.me); }
function canD(c){
  const g = S.G, d = DEFH[CARDS[c.id][1]];
  if (g.phase==='react' && g.pending) return d.vs===g.pending.type || d.vs==='any';
  if (g.phase==='contest') return d.vs==='shot';
  return false;
}
function handHTML(){
  const g = S.G, off = g.side==='off';
  return g.me.hand.map(c => {
    const [oi, di] = CARDS[c.id], o = OFF[oi], d = DEFH[di];
    const ok = canO(c) || canD(c), sel = g.sel===c.uid;
    const sec = secOf(oi, g.me);
    return `<button type="button" class="card ${off?'mute-d':'mute-o'}${ok?'':' dim'}${sel?' sel '+(off?'so':'sd'):''}" data-act="sel" data-uid="${c.uid}" aria-pressed="${sel}">
      <span class="half oh"><span class="k"><span>공격 · ${TYPE_KO[o.type]}</span><span>${sec}초</span></span><span class="n">${o.n}</span><span class="fx">${o.fx}</span></span>
      <span class="perf"></span>
      <span class="half dh"><span class="k"><span>수비</span><span>${VS_KO[d.vs]}</span></span><span class="n">${d.n}</span><span class="fx">${d.fx}</span></span>
    </button>`;
  }).join('');
}
function barHTML(){
  const g = S.G, st = g.P, A = att();
  const sel = g.me.hand.find(c => c.uid===g.sel);
  if (g.phase==='act'){
    const now = shotP(A.team, st.zone, st.chance), pts = ZONES[st.zone].pts;
    let line = g.msg ? `<p class="alert">${g.msg}</p>` : '';
    let use = `<button class="btn" disabled>카드를 고르세요</button>`;
    if (sel){
      const oi = CARDS[sel.id][0];
      if (legalOff(oi, g.me)){
        const a = planAction(oi, g.me), tz = a.to || st.zone;
        const ev2 = shotEV(g.me.team, tz, st.chance + a.gain);
        line += `<p class="hint">${OFF[oi].n}: ${a.sec}초 사용${a.to ? ', 공 → '+ZONES[a.to].n : ''}${a.gain ? ', 찬스 +'+a.gain : ''}. 막히지 않으면 슛 기대 ${f2(now*pts)} → <b>${f2(ev2)}</b>${a.shot ? ' (바로 슛)' : ''}. 상대 ${TYPE_KO[a.type]==='특수' ? '' : `'${VS_KO_REV[a.type]||''}' 카드에 막힐 수 있습니다.`}</p>`;
        use = `<button class="btn" data-act="useo">${OFF[oi].n} 쓰기</button>`;
      } else {
        const o = OFF[oi];
        line += `<p class="hint">${o.n}: ${o.req && !o.req.includes(st.zone) ? `지금 위치(${ZONES[st.zone].n})에서는 쓸 수 없습니다.` : '남은 샷클락이 부족합니다.'}</p>`;
        use = `<button class="btn" disabled>지금은 못 씀</button>`;
      }
    } else if (!line) line = `<p class="hint">카드로 찬스를 쌓거나, 지금 슛하세요. 행동할 때마다 상대가 수비 카드로 끊을 수 있습니다.</p>`;
    return `${line}<div class="actions"><button class="btn shoot grow" data-act="shoot">슛! ${pct(now)} · ${pts}점</button>${use}</div>`;
  }
  if (g.phase==='react'){
    const a = g.pending;
    return `<p class="alert o">상대 ${OFF[a.id].n}${a.to ? ' → '+ZONES[a.to].n : ''}${a.gain ? ' · 찬스 +'+a.gain+' 예정' : ''}</p>
      <p class="hint">막으려면 아래 수비 카드를 고르세요. '${TYPE_KO[a.type]}'을 막는 카드나 '언제든' 카드를 쓸 수 있습니다.</p>
      <div class="actions">${sel && canD(sel) ? `<button class="btn defb grow" data-act="used">${DEFH[CARDS[sel.id][1]].n} 쓰기</button>` : `<button class="btn defb grow" disabled>수비 카드를 고르세요</button>`}<button class="btn sec" data-act="passd">넘기기</button></div>`;
  }
  if (g.phase==='contest'){
    const s = g.pending, pts = ZONES[s.zone].pts;
    let prev = '';
    if (sel && canD(sel)){ const dr = shotDrop(CARDS[sel.id][1], g.me, s.zone, s.floater); prev = ` → <b>${pct(clamp(s.p-dr,.03,.95))}</b>`; }
    return `<p class="alert o">상대 슛! ${ZONES[s.zone].n} · ${pct(s.p)}${prev} · ${pts}점</p>
      <div class="actions">${sel && canD(sel) ? `<button class="btn defb grow" data-act="used">${DEFH[CARDS[sel.id][1]].n} 쓰기</button>` : `<button class="btn defb grow" disabled>컨테스트·블록 카드를 고르세요</button>`}<button class="btn sec" data-act="passd">넘기기</button></div>`;
  }
  if (g.phase==='result'){
    const r = g.res, good = r.mine ? r.kind==='make' : r.kind!=='make';
    const head = r.mine ? r.title : ({make:`${r.pts}점 실점`, miss:'막았다!', steal:'스틸 성공!', viol:'24초 바이올레이션 유도!'}[r.kind]);
    return `<div class="res ${good?'good':'bad'}">${head}</div>
      <div class="actions"><button class="btn grow" data-act="next">다음 포세션</button></div>`;
  }
  return `<p class="hint">${isMe(att()) ? '상대가 대응을 고르는 중…' : '상대가 공격을 고르는 중…'}</p>`;
}
const VS_KO_REV = {pass:'디나이', drive:'헬프', screen:'스위치', post:'더블팀', cut:'바디체크', shot:'컨테스트·블록'};

function menuHTML(){
  const recs = Object.entries(SAVE.rec).map(([k,r]) => { const [t,d] = k.split('|'); return `<tr><td>${TEAMS[t].n}</td><td>${DIFFS[d].n}</td><td>${r.w}승 ${r.l}패</td></tr>`; }).join('');
  return `<p class="eyebrow">농구 전략 카드 게임 · 1대1 AI 대전</p>
  <h2>24초 안에 찬스를 만들고, 쏠 때를 고르세요</h2>
  <ul class="rules">
    <li>공격 때는 카드로 공을 옮기며 <b>찬스</b>를 쌓습니다. 카드마다 샷클락 시간을 씁니다.</li>
    <li>언제든 <b>슛</b>할 수 있습니다. 찬스가 클수록 잘 들어가지만, 기다릴수록 시간이 줄고 상대에게 끊길 기회가 늘어납니다.</li>
    <li>모든 카드는 위가 공격, 아래가 수비입니다. 수비에 쓰면 그 카드의 공격은 버려집니다.</li>
    <li>디나이는 패스를, 헬프는 돌파를, 스위치는 스크린을 막습니다. 압박으로 24초 바이올레이션을 노릴 수도 있습니다.</li>
  </ul>
  <h3>팀 선택</h3>
  <div class="teams">${Object.entries(TEAMS).map(([k,t]) => `<button type="button" class="team${SAVE.team===k?' on':''}" data-act="team" data-id="${k}" aria-pressed="${SAVE.team===k}"><b>${t.n}</b><span class="ps">${t.ps}</span><span class="dk">${t.dk}</span></button>`).join('')}</div>
  <h3>상대 AI</h3>
  <div class="seg" role="group" aria-label="난이도">${DIFFS.map((d,i)=>`<button type="button" class="${SAVE.diff===i?'on':''}" data-act="diff" data-i="${i}" aria-pressed="${SAVE.diff===i}">${d.n}</button>`).join('')}</div>
  <div class="actions"><button class="btn shoot" data-act="start">팁오프</button><button class="btn sec" data-act="rules">카드 목록과 규칙</button></div>
  ${recs ? `<h3 style="margin-top:18px">전적</h3><div class="scroll"><table class="tbl"><tr><th>팀</th><th>난이도</th><th>기록</th></tr>${recs}</table></div>` : ''}`;
}
function overHTML(){
  const g = S.G, win = g.me.st.pts > g.op.st.pts, a = g.me.st, b = g.op.st;
  const fg = s => s.fga ? Math.round(s.fgm/s.fga*100)+'%' : '—';
  return `<p class="eyebrow">경기 종료${g.q>4?' · 연장':''} · ${DIFFS[g.diff].n} AI</p>
    <h2>${win ? '승리!' : '패배'} ${a.pts} : ${b.pts}</h2>
    <p>${teamName(g.me)} vs ${teamName(g.op)}</p>
    <div class="scroll"><table class="tbl"><tr><th></th><th>야투</th><th>성공률</th><th>3점 성공</th><th>스틸</th><th>턴오버</th></tr>
      <tr><td>우리</td><td>${a.fgm}/${a.fga}</td><td>${fg(a)}</td><td>${a.tpm}</td><td>${a.stl}</td><td>${a.to}</td></tr>
      <tr><td>상대</td><td>${b.fgm}/${b.fga}</td><td>${fg(b)}</td><td>${b.tpm}</td><td>${b.stl}</td><td>${b.to}</td></tr></table></div>
    <div class="actions" style="margin-top:14px"><button class="btn shoot" data-act="start">같은 설정으로 다시</button><button class="btn sec" data-act="menu">팀·난이도 바꾸기</button></div>`;
}
function rulesHTML(){
  const rows = Object.entries(CARDS).map(([id,[o,d]]) => `<tr><td><b>${OFF[o].n}</b><br><span class="hint">${TYPE_KO[OFF[o].type]} · ${OFF[o].sec}초 · ${OFF[o].fx}</span></td><td><b>${DEFH[d].n}</b><br><span class="hint">${VS_KO[DEFH[d].vs]} · ${DEFH[d].fx}</span></td></tr>`).join('');
  const zones = Object.values(ZONES).map(z => `${z.n} ${pct(z.base)}`).join(' · ');
  return `<p class="eyebrow">규칙</p><h2>24초 카드 농구</h2>
    <ul class="rules">
      <li>쿼터마다 공격 ${PER_Q}번, 수비 ${PER_Q}번. 4쿼터 후 동점이면 연장(각 ${PER_OT}번).</li>
      <li>공격은 탑에서 샷클락 ${CLOCK}초, 찬스 0으로 시작합니다. 카드는 적힌 시간만큼 샷클락을 씁니다.</li>
      <li>슛 성공률 = 존 기본값 + 찬스 1당 5%p (최대 8). 기본값: ${zones}.</li>
      <li>공격 카드를 쓸 때마다 수비는 수비 카드 한 장으로 대응할 수 있습니다. 슛 때도 한 장(컨테스트·블록)을 쓸 수 있습니다.</li>
      <li>'다음 행동 +1' 카드 뒤에는 다음 행동의 찬스가 1 더 오릅니다. 스위치·헬프에 막히면 사라집니다.</li>
      <li>포세션마다 양 팀이 3장씩 뽑습니다(손패 최대 ${HAND_MAX}장). 덱이 바닥나면 버린 카드를 섞습니다.</li>
      <li>상대 덱의 수비 카드 수는 공개입니다. 남은 수를 보고 어떤 행동이 끊길지 추리하세요.</li>
    </ul>
    <h3>카드 목록 (위 공격 / 아래 수비)</h3>
    <div class="scroll"><table class="tbl"><tr><th>공격</th><th>수비</th></tr>${rows}</table></div>
    <div class="actions" style="margin-top:14px"><button class="btn" data-act="close">닫기</button></div>`;
}

// ---------- events ----------
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, g = S.G;
  if (a==='sel'){ const u = +el.dataset.uid; g.sel = g.sel===u ? null : u; render(); }
  else if (a==='useo') humanOff();
  else if (a==='shoot') humanShoot();
  else if (a==='used'){ const c = g.me.hand.find(x=>x.uid===g.sel); if (c && canD(c) && ANSWER){ const r = ANSWER; ANSWER = null; g.sel = null; g.phase = 'busy'; r(c.uid); } }
  else if (a==='passd'){ if (ANSWER){ const r = ANSWER; ANSWER = null; g.sel = null; g.phase = 'busy'; render(); r(null); } }
  else if (a==='next') nextPoss();
  else if (a==='team'){ SAVE.team = el.dataset.id; persist(); render(); }
  else if (a==='diff'){ SAVE.diff = +el.dataset.i; persist(); render(); }
  else if (a==='start') newGame();
  else if (a==='menu'){ TOKEN++; ANSWER = null; S.screen = 'menu'; S.G = null; S.modal = false; render(); }
  else if (a==='rules'){ S.modal = true; render(); }
  else if (a==='close'){ S.modal = false; render(); }
});
$('#modal').addEventListener('click', e => { if (e.target.id==='modal'){ S.modal = false; render(); } });
document.addEventListener('keydown', e => { if (e.key==='Escape' && S.modal){ S.modal = false; render(); } });
render();
})();
</script>
</body>
</html>
