<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>트랜지스터 팹</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="웨이퍼를 굽고 칩을 출하하며 덱을 키우는 반도체 팹 경영 덱빌딩 카드게임">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* 레이아웃: 위 상태줄 → 가운데 팹 장비 격자(밭) → 출하 창고 → 아래 고정 손패 트레이(부채꼴) */
:root{
  --bg:#0b1712; --board:#10211a; --tile:#152b22; --line:#24453a; --trace:#2f5c4b;
  --ink:#e4f1ea; --dim:#8db3a1; --copper:#e39a5f; --gold:#f0c95a; --si:#9aa9ff;
  --ok:#6fd49a; --bad:#ff7a70; --op:#6cb8ff; --fac:#c49cff; --gray:#7d8a84;
  --font:'IBM Plex Sans KR',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-tap-highlight-color:transparent;
  background-image:linear-gradient(var(--board) 1px,transparent 1px),linear-gradient(90deg,var(--board) 1px,transparent 1px);background-size:28px 28px}
button{font-family:inherit;cursor:pointer;color:inherit;border:0;background:none}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.wrap{max-width:760px;margin:0 auto;padding-block:10px 290px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:10px}

/* 상태줄 */
.hud{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px}
.dayb{background:var(--tile);border:1px solid var(--line);border-radius:12px;padding:6px 10px;text-align:center;line-height:1.1}
.dayb b{font-family:var(--mono);font-size:22px;color:var(--gold)} .dayb span{display:block;font-size:10px;color:var(--dim)}
.brand{font-weight:700;font-size:17px;letter-spacing:-.01em} .brand small{display:block;font-size:11px;color:var(--dim);font-weight:500}
.money{font-family:var(--mono);font-size:22px;font-weight:800;color:var(--gold);text-align:right;line-height:1.1}
.money span{display:block;font-family:var(--font);font-size:10px;color:var(--dim);font-weight:500}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:flex;align-items:center;gap:6px;background:var(--tile);border:1px solid var(--line);border-radius:999px;padding:5px 10px;font-size:12px}
.pill b{font-family:var(--mono);font-size:14px}
.dot{width:10px;height:10px;border-radius:50%}
.d-si{background:radial-gradient(circle at 35% 35%,#d9deff,var(--si))} .d-dp{background:var(--ok)} .d-cu{background:var(--copper)}
.pips{display:flex;gap:3px} .pips i{width:10px;height:14px;border-radius:3px;background:var(--line)} .pips i.on{background:var(--op);box-shadow:0 0 6px var(--op)}
.event{background:var(--tile);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:10px;padding:8px 11px;font-size:12.5px;line-height:1.55}
.event b{color:var(--gold)} .event .sub{color:var(--dim);font-size:11.5px}

/* 팹 장비 격자 */
.sec{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--dim);font-weight:700;letter-spacing:.04em;margin-bottom:6px}
.sec .num{font-weight:500}
.fab{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bay{aspect-ratio:1/1;max-width:100%;border-radius:14px;background:var(--tile);border:1px solid var(--line);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:20px 6px 6px;overflow:hidden}
.bay.empty{border:1.5px dashed var(--trace);color:var(--dim);font-size:12px}
.bay.lock{opacity:.4;font-size:11px;color:var(--dim)}
.bay .tag{position:absolute;top:6px;left:8px;font-family:var(--mono);font-size:9.5px;color:var(--dim)}
.wafer{width:46%;aspect-ratio:1/1;border-radius:50%;position:relative;
  background:repeating-linear-gradient(0deg,transparent 0 7px,#0004 7px 8px),repeating-linear-gradient(90deg,transparent 0 7px,#0004 7px 8px),radial-gradient(circle at 35% 30%,#e6e9ff,var(--si) 55%,#5b67b8);
  box-shadow:0 0 0 2px #0006 inset}
.wafer::after{content:"";position:absolute;bottom:-1px;left:50%;width:18%;height:6%;background:var(--tile);transform:translateX(-50%)}
.bay .lbl{font-size:11px;font-weight:700;text-align:center}
.steps{display:flex;gap:2px}
.steps i{font-style:normal;font-size:10px;font-weight:700;width:18px;height:18px;border-radius:5px;display:flex;align-items:center;justify-content:center;background:var(--board);border:1px solid var(--line);color:var(--dim)}
.steps i.done{background:var(--trace);color:var(--ink);border-color:var(--trace)}
.steps i.now{border-color:var(--copper);color:var(--copper);box-shadow:0 0 6px #e39a5f88}
.t-step{border-color:#3a8f8f;background:linear-gradient(170deg,#14302f,var(--tile) 60%)} .t-step .ty{color:#6fd4d0}
.spb{position:absolute;top:5px;right:7px;font-size:9.5px;font-weight:700;color:#6fd4d0}
.bay.target{border:2px solid var(--gold);box-shadow:0 0 12px #f0c95a66;cursor:pointer;opacity:1}
.chart{width:100%;max-width:100%;height:auto;display:block}
.prog{width:80%;height:5px;border-radius:9px;background:var(--line);overflow:hidden}
.prog u{display:block;height:100%;background:var(--copper)}
.bay .left{font-size:10.5px;color:var(--dim)}

/* 칩 토큰 */
.chip{display:inline-flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:800;font-size:10px;color:#e8eee9;background:#1b1f1d;border-radius:4px;padding:3px 6px;position:relative;letter-spacing:.02em;
  box-shadow:0 -3px 0 -1px #9aa39e,0 3px 0 -1px #9aa39e}
.stock{display:flex;flex-wrap:wrap;gap:8px}
.lot{display:flex;align-items:center;gap:8px;background:var(--tile);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:12px}
.lot.old{border-style:dashed;opacity:.65}
.lot b{font-family:var(--mono)}
.empty-note{font-size:12px;color:var(--dim)}
.order{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.facs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.fac{font-size:11px;border:1px solid var(--fac);color:var(--fac);border-radius:999px;padding:3px 8px}

/* 손패 트레이 */
.tray{position:fixed;left:0;right:0;bottom:0;z-index:5;background:linear-gradient(transparent,var(--bg) 22%);padding-block:14px calc(env(safe-area-inset-bottom,0px) + 10px);padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.tray .in{max-width:760px;margin:0 auto;display:grid;gap:8px}
.sel{min-height:44px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--tile);border:1px solid var(--line);border-radius:12px;padding:7px 8px 7px 12px;font-size:12.5px;line-height:1.45}
.sel .why{color:var(--bad)}
.handrow{display:grid;grid-template-columns:44px 1fr 44px;gap:6px;align-items:end}
.pile{height:70px;border-radius:9px;border:1px solid var(--line);background:repeating-linear-gradient(45deg,var(--tile) 0 6px,var(--board) 6px 12px);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:9.5px;color:var(--dim)}
.pile b{font-family:var(--mono);font-size:16px;color:var(--ink)}
.hand{display:flex;overflow-x:auto;padding:16px 4px 2px;scrollbar-width:none;min-width:0}
.hand::-webkit-scrollbar{display:none}
.hand .card{flex:0 0 auto;transition:transform .15s}
.hand .card:first-child{margin-left:auto!important}
.hand .card:last-child{margin-right:auto}
.hand .card.up{transform:translateY(-14px) rotate(0)!important;z-index:3;box-shadow:0 0 0 2px var(--gold),0 8px 18px #000a}
.acts{display:grid;grid-template-columns:1fr 1fr 1.5fr;gap:8px}
.btn{background:var(--tile);border:1px solid var(--line);border-radius:12px;padding:11px 8px;font-size:14px;font-weight:700}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--copper);border-color:var(--copper);color:#1d0f04}
.btn.sm{padding:7px 12px;font-size:12.5px;border-radius:10px}
.btn:disabled{opacity:.4;cursor:default}

/* 카드 */
.card{position:relative;width:96px;height:136px;border-radius:11px;border:2px solid var(--line);background:var(--tile);display:flex;flex-direction:column;align-items:stretch;text-align:left;padding:6px;gap:3px;box-shadow:0 4px 10px #0008}
.card[data-off]{filter:saturate(.3) brightness(.7)}
.card .cost{position:absolute;top:-8px;left:-8px;width:24px;height:24px;border-radius:50%;background:var(--op);color:#04192b;font-family:var(--mono);font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg)}
.card .art{height:40px;border-radius:7px;background:#0005;display:flex;align-items:center;justify-content:center;font-size:22px}
.card .nm{font-weight:700;font-size:11.5px;line-height:1.25}
.card .ds{font-size:9.5px;color:var(--dim);line-height:1.35}
.card .ty{position:absolute;bottom:5px;right:7px;font-size:8.5px;font-weight:700;letter-spacing:.06em}
.t-mat{border-color:#3f8a62} .t-mat .ty{color:var(--ok)}
.t-proc{border-color:#a8693a;background:linear-gradient(170deg,#2d2016,var(--tile) 60%)} .t-proc .ty{color:var(--copper)}
.t-op{border-color:#3b6e9c} .t-op .ty{color:var(--op)}
.t-fac{border-color:#7c5fb0;background:linear-gradient(170deg,#241c33,var(--tile) 60%)} .t-fac .ty{color:var(--fac)}
.t-bad{border-color:#4d5552;background:#1a1d1c} .t-bad .ty{color:var(--gray)}
.card.big{width:132px;height:178px;padding:8px}
.card.big .nm{font-size:13.5px} .card.big .ds{font-size:11px} .card.big .art{height:56px}
.card .pr{margin-top:auto;font-family:var(--mono);font-size:11px;font-weight:800;color:var(--gold)}

/* 모달 */
.modal{position:fixed;inset:0;background:#000c;display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--board);border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:760px;max-height:88vh;overflow:auto;padding-block:16px calc(env(safe-area-inset-bottom,0px) + 18px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet h2{font-size:19px;font-weight:700;color:var(--copper)}
.sheet .x{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
.grid{display:flex;flex-wrap:wrap;justify-content:center;gap:14px 10px;margin:12px 0 16px}
.lbl2{font-size:12px;color:var(--dim)}
.buyraw{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 14px}
.log{font-size:13px;line-height:1.75}
.g{color:var(--ok)} .r{color:var(--bad)} .y{color:var(--gold)} .m{color:var(--dim)}
.grade{font-family:var(--mono);font-size:64px;font-weight:800;color:var(--gold);text-align:center}
.toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:50%;transform:translateX(-50%);background:#000e;border:1px solid var(--line);padding:9px 14px;border-radius:12px;font-size:13px;z-index:20;pointer-events:none;max-width:90vw;text-align:center}
.title{text-align:center;padding:26px 0 6px;display:grid;gap:8px;justify-items:center}
.title .wafer{width:110px}
.title h1{font-size:34px;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
.title p{color:var(--dim);font-size:14px;line-height:1.6}
.panel{background:var(--tile);border:1px solid var(--line);border-radius:14px;padding:14px}
.rules{font-size:13.5px;line-height:1.75;display:grid;gap:4px;padding-left:18px}
.fc{background:var(--tile);border:1px solid var(--line);border-radius:12px;padding:9px 11px;display:grid;gap:7px}
.fc .row{display:grid;grid-template-columns:34px 1fr;gap:8px;align-items:start;font-size:12px}
.fc .row>span:first-child{color:var(--dim);font-weight:700;padding-top:4px}
.buyers{display:flex;flex-wrap:wrap;gap:5px}
.buyer{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:3px 8px;font-size:11.5px;background:var(--board)}
.buyer b{font-family:var(--mono)} .buyer small{color:var(--dim);font-size:10.5px}
.buyer.hit{border-color:var(--ok)} .buyer.miss{border-color:var(--bad);opacity:.75}
.fc .tip{font-size:11px;color:var(--dim)}
.sales{display:grid;gap:4px;margin:4px 0 12px;font-size:12.5px}
.sale{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;background:var(--tile);border:1px solid var(--line);border-radius:9px;padding:5px 9px;animation:in .28s ease-out both}
.sale.gone{opacity:.55}
.sale .pz{font-family:var(--mono);font-weight:800;color:var(--ok)}
.sale .tagp{font-size:10px;color:var(--ok);border:1px solid var(--ok);border-radius:999px;padding:0 5px;margin-left:4px}
.sale .tags{font-size:10px;color:var(--bad);margin-left:4px}
.total{font-family:var(--mono);font-size:26px;font-weight:800;color:var(--gold);text-align:center;margin:4px 0 2px}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.85)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes flash{0%{box-shadow:0 0 0 2px var(--gold)}100%{box-shadow:0 0 0 0 transparent}}
.pop{animation:pop .35s ease-out}
.flash{animation:flash .7s ease-out}
.ghost{position:fixed;z-index:30;pointer-events:none;margin:0}
.zoom{position:fixed;inset:0;z-index:25;background:#000a;display:flex;align-items:center;justify-content:center;pointer-events:none}
.zoom .card{transform:scale(1.7)}
.hand .card{-webkit-touch-callout:none;user-select:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="modal"></div>
<script>
'use strict';
const KEY='transistor-fab-v1';
const RENT=[20,40,75,120];
const LAST_DAY=28, MAX_BAYS=6;

const PROD={
  diode:{n:'다이오드',k:'다이오드',p:4},
  bjt:{n:'쌍극 트랜지스터',k:'쌍극',p:4},
  led:{n:'발광 다이오드',k:'발광',p:3},
  mos:{n:'전력 트랜지스터',k:'전력',p:7},
  cmos:{n:'논리 회로 칩',k:'논리',p:9},
  dram:{n:'메모리 칩',k:'메모리',p:13},
  cpu:{n:'중앙처리장치',k:'처리장치',p:42,rep:1},
};
const RAW={si:'웨이퍼',dp:'도펀트',cu:'구리'};
const STEP={ox:{n:'산화',s:'산'},li:{n:'노광',s:'노'},et:{n:'식각',s:'식'},mt:{n:'배선',s:'배'}};
const stepTxt=st=>st.map(k=>STEP[k].n).join('→');
const BUYERS={
  home:{n:'가전 회사',a:'📺',want:['diode','led'],w:3},
  car:{n:'자동차 회사',a:'🚗',want:['mos','bjt'],w:2},
  phone:{n:'스마트폰 회사',a:'📱',want:['cmos','dram','led'],w:2},
  server:{n:'서버 회사',a:'🖥️',want:['dram','cpu'],w:1},
  dist:{n:'유통상',a:'🛒',want:[],w:3},
};
const short=p=>PROD[p].k;
const DIFF={easy:{n:'쉬움',rent:.75,coin:8,y:0,cust:0},normal:{n:'보통',rent:1,coin:0,y:0,cust:0},hard:{n:'어려움',rent:1.3,coin:0,y:-.03,cust:-1}};
const UNLOCKS=[{id:'s_any',at:60},{id:'p_cpu',at:150},{id:'f_robot',at:280},{id:'f_partner',at:450}];
const META_KEY='transistor-fab-meta';
function loadMeta(){let m=null;try{m=JSON.parse(localStorage.getItem(META_KEY)||'null')}catch(e){}
  m=m||{};m.best=m.best||{};m.runs=m.runs||0;m.wins=m.wins||0;m.career=m.career||0;if(m.sound===undefined)m.sound=true;return m}
function saveMeta(){try{localStorage.setItem(META_KEY,JSON.stringify(META))}catch(e){}}
let META=loadMeta();
const locked=id=>UNLOCKS.some(u=>u.id===id&&META.career<u.at);
const shopRoll=()=>shuffle(SHOP_POOL.filter(id=>!locked(id))).slice(0,6);
const rentOf=(s,w)=>Math.round(RENT[w-1]*DIFF[s.diff||'normal'].rent);
let AC=null;
function sfx(kind){if(!META.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
  const seq={play:[[520,.05]],coin:[[880,.05],[1320,.08]],done:[[523,.07],[659,.07],[784,.12]],bad:[[330,.15],[220,.3]],step:[[660,.04],[990,.05]]}[kind]||[];
  let t=AC.currentTime;seq.forEach(([f,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=kind==='bad'?'sawtooth':'triangle';o.frequency.value=f;
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.12,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.02);t+=d*.9});
  if(kind==='coin'||kind==='done')try{navigator.vibrate&&navigator.vibrate(12)}catch(e){}}catch(e){}}
function toggleSound(){META.sound=!META.sound;saveMeta();if(META.sound)sfx('coin');render()}
const rawStr=n=>Object.entries(n).map(([k,v])=>`<span class="dot d-${k}" style="display:inline-block;vertical-align:-1px"></span>${RAW[k]}${v}`).join(' ');
const rawTxt=n=>Object.entries(n).map(([k,v])=>`${RAW[k]} ${v}`).join(', ');

const C={
  wafer:{n:'웨이퍼 박스',a:'💿',t:'mat',c:0,price:2,d:'웨이퍼 +2',fx:s=>gain(s,{si:2})},
  wafer2:{n:'30cm 대형 웨이퍼',a:'💿',t:'mat',c:0,price:5,d:'웨이퍼 +4',fx:s=>gain(s,{si:4})},
  dopant:{n:'도펀트 가스',a:'⚗️',t:'mat',c:0,price:4,d:'도펀트 +2',fx:s=>gain(s,{dp:2})},
  copper:{n:'구리 타깃',a:'🟠',t:'mat',c:0,price:4,d:'구리 +2',fx:s=>gain(s,{cu:2})},
  supply:{n:'공급망 계약',a:'🚢',t:'mat',c:1,price:6,d:'웨이퍼 +3, 도펀트 +1, 구리 +1',fx:s=>gain(s,{si:3,dp:1,cu:1})},

  p_diode:{n:'다이오드 공정',t:'proc',c:1,price:3,r:{need:{si:2},out:'diode',q:2,st:['li','et']}},
  p_bjt:{n:'쌍극 트랜지스터 공정',t:'proc',c:1,price:5,r:{need:{si:2},out:'bjt',q:3,st:['ox','et']}},
  p_led:{n:'발광 다이오드 공정',t:'proc',c:1,price:4,r:{need:{si:1,dp:1},out:'led',q:5,st:['li','mt']}},
  p_mos:{n:'전력 트랜지스터 공정',t:'proc',c:1,price:6,r:{need:{si:3},out:'mos',q:2,st:['ox','li']}},
  p_cmos:{n:'논리 회로 공정',t:'proc',c:1,price:8,r:{need:{si:2,dp:2},out:'cmos',q:3,st:['ox','li','et']}},

  <div class="lbl2">카드 폐기 · 4💰, 하루 한 번${s.removed?' (오늘은 사용함)':''}</div>
  <div class="grid">${[...s.hand.map((id,i)=>['hand',i,id]),...s.disc.map((id,i)=>['disc',i,id])].map(([w,i,id])=>cardHTML(id,`onclick="removeCard('${w}',${i})" ${s.removed||s.coin<4?'data-off':''}`,`<span class="pr">${w==='hand'?'손패':'버림'} · 폐기</span>`)).join('')||'<span class="empty-note">폐기할 카드가 없어요</span>'}</div>`)}
function showDeck(){const all=[...S.draw,...S.hand,...S.disc],cnt={};all.forEach(id=>cnt[id]=(cnt[id]||0)+1);const ord=['mat','proc','step','op','fac','bad'];
  modal(`<div class="x"><h2>전체 덱 ${all.length}장</h2><button class="btn sm" onclick="closeModal()">닫기</button></div>
  <div class="grid">${Object.keys(cnt).sort((a,b)=>ord.indexOf(C[a].t)-ord.indexOf(C[b].t)).map(id=>cardHTML(id,'',`<span class="pr">×${cnt[id]}</span>`)).join('')}</div>`)}
function chartHTML(h){if(!h||!h.length)return '';
  const W=320,H=150,L=34,B=22,T=10,Rr=8,n=LAST_DAY,mx=Math.max(1,...h.map(x=>Math.max(x.coin,x.earn))),top=Math.ceil(mx/20)*20;
  const X=d=>L+(d-.5)*(W-L-Rr)/n,Y=v=>T+(H-T-B)*(1-v/top),bw=(W-L-Rr)/n*.62;
  const bars=h.map(x=>`<rect x="${(X(x.d)-bw/2).toFixed(1)}" y="${Y(x.earn).toFixed(1)}" width="${bw.toFixed(1)}" height="${(Y(0)-Y(x.earn)).toFixed(1)}" rx="1.5" style="fill:var(--copper);opacity:.55"/>`).join('');
  const line=h.map((x,i)=>`${i?'L':'M'}${X(x.d).toFixed(1)},${Y(Math.max(0,x.coin)).toFixed(1)}`).join(' ');
  const last=h[h.length-1];
  const grid=[0,.5,1].map(f=>`<line x1="${L}" x2="${W-Rr}" y1="${Y(top*f)}" y2="${Y(top*f)}" style="stroke:var(--line)" stroke-width="1"/><text x="${L-5}" y="${Y(top*f)+3}" text-anchor="end" style="fill:var(--dim);font-size:9px;font-family:var(--mono)">${Math.round(top*f)}</text>`).join('');
  const xl=[1,7,14,21,28].map(d=>`<text x="${X(d)}" y="${H-6}" text-anchor="middle" style="fill:var(--dim);font-size:9px;font-family:var(--mono)">${d}일</text>`).join('');
  return `<div style="margin:6px 0 12px"><div class="lbl2" style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:4px"><span><span style="color:var(--gold)">━</span> 자금</span><span><span style="color:var(--copper)">■</span> 그날 판매 수입</span></div>
    <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="날짜별 자금과 판매 수입">${grid}${bars}<path d="${line}" style="fill:none;stroke:var(--gold)" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="${X(last.d)}" cy="${Y(Math.max(0,last.coin))}" r="3.5" style="fill:var(--gold)"/>${xl}</svg></div>`}
function showNight(){const s=S;let foot;
  if(s.over==='bankrupt')foot=`<div class="grade">파산</div><p class="m" style="text-align:center;margin-bottom:12px">${s.day}일 만에 팹 문을 닫았습니다.<br>출하 ${s.stats.sold}개 · 총수입 ${s.stats.earned}💰</p><button class="btn pri" style="width:100%" onclick="wipe();newGame(S&&S.diff)">다시 도전</button>`;
  else if(s.over==='win'){const sc=score();foot=`<div class="grade">${gradeOf(sc)}</div><p style="text-align:center;margin-bottom:6px"><b>최종 점수 ${sc}</b></p>
    <p class="m" style="text-align:center;margin-bottom:12px;font-size:12px">자금 ${s.coin} + 신뢰 ${s.rep}×5 + 설비 ${s.facs.length}×5<br>출하 ${s.stats.sold}개 · 납품 계약 ${s.stats.orders}건 · 불량 ${s.stats.defect}개 · 단종 ${s.stats.waste}개</p>
    <button class="btn pri" style="width:100%" onclick="wipe();newGame(S&&S.diff)">새 게임</button>`}
  else foot=`<button class="btn pri" style="width:100%" onclick="closeModal();startDay()">${s.day+1}일차 시작 →</button>`;
  const okSales=(s.sales||[]).filter(x=>!x.miss).length;for(let k=0;k<Math.min(okSales,10);k++)setTimeout(()=>sfx('coin'),200+k*110);
  if(s.over==='bankrupt')setTimeout(()=>sfx('bad'),300);else if(s.over==='win')setTimeout(()=>sfx('done'),400);
  if(s.over)foot=`${chartHTML(s.hist)}<p class="m" style="text-align:center;font-size:12px;margin:-4px 0 10px">경력 점수 +${s.pts||0} (누적 ${META.career})${(s.unlockedNow||[]).length?`<br><b class="y">새 카드 해금: ${s.unlockedNow.join(', ')}</b>`:''}</p>`+foot;
  const sales=(s.sales||[]).map((x,i)=>{const b=BUYERS[x.b],dl=`style="animation-delay:${Math.min(i*90,1800)}ms"`;
    return x.miss?`<div class="sale gone" ${dl}><span>${b.a}</span><span>${b.n} · 원하는 칩이 없어 돌아감</span><span class="m">-</span></div>`
      :`<div class="sale" ${dl}><span>${b.a}</span><span>${b.n} → <span class="chip">${short(x.p)}</span>${x.pref?'<span class="tagp">맞춤 +25%</span>':''}${x.sat?'<span class="tags">물량 과잉</span>':''}${x.old?'<span class="tags">구형</span>':''}</span><span class="pz">+${x.pz}</span></div>`}).join('');
  $('modal').innerHTML=`<div class="modal"><div class="sheet"><h2>${s.day}일차 마감</h2>
    ${sales?`<div class="total">+<span id="earn">0</span>💰</div><div class="sales">${sales}</div>`:''}
    <div class="log" style="margin:6px 0 16px">${s.night}</div>${foot}</div></div>`;render();
  const e=$('earn');if(e){e.textContent=0;setTimeout(()=>tick(e,0,s.earnToday||0),150)}}
let lpT=null;
document.addEventListener('pointerdown',e=>{const c=e.target.closest('.hand .card');if(!c)return;LONG=false;clearTimeout(lpT);
  lpT=setTimeout(()=>{LONG=true;const z=document.createElement('div');z.className='zoom';z.innerHTML=c.outerHTML;const k=z.firstElementChild;k.removeAttribute('style');k.classList.remove('up');k.classList.add('big');document.body.appendChild(z)},380)});
['pointerup','pointercancel','pointerleave'].forEach(t=>document.addEventListener(t,()=>{clearTimeout(lpT);document.querySelectorAll('.zoom').forEach(z=>z.remove())},true));
document.addEventListener('contextmenu',e=>{if(e.target.closest('.hand .card'))e.preventDefault()});
window.addEventListener('beforeunload',()=>{if(S)save()});
(function boot(){const sv=load();if(sv&&sv.phase==='night'){S=sv;if(sv.over){render();showNight()}else startDay()}else{S=null;render()}})();
</script>
</body>
</html>
