<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>플레이메이커</title>
<meta name="description" content="드래그로 패스·슛하고 동료마다 작전을 지시하는 3D 농구 경기">
<meta name="theme-color" content="#07080b">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#07080b;--panel:#15171d;--panel2:#1d2029;--line:#2a2e39;--ink:#eceef2;--dim:#8d93a3;--org:#ff7a1a;--org2:#ffb347;
  --green:#3ecf8e;--red:#ff5a5f;--blue:#5aa9ff;--gold:#ffd166}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;-webkit-tap-highlight-color:transparent;overflow:hidden;height:100%}
button{font-family:inherit;cursor:pointer;color:inherit}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:15px;font-weight:700;width:100%}
.btn:active{transform:scale(.98)}
.btn.pri{background:linear-gradient(135deg,var(--org),#ff9d3d);border-color:transparent;color:#1a0d00}
.statbox{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;margin:10px 0 4px}
.statbox div{background:var(--panel2);border-radius:10px;padding:8px 2px}
.statbox b{display:block;font-size:20px;font-weight:900;color:var(--ink)}
.statbox span{font-size:11px;color:var(--dim)}
.court{position:fixed;inset:0;background:var(--bg);touch-action:none;-webkit-user-select:none;user-select:none}
.court.rot{inset:auto;top:0;left:0;transform-origin:0 0}
.cstage{position:absolute;inset:0;overflow:hidden}
#gl,#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#cv{touch-action:none}
.cstage::after{content:'';position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 0 0 rgba(90,169,255,0);transition:box-shadow .35s}
.cstage.slow::after{box-shadow:inset 0 0 90px 14px rgba(90,169,255,.3)}
.slowtag{position:absolute;top:calc(env(safe-area-inset-top) + 64px);left:50%;transform:translateX(-50%);font-family:'Black Han Sans';font-size:14px;letter-spacing:.2em;color:#bfe0ff;
  background:rgba(10,20,40,.6);padding:3px 12px;border-radius:99px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:2}
.cstage.slow .slowtag{opacity:1}
/* broadcast score bar */
.hudbar{position:absolute;top:calc(env(safe-area-inset-top) + 8px);left:50%;transform:translateX(-50%);z-index:4;display:flex;align-items:stretch;
  font-family:'Black Han Sans','Noto Sans KR',sans-serif;box-shadow:0 4px 18px rgba(0,0,0,.5);pointer-events:none;max-width:calc(100% - 16px)}
.hudbar .tm{display:flex;align-items:center;gap:8px;padding:4px 10px;font-size:15px;color:#fff;white-space:nowrap}
.hudbar .tm b{font-weight:400;font-size:22px;min-width:30px;text-align:right}
.hudbar .us{background:linear-gradient(90deg,#d95b12,#f28a2e)}
.hudbar .them{background:linear-gradient(90deg,#163a6b,#235aa0)}
.hudbar .qt{background:#e9e4da;color:#1a1a1a;font-family:'Noto Sans KR';font-size:11px;font-weight:900;padding:3px 8px;display:flex;flex-direction:column;justify-content:center;line-height:1.2;white-space:nowrap}
.hudbar .qt small{font-weight:500;font-size:10px;color:#555}
.hudbar .clk{background:#b0141c;color:#ffd9d9;font-size:24px;min-width:48px;text-align:center;padding:2px 8px;display:flex;align-items:center;justify-content:center}
.hudbar .clk.low{background:#ff2a35;color:#fff}
.cover{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:16px;z-index:5}
.cover.on{display:flex}
.cover .box{background:rgba(21,23,29,.95);border:1px solid var(--line);border-radius:18px;padding:18px;max-width:380px;width:100%;text-align:center;max-height:100%;overflow:auto}
.cover .box h4{font-family:'Black Han Sans';font-weight:400;font-size:22px;margin-bottom:6px}
.cover .box p{font-size:13px;line-height:1.6;color:var(--dim);margin-bottom:6px}
.cover .box p b{color:var(--ink)}
.cover .box .btn{margin-top:8px}
.passm{display:grid;gap:8px;text-align:left}
.passm button{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px}
.passm button span{text-align:left}
.passm button small{display:block;font-weight:400;color:var(--dim);font-size:11px;margin-top:2px}
.passm button em{font-style:normal;font-size:11px;padding:3px 7px;border-radius:99px;background:#0e1015;white-space:nowrap}
.passm button:active{border-color:var(--org)}
.dock{position:absolute;left:0;right:0;bottom:0;z-index:4;padding:6px 8px calc(env(safe-area-inset-bottom) + 8px);
  background:linear-gradient(180deg,rgba(7,8,11,0),rgba(7,8,11,.75) 35%);display:flex;flex-direction:column;align-items:center;pointer-events:none}
.calls{width:100%;max-width:560px;display:grid;grid-template-columns:repeat(5,1fr);gap:6px;pointer-events:auto}
.calls button{background:rgba(40,44,58,.82);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:5px 2px;font-size:11px;font-weight:700;line-height:1.25;min-height:54px;backdrop-filter:blur(4px)}
.calls button b{display:block;font-family:'Black Han Sans';font-weight:400;font-size:19px}
.calls button small{display:block;font-weight:500;color:#b8bdc9;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.calls button.ball{border-color:var(--gold);color:var(--gold)}
.calls button.ord{border-color:var(--blue)}
.calls button.ord small{color:#bfe0ff}
.calls button:disabled{opacity:.45}
.chint{width:100%;max-width:560px;font-size:11px;color:#c3c8d3;text-align:center;padding-bottom:6px;line-height:1.4;text-shadow:0 1px 3px #000}
.chint b{color:#fff}
</style>
</head>
<body>
<div class="court" id="court">
  <div class="cstage" id="cStage"><canvas id="gl"></canvas><canvas id="cv"></canvas><div class="slowtag">SLOW</div>
    <div class="hudbar"><div class="tm us"><span>PLM</span><b id="sUs">0</b></div><div class="tm them"><span id="sOppN">OPP</span><b id="sThem">0</b></div>
      <div class="qt" id="cTitle"></div><div class="clk" id="cClock">12</div></div>
    <div class="dock"><div class="chint" id="cHint"></div><div class="calls" id="cCalls"></div></div>
    <div class="cover" id="cCover"><div class="box" id="cBox"></div></div></div>
</div>

<script>
'use strict';
/* ---------- utils ---------- */
const $=s=>document.querySelector(s);
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const pick=a=>a[Math.floor(Math.random()*a.length)];
function binom(n,p){let k=0;for(let i=0;i<n;i++)if(Math.random()<p)k++;return k}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- match flow ---------- */
const OPPS=['하버타운 바이퍼스','노스필드 울프팩','썬밸리 코메츠','스톤브릿지 바이슨즈','레드캐니언 피닉스','아이언베이 타이탄즈','골든포트 스톰','크라운시티 나이츠'];
const S={a:{sht:62,tpt:62,drv:64,pas:66}};   // 1번(나)의 능력치
let M=null;
const short=n=>n.split(' ').slice(-1)[0];
function simPts(off,def){const p=clamp(.47+(off-def)*.011,.3,.66),r=Math.random();
  if(r<p)return Math.random()<.34?3:2;if(r<p+.07)return binom(2,.74);return 0}
function sim(n){for(let i=0;i<n;i++){M.us+=simPts(M.ms,M.os);M.them+=simPts(M.os,M.ms)}M.them+=Math.random()<.5?simPts(M.os,M.ms):0}
function startMatch(){
  M={opp:pick(OPPS),os:rnd(74,81),ms:78,us:0,them:0,q:1,steps:[],outs:[],
     L:{pts:0,ast:0,tov:0,fga:0,fgm:0,tpa:0,tpm:0,fta:0,ftm:0},clutch:null};
  for(let q=1;q<=4;q++){
    for(let k=0;k<3;k++){M.steps.push(d=>{M.q=q;sim(ri(5,6));d()});M.steps.push(d=>possStep(q,k,d))}
    M.steps.push(d=>{sim(ri(1,2));d()});
    if(q<4)M.steps.push(d=>quarterEnd(q,d));
  }
  M.steps.push(clutchStep);
  M.steps.push(()=>finishMatch());
  sizeCourt();if(!raf){lastT=performance.now();raf=requestAnimationFrame(frame)}
  nextStep();
}
function nextStep(){const s=M&&M.steps.shift();if(s)s(nextStep)}
function scoreHTML(){return`우리 <b>${M.us}</b> : <b>${M.them}</b> ${esc(short(M.opp))}`}
function applyOut(o){M.outs.push(o);for(const k in M.L)M.L[k]+=o[k]||0;M.us+=o.pts}
function possStep(q,k,done){
  const opt={clock:12,title:`${q}쿼터 · 공격 ${k+1}/3`,sub:`${ri(0,11-k*4)}:${String(ri(0,59)).padStart(2,'0')} 남음`,
    intro:q===1&&k===0?`vs <b>${esc(M.opp)}</b> · 쿼터마다 공격 3번, 공격 시간 <b>12초</b><br>
      공을 가진 선수를 드래그 → 동료에게 놓으면 <b>패스</b>, 림에 놓으면 <b>슛</b>, 빈 곳이면 <b>드리블</b>.<br>
      <b>동료를 탭</b>(또는 아래 번호)하면 작전 지시: 스크린·컷·3점 라인·공 받으러.<br>우리 팀이 공을 잡으면 <b>슬로모션</b>.`:null};
  playPoss(opt,o=>{applyOut(o);done()});
}
function quarterEnd(q,done){
  setScore();
  cover(`<h4>${q}쿼터 종료</h4><p style="font-size:22px"><b>${M.us} : ${M.them}</b></p><p>${M.us>M.them?'리드를 지키자!':M.us<M.them?'추격이 필요하다.':'팽팽한 승부!'}</p>
    <button class="btn pri" id="cQ">${q+1}쿼터 시작 ▶</button>`);
  $('#cQ').onclick=()=>{cover(null);done()};
}
function clutchStep(done){
  const gap=M.them-M.us;
  if(gap<0||gap>3)return done();
  const sec=+rnd(6,9).toFixed(1);
  playPoss({clock:sec,clutch:true,title:'⏱ 마지막 공격!',sub:`종료 ${sec}초 전 · ${gap?`${gap}점 차 열세`:'동점'}`,
    intro:`4쿼터 종료 <b>${sec}초</b> 전, ${gap?`<b style="color:var(--red)">${gap}점 차</b>로 뒤지고 있다`:'<b>동점</b>이다'}.<br>마지막 작전을 짜라!`},
    o=>{applyOut(o);M.clutch=o;done()});
}
function finishMatch(){
  G=null;CB=null;
  let ot=false;
  if(M.us===M.them){ot=true;while(M.us===M.them){M.us+=ri(6,14);M.them+=ri(6,14)}}
  const win=M.us>M.them,L=M.L;
  $('#cTitle').innerHTML='경기 종료<small>FINAL</small>';setScore();renderCalls(true);
  cover(`<h4 style="color:${win?'var(--green)':'var(--red)'}">${win?'승리!':'패배'}${ot?' (연장)':''}</h4>
    <p style="font-size:24px"><b>${M.us} : ${M.them}</b></p>
    <p class="small">직접 플레이한 공격 기록</p>
    <div class="statbox"><div><b>${L.pts}</b><span>득점</span></div><div><b>${L.ast}</b><span>어시스트</span></div><div><b>${L.tov}</b><span>턴오버</span></div><div><b>${L.fgm}/${L.fga}</b><span>야투</span></div></div>
    ${M.clutch?`<p class="small">⏱ 마지막 공격: ${esc(M.clutch.desc)}</p>`:''}
    <button class="btn pri" id="cAgain">다시 하기 ▶</button>`);
  $('#cAgain').onclick=()=>{cover(null);startMatch()};
}

/* ---------- court engine ---------- */
const CW=15,CH=14,HOOP={x:7.5,y:1.6};
const FORM={PG:[7.5,9.4],SG:[12.3,6.6],SF:[2.7,6.6],PF:[4.7,3.5],C:[10.3,2.7]};
const PORDER=['PG','SG','SF','PF','C'];
const SPOTS3=[{x:1.2,y:1.4},{x:13.8,y:1.4},{x:1.9,y:6.4},{x:13.1,y:6.4},{x:4.4,y:8.4},{x:10.6,y:8.4},{x:7.5,y:9.2}];
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const unit=(a,b)=>{const dx=b.x-a.x,dy=b.y-a.y,l=Math.hypot(dx,dy)||1;return{x:dx/l,y:dy/l}};
function segDist(p,a,b){const dx=b.x-a.x,dy=b.y-a.y,l2=dx*dx+dy*dy||1,t=clamp(((p.x-a.x)*dx+(p.y-a.y)*dy)/l2,0,1);return{d:Math.hypot(a.x+dx*t-p.x,a.y+dy*t-p.y),t}}
const isThree=p=>Math.abs(p.x-HOOP.x)>=6.6||dist(p,HOOP)>6.75;
let G=null,CB=null,raf=0,lastT=0;

function playPoss(opt,cb){CB=cb;startPoss(opt)}
function possDone(out){const f=CB;CB=null;G=null;f&&f(out)}
function cover(html){const c=$('#cCover');if(html==null){c.classList.remove('on');return}$('#cBox').innerHTML=html;c.classList.add('on')}

function startPoss(opt){
  const of=PORDER.map((pos,i)=>{const f=FORM[pos],x=f[0]+rnd(-.35,.35),y=f[1]+rnd(-.35,.35);
    return{i,pos,num:i+1,x,y,tx:x,ty:y,home:{x,y},me:i===0,order:null,shootT:0}});
  const df=of.map(o=>{const u=unit(o,HOOP),x=o.x+u.x*1.1,y=o.y+u.y*1.1;return{i:o.i,x,y,lx:x,ly:y,stuck:0,hedge:0}});
  G={opt,of,df,meI:0,mate:clamp(45+(M.ms-70)*1.15,40,70),oppF:.88+clamp((M.os-70)/18,0,1.4)*.24,
    clock:opt.clock,time:0,holder:0,flight:null,drag:null,fx:[],ended:false,paused:true,menu:false,
    lastPass:null,helper:-1,ballAt:null,sig:'',
    out:{pts:0,fga:0,fgm:0,tpa:0,tpm:0,fta:0,ftm:0,ast:0,tov:0,desc:''}};
  $('#cTitle').innerHTML=`${esc(opt.title)}<small>${esc(opt.sub)}</small>`;
  setScore();
  if(opt.intro){
    cover(`<h4>${esc(opt.title)}</h4><p>${opt.intro}</p><button class="btn pri" id="cGo">${opt.clutch?'마지막 공격 시작':'경기 시작'} ▶</button>`);
    $('#cGo').onclick=()=>{cover(null);G.paused=false};
  }else{
    const g=G;fx('READY',CW/2,7,'#ffd166',1.6);
    setTimeout(()=>{if(G===g){if(g.menu)g.wasPaused=false;else g.paused=false}},750);
  }
}
const attr=(i,k)=>i===0?S.a[k]:G.mate;
function frame(t){
  raf=requestAnimationFrame(frame);
  const dt=Math.min(.05,(t-lastT)/1000);lastT=t;
  if(!G)return;
  if(!G.paused)step(dt*slowMo());else for(const f of G.fx)f.t+=dt*.5;
  draw(dt);hud();
}
function slowMo(){const g=G;if(!g||g.ended)return 1;if(g.drag)return .2;if(g.holder!=null)return .3;
  if(g.flight&&g.flight.kind==='pass'&&g.flight.t/g.flight.dur>.5)return .5;return 1}
function moveTo(e,tx,ty,sp,dt){const dx=tx-e.x,dy=ty-e.y,l=Math.hypot(dx,dy);if(l<.01)return;const s=Math.min(l,sp*dt);e.x+=dx/l*s;e.y+=dy/l*s}
function contest(o){const f=unit(o,HOOP);let m=9;for(const d of G.df){const l=dist(d,o)||.01,front=((d.x-o.x)*f.x+(d.y-o.y)*f.y)/l;
  const v=l+(d.stuck>0?.6:0)+(front<.35?1.3:0);if(v<m)m=v}return m}
function fx(t,x,y,col,size){G.fx.push({t:0,txt:t,x,y,col:col||'#fff',size:size||1})}
function step(dt){
  const g=G;g.time+=dt;
  for(const f of g.fx)f.t+=dt;g.fx=g.fx.filter(f=>f.t<1.4);
  for(const o of g.of)if(o.shootT>0)o.shootT-=dt;
  if(!g.ended){g.clock=Math.max(0,g.clock-dt);
    if(g.clock<=0&&!(g.flight&&g.flight.kind==='shot')){
      if(g.holder!=null||(g.flight&&g.flight.kind==='pass'))g.out.tov++;
      endPoss(g.opt.clutch?'⏱ 버저가 울렸다… 슛을 던지지 못했다.':'⏱ 공격 시간 초과! (샷클락 바이얼레이션)','#ff5a5f')}}
  const H=g.holder!=null?g.of[g.holder]:null;
  for(const o of g.of){const has=g.holder===o.i;
    const sp=(o.me?4.7*(.85+S.a.drv/300):4.5)*(has?.92:1)*(o.rolling||o.cutting?1.1:1);
    moveTo(o,o.tx,o.ty,sp,dt)}
  g.helper=-1;
  if(H&&dist(H,HOOP)<3.8){let b=6;for(const d of g.df){if(d.i===H.i||d.stuck>0)continue;const v=dist(d,H);if(v<b){b=v;g.helper=d.i}}}
  for(const d of g.df){
    if(d.hedge>0)d.hedge-=dt;
    if(d.stuck>0){d.stuck-=dt;continue}
    const m=g.of[d.i];let tx,ty;
    if(d.hedge>0&&H&&H.i!==d.i){const u=unit(H,HOOP);tx=H.x+u.x*1.2;ty=H.y+u.y*1.2}
    else if(d.i===g.helper){const u=unit(H,HOOP);tx=H.x+u.x*.95;ty=H.y+u.y*.95}
    else{const on=H&&H.i===m.i,u=unit(m,HOOP),gap=on?.95:H&&dist(m,H)<5?1.3:2;tx=m.x+u.x*gap;ty=m.y+u.y*gap;
      if(!on&&H){tx+=(H.x-m.x)*.12;ty+=(H.y-m.y)*.12}}
    const r=Math.min(1,dt*4.5);d.lx+=(tx-d.lx)*r;d.ly+=(ty-d.ly)*r;
    moveTo(d,d.lx,d.ly,3.7*g.oppF*(d.hedge>0||d.i===g.helper?1.08:1),dt);
  }
  separate();
  if(!g.ended)updOrders(dt);
  if(g.flight)updFlight(dt);
  if(!g.ended&&H&&g.holder===H.i)stealCheck(dt,H);
}
function anchored(e,isD){return isD?e.stuck>0:!!(e.order&&e.order.type==='screen'&&e.order.phase==='set')}
function separate(){
  const g=G,all=[...g.of.map(o=>[o,false]),...g.df.map(d=>[d,true])];
  for(let a=0;a<all.length;a++)for(let b=a+1;b<all.length;b++){
    const[A,ad]=all[a],[B,bd]=all[b],dx=B.x-A.x,dy=B.y-A.y,l=Math.hypot(dx,dy);if(l>=.72||l<1e-4)continue;
    const ov=.72-l,aa=anchored(A,ad),ba=anchored(B,bd);if(aa&&ba)continue;const fa=aa?0:ba?1:.5;
    A.x-=dx/l*ov*fa;A.y-=dy/l*ov*fa;B.x+=dx/l*ov*(1-fa);B.y+=dy/l*ov*(1-fa)}
  for(const[e]of all){e.x=clamp(e.x,.3,CW-.3);e.y=clamp(e.y,.3,CH-.3)}
}
function stealCheck(dt,H){
  const g=G;if(dist(H,{x:H.tx,y:H.ty})<.25)return;
  for(const d of g.df){if(d.stuck>0)continue;
    if(dist(d,H)<.82&&Math.random()<dt*.25*(1.2-attr(H.i,'drv')/100)*g.oppF){
      g.out.tov++;g.holder=null;g.ballAt={x:d.x,y:d.y};fx('스틸!',d.x,d.y,'#ff5a5f');return endPoss(`🙅 ${H.num}번이 드리블하다 스틸당했다!`,'#ff5a5f')}}
}

/* --- orders (작전 지시) --- */
const ORD_NAME={screen:'스크린',cut:'림으로 컷',spot:'3점 라인으로',come:'공 받으러'};
function bestSpot(o){
  const g=G;let best=null,bv=-1;
  for(const s of SPOTS3){if(g.of.some(p=>p!==o&&dist(p,s)<2.2))continue;
    const open=Math.min(...g.df.map(d=>dist(d,s))),v=open-dist(o,s)*.25;if(v>bv){bv=v;best=s}}
  return best||{x:o.x<HOOP.x?1.9:13.1,y:6.4};
}
function clearOrder(o){o.order=null;o.cutting=o.rolling=o.popping=false}
function giveOrder(i,ord){
  const g=G,o=g.of[i];clearOrder(o);o.order=ord;
  if(ord.type==='cut'){o.cutting=true;o.tx=HOOP.x+(o.x<HOOP.x?-1.1:1.1);o.ty=2.2;g.df[i].stuck=Math.max(g.df[i].stuck,.6);ord.t=2.6;fx('컷!',o.x,o.y,'#5aa9ff')}
  else if(ord.type==='spot'){const s=bestSpot(o);o.tx=s.x;o.ty=s.y;o.home={x:s.x,y:s.y};ord.t=2.4;fx('3점 라인!',o.x,o.y,'#5aa9ff')}
  else if(ord.type==='come'){const h=g.holder!=null?g.of[g.holder]:{x:7.5,y:9};const u=unit(h,o),p={x:clamp(h.x+u.x*3.2,.6,CW-.6),y:clamp(h.y+u.y*3.2,.6,CH-.6)};
    o.tx=p.x;o.ty=p.y;o.home=p;g.df[i].stuck=Math.max(g.df[i].stuck,.35);ord.t=1.8;fx('공 줘!',o.x,o.y,'#5aa9ff')}
  else if(ord.type==='screen'){ord.phase='go';ord.t=4;fx(`스크린 → ${g.of[ord.target].num}번`,o.x,o.y,'#ffd166')}
}
function updOrders(dt){
  const g=G;
  for(const o of g.of){const ord=o.order;if(!ord)continue;ord.t-=dt;
    if(ord.type==='cut'){if(ord.t<=0){o.cutting=false;const c=dist(o,{x:1.2,y:1.4})<dist(o,{x:13.8,y:1.4})?{x:1.2,y:1.4}:{x:13.8,y:1.4};
      if(g.holder!==o.i){o.tx=c.x;o.ty=c.y;o.home=c}o.order=null}continue}
    if(ord.type!=='screen'){if(ord.t<=0)o.order=null;continue}
    const T=g.of[ord.target],D=g.df[ord.target];
    if(ord.phase==='go'){
      const v=unit(T,D),n={x:-v.y,y:v.x},sg=((o.x-D.x)*n.x+(o.y-D.y)*n.y)>=0?1:-1,sp={x:D.x+n.x*sg*.75,y:D.y+n.y*sg*.75};
      o.tx=clamp(sp.x,.4,CW-.4);o.ty=clamp(sp.y,.4,CH-.4);
      if(dist(o,sp)<.45){ord.phase='set';ord.t=2.8;o.tx=o.x;o.ty=o.y;if(g.holder!==T.i)useScreen(o);else fx('스크린 세팅!',o.x,o.y,'#ffd166',.9)}
      else if(ord.t<=0){o.tx=o.home.x;o.ty=o.home.y;o.order=null}
    }else if(ord.phase==='set'){
      if(g.holder===T.i&&dist(T,{x:T.tx,y:T.ty})>.3&&dist(T,o)<2.1)useScreen(o);
      else if(ord.t<=0){o.tx=o.home.x;o.ty=o.home.y;o.order=null}
    }else if(ord.t<=0){o.rolling=o.popping=false;o.order=null}
  }
}
function useScreen(o){
  const g=G,ord=o.order,T=g.of[ord.target],D=g.df[ord.target],side=o.x<HOOP.x?-1:1;
  D.stuck=1.25;ord.phase='after';ord.t=2.6;fx('스크린!',D.x,D.y,'#ffd166',1.2);
  if(g.holder===T.i)g.df[o.i].hedge=1.1;
  else if(dist(T,HOOP)<4.6){T.tx=T.x<HOOP.x?3.2:11.8;T.ty=7.2;T.home={x:T.tx,y:T.ty};T.popping=true;fx('플레어!',T.x,T.y,'#5aa9ff')}
  else{T.order={type:'cut',t:2.4};T.cutting=true;T.tx=HOOP.x+(T.x<HOOP.x?-1.1:1.1);T.ty=2.3;fx('컬 컷!',T.x,T.y,'#5aa9ff')}
  if(ord.after==='roll'){o.rolling=true;o.tx=HOOP.x+side*.8;o.ty=2.4;fx('롤!',o.x,o.y,'#5aa9ff')}
  else if(ord.after==='pop'){o.popping=true;o.tx=o.x<HOOP.x?3.1:11.9;o.ty=7.3;o.home={x:o.tx,y:o.ty};fx('팝!',o.x,o.y,'#5aa9ff')}
  else{o.tx=o.home.x;o.ty=o.home.y}
}

/* --- passing & shooting --- */
function passRisk(from,to){
  const g=G,a=g.of[from],b=g.of[to],pa=attr(from,'pas');let best=0,who=null,tt=0;
  for(const d of g.df){if(d.stuck>0)continue;const s=segDist(d,a,b);if(s.t<.08||s.t>.95||s.d>=1.05)continue;
    const ch=(1-s.d/1.05)*.8*(1.2-pa/100)*g.oppF;if(ch>best){best=ch;who=d;tt=s.t}}
  return{p:clamp(best,0,.85),d:who,t:tt};
}
function launchPass(from,to,type){
  const g=G,a=g.of[from],b=g.of[to],pa=attr(from,'pas');g.holder=null;
  const f={kind:'pass',from,to,type,sx:a.x,sy:a.y,t:0,dur:type==='lob'?.5+dist(a,b)/9:.12+dist(a,b)/15};
  if(type==='lob'){if(Math.random()<clamp(.17-pa*.0018,.03,.12))f.over=true}
  else{const r=passRisk(from,to);if(r.d&&Math.random()<r.p){f.stealD=r.d;f.stealT=r.t}}
  g.flight=f;g.lastPass={from,to,time:g.time};
}
function updFlight(dt){
  const g=G,f=g.flight;f.t+=dt;const r=f.t/f.dur;
  if(f.kind==='pass'){
    if(f.stealD&&r>=f.stealT){g.flight=null;const d=f.stealD;g.ballAt={x:d.x,y:d.y};g.out.tov++;
      fx('가로채기!',d.x,d.y,'#ff5a5f');return endPoss('🙅 패스가 길목에서 차단당했다!','#ff5a5f')}
    if(r>=1){g.flight=null;
      if(f.over){const b=g.of[f.to];g.ballAt={x:clamp(b.x+(b.x-f.sx)*.25,.3,CW-.3),y:clamp(b.y+(b.y-f.sy)*.25,.3,CH-.3)};
        g.out.tov++;return endPoss('🪂 랍 패스가 너무 길었다… 턴오버.','#ff5a5f')}
      catchBall(f.to,f)}
  }else if(r>=1){g.flight=null;landShot(f)}
}
function catchBall(i,f){
  const g=G,o=g.of[i];
  if(f.type==='lob'&&(o.rolling||o.cutting)&&dist(o,HOOP)<3){g.holder=i;fx('앨리웁!',o.x,o.y,'#ffd166',1.3);clearOrder(o);return shoot(i,0,true)}
  g.holder=i;clearOrder(o);o.tx=o.x;o.ty=o.y;
}
function shotProb(i,aim,aoop){
  const g=G,o=g.of[i],dR=dist(o,HOOP),th=isThree(o),cd=contest(o);let base;
  if(aoop){const pa=g.lastPass&&g.lastPass.to===i?attr(g.lastPass.from,'pas'):g.mate;base=.68+(pa-55)*.004+(attr(i,'drv')-55)*.003}
  else{const at=attr(i,dR<2.6?'drv':th?'tpt':'sht');
    base=dR<2.6?.54+(at-55)*.006:!th?.4+(at-55)*.005-(dR-2.6)*.01:.34+(at-55)*.0045-Math.max(0,dR-7.6)*.07}
  let con=cd<.85?-.25:cd<1.4?-.14:cd<2.2?-.04:cd<3?.09:.16;if(con<0)con*=g.oppF*(aoop?.5:1);
  return clamp(base+con-aim*.17,.03,.9);
}
function shoot(i,aim,aoop){
  const g=G,o=g.of[i],pr=shotProb(i,aim,aoop),dR=dist(o,HOOP),th=!aoop&&isThree(o),cd=contest(o);
  const made=Math.random()<pr,foul=!aoop&&dR<2.8&&cd<1.25&&Math.random()<.17,block=!made&&!foul&&cd<.95&&dR<3.2&&Math.random()<.5;
  g.holder=null;o.shootT=.7;
  g.flight={kind:'shot',from:i,sx:o.x,sy:o.y,t:0,dur:aoop?.3:block?.25:.55+dR*.04,made,th,foul,block,aoop,dR};
  if(made||!foul){g.out.fga++;if(th)g.out.tpa++}
  fx(aoop?'덩크!':th?'3점슛!':dR<2.6?'레이업!':'점퍼!',o.x,o.y);
}
function landShot(f){
  const g=G,o=g.of[f.from];let pts=0,ft=0,fm=0;
  if(f.made){pts=f.th?3:2;g.out.fgm++;if(f.th)g.out.tpm++}
  if(f.foul){ft=f.made?1:f.th?3:2;fm=binom(ft,f.from===0?clamp(.58+S.a.sht*.0032,.5,.93):.74);pts+=fm;g.out.fta+=ft;g.out.ftm+=fm}
  const lp=g.lastPass,assisted=f.made&&lp&&lp.to===f.from&&g.time-lp.time<6;
  if(assisted)g.out.ast++;
  let txt=f.made?(f.aoop?'🪂 앨리웁 덩크!!':f.th?'🏹 3점슛 성공!':f.dR<2.6?'⚡ 골밑 마무리 성공!':'🎯 점퍼 성공!')
    :(f.block?'🚫 블록당했다!':f.th?'3점슛이 빗나갔다.':'슛이 림을 돌아 나왔다.');
  if(f.foul)txt+=f.made?` 앤드원! 자유투 ${fm}/1`:` 슈팅 파울! 자유투 ${fm}/${ft}`;
  g.out.pts=pts;
  fx(pts?`+${pts}`:f.block?'BLOCK':'MISS',HOOP.x,HOOP.y,pts?'#3ecf8e':'#ff5a5f',1.6);
  g.ballAt={x:HOOP.x+(pts?0:rnd(-1,1)),y:HOOP.y+(pts?.3:1.3)};
  endPoss(`${o.num}번 ${o.pos} `+txt+(assisted?` (${g.of[lp.from].num}번 어시스트)`:''),pts?'#3ecf8e':'#ff5a5f');
}
function statTxt(o){const a=[];if(o.ast)a.push(`어시스트 ${o.ast}`);if(o.tov)a.push('턴오버');if(o.fga)a.push(`야투 ${o.fgm}/${o.fga}`);return a.join(' · ')}
function endPoss(txt,col){
  const g=G;if(g.ended)return;g.ended=true;g.out.desc=txt;g.drag=null;
  if(g.flight&&g.flight.kind==='pass')g.flight=null;
  if(g.holder!=null){const h=g.of[g.holder];g.ballAt={x:h.x,y:h.y};g.holder=null}
  setTimeout(()=>{if(G!==g)return;const o=g.out;
    cover(`<h4 style="color:${col}">${o.pts?`+${o.pts}점!`:'공격 실패'}</h4><p><b>${txt}</b></p><p class="small">${statTxt(o)}</p>
      <p class="small">우리 ${M.us+o.pts} : ${M.them} ${esc(short(M.opp))}</p>
      <button class="btn pri" id="cNext">${g.opt.clutch?'경기 결과 보기':'계속 ▶'}</button>`);
    $('#cNext').onclick=()=>{cover(null);possDone(g.out)}},1000);
}

/* --- input --- */
(function bindCourt(){
  const cv=$('#cv');
  cv.addEventListener('pointerdown',e=>{if(!G||G.paused||G.ended||!R)return;e.preventDefault();const p=ptC(e);
    G.press={sx:p.sx,sy:p.sy,t:performance.now()};if(G.holder!=null)G.drag=p;try{cv.setPointerCapture(e.pointerId)}catch(_){}});
  cv.addEventListener('pointermove',e=>{if(G&&G.press&&G.drag)G.drag=ptC(e,G.drag)});
  cv.addEventListener('pointerup',e=>{
    const g=G;if(!g||!g.press)return;const pr=g.press,p=ptC(e,g.drag);g.press=null;const d=g.drag;g.drag=null;if(g.paused||g.ended)return;
    const moved=Math.hypot(p.sx-pr.sx,p.sy-pr.sy)>14;
    if(!moved){const t=tapPlayer(p);if(t!=null&&t!==g.holder)return orderMenu(t)}
    if(g.holder==null||!d)return;
    const tg=dragTarget(p),h=g.of[g.holder];
    if(tg.kind==='shot')return shoot(g.holder,tg.aim,false);
    if(tg.kind==='pass')return passMenu(tg.to);
    h.tx=tg.x;h.ty=tg.y;
  });
  cv.addEventListener('pointercancel',()=>{if(G){G.drag=null;G.press=null}});
  const re=()=>{applyOrient();if(R)sizeCourt()};window.addEventListener('resize',re);window.addEventListener('orientationchange',()=>setTimeout(re,250));
})();
function tapPlayer(p){let best=null,bd=.9;for(const o of G.of){const q=scrPt(o);const v=Math.hypot(p.sx-q.x,p.sy-q.y)/q.ppm;if(v<bd){bd=v;best=o.i}}return best}
function dragTarget(d){
  const g=G,hi=g.holder;
  let best=null,bd=1.5;
  for(const o of g.of){if(o.i===hi)continue;const p=scrPt(o);const v=Math.hypot(d.sx-p.x,d.sy-p.y)/p.ppm;if(v<bd){bd=v;best=o.i}}
  const rp=proj(HOOP.x,HOOP.y,3.05),dh=Math.hypot(d.sx-rp.x,d.sy-rp.y)/pxPerM(HOOP.x,HOOP.y,3.05);
  if(dh<.75)return{kind:'shot',aim:clamp((dh-.3)/.9,0,1)};
  if(best!=null&&bd<.8)return{kind:'pass',to:best};
  if(dh<1.2)return{kind:'shot',aim:clamp((dh-.3)/.9,0,1)};
  if(best!=null)return{kind:'pass',to:best};
  return{kind:'move',x:clamp(d.x,.4,CW-.4),y:clamp(d.y,.4,CH-.4)};
}

/* ---------- 3D rendering (three.js) ---------- */

  const ball=new T.Mesh(new T.SphereGeometry(.12,28,20),new T.MeshStandardMaterial({map:ballTex(),roughness:.7}));ball.castShadow=true;scene.add(ball);
  R={renderer,scene,cam,off,def,refs,ring,meRing,ball,net,scTex,scLast:-1,ray:new T.Raycaster(),ground:new T.Plane(new T.Vector3(0,1,0),0),
     cp:new T.Vector3(0,6,14),cl:new T.Vector3(0,1,-3),w:1,h:1,ctx:$('#cv').getContext('2d'),dpr:1};
  return true;
}
function sizeCourt(){
  if(!R)return;const st=$('#cStage'),w=Math.max(200,st.offsetWidth),h=Math.max(200,st.offsetHeight),dpr=Math.min(2,window.devicePixelRatio||1);
  R.w=w;R.h=h;R.dpr=dpr;R.renderer.setPixelRatio(dpr);R.renderer.setSize(w,h,false);
  const cv=$('#cv');cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);
  const a=w/h;R.cam.aspect=a;R.cam.fov=a<1?clamp(2*Math.atan(Math.tan(25*Math.PI/180)/a)*180/Math.PI,46,78):44;R.cam.updateProjectionMatrix();
}
function setScore(){if(!M)return;$('#sUs').textContent=M.us;$('#sThem').textContent=M.them;$('#sOppN').textContent=short(M.opp)}
function hud(){
  const el=$('#cClock'),v=G.clock;el.textContent=v<5?v.toFixed(1):Math.ceil(v);el.classList.toggle('low',v<4);
  $('#cStage').classList.toggle('slow',slowMo()<1&&!G.paused&&!G.ended);renderCalls();
  const n=Math.ceil(v);if(R&&n!==R.scLast){R.scLast=n;const c=R.scTex.userData.c,x=c.getContext('2d');x.fillStyle='#120404';x.fillRect(0,0,128,64);
    x.fillStyle='#ff3030';x.font="900 52px 'Black Han Sans',monospace";x.textAlign='center';x.textBaseline='middle';x.fillText(String(n),64,35);R.scTex.needsUpdate=true}
}
function animPlayer(m,x,y,lx,ly,dt,mode){
  const u=m.userData,p=W3(x,y,0),mv=Math.hypot(x-u.px,y-u.py)/Math.max(dt,1e-3);u.px=x;u.py=y;
  u.run+=((clamp(mv/4.5,0,1))-u.run)*Math.min(1,dt*8);u.ph+=dt*(4+mv*2.4);
  m.position.set(p.x,0,p.z);
  const ta=Math.atan2(lx-x,ly-y);let da=ta-m.rotation.y;while(da>Math.PI)da-=2*Math.PI;while(da<-Math.PI)da+=2*Math.PI;m.rotation.y+=da*Math.min(1,dt*10);
  const s=Math.sin(u.ph),r=u.run,crouch=mode.def?.1:mode.hold?.05:0;
  const jump=mode.shoot>0?Math.sin(clamp(1-mode.shoot/.7,0,1)*Math.PI)*.35:0;
  u.body.position.y=-crouch+Math.abs(Math.cos(u.ph))*.05*r+jump;
  u.legs.forEach((L,k)=>{const sg=k?1:-1;L.th.rotation.x=-s*sg*.75*r-crouch*2.2;L.sh.rotation.x=Math.max(0,s*sg)*1.1*r+crouch*3.6});
  u.arms.forEach((A,k)=>{const sg=k?1:-1;
    if(mode.shoot>0){A.up.rotation.set(-2.7,0,-A.sd*.15);A.fo.rotation.x=-.5}
    else if(mode.def){A.up.rotation.set(-.35,0,A.sd*1.05);A.fo.rotation.x=-.6}
    else if(mode.holdBall&&A.sd>0){A.up.rotation.set(-.5,0,-.1);A.fo.rotation.x=-.7+Math.abs(Math.sin(mode.t*8))*.6}
    else{A.up.rotation.set(s*sg*.7*r,0,A.sd*.08);A.fo.rotation.x=-.25-.6*r}});
}
function draw(dt){
  const g=G;if(!R||!g)return;const t=performance.now()/1000,gdt=dt*(g.paused?0:slowMo());
  g.of.forEach((o,i)=>{const H=g.holder!=null&&g.holder!==i?g.of[g.holder]:null,look=g.holder===i||!H?HOOP:H;
    animPlayer(R.off[i],o.x,o.y,look.x,look.y,gdt||1e-4,{hold:g.holder===i,holdBall:g.holder===i&&!g.ended,shoot:o.shootT,t:g.time})});
  g.df.forEach((d,i)=>{const m=g.of[i];animPlayer(R.def[i],d.x,d.y,m.x,m.y,gdt||1e-4,{def:true,shoot:0});
    R.def[i].rotation.z=d.stuck>0?Math.sin(t*14)*.1:0});
  const ho=g.holder!=null?g.of[g.holder]:null;R.ring.visible=!!ho;
  if(ho){const p=W3(ho.x,ho.y,0);R.ring.position.set(p.x,.015,p.z);R.ring.rotation.z+=dt*1.5}
  const me=g.of[0],mp=W3(me.x,me.y,0);R.meRing.position.set(mp.x,.014,mp.z);
  // ball
  let bx,by,bh;
  if(g.flight){const f=g.flight,r=clamp(f.t/f.dur,0,1);
    if(f.kind==='pass'){const b=g.of[f.to];let ex=b.x,ey=b.y;if(f.over){ex=b.x+(b.x-f.sx)*.25;ey=b.y+(b.y-f.sy)*.25}
      bx=f.sx+(ex-f.sx)*r;by=f.sy+(ey-f.sy)*r;bh=1.2+(f.type==='lob'?Math.sin(Math.PI*r)*2.6:Math.sin(Math.PI*r)*.2)}
    else{bx=f.sx+(HOOP.x-f.sx)*r;by=f.sy+(HOOP.y-f.sy)*r;
      bh=f.block?2.4+Math.sin(Math.PI*r)*.4:2.45+(3.15-2.45)*r+Math.sin(Math.PI*r)*(1.3+f.dR*.14)}}
  else if(ho){const m=R.off[g.holder],a=m.rotation.y;bx=ho.x+Math.sin(a)*.25-Math.cos(a)*.3;by=ho.y+Math.cos(a)*.25+Math.sin(a)*.3;
    bh=g.ended?1.1:.13+Math.abs(Math.sin(g.time*8))*.75}
  else if(g.ballAt){bx=g.ballAt.x;by=g.ballAt.y;bh=.12}
  else{bx=HOOP.x;by=HOOP.y;bh=.12}
  R.ball.position.copy(W3(bx,by,bh));R.ball.rotation.x+=gdt*8;R.ball.rotation.z+=gdt*3;
  R.net.scale.y=g.ended&&g.out.pts&&g.time%1<.5?1.2:1;
  // referees trail the play
  animPlayer(R.refs[0],-.7,clamp(by+1.5,2,CH),bx,by,dt,{});animPlayer(R.refs[1],clamp(bx*.4+9,9,14),-.9,bx,by,dt,{});
  // broadcast camera: low and behind the ball, looking toward the rim
  const portrait=R.w<R.h,fx=bx+(HOOP.x-bx)*(portrait?.5:.3),fy=by+(HOOP.y-by)*(portrait?.55:.38);
  const D=portrait?8:7.6,Hc=portrait?5.2:4.4;
  const cx=CW/2+(bx-CW/2)*.55,cy=Math.min(by+D,CH+(portrait?6:5.5));
  const want=W3(cx,cy,Hc),look=W3(CW/2+(fx-CW/2)*.75,fy,1);const k=Math.min(1,dt*2.2);
  R.cp.lerp(want,k);R.cl.lerp(look,k);R.cam.position.copy(R.cp);R.cam.lookAt(R.cl);
  R.renderer.render(R.scene,R.cam);
  overlay();
}
function overlay(){
  const g=G,c=R.ctx,dpr=R.dpr;c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,R.w*dpr,R.h*dpr);c.setTransform(dpr,0,0,dpr,0,0);
  const fs=13,txt=(s,x,y,px,col,wt)=>{c.font=`${wt||700} ${px}px 'Noto Sans KR',sans-serif`;c.textAlign='center';c.textBaseline='middle';
    c.lineWidth=3;c.strokeStyle='rgba(0,0,0,.65)';c.strokeText(s,x,y);c.fillStyle=col;c.fillText(s,x,y)};
  const ringAt=(x,y,h,r,col,lw,dash)=>{c.strokeStyle=col;c.lineWidth=lw;c.setLineDash(dash||[]);c.beginPath();for(let i=0;i<=40;i++){const a=i/40*Math.PI*2,p=proj(x+Math.cos(a)*r,y+Math.sin(a)*r,h);i?c.lineTo(p.x,p.y):c.moveTo(p.x,p.y)}c.stroke();c.setLineDash([])};
  const ground=(a,b,col,dash)=>{const p=proj(a.x,a.y,.03),q=proj(b.x,b.y,.03);if(p.z>1||q.z>1)return;c.strokeStyle=col;c.lineWidth=2.5;c.setLineDash(dash||[]);c.beginPath();c.moveTo(p.x,p.y);c.lineTo(q.x,q.y);c.stroke();c.setLineDash([])};
  for(const o of g.of){const lab=ordLabel(o);if(!lab||g.ended)continue;if(dist(o,{x:o.tx,y:o.ty})>.4)ground(o,{x:o.tx,y:o.ty},'rgba(120,190,255,.75)',[6,5])}
  let guide=null;
  if(g.drag&&!g.ended&&g.holder!=null){const h=g.of[g.holder],t=dragTarget(g.drag);let col='rgba(255,255,255,.9)',lbl;
    const from=proj(h.x,h.y,1.1),to={x:g.drag.sx,y:g.drag.sy};
    if(t.kind==='shot'){col='#3ecf8e';ringAt(HOOP.x,HOOP.y,3.05,1.2,'rgba(62,207,142,.85)',2,[6,5]);ringAt(HOOP.x,HOOP.y,3.05,.3,'#3ecf8e',3);
      lbl=`${contest(h)>=2.2?'오픈! ':''}${isThree(h)?'3점 ':''}슛 ${Math.round(shotProb(g.holder,t.aim,false)*100)}%`}
    else if(t.kind==='pass'){col='#5aa9ff';const o=g.of[t.to],sp=scrPt(o);if(sp.off){c.strokeStyle=col;c.lineWidth=3;c.beginPath();c.arc(sp.x,sp.y,20,0,7);c.stroke()}else ringAt(o.x,o.y,.03,.75,col,3);lbl=`패스 → ${o.num}번`}
    else{lbl='드리블';ground(h,t,col,[8,6]);ringAt(t.x,t.y,.03,.35,col,2)}
    if(t.kind!=='move'){c.strokeStyle=col;c.lineWidth=4;c.beginPath();c.moveTo(from.x,from.y);c.lineTo(to.x,to.y);c.stroke();
      const ang=Math.atan2(to.y-from.y,to.x-from.x);c.fillStyle=col;c.beginPath();c.moveTo(to.x,to.y);c.lineTo(to.x-14*Math.cos(ang-.45),to.y-14*Math.sin(ang-.45));c.lineTo(to.x-14*Math.cos(ang+.45),to.y-14*Math.sin(ang+.45));c.fill()}
    guide={lbl,col,x:g.drag.sx,y:g.drag.sy-34}}
  for(const d of g.df){const p=proj(d.x,d.y,2.15);if(p.z>1)continue;if(d.stuck>0)txt('💫',p.x,p.y,fs+4);else if(d.hedge>0)txt('헷지',p.x,p.y,fs-1,'#ff9a9d')}
  for(const o of g.of){const h=g.holder===o.i,lab=ordLabel(o),sp=scrPt(o,2.15);
    if(sp.off){c.fillStyle=h?'rgba(255,209,102,.95)':'rgba(232,102,28,.92)';c.beginPath();c.arc(sp.x,sp.y,15,0,7);c.fill();c.strokeStyle='#fff';c.lineWidth=2;c.stroke();
      txt(String(o.num),sp.x,sp.y+1,13,'#1a0d00',900);if(lab&&!g.ended)txt(lab,sp.x,sp.y-24,fs-2,'#bfe0ff');continue}
    txt(`${o.num}${o.me?' 나':''}`,sp.x,sp.y,h?fs+3:fs,h?'#ffd166':o.me?'#ffe6a8':'#ffffff',900);
    if(lab&&!g.ended)txt(lab,sp.x,sp.y-16,fs-1,'#bfe0ff')}
  if(ho_name(g)){const h=g.of[g.holder],p=proj(h.x,h.y,0);if(p.z<1)txt(ho_name(g),p.x,p.y+28,15,'rgba(255,255,255,.85)',900)}
  if(guide)txt(guide.lbl,clamp(guide.x,60,R.w-60),Math.max(80,guide.y),fs+3,guide.col,900);
  for(const f of g.fx){const p=proj(f.x,f.y,2.7+f.t*.9);if(p.z>1)continue;c.globalAlpha=clamp(1.4-f.t,0,1);txt(f.txt,p.x,p.y,(fs+3)*f.size,f.col,900);c.globalAlpha=1}
}
function ho_name(g){if(g.holder==null||g.ended)return'';const h=g.of[g.holder];return h.me?'나 (1번 PG)':`${h.num}번 ${h.pos}`}

/* ---------- landscape lock: rotate the game when the phone is upright ---------- */
let ROT=false;
function applyOrient(){const c=$('#court'),W=window.innerWidth,H=window.innerHeight;ROT=H>W;
  if(ROT){c.classList.add('rot');c.style.width=H+'px';c.style.height=W+'px';c.style.transform=`translateX(${W}px) rotate(90deg)`}
  else{c.classList.remove('rot');c.style.width=c.style.height=c.style.transform=''}}
applyOrient();

/* ---------- boot ---------- */
Promise.race([document.fonts?document.fonts.ready:Promise.resolve(),new Promise(r=>setTimeout(r,1500))]).then(()=>{
  if(initGL()){sizeCourt();startMatch()}
  else cover('<h4>3D를 불러오지 못했어요</h4><p>인터넷 연결을 확인하고 새로고침해 주세요.</p>');
});
</script>
