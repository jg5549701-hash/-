<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>플레이메이커</title>
<meta name="description" content="드래그로 패스·슛하고 동료마다 작전을 지시하는 3D 농구 경기">
<meta name="theme-color" content="#07080b">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#07080b;--panel:#15171d;--panel2:#1d2029;--line:#2a2e39;--ink:#eceef2;--dim:#8d93a3;--org:#ff7a1a;--org2:#ffb347;
  --green:#3ecf8e;--red:#ff5a5f;--blue:#5aa9ff;--gold:#ffd166}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;-webkit-tap-highlight-color:transparent;overflow:hidden;height:100%}
button{font-family:inherit;cursor:pointer;color:inherit}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:15px;font-weight:700;width:100%}
.btn:active{transform:scale(.98)}
.btn.pri{background:linear-gradient(135deg,var(--org),#ff9d3d);border-color:transparent;color:#1a0d00}
.statbox{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;margin:10px 0 4px}
.statbox div{background:var(--panel2);border-radius:10px;padding:8px 2px}
.statbox b{display:block;font-size:20px;font-weight:900;color:var(--ink)}
.statbox span{font-size:11px;color:var(--dim)}
.court{position:fixed;inset:0;background:var(--bg);touch-action:none;-webkit-user-select:none;user-select:none}
.court.rot{inset:auto;top:0;left:0;transform-origin:0 0}
.cstage{position:absolute;inset:0;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#cv{touch-action:none}
.cstage::after{content:'';position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 0 0 rgba(90,169,255,0);transition:box-shadow .35s}
.cstage.slow::after{box-shadow:inset 0 0 90px 14px rgba(90,169,255,.3)}
.slowtag{position:absolute;top:calc(env(safe-area-inset-top) + 64px);left:50%;transform:translateX(-50%);font-family:'Black Han Sans';font-size:14px;letter-spacing:.2em;color:#bfe0ff;
  background:rgba(10,20,40,.6);padding:3px 12px;border-radius:99px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:2}
.cstage.slow .slowtag{opacity:1}
/* broadcast score bar */
.hudbar{position:absolute;top:calc(env(safe-area-inset-top) + 8px);left:50%;transform:translateX(-50%);z-index:4;display:flex;align-items:stretch;
  font-family:'Black Han Sans','Noto Sans KR',sans-serif;box-shadow:0 4px 18px rgba(0,0,0,.5);pointer-events:none;max-width:calc(100% - 16px)}
.hudbar .tm{display:flex;align-items:center;gap:8px;padding:4px 10px;font-size:15px;color:#fff;white-space:nowrap}
.hudbar .tm b{font-weight:400;font-size:22px;min-width:30px;text-align:right}
.hudbar .us{background:linear-gradient(90deg,#d95b12,#f28a2e)}
.hudbar .them{background:linear-gradient(90deg,#163a6b,#235aa0)}
.hudbar .qt{background:#e9e4da;color:#1a1a1a;font-family:'Noto Sans KR';font-size:11px;font-weight:900;padding:3px 8px;display:flex;flex-direction:column;justify-content:center;line-height:1.2;white-space:nowrap}
.hudbar .qt small{font-weight:500;font-size:10px;color:#555}
.hudbar .clk{background:#b0141c;color:#ffd9d9;font-size:24px;min-width:48px;text-align:center;padding:2px 8px;display:flex;align-items:center;justify-content:center}
.hudbar .clk.low{background:#ff2a35;color:#fff}
.cover{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:16px;z-index:5}
.cover.on{display:flex}
.cover .box{background:rgba(21,23,29,.95);border:1px solid var(--line);border-radius:18px;padding:18px;max-width:380px;width:100%;text-align:center;max-height:100%;overflow:auto}
.cover .box h4{font-family:'Black Han Sans';font-weight:400;font-size:22px;margin-bottom:6px}
.cover .box p{font-size:13px;line-height:1.6;color:var(--dim);margin-bottom:6px}
.cover .box p b{color:var(--ink)}
.cover .box .btn{margin-top:8px}
.passm{display:grid;gap:8px;text-align:left}
.passm button{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px}
.passm button span{text-align:left}
.passm button small{display:block;font-weight:400;color:var(--dim);font-size:11px;margin-top:2px}
.passm button em{font-style:normal;font-size:11px;padding:3px 7px;border-radius:99px;background:#0e1015;white-space:nowrap}
.passm button:active{border-color:var(--org)}
.dock{position:absolute;left:0;right:0;bottom:0;z-index:4;padding:6px 8px calc(env(safe-area-inset-bottom) + 8px);
  background:linear-gradient(180deg,rgba(7,8,11,0),rgba(7,8,11,.75) 35%);display:flex;flex-direction:column;align-items:center;pointer-events:none}
.calls{width:100%;max-width:560px;display:grid;grid-template-columns:repeat(5,1fr);gap:6px;pointer-events:auto}
.calls button{background:rgba(40,44,58,.82);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:5px 2px;font-size:11px;font-weight:700;line-height:1.25;min-height:54px;backdrop-filter:blur(4px)}
.calls button b{display:block;font-family:'Black Han Sans';font-weight:400;font-size:19px}
.calls button small{display:block;font-weight:500;color:#b8bdc9;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.calls button.ball{border-color:var(--gold);color:var(--gold)}
.calls button.ord{border-color:var(--blue)}
.calls button.ord small{color:#bfe0ff}
.calls button:disabled{opacity:.45}
.chint{width:100%;max-width:560px;font-size:11px;color:#c3c8d3;text-align:center;padding-bottom:6px;line-height:1.4;text-shadow:0 1px 3px #000}
.chint b{color:#fff}
.hub{position:absolute;inset:0;z-index:8;background:radial-gradient(ellipse at top,#1a2340,#07080b 70%);display:none;overflow:auto;padding:calc(env(safe-area-inset-top) + 10px) 10px 14px}
.hub.on{display:block}
.hwrap{display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:10px;max-width:1100px;margin:0 auto}
@media (max-aspect-ratio:1/1){.hwrap{grid-template-columns:1fr}}
.hcol{display:flex;flex-direction:column;gap:10px;min-width:0}
.hcard{background:rgba(21,23,29,.92);border:1px solid var(--line);border-radius:14px;padding:12px}
.hcard h3{font-family:'Black Han Sans';font-weight:400;font-size:17px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.hcard h3 small{font-family:'Noto Sans KR';font-size:11px;color:var(--dim)}
.pts{font-size:13px;color:var(--dim);margin-bottom:8px}.pts b{font-family:'Black Han Sans';font-weight:400;font-size:24px;color:var(--gold);margin-left:6px}
.trow{display:grid;grid-template-columns:62px 1fr 26px 64px;gap:6px;align-items:center;font-size:12px;margin-bottom:6px}
.trow i{height:7px;background:var(--panel2);border-radius:9px;overflow:hidden}.trow i u{display:block;height:100%;background:var(--org)}
.trow em{font-style:normal;font-weight:900;text-align:right}
.trow button,.pb button{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:4px 6px;font-size:11px;font-weight:900;color:var(--green)}
.trow button small{color:var(--dim);font-weight:400}
.trow button:disabled,.pb button:disabled{opacity:.35}
.hn{font-size:11px;color:var(--dim);margin-top:6px;line-height:1.5}
.opp{display:flex;justify-content:space-between;font-size:14px}.opp span{color:var(--dim);font-size:12px}
.sty{background:var(--panel2);border-radius:10px;padding:8px 10px;margin-top:8px;font-size:13px}.sty small{color:var(--dim);font-size:11px;line-height:1.5}
.hcard .btn{margin-top:10px}
.pbook{display:grid;gap:6px}
.pb{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--panel2);border-radius:10px;padding:7px 9px}
.pb b{font-size:13px}.pb i{font-style:normal;font-size:10px;color:var(--gold);margin-left:6px}
.pb small{display:block;font-size:10.5px;color:var(--dim);line-height:1.4;margin-top:2px}
.pb em{font-style:normal;font-size:11px;color:#bfe0ff;white-space:nowrap}
.pb.lock{opacity:.75}
.lad{display:grid;gap:4px}
.lad div{display:grid;grid-template-columns:22px 1fr;gap:0 6px;background:var(--panel2);border-radius:8px;padding:5px 8px;font-size:12px;border:1px solid transparent}
.lad div small{grid-column:2;color:var(--dim);font-size:10.5px}
.lad div.cur{border-color:var(--org)}.lad div.done{opacity:.5}
.plays{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:8px}
.plays button{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:9px 8px;text-align:left;position:relative}
.plays button b{font-size:13px}.plays button i{position:absolute;top:6px;right:8px;font-style:normal;color:var(--gold);font-size:12px}
.plays button small{display:block;color:var(--dim);font-size:10.5px;margin-top:2px}
.plays button:active{border-color:var(--org)}
.cover .box{max-width:460px}
.dockrow{display:flex;align-items:flex-end;gap:10px;width:100%;max-width:680px;justify-content:center}
.shoot{pointer-events:auto;flex:none;width:76px;height:76px;border-radius:50%;border:3px solid rgba(255,255,255,.35);background:radial-gradient(circle at 35% 30%,#ffb347,#e8661c 60%,#a8410a);
  color:#1a0d00;font-family:'Black Han Sans';font-size:22px;box-shadow:0 6px 18px rgba(0,0,0,.5);opacity:.45;touch-action:none;margin-bottom:-4px}
.shoot.ready{opacity:1}.shoot.hold{transform:scale(.92);border-color:#7dffb4;box-shadow:0 0 0 6px rgba(125,255,180,.25),0 6px 18px rgba(0,0,0,.5)}
@media (max-height:460px){.calls button{min-height:44px;padding:3px 2px}.calls button b{font-size:16px}.shoot{width:64px;height:64px;font-size:19px}.chint{display:none}}
</style>
</head>
<body>
<div class="court" id="court">
  <div class="cstage" id="cStage"><canvas id="cv"></canvas><div class="slowtag">SLOW</div>
    <div class="hudbar"><div class="tm us"><span>PLM</span><b id="sUs">0</b></div><div class="tm them"><span id="sOppN">OPP</span><b id="sThem">0</b></div>
      <div class="qt" id="cTitle"></div><div class="clk" id="cClock">12</div></div>
    <div class="dock"><div class="chint" id="cHint"></div><div class="dockrow"><div class="calls" id="cCalls"></div><button class="shoot" id="shootBtn">슛</button></div></div>
    <div class="cover" id="cCover"><div class="box" id="cBox"></div></div></div>
  <div class="hub" id="hub"></div>
</div>

<script>
'use strict';
/* ---------- utils ---------- */
const $=s=>document.querySelector(s);
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const pick=a=>a[Math.floor(Math.random()*a.length)];
function binom(n,p){let k=0;for(let i=0;i<n;i++)if(Math.random()<p)k++;return k}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- profile (saved) ---------- */
const KEY='playmaker-v2';
const STYLES={
  drop:{n:'드롭 수비',ic:'⬇️',d:'빅맨이 골밑으로 내려앉는다. 롤은 막히지만 팝·풀업 점퍼가 빈다.'},
  switch:{n:'스위치 수비',ic:'🔀',d:'스크린마다 수비를 바꾼다. 스크린 효과가 약하지만 미스매치·백도어에 약하다.'},
  blitz:{n:'블리츠 수비',ic:'⚡',d:'볼 핸들러에게 더블팀. 롤맨과 반대편 슈터가 빈다.'},
};
const OPP_NAMES=['하버타운 바이퍼스','노스필드 울프팩','썬밸리 코메츠','스톤브릿지 바이슨즈','레드캐니언 피닉스','아이언베이 타이탄즈','골든포트 스톰','크라운시티 나이츠'];
// court spots
const SP={top:[7.5,9],lw:[2.5,6.2],rw:[12.5,6.2],lc:[.6,1.5],rc:[14.4,1.5],le:[5.3,5.9],re:[9.7,5.9],lb:[5.6,2.4],rb:[9.4,2.4],ls:[4.6,8.4],rs:[10.4,8.4]};
// playbook: f = formation (spot per player 1..5), s = script steps, r = reads
const PLAYS={
  free:{n:'프리 오펜스',ic:'🆓',cost:0,d:'정해진 작전 없이 자유롭게. 동료를 탭해 직접 지시.',f:['top','rw','lw','lb','re'],s:[],r:[],good:[]},
  pnr:{n:'픽앤롤',ic:'🔁',cost:0,d:'5번이 1번에게 스크린 후 림으로 롤. 2·3번은 코너에서 대기.',f:['top','rc','lc','ls','re'],
    s:[[0,4,{type:'screen',target:0,after:'roll'}]],r:[[4,'롤 → 랍 앨리웁'],[1,'코너 3점'],[2,'반대 코너 3점']],good:['blitz']},
  iso:{n:'아이솔레이션',ic:'🧹',cost:0,d:'4명이 코너·윙으로 넓게 벌려 1번이 1대1. 도움 수비가 오면 킥아웃.',f:['top','rc','lc','lw','rw'],
    s:[],iso:true,r:[[0,'1대1 돌파·점퍼'],[1,'킥아웃 코너 3점']],good:['switch']},
  backdoor:{n:'백도어 컷',ic:'✂️',cost:0,d:'3번이 공을 받으러 나오는 척하다 림으로 컷. 5번은 하이포스트.',f:['top','lw','rw','lb','re'],
    s:[[0,2,{type:'come'}],[1.1,2,{type:'cut'}]],r:[[2,'백도어 레이업·랍'],[4,'하이포스트']],good:['switch','blitz']},
  pop:{n:'픽앤팝',ic:'🎯',cost:4,d:'4번이 스크린 후 3점 라인으로 팝. 드롭 수비의 천적.',f:['top','rc','lc','ls','rb'],
    s:[[0,3,{type:'screen',target:0,after:'pop'}]],r:[[3,'팝 3점'],[0,'풀업 점퍼']],good:['drop']},
  horns:{n:'호른스',ic:'🐂',cost:5,d:'4·5번이 양쪽 엘보. 5번은 스크린 후 롤, 4번은 3점 라인으로.',f:['top','rc','lc','le','re'],
    s:[[0,4,{type:'screen',target:0,after:'roll'}],[.4,3,{type:'spot'}]],r:[[4,'롤 → 앨리웁'],[3,'팝 3점'],[0,'풀업 점퍼']],good:['drop','blitz']},
  stagger:{n:'스태거 스크린',ic:'🧱',cost:6,d:'5번·4번이 연속으로 2번에게 오프볼 스크린 → 2번이 3점 라인으로.',f:['top','rb','lc','re','le'],
    s:[[0,4,{type:'screen',target:1,after:'stay'}],[.7,3,{type:'screen',target:1,after:'stay'}]],r:[[1,'플레어 3점'],[2,'반대 코너']],good:['drop','blitz']},
  spain:{n:'스페인 픽앤롤',ic:'🇪🇸',cost:7,d:'5번 픽앤롤 + 2번이 5번의 수비에게 백스크린 후 3점 라인으로. 스위치를 깨는 작전.',f:['top','ls','lc','rc','re'],
    s:[[0,4,{type:'screen',target:0,after:'roll'}],[1.1,1,{type:'screen',target:4,after:'pop'}]],r:[[4,'롤 → 앨리웁'],[1,'팝 3점']],good:['switch','blitz']},
};
const PLAY_ORDER=['pnr','iso','backdoor','pop','horns','stagger','spain','free'];
let P=null;
function newProfile(){return{v:2,season:1,stage:0,pts:0,w:0,l:0,titles:0,team:{sht:60,pas:60,spd:60},unlocked:PLAY_ORDER.slice(),stats:{},opps:makeOpps(1)}}
function makeOpps(season){const st=['drop','switch','blitz'];return OPP_NAMES.map((n,i)=>({n,str:72+i*1.9+(season-1)*4,style:i<3?st[i]:pick(st)}))}
function loadP(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.v===2){s.unlocked=PLAY_ORDER.slice();return s}}catch(e){}return newProfile()}
function saveP(){try{localStorage.setItem(KEY,JSON.stringify(P))}catch(e){}}
const teamAvg=()=>(P.team.sht+P.team.pas+P.team.spd)/3;
const attr=(i,k)=>{const t=P.team,v=k==='pas'?t.pas:k==='drv'?t.spd:t.sht;return v+(i===0?3:0)};
const playRate=id=>{const s=P.stats[id];return s&&s.n?`${s.ok}/${s.n} 득점`:'기록 없음'};

/* ---------- hub (between games) ---------- */
function showHub(){
  const opp=P.opps[P.stage],st=STYLES[opp.style];
  const fit=PLAY_ORDER.filter(k=>PLAYS[k].good.includes(opp.style));
  $('#hub').innerHTML=`<div class="hwrap">
   <div class="hcol"><div class="hcard"><h3>🏀 PLAYMAKERS <small>시즌 ${P.season} · ${P.w}승 ${P.l}패${P.titles?` · 🏆${P.titles}`:''}</small></h3>
     <div class="pts">작전 포인트 <b>${P.pts}</b></div>
     ${[['sht','🎯 슈팅'],['pas','🤝 패스'],['spd','⚡ 스피드']].map(([k,n])=>`<div class="trow"><span>${n}</span><i><u style="width:${P.team[k]}%"></u></i><em>${P.team[k]}</em>
       <button data-up="${k}" ${P.pts<2||P.team[k]>=90?'disabled':''}>+2 <small>(2P)</small></button></div>`).join('')}
     <p class="hn">작전 포인트로 팀을 훈련하세요. 이기면 +4P, 지면 +1P, 15점 이상 직접 득점하면 +1P</p></div>
     <div class="hcard"><h3>📋 다음 상대 스카우팅</h3><div class="opp"><b>${esc(opp.n)}</b><span>전력 ${Math.round(opp.str)}</span></div>
       <div class="sty">${st.ic} <b>${st.n}</b><br><small>${st.d}</small></div>
       <p class="hn">추천 작전: ${fit.map(k=>`${PLAYS[k].ic} ${PLAYS[k].n}`).join(' · ')}</p>
       <button class="btn pri" id="hGo">경기 시작 ▶</button></div></div>
   <div class="hcol"><div class="hcard"><h3>📖 플레이북 <small>모든 작전 사용 가능 · 상대에 맞춰 골라라</small></h3><div class="pbook">
     ${PLAY_ORDER.map(k=>{const p=PLAYS[k],on=P.unlocked.includes(k);return`<div class="pb ${on?'':'lock'}"><div><b>${p.ic} ${p.n}</b>${p.good.includes(opp.style)?'<i>★ 추천</i>':''}<small>${p.d}</small></div>
       <em>${playRate(k)}</em></div>`}).join('')}</div></div></div>
   <div class="hcol"><div class="hcard"><h3>🏆 시즌 ${P.season} 일정 <small>${P.stage}/${P.opps.length}</small></h3><div class="lad">
     ${P.opps.map((o,i)=>`<div class="${i<P.stage?'done':i===P.stage?'cur':''}"><b>${i<P.stage?'✅':i===P.stage?'▶':i+1}</b><span>${esc(o.n)}</span><small>${STYLES[o.style].ic} ${STYLES[o.style].n.replace(' 수비','')} · ${Math.round(o.str)}</small></div>`).join('')}</div>
     <button class="btn" id="hReset" style="margin-top:10px;font-size:12px;padding:8px">처음부터 다시</button></div></div></div>`;
  $('#hub').classList.add('on');
  document.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{const k=b.dataset.up;if(P.pts<2)return;P.pts-=2;P.team[k]=Math.min(90,P.team[k]+2);saveP();showHub()});
  $('#hGo').onclick=()=>{$('#hub').classList.remove('on');startMatch()};
  $('#hReset').onclick=()=>{if(confirm('시즌·포인트·플레이북을 모두 초기화할까요?')){P=newProfile();saveP();showHub()}};
}

/* ---------- match flow ---------- */
let M=null;
const short=n=>n.split(' ').slice(-1)[0];
function simPts(off,def){const p=clamp(.47+(off-def)*.011,.3,.66),r=Math.random();
  if(r<p)return Math.random()<.34?3:2;if(r<p+.07)return binom(2,.74);return 0}
function sim(n){for(let i=0;i<n;i++){M.us+=simPts(M.ms,M.os);M.them+=simPts(M.os,M.ms)}M.them+=Math.random()<.5?simPts(M.os,M.ms):0}
function startMatch(){
  const opp=P.opps[P.stage];
  M={opp:opp.n,style:opp.style,os:opp.str,ms:72+(teamAvg()-60)*.6,us:0,them:0,q:1,steps:[],outs:[],
     L:{pts:0,ast:0,tov:0,fga:0,fgm:0,tpa:0,tpm:0,fta:0,ftm:0},clutch:null,used:{}};
  for(let q=1;q<=4;q++){
    for(let k=0;k<3;k++){M.steps.push(d=>{M.q=q;sim(ri(5,6));d()});M.steps.push(d=>possStep(q,k,d))}
    M.steps.push(d=>{sim(ri(1,2));d()});
    if(q<4)M.steps.push(d=>quarterEnd(q,d));
  }
  M.steps.push(clutchStep);
  M.steps.push(()=>finishMatch());
  sizeCourt();if(!raf){lastT=performance.now();raf=requestAnimationFrame(frame)}
  nextStep();
}
function nextStep(){const s=M&&M.steps.shift();if(s)s(nextStep)}
function applyOut(o){M.outs.push(o);for(const k in M.L)M.L[k]+=o[k]||0;M.us+=o.pts;
  if(o.play){const s=P.stats[o.play]||(P.stats[o.play]={n:0,ok:0,pts:0});s.n++;s.pts+=o.pts;if(o.pts>0)s.ok++;
    const u=M.used[o.play]||(M.used[o.play]={n:0,pts:0});u.n++;u.pts+=o.pts}}
function possStep(q,k,done){
  playPoss({clock:12,title:`${q}쿼터 · 공격 ${k+1}/3`,sub:`${ri(0,11-k*4)}:${String(ri(0,59)).padStart(2,'0')} 남음`,first:q===1&&k===0},o=>{applyOut(o);done()});
}
function quarterEnd(q,done){
  setScore();
  cover(`<h4>${q}쿼터 종료</h4><p style="font-size:22px"><b>${M.us} : ${M.them}</b></p><p>${M.us>M.them?'리드를 지키자!':M.us<M.them?'작전을 바꿔 추격하자.':'팽팽한 승부!'}</p>
    <button class="btn pri" id="cQ">${q+1}쿼터 시작 ▶</button>`);
  $('#cQ').onclick=()=>{cover(null);done()};
}
function clutchStep(done){
  const gap=M.them-M.us;
  if(gap<0||gap>3)return done();
  const sec=+rnd(6,9).toFixed(1);
  playPoss({clock:sec,clutch:true,title:'⏱ 마지막 공격!',sub:`종료 ${sec}초 전 · ${gap?`${gap}점 차 열세`:'동점'}`},o=>{applyOut(o);M.clutch=o;done()});
}
function finishMatch(){
  G=null;CB=null;
  let ot=false;
  if(M.us===M.them){ot=true;while(M.us===M.them){M.us+=ri(6,14);M.them+=ri(6,14)}}
  const win=M.us>M.them,L=M.L,gain=(win?4:1)+(L.pts>=15?1:0);
  P.pts+=gain;win?P.w++:P.l++;let champ=false;
  if(win){P.stage++;if(P.stage>=P.opps.length){champ=true;P.titles++;P.season++;P.stage=0;P.opps=makeOpps(P.season)}}
  saveP();
  $('#cTitle').innerHTML='경기 종료<small>FINAL</small>';setScore();renderCalls(true);
  const used=Object.entries(M.used).sort((a,b)=>b[1].n-a[1].n).map(([k,u])=>`${PLAYS[k].ic} ${PLAYS[k].n} ${u.n}회 · ${u.pts}점`).join('<br>');
  cover(`<h4 style="color:${win?'var(--green)':'var(--red)'}">${champ?'🏆 시즌 우승!!':win?'승리!':'패배'}${ot?' (연장)':''}</h4>
    <p style="font-size:24px"><b>${M.us} : ${M.them}</b></p>
    <div class="statbox"><div><b>${L.pts}</b><span>직접 득점</span></div><div><b>${L.ast}</b><span>어시스트</span></div><div><b>${L.tov}</b><span>턴오버</span></div><div><b>${L.fgm}/${L.fga}</b><span>야투</span></div></div>
    <p class="small" style="text-align:left">${used||''}</p>
    <p class="small">작전 포인트 <b>+${gain}P</b>${win?'':' · 같은 상대에게 다시 도전'}</p>
    <button class="btn pri" id="cHub">팀 관리로 ▶</button>`);
  $('#cHub').onclick=()=>{cover(null);M=null;showHub()};
}

/* ---------- court engine ---------- */
const CW=15,CH=14,HOOP={x:7.5,y:1.6};
const PORDER=['PG','SG','SF','PF','C'];
const SPOTS3=[{x:.6,y:1.4},{x:14.4,y:1.4},{x:1.9,y:6.4},{x:13.1,y:6.4},{x:4.4,y:8.4},{x:10.6,y:8.4},{x:7.5,y:9.2}];
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const unit=(a,b)=>{const dx=b.x-a.x,dy=b.y-a.y,l=Math.hypot(dx,dy)||1;return{x:dx/l,y:dy/l}};
function segDist(p,a,b){const dx=b.x-a.x,dy=b.y-a.y,l2=dx*dx+dy*dy||1,t=clamp(((p.x-a.x)*dx+(p.y-a.y)*dy)/l2,0,1);return{d:Math.hypot(a.x+dx*t-p.x,a.y+dy*t-p.y),t}}
const isThree=p=>Math.abs(p.x-HOOP.x)>=6.6||dist(p,HOOP)>6.75;
const defOf=i=>G.df.find(d=>d.man===i);
let G=null,CB=null,raf=0,lastT=0;

function playPoss(opt,cb){CB=cb;startPoss(opt)}
function possDone(out){const f=CB;CB=null;G=null;f&&f(out)}
function cover(html){const c=$('#cCover');if(html==null){c.classList.remove('on');return}$('#cBox').innerHTML=html;c.classList.add('on')}

function setFormation(id){
  const g=G,f=PLAYS[id].f;
  g.of.forEach((o,i)=>{const s=SP[f[i]];o.x=o.tx=s[0]+rnd(-.2,.2);o.y=o.ty=s[1]+rnd(-.2,.2);o.home={x:o.x,y:o.y};clearOrder(o)});
  g.df.forEach(d=>{const m=g.of[d.man],u=unit(m,HOOP);d.x=d.lx=m.x+u.x*1.1;d.y=d.ly=m.y+u.y*1.1});
}
function startPoss(opt){
  const of=PORDER.map((pos,i)=>({i,pos,num:i+1,x:7.5,y:7,tx:7.5,ty:7,home:{x:7.5,y:7},me:i===0,order:null,shootT:0}));
  const df=of.map(o=>({i:o.i,man:o.i,x:7.5,y:6,lx:7.5,ly:6,stuck:0,hedge:0,drop:0,slow:0}));
  G={opt,of,df,meI:0,oppF:.85+clamp((M.os-70)/18,0,1.4)*.18,style:M.style,
    clock:opt.clock,time:0,holder:0,flight:null,drag:null,fx:[],ended:false,paused:true,menu:false,
    lastPass:null,helper:-1,ballAt:null,sig:'',playId:null,script:[],playT:0,iso:false,
    out:{pts:0,fga:0,fgm:0,tpa:0,tpm:0,fta:0,ftm:0,ast:0,tov:0,desc:'',play:null}};
  setFormation('free');
  $('#cTitle').innerHTML=`${esc(opt.title)}<small>${esc(opt.sub)}</small>`;
  setScore();playSelect();
}
function playSelect(){
  const g=G,opt=g.opt,st=STYLES[g.style];
  cover(`<h4>${esc(opt.title)}</h4>
    <p>${opt.clutch?`<b style="color:var(--red)">${esc(opt.sub)}</b> — 마지막 작전을 골라라!`:`상대 수비: <b>${st.ic} ${st.n}</b> · ${st.d}`}</p>
    ${opt.first?'<p class="small">작전을 고르면 팀이 자동으로 움직인다. ①② 표시가 <b>초록색</b>이면 그 선수가 오픈 — 공 가진 선수를 그쪽으로 드래그해 패스. 슛은 <b>슛 버튼을 길게 눌러 게이지가 초록 구간일 때 떼기</b>(PC는 스페이스바).</p>':''}
    <div class="plays">${P.unlocked.slice().sort((a,b)=>PLAY_ORDER.indexOf(a)-PLAY_ORDER.indexOf(b)).map(k=>{const p=PLAYS[k];
      return`<button data-play="${k}"><b>${p.ic} ${p.n}</b>${p.good.includes(g.style)?'<i>★</i>':''}<small>${playRate(k)}</small></button>`}).join('')}</div>`);
  document.querySelectorAll('#cBox [data-play]').forEach(b=>b.onclick=()=>{cover(null);runPlay(b.dataset.play)});
}
function runPlay(id){
  const g=G,p=PLAYS[id];g.playId=id;g.out.play=id;g.iso=!!p.iso;
  setFormation(id);g.script=p.s.map(s=>({t:s[0],who:s[1],ord:{...s[2]},done:false}));g.playT=0;
  fx(`${p.ic} ${p.n}`,CW/2,8,'#ffd166',1.4);
  setTimeout(()=>{if(G===g){if(g.menu)g.wasPaused=false;else g.paused=false}},500);
}
function frame(t){
  raf=requestAnimationFrame(frame);
  const dt=Math.min(.05,(t-lastT)/1000);lastT=t;
  if(!G)return;
  if(!G.paused)step(dt*slowMo());else for(const f of G.fx)f.t+=dt*.5;
  draw(dt);hud();
}
function slowMo(){const g=G;if(!g||g.ended)return 1;if(g.drag)return .2;if(g.holder!=null)return .3;
  if(g.flight&&g.flight.kind==='pass'&&g.flight.t/g.flight.dur>.5)return .5;return 1}
function moveTo(e,tx,ty,sp,dt){const dx=tx-e.x,dy=ty-e.y,l=Math.hypot(dx,dy);if(l<.01)return;const s=Math.min(l,sp*dt);e.x+=dx/l*s;e.y+=dy/l*s}
function contest(o){const f=unit(o,HOOP);let m=9;for(const d of G.df){const l=dist(d,o)||.01,front=((d.x-o.x)*f.x+(d.y-o.y)*f.y)/l;
  const v=l+(d.stuck>0?.6:0)+(front<.35?1.3:0);if(v<m)m=v}return m}
function fx(t,x,y,col,size){G.fx.push({t:0,txt:t,x,y,col:col||'#fff',size:size||1})}
function step(dt){
  const g=G;g.time+=dt;
  for(const f of g.fx)f.t+=dt;g.fx=g.fx.filter(f=>f.t<1.4);
  for(const o of g.of)if(o.shootT>0)o.shootT-=dt;
  // play script
  if(!g.ended&&g.script.length){g.playT+=dt;for(const s of g.script){if(s.done||s.t>g.playT)continue;s.done=true;
    const o=g.of[s.who];if(g.holder===s.who)continue;
    if(s.ord.type==='screen'&&s.ord.target===0&&g.holder!==0)continue;giveOrder(s.who,{...s.ord})}}
  if(!g.ended){g.clock=Math.max(0,g.clock-dt);
    if(g.clock<=0&&!(g.flight&&g.flight.kind==='shot')){
      if(g.holder!=null||(g.flight&&g.flight.kind==='pass'))g.out.tov++;
      endPoss(g.opt.clutch?'⏱ 버저가 울렸다… 슛을 던지지 못했다.':'⏱ 공격 시간 초과! (샷클락 바이얼레이션)','#ff5a5f')}}
  const H=g.holder!=null?g.of[g.holder]:null;
  for(const o of g.of){const has=g.holder===o.i;
    const sp=4.3*(.85+attr(o.i,'drv')/300)*(has?.92:1)*(o.rolling||o.cutting?1.1:1);
    moveTo(o,o.tx,o.ty,sp,dt)}
  g.helper=-1;
  if(H&&dist(H,HOOP)<3.8){let b=g.iso?3:6;for(const d of g.df){if(d.man===H.i||d.stuck>0)continue;const v=dist(d,H);if(v<b){b=v;g.helper=d.i}}}
  for(const d of g.df){
    if(d.hedge>0)d.hedge-=dt;if(d.drop>0)d.drop-=dt;if(d.slow>0)d.slow-=dt;
    if(d.stuck>0){d.stuck-=dt;continue}
    const m=g.of[d.man];let tx,ty;
    if(d.hedge>0&&H&&H.i!==d.man){const u=unit(H,HOOP);tx=H.x+u.x*1.1;ty=H.y+u.y*1.1}
    else if(d.drop>0){const u=unit(HOOP,m);tx=HOOP.x+u.x*1.4;ty=HOOP.y+u.y*1.4}
    else if(d.i===g.helper){const u=unit(H,HOOP);tx=H.x+u.x*.95;ty=H.y+u.y*.95}
    else{const on=H&&H.i===m.i,u=unit(m,HOOP),sh=isThree(m),gap=on?1.25:sh?1.3:g.iso?1.4:1.7;tx=m.x+u.x*gap;ty=m.y+u.y*gap;
      if(!on&&H&&!g.iso&&!sh){tx+=(H.x-m.x)*.12;ty+=(H.y-m.y)*.12}}
    const r=Math.min(1,dt*4.5);d.lx+=(tx-d.lx)*r;d.ly+=(ty-d.ly)*r;
    moveTo(d,d.lx,d.ly,3.3*g.oppF*(d.hedge>0||d.i===g.helper?1.08:1)*(d.slow>0?.8:1),dt);
  }
  separate();
  if(!g.ended)updOrders(dt);
  if(g.flight)updFlight(dt);
  if(!g.ended&&H&&g.holder===H.i)stealCheck(dt,H);
}
function anchored(e,isD){return isD?e.stuck>0:!!(e.order&&e.order.type==='screen'&&e.order.phase==='set')}
function separate(){
  const g=G,all=[...g.of.map(o=>[o,false]),...g.df.map(d=>[d,true])];
  for(let a=0;a<all.length;a++)for(let b=a+1;b<all.length;b++){
    const[A,ad]=all[a],[B,bd]=all[b],dx=B.x-A.x,dy=B.y-A.y,l=Math.hypot(dx,dy);if(l>=.72||l<1e-4)continue;
    const ov=.72-l,aa=anchored(A,ad),ba=anchored(B,bd);if(aa&&ba)continue;const fa=aa?0:ba?1:.5;
    A.x-=dx/l*ov*fa;A.y-=dy/l*ov*fa;B.x+=dx/l*ov*(1-fa);B.y+=dy/l*ov*(1-fa)}
  for(const[e]of all){e.x=clamp(e.x,.3,CW-.3);e.y=clamp(e.y,.3,CH-.3)}
}
function stealCheck(dt,H){
  const g=G;if(dist(H,{x:H.tx,y:H.ty})<.25)return;
  for(const d of g.df){if(d.stuck>0)continue;
    if(dist(d,H)<.82&&Math.random()<dt*.12*(1.2-attr(H.i,'drv')/100)*g.oppF*(d.hedge>0?1.6:1)){
      g.out.tov++;g.holder=null;g.ballAt={x:d.x,y:d.y};fx('스틸!',d.x,d.y,'#ff5a5f');return endPoss(`🙅 ${H.num}번이 드리블하다 스틸당했다!`,'#ff5a5f')}}
}

/* --- orders (작전 지시) --- */
const ORD_NAME={screen:'스크린',cut:'림으로 컷',spot:'3점 라인으로',come:'공 받으러'};
function bestSpot(o){
  const g=G;let best=null,bv=-1;
  for(const s of SPOTS3){if(g.of.some(p=>p!==o&&dist(p,s)<2.2))continue;
    const open=Math.min(...g.df.map(d=>dist(d,s))),v=open-dist(o,s)*.25;if(v>bv){bv=v;best=s}}
  return best||{x:o.x<HOOP.x?1.9:13.1,y:6.4};
}
function clearOrder(o){o.order=null;o.cutting=o.rolling=o.popping=false}
function giveOrder(i,ord){
  const g=G,o=g.of[i],D=defOf(i);clearOrder(o);o.order=ord;
  if(ord.type==='cut'){o.cutting=true;o.tx=HOOP.x+(o.x<HOOP.x?-1.1:1.1);o.ty=2.2;
    D.stuck=Math.max(D.stuck,g.style==='switch'||g.style==='blitz'?1.25:.6);ord.t=2.6;fx('컷!',o.x,o.y,'#5aa9ff')}
  else if(ord.type==='spot'){const s=bestSpot(o);o.tx=s.x;o.ty=s.y;o.home={x:s.x,y:s.y};ord.t=2.4;fx('3점 라인!',o.x,o.y,'#5aa9ff')}
  else if(ord.type==='come'){const h=g.holder!=null?g.of[g.holder]:{x:7.5,y:9};const u=unit(h,o),p={x:clamp(h.x+u.x*3.2,.6,CW-.6),y:clamp(h.y+u.y*3.2,.6,CH-.6)};
    o.tx=p.x;o.ty=p.y;o.home=p;D.stuck=Math.max(D.stuck,.35);ord.t=1.8;fx('공 줘!',o.x,o.y,'#5aa9ff')}
  else if(ord.type==='screen'){ord.phase='go';ord.t=4;fx(`스크린 → ${g.of[ord.target].num}번`,o.x,o.y,'#ffd166')}
}
function updOrders(dt){
  const g=G;
  for(const o of g.of){const ord=o.order;if(!ord)continue;ord.t-=dt;
    if(ord.type==='cut'){if(ord.t<=0){o.cutting=false;const c=dist(o,{x:.6,y:1.4})<dist(o,{x:14.4,y:1.4})?{x:.6,y:1.4}:{x:14.4,y:1.4};
      if(g.holder!==o.i){o.tx=c.x;o.ty=c.y;o.home=c}o.order=null}continue}
    if(ord.type!=='screen'){if(ord.t<=0)o.order=null;continue}
    const T=g.of[ord.target],D=defOf(ord.target);
    if(ord.phase==='go'){
      const v=unit(T,D),n={x:-v.y,y:v.x},sg=((o.x-D.x)*n.x+(o.y-D.y)*n.y)>=0?1:-1,sp={x:D.x+n.x*sg*.75,y:D.y+n.y*sg*.75};
      o.tx=clamp(sp.x,.4,CW-.4);o.ty=clamp(sp.y,.4,CH-.4);
      if(dist(o,sp)<.45){ord.phase='set';ord.t=2.8;o.tx=o.x;o.ty=o.y;if(g.holder!==T.i)useScreen(o);else fx('스크린 세팅!',o.x,o.y,'#ffd166',.9)}
      else if(ord.t<=0){o.tx=o.home.x;o.ty=o.home.y;o.order=null}
    }else if(ord.phase==='set'){
      const moving=dist(T,{x:T.tx,y:T.ty})>.3;
      if(g.holder===T.i&&moving&&dist(T,o)<2.1)useScreen(o);
      else if(g.holder===T.i&&!moving&&(ord.wait=(ord.wait||0)+dt)>.7&&!g.drag){ // handler uses the screen automatically
        const u=unit(D,o),h=unit(o,HOOP);T.tx=clamp(o.x+u.x*1.8+h.x*.8,.5,CW-.5);T.ty=clamp(o.y+u.y*1.8+h.y*.8,.5,CH-.5)}
      else if(ord.t<=0){o.tx=o.home.x;o.ty=o.home.y;o.order=null}
    }else if(ord.t<=0){o.rolling=o.popping=false;o.order=null}
  }
}
// how the opponent's defensive style answers a screen
function useScreen(o){
  const g=G,ord=o.order,T=g.of[ord.target],D=defOf(ord.target),Ds=defOf(o.i),side=o.x<HOOP.x?-1:1,onBall=g.holder===T.i;
  ord.phase='after';ord.t=2.6;
  if(g.style==='switch'){
    D.stuck=.25;const a=D.man;D.man=Ds.man;Ds.man=a;Ds.slow=3;D.slow=0;
    fx('스위치!',D.x,D.y,'#ff9a9d',1.1);
  }else{
    D.stuck=g.style==='blitz'&&onBall?.6:1.25;fx('스크린!',D.x,D.y,'#ffd166',1.2);
    if(onBall){if(g.style==='drop'){Ds.drop=2.6;fx('드롭',Ds.x,Ds.y,'#ff9a9d')}else{Ds.hedge=g.style==='blitz'?2.3:1.1;if(g.style==='blitz')fx('더블팀!',Ds.x,Ds.y,'#ff9a9d',1.1)}}
  }
  if(!onBall){
    if(dist(T,HOOP)<4.6){T.tx=T.x<HOOP.x?3.2:11.8;T.ty=7.2;T.home={x:T.tx,y:T.ty};T.popping=true;fx('플레어!',T.x,T.y,'#5aa9ff')}
    else{T.order={type:'cut',t:2.4};T.cutting=true;T.tx=HOOP.x+(T.x<HOOP.x?-1.1:1.1);T.ty=2.3;fx('컬 컷!',T.x,T.y,'#5aa9ff')}}
  if(ord.after==='roll'){o.rolling=true;o.tx=HOOP.x+side*.8;o.ty=2.4;fx('롤!',o.x,o.y,'#5aa9ff')}
  else if(ord.after==='pop'){o.popping=true;o.tx=o.x<HOOP.x?3.1:11.9;o.ty=7.3;o.home={x:o.tx,y:o.ty};fx('팝!',o.x,o.y,'#5aa9ff')}
  else{o.tx=o.home.x;o.ty=o.home.y}
}

/* --- passing & shooting --- */
function passRisk(from,to){
  const g=G,a=g.of[from],b=g.of[to],pa=attr(from,'pas');let best=0,who=null,tt=0;
  for(const d of g.df){if(d.stuck>0)continue;const s=segDist(d,a,b);if(s.t<.08||s.t>.95||s.d>=1.05)continue;

function hud(){
  const el=$('#cClock'),v=G.clock;el.textContent=v<5?v.toFixed(1):Math.ceil(v);el.classList.toggle('low',v<4);
  $('#cStage').classList.toggle('slow',slowMo()<1&&!G.paused&&!G.ended);renderCalls();
  $('#shootBtn').classList.toggle('ready',G.holder!=null&&!G.ended&&!G.paused);$('#shootBtn').classList.toggle('hold',!!G.meter);
}
function ballPos(){
  const g=G;let bx,by,bh;
  if(g.flight){const f=g.flight,r=clamp(f.t/f.dur,0,1);
    if(f.kind==='pass'){const b=g.of[f.to];let ex=b.x,ey=b.y;if(f.over){ex=b.x+(b.x-f.sx)*.25;ey=b.y+(b.y-f.sy)*.25}
      bx=f.sx+(ex-f.sx)*r;by=f.sy+(ey-f.sy)*r;bh=1.1+(f.type==='lob'?Math.sin(Math.PI*r)*2.6:Math.sin(Math.PI*r)*.2)}
    else{bx=f.sx+(HOOP.x-f.sx)*r;by=f.sy+(HOOP.y-f.sy)*r;bh=f.block?2.3+Math.sin(Math.PI*r)*.4:2.3+(3.05-2.3)*r+Math.sin(Math.PI*r)*(1.3+f.dR*.14)}}
  else if(g.holder!=null){const h=g.of[g.holder],a=h.face||0;bx=h.x+Math.cos(a)*.18-Math.sin(a)*.3;by=h.y+Math.sin(a)*.18+Math.cos(a)*.3;
    bh=g.meter&&g.meter.i===g.holder?1.9:g.ended?1:.15+Math.abs(Math.sin(g.time*8))*.75}
  else if(g.ballAt){bx=g.ballAt.x;by=g.ballAt.y;bh=.12}
  else{bx=HOOP.x;by=HOOP.y;bh=.12}
  return{x:bx,y:by,h:bh};
}
function draw(dt){
  const g=G;if(!R||!g)return;const c=R.ctx,dpr=R.dpr,k=R.k,t=performance.now()/1000,PI=Math.PI;
  const b=ballPos();
  // camera: follow the ball, biased toward the rim, clamped to the floor
  const vw=R.w/k/2,up=(R.oy-R.top)/k,dn=(R.bot-R.oy)/k,tx=clamp(b.x,vw-2.2,CW+2.2-vw),ty=clamp(b.y-1.6,-.8+up,Math.max(-.8+up,CH+2.2-dn));
  const kk=Math.min(1,dt*3);R.cx+=((vw*2>=CW+4.4?CW/2:tx)-R.cx)*kk;R.cy+=(ty-R.cy)*kk;
  c.setTransform(1,0,0,1,0,0);c.fillStyle='#0b0d14';c.fillRect(0,0,R.w*dpr,R.h*dpr);c.setTransform(dpr,0,0,dpr,0,0);
  const F=R.floor,o0=proj(-F.L,-F.T,0);c.drawImage(F.c,o0.x,o0.y,F.c.width/F.s*k,F.c.height/F.s*k);
  // stanchion, backboard, rim
  const P=(x,y,h)=>proj(x,y,h);
  let q=P(HOOP.x-.65,-1.9,0);c.fillStyle='#232a5c';c.fillRect(q.x,q.y,1.3*k,1.1*k);
  q=P(HOOP.x-.9,1.2,0);c.fillStyle='rgba(0,0,0,.18)';c.fillRect(q.x,q.y,1.8*k,.12*k);
  q=P(HOOP.x-.9,1.2,3.42);c.fillStyle='rgba(255,255,255,.95)';c.fillRect(q.x,q.y-.06*k,1.8*k,.1*k);
  const rim=P(HOOP.x,HOOP.y,3.05);c.strokeStyle='#ff5a1a';c.lineWidth=Math.max(2,.05*k);c.beginPath();c.ellipse(rim.x,rim.y,.24*k,.2*k,0,0,2*PI);c.stroke();
  c.strokeStyle='rgba(255,255,255,.75)';c.lineWidth=1;c.beginPath();c.ellipse(rim.x,rim.y+.18*k,.17*k,.13*k,0,0,2*PI);c.stroke();
  if(g.ended&&g.out.pts&&g.time%1<.5){c.fillStyle='rgba(62,207,142,.25)';c.beginPath();c.arc(rim.x,rim.y,.6*k,0,2*PI);c.fill()}
  // players
  const people=[];
  g.of.forEach((o,i)=>{const H=g.holder!=null&&g.holder!==i?g.of[g.holder]:null,look=g.holder===i||!H?HOOP:H;
    o.face=Math.atan2(look.x-o.x,look.y-o.y);people.push({x:o.x,y:o.y,face:o.face,off:true,o})});
  g.df.forEach(d=>{const m=g.of[d.man];d.face=Math.atan2(m.x-d.x,m.y-d.y);people.push({x:d.x,y:d.y,face:d.face,off:false,d})});
  people.sort((a,b)=>a.y-b.y);
  const ho=g.holder!=null?g.of[g.holder]:null;
  if(ho){const p=P(ho.x,ho.y,0);R.spin+=dt*1.5;c.lineWidth=3;c.strokeStyle='rgba(0,0,0,.55)';c.beginPath();c.ellipse(p.x,p.y,.62*k,.62*k,0,0,2*PI);c.stroke();
    c.strokeStyle='#ffd166';for(let s=0;s<3;s++){c.beginPath();c.arc(p.x,p.y,.62*k,R.spin+s*2.1,R.spin+s*2.1+.6);c.stroke()}}
  for(const pp of people){const p=P(pp.x,pp.y,0);
    c.fillStyle='rgba(0,0,0,.28)';c.beginPath();c.ellipse(p.x+.08*k,p.y+.1*k,.42*k,.32*k,0,0,2*PI);c.fill()}
  for(const pp of people){
    const jump=pp.off&&pp.o.shootT>0?Math.sin(clamp(1-pp.o.shootT/.7,0,1)*PI)*.5:0,p=P(pp.x,pp.y,.9+jump),sc=1+jump*.25;
    const jersey=pp.off?'#f6f4ef':'#1f4e8c',trim=pp.off?'#e8661c':'#ff5a5f';
    c.save();c.translate(p.x,p.y);c.scale(sc,sc);c.rotate(-pp.face);
    // shoulders + arms
    c.fillStyle=pp.off?'#7a4a2c':'#6b4428';
    if(!pp.off){c.beginPath();c.ellipse(-.5*k,.12*k,.11*k,.11*k,0,0,2*PI);c.ellipse(.5*k,.12*k,.11*k,.11*k,0,0,2*PI);c.fill()}
    c.fillStyle=jersey;c.strokeStyle=trim;c.lineWidth=Math.max(1.5,.05*k);
    c.beginPath();c.ellipse(0,0,.4*k,.24*k,0,0,2*PI);c.fill();c.stroke();
    c.fillStyle='#4a2d1a';c.beginPath();c.arc(0,.03*k,.15*k,0,2*PI);c.fill();
    c.restore();
    const lp=P(pp.x,pp.y,.9);
    if(pp.off){const o=pp.o;c.font=`900 ${Math.max(11,.36*k)}px 'Black Han Sans',sans-serif`;c.textAlign='center';c.textBaseline='middle';
      c.lineWidth=3;c.strokeStyle='rgba(0,0,0,.6)';c.strokeText(o.num,lp.x,lp.y+.36*k);c.fillStyle=o.me?'#ffd166':'#e8661c';c.fillText(o.num,lp.x,lp.y+.36*k)}
    else if(pp.d.stuck>0){c.font=`${Math.max(12,.4*k)}px sans-serif`;c.textAlign='center';c.fillText('💫',lp.x,lp.y-.5*k)}
  }
  // ball
  const bg=P(b.x,b.y,0),bp=P(b.x,b.y,b.h),br=Math.max(5,(.13+b.h*.02)*k);
  c.fillStyle='rgba(0,0,0,.3)';c.beginPath();c.ellipse(bg.x,bg.y,br*.9,br*.6,0,0,2*PI);c.fill();
  c.fillStyle='#e8701f';c.beginPath();c.arc(bp.x,bp.y,br,0,2*PI);c.fill();c.strokeStyle='#2a1204';c.lineWidth=1.2;c.stroke();
  c.beginPath();c.moveTo(bp.x-br,bp.y);c.lineTo(bp.x+br,bp.y);c.moveTo(bp.x,bp.y-br);c.lineTo(bp.x,bp.y+br);c.stroke();
  overlay();
  drawMeter();
}
function overlay(){
  const g=G,c=R.ctx;
  const fs=13,txt=(s,x,y,px,col,wt)=>{c.font=`${wt||700} ${px}px 'Noto Sans KR',sans-serif`;c.textAlign='center';c.textBaseline='middle';
    c.lineWidth=3;c.strokeStyle='rgba(0,0,0,.65)';c.strokeText(s,x,y);c.fillStyle=col;c.fillText(s,x,y)};
  const ringAt=(x,y,h,r,col,lw,dash)=>{const p=proj(x,y,h);c.strokeStyle=col;c.lineWidth=lw;c.setLineDash(dash||[]);c.beginPath();c.arc(p.x,p.y,r*R.k,0,7);c.stroke();c.setLineDash([])};
  const ground=(a,b,col,dash)=>{const p=proj(a.x,a.y,0),q=proj(b.x,b.y,0);c.strokeStyle=col;c.lineWidth=2.5;c.setLineDash(dash||[]);c.beginPath();c.moveTo(p.x,p.y);c.lineTo(q.x,q.y);c.stroke();c.setLineDash([])};
  for(const o of g.of){const lab=ordLabel(o);if(!lab||g.ended)continue;if(dist(o,{x:o.tx,y:o.ty})>.4)ground(o,{x:o.tx,y:o.ty},'rgba(90,169,255,.8)',[6,5])}
  let guide=null;
  if(g.drag&&!g.ended&&g.holder!=null){const h=g.of[g.holder],t=dragTarget(g.drag);let col='rgba(255,255,255,.95)',lbl;
    const from=proj(h.x,h.y,.9),to={x:g.drag.sx,y:g.drag.sy};
    if(t.kind==='pass'){col='#5aa9ff';const o=g.of[t.to],sp=scrPt(o);if(sp.off){c.strokeStyle=col;c.lineWidth=3;c.beginPath();c.arc(sp.x,sp.y,20,0,7);c.stroke()}else ringAt(o.x,o.y,0,.75,col,3);lbl=`패스 → ${o.num}번`}
    else{lbl='드리블';ground(h,t,col,[8,6]);ringAt(t.x,t.y,0,.35,col,2)}
    if(t.kind!=='move'){c.strokeStyle=col;c.lineWidth=4;c.beginPath();c.moveTo(from.x,from.y);c.lineTo(to.x,to.y);c.stroke();
      const ang=Math.atan2(to.y-from.y,to.x-from.x);c.fillStyle=col;c.beginPath();c.moveTo(to.x,to.y);c.lineTo(to.x-14*Math.cos(ang-.45),to.y-14*Math.sin(ang-.45));c.lineTo(to.x-14*Math.cos(ang+.45),to.y-14*Math.sin(ang+.45));c.fill()}
    guide={lbl,col,x:g.drag.sx,y:g.drag.sy-34}}
  for(const d of g.df){if(d.hedge>0&&d.stuck<=0){const p=proj(d.x,d.y,2);txt(d.hedge>1.5?'더블팀':'헷지',p.x,p.y,fs-1,'#ff9a9d')}else if(d.drop>0){const p=proj(d.x,d.y,2);txt('드롭',p.x,p.y,fs-1,'#ff9a9d')}}
  for(const o of g.of){const lab=ordLabel(o),sp=scrPt(o,2);
    if(sp.off){c.fillStyle=g.holder===o.i?'rgba(255,209,102,.95)':'rgba(232,102,28,.92)';c.beginPath();c.arc(sp.x,sp.y,15,0,7);c.fill();c.strokeStyle='#fff';c.lineWidth=2;c.stroke();
      txt(String(o.num),sp.x,sp.y+1,13,'#1a0d00',900);if(lab&&!g.ended)txt(lab,sp.x,sp.y-24,fs-2,'#bfe0ff');continue}
    if(lab&&!g.ended)txt(lab,sp.x,sp.y,fs-1,'#bfe0ff')}
  if(g.playId&&!g.ended){PLAYS[g.playId].r.forEach(([w,lab],k)=>{const o=g.of[w],sp=scrPt(o,1.6);if(g.holder===w&&w!==0)return;
    const open=contest(o)>=2.1,bx=sp.x+(sp.off?0:.55*R.k),by=sp.y-(sp.off?30:.45*R.k);
    c.fillStyle=open?'#2fbf71':'rgba(40,44,58,.9)';c.beginPath();c.arc(bx,by,11,0,7);c.fill();c.strokeStyle=open?'#d6ffe8':'rgba(255,255,255,.5)';c.lineWidth=2;c.stroke();
    txt(String(k+1),bx,by+1,12,'#fff',900);if(open)txt(lab,bx,by-17,11,'#a8ffd0',900)})}
  if(g.holder!=null&&!g.ended){const h=g.of[g.holder],p=proj(h.x,h.y,0);txt(h.me?'나 (1번 PG)':`${h.num}번 ${h.pos}`,p.x,p.y+.95*R.k,13,'rgba(255,255,255,.9)',900)}
  if(guide)txt(guide.lbl,clamp(guide.x,60,R.w-60),Math.max(80,guide.y),fs+3,guide.col,900);
  for(const f of g.fx){const p=proj(f.x,f.y,2.6+f.t*.9);c.globalAlpha=clamp(1.4-f.t,0,1);txt(f.txt,p.x,p.y,(fs+3)*f.size,f.col,900);c.globalAlpha=1}
}

/* ---------- shot meter (hold the shot button, release in the green) ---------- */
const FILL=850,SWEET=.9;
function shotWindow(i){const cd=contest(G.of[i]);return clamp(.035+(cd>=2.2?.04:cd>=1.4?.02:0)+(attr(i,'sht')-55)*.001,.025,.1)}
function meterStart(){
  const g=G;if(!g||g.ended||g.paused||g.holder==null||g.meter||g.flight)return;
  const h=g.of[g.holder];h.tx=h.x;h.ty=h.y;g.drag=null;g.meter={t0:performance.now(),i:g.holder,win:shotWindow(g.holder)};
}
function meterRelease(){
  const g=G;if(!g||!g.meter)return;const m=g.meter;g.meter=null;if(g.ended||g.holder!==m.i)return;
  const v=(performance.now()-m.t0)/FILL,d=v-SWEET,ad=Math.abs(d);
  const q=ad<=m.win?'perfect':ad<=m.win*2.2?'good':d<0?'early':'late';
  g.meterRes={v,win:m.win,q,t:performance.now(),i:m.i};
  shoot(m.i,0,false,q,ad/m.win);
}
function drawMeter(){
  const g=G,c=R.ctx,now=performance.now();let m=g.meter,v,win,i,res=null;
  if(m){v=(now-m.t0)/FILL;win=m.win;i=m.i;if(v>=1.25)return meterRelease()}
  else if(g.meterRes&&now-g.meterRes.t<900){res=g.meterRes;v=res.v;win=res.win;i=res.i}
  else return;
  const o=g.of[i],p=proj(o.x,o.y,1.4),H=70,W=12,x=p.x+.75*R.k,y=p.y-H/2,vy=v2=>y+H-H*clamp(v2/1.1,0,1);
  c.fillStyle='rgba(10,12,18,.85)';c.fillRect(x-3,y-3,W+6,H+6);
  c.fillStyle='#2fbf71';c.fillRect(x,vy(SWEET+win),W,vy(SWEET-win)-vy(SWEET+win));
  const inZ=Math.abs(v-SWEET)<=win;
  c.fillStyle=res?(res.q==='perfect'?'#3ecf8e':res.q==='good'?'#ffd166':'#ff5a5f'):inZ?'#7dffb4':'#ffffff';
  const fy=vy(Math.min(v,1.1));c.fillRect(x,fy,W,y+H-fy);
  c.strokeStyle='#fff';c.lineWidth=1.5;c.strokeRect(x-.5,y-.5,W+1,H+1);
  if(res){const t=({perfect:'완벽한 릴리스!',good:'좋은 타이밍',early:'너무 빨라요',late:'너무 늦어요'})[res.q];
    c.font="900 15px 'Noto Sans KR',sans-serif";c.textAlign='left';c.textBaseline='middle';c.lineWidth=3;c.strokeStyle='rgba(0,0,0,.7)';
    c.strokeText(t,x+W+8,y+10);c.fillStyle=res.q==='perfect'?'#3ecf8e':res.q==='good'?'#ffd166':'#ff8a8a';c.fillText(t,x+W+8,y+10)}
}
(function bindShoot(){
  const b=$('#shootBtn');
  b.addEventListener('pointerdown',e=>{e.preventDefault();try{b.setPointerCapture(e.pointerId)}catch(_){}meterStart()});
  b.addEventListener('pointerup',e=>{e.preventDefault();meterRelease()});
  b.addEventListener('pointercancel',()=>meterRelease());
  window.addEventListener('keydown',e=>{if(e.code==='Space'&&!e.repeat){e.preventDefault();meterStart()}});
  window.addEventListener('keyup',e=>{if(e.code==='Space'){e.preventDefault();meterRelease()}});
})();

/* ---------- landscape lock: rotate the game when the phone is upright ---------- */
let ROT=false;
function applyOrient(){const c=$('#court'),W=window.innerWidth,H=window.innerHeight;ROT=H>W;
  if(ROT){c.classList.add('rot');c.style.width=H+'px';c.style.height=W+'px';c.style.transform=`translateX(${W}px) rotate(90deg)`}
  else{c.classList.remove('rot');c.style.width=c.style.height=c.style.transform=''}}
applyOrient();

/* ---------- boot ---------- */
Promise.race([document.fonts?document.fonts.ready:Promise.resolve(),new Promise(r=>setTimeout(r,1500))]).then(()=>{
  if(init2D()){sizeCourt();P=loadP();showHub()}
  else cover('<h4>3D를 불러오지 못했어요</h4><p>인터넷 연결을 확인하고 새로고침해 주세요.</p>');
});
