<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>코치의 작전판</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="상대 수비를 읽고 작전을 부르는 농구 전술 게임">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;700&family=Oswald:wght@500;600&display=swap">
<style>
/* Layout: a coach's clipboard — dry-erase half court on the left, the play-call sheet on the right; stacks on phones */
:root{
  --bg:#e6e9e3; --surface:#fbfcf9; --board:#fefefc; --frame:#86683f; --frame-text:#fffaf0;
  --ink:#1c2230; --dim:#5d6674; --line:#d6dad2; --court:#a4acb6;
  --us:#1d5bd0; --them:#cf3027; --ball:#e06a0f; --good:#1b8a4c; --bad:#cf3027; --hl:rgba(29,91,208,.09);
  --f-marker:'Gaegu','Nanum Pen Script',cursive;
  --f-ui:'IBM Plex Sans KR',system-ui,-apple-system,sans-serif;
  --f-score:'Oswald','IBM Plex Sans KR',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11151a; --surface:#192027; --board:#1c242b; --frame:#4a3d2a; --frame-text:#f1e6d2;
  --ink:#e6eaee; --dim:#97a1ab; --line:#2b343d; --court:#5a6773;
  --us:#6ea8ff; --them:#ff6e60; --ball:#ff9a3c; --good:#45c483; --bad:#ff6e60; --hl:rgba(110,168,255,.13); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11151a; --surface:#192027; --board:#1c242b; --frame:#4a3d2a; --frame-text:#f1e6d2;
  --ink:#e6eaee; --dim:#97a1ab; --line:#2b343d; --court:#5a6773;
  --us:#6ea8ff; --them:#ff6e60; --ball:#ff9a3c; --good:#45c483; --bad:#ff6e60; --hl:rgba(110,168,255,.13); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 32px;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--us);outline-offset:2px}
.top{max-width:1120px;margin:0 auto 12px;display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-marker);font-weight:700;font-size:30px;line-height:1;letter-spacing:-.01em}
.brand span{color:var(--them)}
.top nav{display:flex;gap:8px}
.ghost{background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--dim)}
.ghost:hover{color:var(--ink);border-color:var(--dim)}

.layout{max-width:1120px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:860px){.layout{grid-template-columns:minmax(0,1fr)}}

/* clipboard */
.clip{background:var(--frame);border-radius:18px;padding:30px 12px 12px;position:relative;box-shadow:0 1px 0 rgba(0,0,0,.08)}
.clip::before{content:"";position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:120px;height:26px;border-radius:7px 7px 12px 12px;
  background:linear-gradient(180deg,#d7dbe0,#9aa1aa);box-shadow:inset 0 -2px 0 rgba(0,0,0,.18)}
.scorebar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:0 6px 10px}
.tm{display:flex;align-items:center;gap:10px;min-width:0}
.tm.them{justify-content:flex-end}
.nm{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--frame-text)}
.pts{font-family:var(--f-score);font-weight:600;font-size:34px;line-height:1;font-variant-numeric:tabular-nums;background:var(--surface);border-radius:8px;padding:4px 10px;min-width:62px;text-align:center}
.us .pts{color:var(--us)} .them .pts{color:var(--them)}
.mid{display:flex;flex-direction:column;align-items:center;font-family:var(--f-score);color:var(--frame-text);line-height:1.15;text-align:center}
.mid b{font-size:20px;font-weight:600}
.mid small{font-size:12px;letter-spacing:.06em;opacity:.85;font-variant-numeric:tabular-nums}
.board{background:var(--board);border-radius:8px;position:relative;overflow:hidden}
canvas{display:block;width:100%;height:auto}
.banner{position:absolute;left:10px;top:10px;font-family:var(--f-marker);font-weight:700;font-size:20px;color:var(--them);background:var(--board);padding:0 6px;border-radius:4px}
.legend{display:flex;gap:14px;flex-wrap:wrap;padding:8px 6px 0;font-size:12px;color:var(--frame-text);opacity:.9}

/* call sheet */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--dim);margin:0 0 4px;font-weight:500}
h2{font-family:var(--f-marker);font-weight:700;font-size:30px;line-height:1.1;margin:0 0 10px;text-wrap:balance}
h3{font-size:13px;font-weight:700;margin:18px 0 8px;color:var(--dim);letter-spacing:.04em}
p{margin:0 0 10px;max-width:62ch}
.ctx{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:15px;margin-bottom:6px}
.side{font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;color:var(--surface)}
.side.off{background:var(--us)} .side.def{background:var(--them)}
.read{font-family:var(--f-marker);font-size:24px;font-weight:700;line-height:1.1}
.hint{color:var(--dim);font-size:13px}
.obs{font-size:12px;color:var(--dim);background:var(--bg);border-radius:8px;padding:7px 10px;margin:8px 0 12px;font-variant-numeric:tabular-nums}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.card{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;display:flex;flex-direction:column;gap:2px;min-width:0}
.card:hover{border-color:var(--dim)}
.card.sel{border-color:var(--us);background:var(--hl)}
.def-mode .card.sel{border-color:var(--them)}
.card .n{display:flex;justify-content:space-between;align-items:center;gap:6px;font-weight:700;font-size:14px}
.card .d{font-size:12px;color:var(--dim);line-height:1.35}
.badges{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.bd{font-size:11px;padding:0 6px;border-radius:4px;background:var(--bg);color:var(--dim);font-weight:500}
.bd.warn{color:var(--bad)} .bd.up{color:var(--good);font-weight:700} .bd.dn{color:var(--bad);font-weight:700}
.actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn{border:none;border-radius:10px;padding:11px 18px;font-weight:700;font-size:15px;background:var(--ink);color:var(--surface)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.sec{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.btn.grow{flex:1}
.res{font-family:var(--f-marker);font-weight:700;font-size:40px;line-height:1}
.res.good{color:var(--good)} .res.bad{color:var(--bad)}
.vs{font-size:14px;margin:8px 0}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;border:1px solid currentColor}
.chip.up{color:var(--good)} .chip.eq{color:var(--dim)} .chip.dn{color:var(--bad)}
.why{border-left:3px solid var(--line);padding:2px 0 2px 12px;margin:10px 0;font-size:14px}
.new{font-size:12px;color:var(--us);font-weight:700}
.log{list-style:none;margin:0;padding:0;font-size:12.5px;display:flex;flex-direction:column;gap:3px;max-height:180px;overflow:auto}
.log li{display:grid;grid-template-columns:34px 1fr auto;gap:8px;color:var(--dim);font-variant-numeric:tabular-nums}
.log b{color:var(--ink);font-weight:500}
.log .p{font-weight:700} .log .p.u{color:var(--us)} .log .p.t{color:var(--them)}
.bracket{list-style:none;padding:0;margin:12px 0 14px;display:flex;flex-direction:column;gap:6px}
.bracket li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 12px;border-radius:10px;border:1px solid var(--line)}
.bracket li.cur{border-color:var(--ink);font-weight:700}
.bracket li.done{color:var(--dim)}
.bracket small{color:var(--dim);font-weight:400}
.stars{color:var(--ball);letter-spacing:2px}
.meter{height:6px;background:var(--bg);border-radius:6px;overflow:hidden;margin:6px 0 2px}
.meter i{display:block;height:100%;background:var(--us)}
.ev{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.ev>div{background:var(--bg);border-radius:10px;padding:9px 12px;display:flex;flex-direction:column;min-width:0}
.ev span{font-size:12px;color:var(--dim)}
.ev b{font-family:var(--f-score);font-weight:600;font-size:24px;line-height:1.2;font-variant-numeric:tabular-nums}
.ev small{font-size:12px;color:var(--dim)}
.clock{height:6px;background:var(--bg);border-radius:6px;overflow:hidden;margin:4px 0 12px}
.clock i{display:block;height:100%;width:100%;background:var(--ball);transition:width .1s linear}
.opts{grid-template-columns:minmax(0,1fr)}
.let{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;border:2px solid var(--us);color:var(--us);font-family:var(--f-score);font-size:13px;margin-right:4px}
.tbl{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tbl td,.tbl th{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left}
.tbl th{color:var(--dim);font-weight:500;font-size:12px}

/* playbook notebook */
.sheet-wrap{position:fixed;inset:0;background:rgba(10,14,20,.45);display:flex;align-items:center;justify-content:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:20}
.sheet{background:var(--surface);border-radius:14px;max-width:760px;width:100%;max-height:100%;overflow:auto;padding:18px}
.scroll{overflow-x:auto}
.mx{border-collapse:collapse;font-size:13px;min-width:560px;width:100%}
.mx th{font-weight:700;font-size:12px;padding:6px;color:var(--dim);text-align:center;white-space:nowrap}
.mx th.r{text-align:left;color:var(--ink)}
.mx td{text-align:center;padding:6px;border:1px solid var(--line);font-family:var(--f-marker);font-size:20px;font-weight:700;line-height:1}
.mx td.u{color:var(--good)} .mx td.d{color:var(--bad)} .mx td.e{color:var(--dim)} .mx td.q{color:var(--line)}
.key{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--dim);margin-top:10px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">코치의 작전판 <span>X</span>·O</div>
  <nav><button class="ghost" id="noteBtn" type="button">작전 노트</button><button class="ghost" id="homeBtn" type="button">대진표</button></nav>
</header>
<main class="layout">
  <section class="clip" aria-label="작전판">
    <div class="scorebar">
      <div class="tm us"><span class="pts" id="sUs">0</span><span class="nm">우리 팀</span></div>
      <div class="mid"><b id="sPer">—</b><small id="sPos">팁오프 전</small></div>
      <div class="tm them"><span class="nm" id="sThemName">상대</span><span class="pts" id="sThem">0</span></div>
    </div>
    <div class="board"><canvas id="court" width="520" height="490"></canvas><div class="banner" id="banner" hidden></div></div>
    <div class="legend"><span>O 공격 · X 수비</span><span>── 컷</span><span>┄┄ 패스</span><span>〰 드리블</span><span>─┤ 스크린</span></div>
  </section>
  <section class="panel" id="panel" aria-live="polite"></section>
</main>
<div class="sheet-wrap" id="noteWrap" hidden><div class="sheet" id="note" role="dialog" aria-label="작전 노트"></div></div>

<script>
(() => {
const B = {x:250, y:52};
const DEFS = [
  {id:'man',   name:'대인 방어', d:'각자 한 명씩 맡고 스크린은 뚫고 따라간다.'},
  {id:'switch',name:'스위치',   d:'스크린이 걸리면 마크맨을 맞바꾼다.'},
  {id:'drop',  name:'드롭',     d:'빅맨이 림 앞까지 내려가 페인트를 지킨다.'},
  {id:'blitz', name:'블리츠',   d:'볼 핸들러에게 두 명이 덮치는 더블팀.'},
  {id:'z23',   name:'2-3 존',   d:'앞 2명, 뒤 3명. 페인트를 잠근다.', zone:true},
  {id:'z131',  name:'1-3-1 존', d:'가운데 일자 라인에서 트랩을 건다.', zone:true},
];
const DEF = Object.fromEntries(DEFS.map(d=>[d.id,d]));
const GROUPS = {
  hs:{name:'하이 스크린 셋', opts:'픽앤롤 또는 픽앤팝'},
  po:{name:'포스트 셋', opts:'포스트업 또는 하이-로우'},
  wg:{name:'윙 셋', opts:'스태거 스크린 또는 백도어 컷'},
  sp:{name:'스페이싱 셋', opts:'아이솔레이션 또는 드라이브 앤 킥'},
};
const S0 = [[250,330],[420,230],[80,230],[455,70],[175,100]];
const PLAYS = [
  {id:'pnr', name:'픽앤롤', g:'hs', pts:2, d:'센터가 스크린 후 림으로 롤.',
   start:[[250,330],[455,70],[45,70],[80,240],[250,200]],
   steps:[{mv:{4:[282,322]},scr:[4]},{mv:{0:[345,235],4:[262,140]}},{mv:{4:[250,80]},b:4}], screen:{h:0,s:4,k:1}},
  {id:'pop', name:'픽앤팝', g:'hs', pts:3, d:'파워포워드가 스크린 후 3점 라인으로 빠진다.',
   start:[[250,330],[455,70],[45,70],[250,200],[170,95]],
   steps:[{mv:{3:[218,322]},scr:[3]},{mv:{0:[150,240],3:[345,318]}},{b:3}], screen:{h:0,s:3,k:1}},
  {id:'post', name:'포스트업', g:'po', pts:2, d:'로우포스트 센터에게 볼 투입, 1대1.',
   start:[[250,330],[420,230],[80,230],[455,70],[250,190]],
   steps:[{mv:{4:[150,95]},b:2},{mv:{2:[70,160]},b:4},{mv:{4:[212,68]}}]},
  {id:'hilo', name:'하이-로우', g:'po', pts:2, d:'자유투 라인에서 골밑으로 내려주는 패스.',
   start:[[250,330],[420,230],[80,230],[455,70],[330,100]],
   steps:[{mv:{3:[250,205]}},{mv:{4:[272,95]},b:3},{mv:{4:[250,72]},b:4}]},
  {id:'stg', name:'스태거 스크린', g:'wg', pts:3, d:'연속 스크린으로 슈터를 3점 라인에 띄운다.',
   start:[[250,330],[300,75],[420,230],[215,160],[160,230]],
   steps:[{mv:{1:[215,118],3:[205,150],4:[150,225]},scr:[3,4]},{mv:{1:[130,295]}},{b:1}], screen:{h:1,s:3,k:1}},
  {id:'bd', name:'백도어 컷', g:'wg', pts:2, d:'바짝 붙은 수비의 등 뒤로 림 컷.',
   start:[[250,330],[420,230],[80,230],[455,70],[250,205]],
   steps:[{mv:{1:[402,268]},b:4},{mv:{1:[300,105]}},{mv:{1:[262,66]},b:1}]},
  {id:'iso', name:'아이솔레이션', g:'sp', pts:2, d:'에이스에게 한쪽을 비워주고 1대1.',
   start:[[250,330],[455,70],[415,240],[45,70],[80,240]],
   steps:[{mv:{0:[130,330]},b:2},{mv:{2:[395,212]}},{mv:{2:[310,140]}}]},
  {id:'dk', name:'드라이브 앤 킥', g:'sp', pts:3, d:'돌파로 수비를 모은 뒤 코너로 킥아웃.',
   start:[[250,330],[420,230],[45,70],[80,240],[175,100]],
   steps:[{b:1},{mv:{1:[300,135],3:[120,310]}},{b:2}]},
];
// read options: at = steps before the read; option 0 finishes the play as drawn.
// [name, edge row it uses, shot value, finishing steps]
const OPTS = {
  pnr:{at:2, o:[['롤맨에게 패스','pnr',2],['미스매치 돌파','iso',2,[{mv:{0:[298,118]}}]],['코너 킥아웃','dk',3,[{b:1}]]]},
  pop:{at:2, o:[['팝 3점','pop',3],['핸들러 돌파 후 코너','dk',3,[{mv:{0:[205,140]}},{b:2}]],['숏롤 하이-로우','hilo',2,[{mv:{3:[250,200]},b:3},{mv:{4:[232,70]},b:4}]]]},
  post:{at:2, o:[['포스트 마무리','post',2],['반대편 코너 킥아웃','dk',3,[{b:3}]],['베이스라인 컷터','bd',2,[{mv:{1:[272,72]},b:1}]]]},
  hilo:{at:2, o:[['로우포스트 투입','hilo',2],['윙 슈터에게 스킵','stg',3,[{b:2}]],['백도어 컷','bd',2,[{mv:{1:[265,70]},b:1}]]]},
  stg:{at:2, o:[['슈터 3점','stg',3],['스크리너 슬립','pnr',2,[{mv:{3:[245,78]},b:3}]],['슈터 돌파','iso',2,[{b:1},{mv:{1:[205,128]}}]]]},
  bd:{at:1, o:[['백도어 컷','bd',2],['핸드오프 3점','stg',3,[{mv:{4:[320,242],1:[365,300]}},{b:1}]],['코너 빅맨 다이브','hilo',2,[{mv:{3:[278,80]},b:3}]]]},
  iso:{at:2, o:[['1대1 마무리','iso',2],['도움 오면 킥아웃','dk',3,[{mv:{2:[332,152]}},{b:1}]],['포스트업 전환','post',2,[{mv:{2:[350,110]}},{mv:{2:[300,72]}}]]]},
  dk:{at:2, o:[['코너 킥아웃','dk',3],['직접 마무리','iso',2,[{mv:{1:[262,74]}}]],['빅맨 덤프오프','post',2,[{mv:{4:[215,68]},b:4}]]]},
};
PLAYS.forEach(p => { const o = OPTS[p.id]; p.pre = p.steps.slice(0,o.at);
  p.opts = o.o.map((x,i) => ({n:x[0], row:x[1], pts:x[2], fin: i===0 ? p.steps.slice(o.at) : x[3]})); });
const PLAY = Object.fromEntries(PLAYS.map(p=>[p.id,p]));
const LET = ['A','B','C'];
// matchup: play|defense → [edge for the offense, why]
const RAW = {
 'pnr|man':[2,'스크린 대응 규칙이 없는 대인 수비는 볼 핸들러와 롤맨을 동시에 막지 못합니다.'],
 'pnr|switch':[-1,'스위치로 마크맨을 바꿔 붙어 롤맨에게 가는 패스 길이 닫혔습니다.'],
 'pnr|blitz':[-1,'더블팀이 볼 핸들러를 덮쳐 패스가 쫓기듯 나갑니다. 턴오버 위험이 큽니다.'],
 'pnr|z23':[-1,'존 뒷선 세 명이 롤맨이 들어갈 페인트를 이미 채우고 있습니다.'],
 'pop|man':[-1,'대인 수비의 빅맨이 그대로 따라 나와 슛을 견제합니다.'],
 'pop|switch':[-1,'스위치로 가드가 곧바로 슈터에게 붙었습니다.'],

const edge = (p,d) => (RAW[p+'|'+d]||[0])[0];
const why = (p,d) => (RAW[p+'|'+d]||[0,'뚜렷한 상성 없이 선수들의 실력 싸움이었습니다.'])[1];

const TEAMS = [
  {name:'항구 갈매기', round:'8강', rating:0, def:[4,1,3,1,1,0], off:[3,1,2,2,1,1,1,1], adapt:.5, read:.3,
   scout:'대인 방어와 드롭 수비가 기본인 정석 팀. 공격은 픽앤롤과 포스트업 위주. 패턴을 늦게 읽는다.'},
  {name:'북부 빙벽', round:'4강', rating:1, def:[1,0,2,1,4,3], off:[1,1,3,3,1,1,1,1], adapt:.8, read:.55,
   scout:'존 디펜스의 팀. 2-3과 1-3-1을 번갈아 세운다. 공격은 골밑 빅맨에게 집중한다.'},
  {name:'수도 번개', round:'결승', rating:2, def:[2,5,1,2,1,1], off:[2,2,1,1,2,2,3,2], adapt:1.2, read:.8,
   scout:'거의 모든 스크린을 스위치한다. 에이스 아이솔레이션과 슈터 활용. 같은 작전을 반복하면 금방 읽힌다.'},
];
const PER_Q = 5, PER_OT = 2;
const KEY = 'tactics-board-v1';

// ---------- persistence ----------
let SAVE = {stage:0, note:{}};
try { const s = JSON.parse(localStorage.getItem(KEY)||'null'); if (s) SAVE = Object.assign(SAVE, s); } catch(e){}
const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(SAVE)); } catch(e){} };

let S = {screen:'title', game:null};

// ---------- helpers ----------
const $ = s => document.querySelector(s);
const rnd = Math.random;
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const lerp = (a,b,t) => a+(b-a)*t;
const lp = (p,q,t) => [lerp(p[0],q[0],t), lerp(p[1],q[1],t)];
const ease = t => t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;
const dist = (p,q) => Math.hypot(p[0]-q[0], p[1]-q[1]);
const toward = (p,q,r) => { const d = dist(p,q)||1; return [p[0]+(q[0]-p[0])/d*r, p[1]+(q[1]-p[1])/d*r]; };
const pickW = w => { const t = w.reduce((a,b)=>a+b,0); let r = rnd()*t; for (let i=0;i<w.length;i++){ r -= w[i]; if (r<=0) return i; } return w.length-1; };
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const edgeTag = e => e>0 ? ['up','▲ 유리'] : e<0 ? ['dn','▼ 불리'] : ['eq','● 보통'];

// ---------- game ----------
function newGame(ti){
  S.game = {ti, q:1, ot:0, idx:0, side:'off', us:0, them:0, tos:2,
    ourPlays:[], ourDefs:[], theirPlays:[], famFrom:0, seen:{man:0,switch:0,drop:0,blitz:0},
    oppDef:null, oppPlay:null, reveal:false, sel:null, phase:'choose', last:null, log:[], stats:{},
    cur:null, defW:[], playW:[], loss:0, nDec:0, xUs:0, xThem:0};
  S.screen = 'play';
  startPoss();
}
const T = () => TEAMS[S.game.ti];
const perLen = g => g.q<=4 ? PER_Q : PER_OT;
const perLabel = g => g.q<=4 ? g.q+'Q' : (g.q===5 ? 'OT' : 'OT'+(g.q-4));
function startPoss(){
  const g = S.game, t = T();
  g.sel = null; g.reveal = false; g.phase = 'choose'; g.last = null;
  if (g.side==='off'){
    const hist = g.ourPlays.slice(-8);
    const w = DEFS.map((d,j) => { let sc=0; for (const p of hist) sc -= edge(p,d.id); sc /= Math.max(3,hist.length); return t.def[j]*Math.exp(t.adapt*sc*1.6); });
    g.defW = w; g.oppDef = DEFS[pickW(w)].id;
  } else {
    const hist = g.ourDefs.slice(-8);
    const w = PLAYS.map((p,j) => { let sc=0; for (const d of hist) sc += edge(p.id,d); sc /= Math.max(3,hist.length); return t.off[j]*Math.exp(t.adapt*sc*1.6); });
    g.playW = w; g.oppPlay = PLAYS[pickW(w)].id;
  }
  render(); drawStatic();
}
function famCount(g, pid){ return g.ourPlays.slice(Math.max(g.famFrom, g.ourPlays.length-3)).filter(x=>x===pid).length; }
// ----- odds & expected points -----
function odds(row, pts, did, att, fam, pen){
  const t = T(), e = edge(row,did), rd = att==='us' ? -t.rating : t.rating;
  let p = 0.47 + 0.10*e - fam - pen + rd*0.015 + (row==='iso' ? 0.04 : 0);
  if (pts===3) p *= 0.78;
  p = clamp(p, 0.1, 0.85);
  const to = 0.05 + Math.max(0,-e)*0.04 + (row==='pnr' && did==='blitz' ? 0.06 : 0);
  return {e, p, to};
}
const optPen = oi => oi>0 ? 0.03 : 0;
function optEV(play, oi, did, att, fam){
  const o = play.opts[oi], {e,p,to} = odds(o.row, o.pts, did, att, fam, optPen(oi));
  return (1-to) * p * (o.pts + (o.pts===2 && e>=1 ? 0.18 : 0));
}
function bestOpt(play, did, att, fam){
  let bi = 0, bv = -1;
  play.opts.forEach((o,i) => { const v = optEV(play,i,did,att,fam); if (v > bv + 1e-9){ bv = v; bi = i; } });
  return [bi, bv];
}
const oppEV = (play, did) => { const r = T().read; return r*bestOpt(play,did,'them',0)[1] + (1-r)*optEV(play,0,did,'them',0); };
function roll(play, oi, did, att, fam){
  const o = play.opts[oi], {e,p,to} = odds(o.row, o.pts, did, att, fam, optPen(oi));
  if (rnd() < to) return {kind:'to', pts:0, e, fam};
  const make = rnd() < p, and1 = make && o.pts===2 && e>=1 && rnd()<0.18;
  return {kind: make?'make':'miss', pts: make ? o.pts + (and1?1:0) : 0, and1, e, fam};
}
const norm = L => { const s = L.reduce((a,b)=>a+b[1],0) || 1; return L.map(([k,w])=>[k,w/s]); };
// what the coach could know before the call
function defInfo(g){
  if (DEF[g.oppDef].zone || g.reveal) return [[g.oppDef,1]];
  return norm(DEFS.map((d,i)=>[d.id,g.defW[i]]).filter(([id,w]) => !DEF[id].zone && w>0));
}
function playInfo(g){
  const p = PLAY[g.oppPlay];
  if (g.reveal) return [[p.id,1]];
  return norm(PLAYS.map((x,i)=>[x.id,g.playW[i]]).filter(([id]) => PLAY[id].g===p.g));
}
function setLast(pid, did, oi, r, off, ev){
  const row = PLAY[pid].opts[oi].row, key = row+'|'+did, isNew = !SAVE.note[key];
  SAVE.note[key] = 1; persist();
  S.game.last = {pid, did, oi, row, r, off, isNew, ev};
}
function callPlay(){
  const g = S.game; if (!g.sel || g.phase!=='choose') return;
  if (g.side==='off'){
    const pid = g.sel, did = g.oppDef, play = PLAY[pid], fam = famCount(g,pid)*0.05;
    const info = defInfo(g);
    const fv = id => info.reduce((a,[d,w]) => a + w*bestOpt(PLAY[id], d, 'us', famCount(g,id)*0.05)[1], 0);
    let bestP = pid, best = -1; PLAYS.forEach(p => { const v = fv(p.id); if (v > best + 1e-9){ best = v; bestP = p.id; } });
    g.cur = {pid, did, fam, first:{v:fv(pid), best, bestP}};
    g.ourPlays.push(pid); if (!DEF[did].zone) g.seen[did]++;
    g.phase = 'anim'; render();
    runAnim(play, play.pre, did, true);
  } else {
    const did = g.sel, play = PLAY[g.oppPlay];
    const oi = rnd() < T().read ? bestOpt(play,did,'them',0)[0] : 0;
    const info = playInfo(g), dv = d => info.reduce((a,[p,w]) => a + w*oppEV(PLAY[p], d), 0);
    let bestD = did, best = 1e9; DEFS.forEach(d => { const v = dv(d.id); if (v < best - 1e-9){ best = v; bestD = d.id; } });
    const v = dv(did), r = roll(play, oi, did, 'them', 0);
    g.ourDefs.push(did); g.theirPlays.push(play.id);
    g.loss += v - best; g.nDec++; g.xThem += optEV(play, oi, did, 'them', 0);
    setLast(play.id, did, oi, r, false, {def:{v, best, bestD}});
    g.phase = 'anim'; render();
    runAnim(play, play.pre.concat(play.opts[oi].fin), did, false); A.r = r;
  }
}
function chooseOpt(oi){
  const g = S.game; if (!g || g.phase!=='read' || !A) return;
  stopTimer();
  const c = g.cur, play = PLAY[c.pid];
  const r = roll(play, oi, c.did, 'us', c.fam);
  const [bo, bv] = bestOpt(play, c.did, 'us', c.fam), v = optEV(play, oi, c.did, 'us', c.fam);
  g.loss += (c.first.best - c.first.v) + (bv - v); g.nDec += 2; g.xUs += v;
  const st = g.stats[c.pid] ||= {n:0,pts:0}; st.n++; st.pts += r.pts;
  setLast(c.pid, c.did, oi, r, true, {first:c.first, read:{v, best:bv, bestO:bo}});
  g.phase = 'anim'; render();
  A.r = r; appendSteps(play.opts[oi].fin); A.pauseAt = null; A.last = performance.now(); kick();
}
let TM = 0; const READ_MS = 8000;
function startTimer(){
  stopTimer(); const t0 = performance.now();
  TM = setInterval(() => {
    const left = 1 - (performance.now()-t0)/READ_MS, b = $('#clockBar');
    if (b) b.style.width = Math.max(0,left*100) + '%';
    if (left <= 0){ stopTimer(); chooseOpt(0); }
  }, 100);
}
function stopTimer(){ clearInterval(TM); TM = 0; }
function finishPoss(){
  const g = S.game, L = g.last, r = L.r;
  if (L.off) g.us += r.pts; else g.them += r.pts;
  const pn = PLAY[L.pid].name + (L.oi ? '→' + PLAY[L.pid].opts[L.oi].n : '');
  const txt = L.off ? `${pn} vs ${DEF[L.did].name}` : `${DEF[L.did].name} vs ${pn}`;
  const res = r.kind==='to' ? '턴오버' : r.kind==='miss' ? '실패' : `+${r.pts}`;
  g.log.unshift({per:perLabel(g), off:L.off, txt, res});
  g.phase = 'result';
  updateScore(); render();
}
function nextPoss(){
  const g = S.game;
  if (g.side==='off'){ g.side='def'; return startPoss(); }
  g.side = 'off'; g.idx++;
  if (g.idx >= perLen(g)){
    if (g.q < 4 || g.us===g.them){ g.q++; g.idx=0; if (g.q===3) g.tos = Math.max(g.tos,1); }
    else return endGame();
  }
  startPoss();
}
function isClutch(g){ return g.q>=4 && g.idx===perLen(g)-1 && Math.abs(g.us-g.them)<=3; }
function timeout(){
  const g = S.game; if (g.tos<=0 || g.reveal || g.phase!=='choose') return;
  g.tos--; g.reveal = true; g.famFrom = g.ourPlays.length;
  render(); drawStatic();
}
function endGame(){
  const g = S.game; g.phase = 'over';
  const win = g.us > g.them;
  if (win && SAVE.stage===g.ti) { SAVE.stage = g.ti+1; persist(); }
  S.screen = 'over'; render(); drawStatic();
}

// ---------- panel ----------
function render(){
  const P = $('#panel');
  P.classList.toggle('def-mode', !!(S.game && S.game.side==='def'));
  if (S.screen==='title') P.innerHTML = titleHTML();
  else if (S.screen==='scout') P.innerHTML = scoutHTML();
  else if (S.screen==='over') P.innerHTML = overHTML();
  else P.innerHTML = playHTML();
  updateScore();
}
function noteCount(){ return Object.keys(SAVE.note).length; }
function titleHTML(){
  const st = SAVE.stage;
  const rows = TEAMS.map((t,i)=>`<li class="${i<st?'done':i===st?'cur':''}"><span>${t.round} · ${esc(t.name)} <span class="stars">${'★'.repeat(t.rating+1)}</span></span><small>${i<st?'승리':i===st?'다음 상대':'대기'}</small></li>`).join('');
  const champ = st>=TEAMS.length;
  return `<p class="eyebrow">컵 대회 토너먼트 · 3라운드</p>
  <h2>${champ?'우승했습니다':'선수는 그대로, 작전만 바꾼다'}</h2>
  <p>당신은 감독입니다. 공격 때는 상대 수비 대형을 보고 작전을 부르고, 수비 때는 상대 공격 세트를 보고 수비 전술을 고릅니다. 모든 작전에는 상성이 있습니다.</p>
  <p class="hint">작전이 시작되면 수비 반응이 드러나는 순간 멈춥니다. 8초 안에 A·B·C 중 공을 보낼 곳을 고르세요. 매 포세션의 판단은 기대 득점으로 평가됩니다. 대인 계열 수비(대인·스위치·드롭·블리츠)는 공을 잡기 전엔 똑같아 보입니다. 이번 경기에서 관찰한 대응 횟수와 작전 타임으로 추리하세요. 같은 작전을 연달아 쓰면 상대가 읽고, 상대는 당신이 자주 쓰는 작전에 맞춰 수비를 바꿉니다.</p>
  <ol class="bracket">${rows}</ol>
  <div><b>작전 노트</b> <span class="hint">${noteCount()}/48 상성 발견</span><div class="meter"><i style="width:${noteCount()/48*100}%"></i></div></div>
  <div class="actions">${champ
    ? `<button class="btn grow" data-act="reset">새 시즌 시작 (노트 유지)</button>`
    : `<button class="btn grow" data-act="scout">${TEAMS[st].round} 스카우팅 리포트</button>`}
    <button class="btn sec" data-act="note">작전 노트</button></div>`;
}
function scoutHTML(){
  const t = TEAMS[SAVE.stage];
  const top = (arr, list, n) => arr.map((w,i)=>[w,i]).sort((a,b)=>b[0]-a[0]).slice(0,n).map(([,i])=>list[i].name).join(', ');

  <div class="actions"><button class="btn grow" data-act="tip">팁오프</button><button class="btn sec" data-act="home">돌아가기</button></div>`;
}
function playHTML(){
  const g = S.game, off = g.side==='off';
  let head = '', cards = '', obs = '';
  if (g.phase==='result') return resultHTML();
  if (g.phase==='read') return readHTML();
  if (off){
    const d = DEF[g.oppDef];
    const known = d.zone || g.reveal;
    head = `<div class="ctx"><span class="side off">공격</span><span class="hint">상대 수비 대형</span></div>
      <div class="read">${known ? d.name : '대인 계열 · 스크린 대응 미확인'}</div>
      <p class="hint">${known ? (g.reveal && !d.zone ? '작전 타임에 확인한 수비입니다. ' : '') + d.d : '대인·스위치·드롭·블리츠 중 하나. 스크린이 걸려야 정체가 드러납니다.'}</p>`;
    obs = `<div class="obs">이번 경기 관찰된 대인 계열: 대인 ${g.seen.man} · 스위치 ${g.seen.switch} · 드롭 ${g.seen.drop} · 블리츠 ${g.seen.blitz}</div>`;
    cards = PLAYS.map(p => {
      const f = famCount(g,p.id);
      let bs = `<span class="bd">${p.pts}점 슛</span>`;

const ZS = {z23:[[190,255],[310,255],[110,130],[390,130],[250,95]], z131:[[250,345],[100,215],[250,205],[400,215],[250,85]]};
function defPos(off, ball, sf, d, play, holder){

    const res = ZS[d].map(s => [s[0]+(ball[0]-250)*.3, s[1]+(ball[1]-220)*.12]);
    const order = res.map((p,i)=>[dist(p,ball),i]).sort((a,b)=>a[0]-b[0]);
    const hp = off[holder] || ball, tgt = toward(hp,[B.x,B.y],20);
    res[order[0][1]] = lp(res[order[0][1]], tgt, .7);
    if (d==='z131') res[order[1][1]] = lp(res[order[1][1]], [hp[0]+(hp[0]<250?16:-16), hp[1]+8], .4);
    return res;
  }
  const asg = [0,1,2,3,4], sc = play && play.screen;
  if (d==='switch' && sc && sf >= sc.k-.25){ asg[sc.h]=sc.s; asg[sc.s]=sc.h; }
  const res = asg.map(a => toward(off[a],[B.x,B.y],22));
  if (sc && sf >= sc.k-.5 && sf < sc.k+1.3){
    if (d==='drop') res[sc.s] = lp(res[sc.s],[250,165],.75);
    if (d==='blitz'){ const h = off[sc.h]; res[sc.s] = [h[0]+(h[0]<250?20:-20), h[1]-8]; }
  }
  if (d==='drop' && !sc) res[4] = lp(res[4],[250,115],.45);

  readColors(); begin(); court();
  const g = S.game;
  if (A){ frame(); if (g && g.phase==='read') readDiagram(); return; }
  if (!g || S.screen!=='play'){ idleBoard(); return; }
  const off = g.side==='off';
  const oc = off ? C.us : C.them, xc = off ? C.them : C.us;
  if (g.phase==='result' && g.last){ const fin = g.last.final; if (fin){ fin.off.forEach((p,i)=>drawO(p,i+1,oc)); fin.def.forEach(p=>drawX(p,xc)); drawBall(fin.ball); } return; }
  let O = S0, dType = 'man', play = null;
  if (off){
    dType = DEF[g.oppDef].zone || g.reveal ? g.oppDef : 'man';
    if (g.sel){ play = PLAY[g.sel]; O = play.start; }
  } else {
    if (g.reveal){ play = PLAY[g.oppPlay]; O = play.start; }
    if (g.sel) dType = g.sel;
  }
  const Dp = defPos(O, O[0], -1, dType, play, 0);
  if (play) diagram(play, oc);
  O.forEach((p,i)=>drawO(p,i+1,oc));
  Dp.forEach(p=>drawX(p,xc));
  drawBall([O[0][0]+9,O[0][1]-9]);
}
function idleBoard(){
  const p = PLAY.pnr; diagram(p, C.us);
  p.start.forEach((q,i)=>drawO(q,i+1,C.us));
  defPos(p.start,p.start[0],-1,'z23',p,0).forEach(q=>drawX(q,C.them));
  drawBall([p.start[0][0]+9,p.start[0][1]-9]);
}

// ---------- animation ----------
let A = null, raf = 0;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
function runAnim(play, steps, did, off){
  A = {play, did, r:null, off, K:[S0.map(p=>p.slice()), play.start.map(p=>p.slice())], Hs:[0,0], D:[0,420],
       el:0, last:performance.now(), speed: reduce?4:1, total:420, shot:900, hold:900, pauseAt:null};
  appendSteps(steps);
  if (off) A.pauseAt = A.total;
  kick();
}
function appendSteps(steps){
  let cur = A.K[A.K.length-1], h = A.Hs[A.Hs.length-1];
  for (const st of steps){
    cur = cur.map(p=>p.slice()); for (const i in st.mv) cur[i] = st.mv[i].slice();
    if (st.b!==undefined) h = st.b;
    A.K.push(cur); A.Hs.push(h); A.D.push(640); A.total += 640;
  }
}
function kick(){ if (!raf) raf = requestAnimationFrame(loop); }
function loop(now){
  raf = 0; if (!A) return;
  A.el += Math.min(64, now - A.last) * A.speed; A.last = now;
  if (A.pauseAt!==null && A.el >= A.pauseAt){
    A.el = A.pauseAt; A.speed = reduce?4:1;
    if (S.game.phase!=='read'){ S.game.phase = 'read'; render(); startTimer(); }
    redraw(); return;
  }
  redraw();
  if (A.el >= A.total + A.shot + A.hold){
    S.game.last.final = A.final; A = null; finishPoss(); redraw(); return;
  }
  raf = requestAnimationFrame(loop);
}
function frame(){
  const {K,Hs,D,play,did,r,off} = A;
  const oc = off ? C.us : C.them, xc = off ? C.them : C.us;
  let t = A.el, j = 1;
  while (j < D.length && t > D[j]){ t -= D[j]; j++; }
  let O, ball, sf, holder;
  const fin = K[K.length-1], sh = Hs[Hs.length-1];
  if (j < D.length){
    const u = ease(clamp(t/D[j],0,1));
    O = K[j-1].map((p,i)=>lp(p,K[j][i],u));
    sf = j===1 ? -1+u : j-2+u;
    const a = Hs[j-1], b = Hs[j]; holder = b;
    const hp = i => [O[i][0]+9, O[i][1]-9];
    ball = a===b ? hp(a) : lp(hp(a), hp(b), ease(clamp(t/D[j]/.75,0,1)));
    if (a!==b && t/D[j] < .4) holder = a;
  } else {
    O = fin.map(p=>p.slice()); sf = play.steps.length; holder = sh;
    const st = A.el - A.total, u = clamp(st/A.shot,0,1);
    const from = [fin[sh][0]+9, fin[sh][1]-9];
    if (r.kind==='to'){
      const Dn = defPos(O, from, sf, did, play, sh);
      let bi=0, bd=1e9; Dn.forEach((p,i)=>{ const dd=dist(p,from); if (dd<bd){bd=dd;bi=i;} });
      ball = lp(from, [Dn[bi][0]+8, Dn[bi][1]+8], ease(clamp(u*1.6,0,1)));
    } else {
      const rim = r.kind==='make' ? [250,52] : [262,48];
      const v = ease(u); ball = lp(from, rim, v); ball[1] -= Math.sin(Math.PI*v)*Math.min(90, dist(from,rim)*.4);
      if (st > A.shot){
        const w = clamp((st-A.shot)/A.hold,0,1);
        ball = r.kind==='make' ? [250, 52 + 26*ease(w)] : lp(rim,[318,118],ease(w));
      }
    }
  }
  const Dn = defPos(O, ball, sf, did, play, holder);
  O.forEach((p,i)=>drawO(p,i+1,oc));
  Dn.forEach(p=>drawX(p,xc));
  drawBall(ball);
  A.final = {off:O, def:Dn, ball};
  const st = A.el - A.total;
  if (st > A.shot*.75){
    const txt = r.kind==='to' ? (off?'턴오버':'스틸!') : r.kind==='miss' ? (off?'노골':'블록아웃') : `+${r.pts}${r.and1?' 앤드원':''}`;
    const good = off ? r.pts>0 : r.pts===0;
    ctx.globalAlpha = clamp((st-A.shot*.75)/250,0,1);
    ctx.fillStyle = good ? C.good : C.bad; ctx.font = '700 64px Gaegu, cursive'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(txt, 250, 400);
    ctx.globalAlpha = 1;
  }
}

// ---------- boot ----------
function start(data){
  if (data && data.S){ S = data.S; const g = S.game;
    if (g && (g.phase==='anim' || g.phase==='read')){ if (g.side==='off' && g.phase==='read') g.ourPlays.pop(); g.phase='choose'; } }
  render(); fit();
}
window.claude?.hot?.snapshot?.(() => ({S: JSON.parse(JSON.stringify(S))}));
new ResizeObserver(fit).observe(cv);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', redraw);
new MutationObserver(redraw).observe(document.documentElement, {attributes:true, attributeFilter:['data-theme']});
if (document.fonts && document.fonts.ready) document.fonts.ready.then(redraw);
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
