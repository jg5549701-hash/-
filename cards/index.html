<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>코치의 작전 카드</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="농구 작전을 카드로 쥐고 싸우는 덱빌딩 전략 카드 게임">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;700&family=Oswald:wght@500;600&display=swap">
<style>
/* Layout: the card table sits on the coach's clipboard — duel slots on a whiteboard, hand fanned below, opponent's deck tracker at the side */
:root{
  --bg:#e6e9e3; --surface:#fbfcf9; --board:#fefefc; --frame:#86683f; --frame-text:#fffaf0;
  --ink:#1c2230; --dim:#5d6674; --line:#d6dad2; --court:#a4acb6;
  --us:#1d5bd0; --them:#cf3027; --ball:#d9640c; --good:#1b8a4c; --bad:#cf3027; --hl:rgba(29,91,208,.09);
  --f-marker:'Gaegu','Nanum Pen Script',cursive;
  --f-ui:'IBM Plex Sans KR',system-ui,-apple-system,sans-serif;
  --f-score:'Oswald','IBM Plex Sans KR',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11151a; --surface:#192027; --board:#1c242b; --frame:#4a3d2a; --frame-text:#f1e6d2;
  --ink:#e6eaee; --dim:#97a1ab; --line:#2b343d; --court:#5a6773;
  --us:#6ea8ff; --them:#ff6e60; --ball:#ff9a3c; --good:#45c483; --bad:#ff6e60; --hl:rgba(110,168,255,.13); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11151a; --surface:#192027; --board:#1c242b; --frame:#4a3d2a; --frame-text:#f1e6d2;
  --ink:#e6eaee; --dim:#97a1ab; --line:#2b343d; --court:#5a6773;
  --us:#6ea8ff; --them:#ff6e60; --ball:#ff9a3c; --good:#45c483; --bad:#ff6e60; --hl:rgba(110,168,255,.13); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 32px;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--us);outline-offset:2px}
.top{max-width:1180px;margin:0 auto 12px;display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-marker);font-weight:700;font-size:30px;line-height:1}
.brand span{color:var(--ball)}
.top nav{display:flex;gap:8px;flex-wrap:wrap}
.ghostbtn{background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--dim)}
.ghostbtn:hover{color:var(--ink);border-color:var(--dim)}
#app{max-width:1180px;margin:0 auto}

/* game grid */
.game{display:grid;grid-template-columns:minmax(0,1fr) 290px;grid-template-areas:"table side" "hand side";gap:16px;align-items:start}
.game>.clip{grid-area:table} .game>.handwrap{grid-area:hand} .game>.side{grid-area:side}
@media (max-width:900px){.game{grid-template-columns:minmax(0,1fr);grid-template-areas:"table" "hand" "side"}}

.clip{background:var(--frame);border-radius:18px;padding:30px 12px 12px;position:relative}
.clip::before{content:"";position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:120px;height:26px;border-radius:7px 7px 12px 12px;background:linear-gradient(180deg,#d7dbe0,#9aa1aa);box-shadow:inset 0 -2px 0 rgba(0,0,0,.18)}
.scorebar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:0 6px 10px}
.tm{display:flex;align-items:center;gap:10px;min-width:0}
.tm.them{justify-content:flex-end}
.nm2{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--frame-text)}
.pts{font-family:var(--f-score);font-weight:600;font-size:32px;line-height:1;font-variant-numeric:tabular-nums;background:var(--surface);border-radius:8px;padding:4px 10px;min-width:58px;text-align:center}
.us .pts{color:var(--us)} .them .pts{color:var(--them)}
.mid{display:flex;flex-direction:column;align-items:center;font-family:var(--f-score);color:var(--frame-text);line-height:1.15;text-align:center}
.mid b{font-size:20px;font-weight:600}
.mid small{font-size:12px;letter-spacing:.04em;opacity:.85;font-variant-numeric:tabular-nums}
.table{background:var(--board);border-radius:8px;padding:12px 14px 16px;display:flex;flex-direction:column;gap:12px}
.opp{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--dim)}
.backs{display:flex}
.backs i{width:14px;height:20px;border-radius:3px;background:var(--frame);border:1.5px solid var(--board);margin-left:-4px}
.backs i:first-child{margin-left:0}
.peekhand{display:flex;gap:6px;flex-wrap:wrap}
.chipc{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:6px;border:1.5px solid var(--k);color:var(--k)}
.slots{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:start;gap:10px;justify-items:center}
.slot{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.sl{font-size:12px;font-weight:700;color:var(--dim);text-align:center}
.vs{font-family:var(--f-marker);font-weight:700;font-size:30px;color:var(--dim);align-self:center}
.rcs{display:flex;flex-direction:column;gap:4px;align-items:center}
.rchip{font-size:12px;font-weight:700;color:var(--ball)}
.odds{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;justify-content:center;font-variant-numeric:tabular-nums;font-size:13px;color:var(--dim)}
.odds b{font-family:var(--f-score);font-size:22px;font-weight:600;color:var(--ink)}
.odds .ar{color:var(--ball);font-weight:700}
.prompt{border-top:1px dashed var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.prompt p{margin:0;max-width:64ch}
.res{font-family:var(--f-marker);font-weight:700;font-size:38px;line-height:1}
.res.good{color:var(--good)} .res.bad{color:var(--bad)}
.why{border-left:3px solid var(--line);padding:2px 0 2px 12px;font-size:14px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:none;border-radius:10px;padding:10px 16px;font-weight:700;font-size:14.5px;background:var(--ink);color:var(--surface)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.sec{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.hint{color:var(--dim);font-size:13px}
.new{font-size:12px;color:var(--us);font-weight:700}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px;border:1px solid currentColor}
.chip.up{color:var(--good)} .chip.eq{color:var(--dim)} .chip.dn{color:var(--bad)}

/* cards */
.k-play{--k:var(--us)} .k-def{--k:var(--them)} .k-tac{--k:var(--ball)}
.card{--cw:132px;width:var(--cw);flex:0 0 var(--cw);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:8px 8px 9px;
  display:flex;flex-direction:column;gap:5px;text-align:left;position:relative;box-shadow:inset 0 4px 0 var(--k);transition:transform .15s ease,border-color .15s}
button.card:hover{border-color:var(--k)}
.card .tp{display:flex;justify-content:space-between;gap:4px;font-size:10.5px;font-weight:700;color:var(--k);letter-spacing:.02em;margin-top:2px}
.card .tp span:last-child{color:var(--dim)}
.card .art{width:100%;aspect-ratio:22/15;border-radius:6px;display:block;border:1px solid var(--line)}
.card .nm{font-weight:700;font-size:14px;line-height:1.2}
.card .tx{font-size:11px;color:var(--dim);line-height:1.35}
.card .bdg{display:flex;gap:4px;flex-wrap:wrap}
.bd{font-size:10.5px;padding:0 5px;border-radius:4px;background:var(--bg);color:var(--dim);font-weight:500}
.bd.up{color:var(--good);font-weight:700} .bd.dn{color:var(--bad);font-weight:700} .bd.warn{color:var(--bad)}
.card.sel{border-color:var(--k);transform:translateY(-8px);background:var(--hl)}
.card.dim{opacity:.5}
.card.ghost{border-style:dashed;box-shadow:none}
.card.big,.back.big,.ph.big{--cw:150px;min-height:236px}
.back{--cw:132px;width:var(--cw);border-radius:12px;background:var(--frame);border:1.5px solid var(--frame);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px;text-align:center;
  background-image:repeating-linear-gradient(45deg,transparent 0 10px,rgba(255,255,255,.06) 10px 20px)}
.back .logo{font-family:var(--f-marker);font-weight:700;font-size:40px;color:var(--frame-text);line-height:1}
.back .hint2{font-weight:700;font-size:14px;color:var(--frame-text);background:rgba(0,0,0,.18);padding:3px 10px;border-radius:999px}
.back .sub{font-size:11px;color:var(--frame-text);opacity:.85;line-height:1.35}
.ph{--cw:132px;width:var(--cw);border:2px dashed var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--dim);font-size:13px;padding:10px}
.flipin{animation:flip .5s ease both}
@keyframes flip{from{transform:perspective(700px) rotateY(90deg)}to{transform:none}}
@media (max-width:560px){.card.big,.back.big,.ph.big{--cw:118px;min-height:208px}.card.big .tx{font-size:10px}.vs{font-size:22px}}
@media (prefers-reduced-motion: reduce){.flipin{animation:none}.card{transition:none}}

.handwrap{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 12px 4px;min-width:0}
.hh{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}
.hh b{font-size:14px}
.hand{display:flex;gap:8px;overflow-x:auto;padding:14px 2px 10px;scroll-snap-type:x proximity}
.hand .card{scroll-snap-align:start}

.side{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
h3{font-size:13px;font-weight:700;margin:14px 0 6px;color:var(--dim);letter-spacing:.04em}
.side h3:first-child{margin-top:0}
.trk{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;font-size:12.5px}
.trk li{display:grid;grid-template-columns:8px 1fr auto;gap:8px;align-items:center;font-variant-numeric:tabular-nums}
.trk li::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--k)}
.trk li.gone{color:var(--dim);text-decoration:line-through}
.log{list-style:none;margin:0;padding:0;font-size:12px;display:flex;flex-direction:column;gap:3px;max-height:220px;overflow:auto}
.log li{display:grid;grid-template-columns:30px 1fr auto;gap:6px;color:var(--dim);font-variant-numeric:tabular-nums}
.log b{color:var(--ink);font-weight:500}
.log .p{font-weight:700} .log .p.u{color:var(--us)} .log .p.t{color:var(--them)}

/* solo screens */
.solo{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;max-width:860px;margin:0 auto}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--dim);margin:0 0 4px;font-weight:500}
h2{font-family:var(--f-marker);font-weight:700;font-size:32px;line-height:1.1;margin:0 0 10px;text-wrap:balance}
p{margin:0 0 10px;max-width:66ch}
.rules{margin:0 0 12px;padding-left:18px;display:flex;flex-direction:column;gap:4px;max-width:66ch}
.bracket{list-style:none;padding:0;margin:12px 0 14px;display:flex;flex-direction:column;gap:6px}
.bracket li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 12px;border-radius:10px;border:1px solid var(--line)}
.bracket li.cur{border-color:var(--ink);font-weight:700}
.bracket li.done{color:var(--dim)}
.bracket small{color:var(--dim);font-weight:400}
.stars{color:var(--ball);letter-spacing:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.row.center{justify-content:center}
.deckgrid{display:flex;gap:8px;flex-wrap:wrap}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:10px 0}
.stat>div{background:var(--bg);border-radius:10px;padding:9px 12px;display:flex;flex-direction:column}
.stat span{font-size:12px;color:var(--dim)} .stat b{font-family:var(--f-score);font-weight:600;font-size:24px;font-variant-numeric:tabular-nums}

.sheet-wrap{position:fixed;inset:0;background:rgba(10,14,20,.45);display:flex;align-items:center;justify-content:center;z-index:20;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--surface);border-radius:14px;max-width:820px;width:100%;max-height:100%;overflow:auto;padding:18px}
.scroll{overflow-x:auto}
.mx{border-collapse:collapse;font-size:13px;min-width:560px;width:100%}
.mx th{font-weight:700;font-size:12px;padding:6px;color:var(--dim);text-align:center;white-space:nowrap}
.mx th.r{text-align:left;color:var(--ink)}
.mx td{text-align:center;padding:5px;border:1px solid var(--line);font-family:var(--f-marker);font-size:19px;font-weight:700;line-height:1}
.mx td.u{color:var(--good)} .mx td.d{color:var(--bad)} .mx td.e{color:var(--dim)} .mx td.q{color:var(--line)}
</style>
</head>
<body>
<header class="top">
  <div class="brand">코치의 작전 카드 <span>X·O</span></div>
  <nav><button class="ghostbtn" type="button" data-act="deck">내 덱</button><button class="ghostbtn" type="button" data-act="note">작전 노트</button><button class="ghostbtn" type="button" data-act="home">대진표</button></nav>
</header>
<main id="app" aria-live="polite"></main>
<div class="sheet-wrap" id="modal" hidden><div class="sheet" id="modalBody" role="dialog"></div></div>

<script>
(() => {

  {id:'z131',  name:'1-3-1 존', d:'가운데 일자 라인에서 트랩을 건다.', zone:true},

const DEF = Object.fromEntries(DEFS.map(d=>[d.id,d]));
const GROUPS = {

const S0 = [[250,330],[420,230],[80,230],[455,70],[175,100]];

   steps:[{mv:{3:[250,205]}},{mv:{4:[272,95]},b:3},{mv:{4:[250,72]},b:4}]},
  {id:'stg', name:'스태거 스크린', g:'wg', pts:3, d:'연속 스크린으로 슈터를 3점 라인에 띄운다.',

  {id:'bd', name:'백도어 컷', g:'wg', pts:2, d:'바짝 붙은 수비의 등 뒤로 림 컷.',
   start:[[250,330],[420,230],[80,230],[455,70],[250,205]],
   steps:[{mv:{1:[402,268]},b:4},{mv:{1:[300,105]}},{mv:{1:[262,66]},b:1}]},
  {id:'iso', name:'아이솔레이션', g:'sp', pts:2, d:'에이스에게 한쪽을 비워주고 1대1.',
   start:[[250,330],[455,70],[415,240],[45,70],[80,240]],

  {id:'dk', name:'드라이브 앤 킥', g:'sp', pts:3, d:'돌파로 수비를 모은 뒤 코너로 킥아웃.',
   start:[[250,330],[420,230],[45,70],[80,240],[175,100]],
   steps:[{b:1},{mv:{1:[300,135],3:[120,310]}},{b:2}]},
  {id:'spain', name:'스페인 픽앤롤', g:'hs', pts:2, d:'픽앤롤에 백스크린을 더해 롤맨의 수비를 떼어낸다.',
   start:[[250,330],[455,70],[45,70],[300,190],[215,230]],
   steps:[{mv:{4:[282,322]},scr:[4]},{mv:{0:[345,240],4:[255,205],3:[275,275]},scr:[3]},{mv:{4:[250,82]},b:4}], screen:{h:0,s:4,k:1}},
  {id:'ucla', name:'UCLA 컷', g:'po', pts:2, d:'윙에 패스한 가드가 하이포스트 스크린을 받고 림으로 컷.',
   start:[[250,330],[420,230],[80,230],[455,70],[250,200]],
   steps:[{b:1},{mv:{4:[285,245]},scr:[4]},{mv:{0:[268,85]}},{mv:{0:[255,70]},b:0}], screen:{h:0,s:4,k:2}},
  {id:'elev', name:'엘리베이터 스크린', g:'wg', pts:3, d:'두 빅맨 사이로 슈터가 빠져나가면 문을 닫듯 막아선다.',
   start:[[390,300],[250,95],[45,70],[205,250],[295,250]],

  {id:'ham', name:'해머 스크린', g:'sp', pts:3, d:'베이스라인 돌파 순간 반대편 코너 수비에 백스크린.',
   start:[[250,330],[420,230],[70,210],[120,170],[330,95]],
   steps:[{b:1},{mv:{1:[400,95],0:[300,330]}},{mv:{3:[95,110],2:[45,70]},scr:[3]},{b:2}]},
];
// read options: at = steps before the read; option 0 finishes the play as drawn.

const ZS = {z23:[[190,255],[310,255],[110,130],[390,130],[250,95]], z131:[[250,345],[100,215],[250,205],[400,215],[250,85]]};
function defPos(off, ball, sf, d, play, holder){
  if (ZS[d]){
    const res = ZS[d].map(s => [s[0]+(ball[0]-250)*.3, s[1]+(ball[1]-220)*.12]);
    const order = res.map((p,i)=>[dist(p,ball),i]).sort((a,b)=>a[0]-b[0]);
    const hp = off[holder] || ball, tgt = toward(hp,[B.x,B.y],20);
    res[order[0][1]] = lp(res[order[0][1]], tgt, .7);
    if (d==='z131') res[order[1][1]] = lp(res[order[1][1]], [hp[0]+(hp[0]<250?16:-16), hp[1]+8], .4);
    return res;
  }
  const asg = [0,1,2,3,4], sc = play && play.screen;
  if (d==='switch' && sc && sf >= sc.k-.25){ asg[sc.h]=sc.s; asg[sc.s]=sc.h; }
  const res = asg.map(a => toward(off[a],[B.x,B.y],22));
  if (sc && sf >= sc.k-.5 && sf < sc.k+1.3){
    if (d==='drop') res[sc.s] = lp(res[sc.s],[250,165],.75);
    if (d==='blitz'){ const h = off[sc.h]; res[sc.s] = [h[0]+(h[0]<250?20:-20), h[1]-8]; }
  }
  if (d==='drop' && !sc) res[4] = lp(res[4],[250,115],.45);
  if (d==='blitz' && !sc && sf>=.3){
    const hp = off[holder]; let best=-1, bd=1e9;
    for (let i=0;i<5;i++){ if (i===holder) continue; const dd = dist(off[i],hp); if (dd<bd){bd=dd;best=i;} }
    if (best>=0) res[best] = lp(res[best],[hp[0]+(hp[0]<250?18:-18), hp[1]+10],.65);
  }
  return res;
}

// ---------- odds ----------
function evalCtx(offId, defId, reacts, att, fam){
  const oc = C[offId], dc = C[defId], did = dc.def;
  let row = oc.id, pts = oc.pts, eMod = 0, pAdd = 0, toAdd = 0, foul = false;
  if (oc.base) pAdd -= .05;
  if (dc.base) pAdd += .03;
  pAdd -= fam||0;
  for (const r of reacts){
    if (r==='kick'){ row = 'dk'; pts = 3; }
    else if (r==='mismatch') eMod += did==='switch' ? 2 : (DEF[did].zone ? 0 : 1);
    else if (r==='ace') pAdd += .12;
    else if (r==='help') eMod -= 1;
    else if (r==='trap') toAdd += .15;
    else if (r==='foul') foul = true;
  }
  const e = edge(row, did) + eMod;
  const rd = att==='us' ? -T().rating : T().rating;
  let p = .47 + .10*e + pAdd + rd*.015 + (row==='iso' ? .04 : 0);
  if (pts===3) p *= .78;
  p = clamp(p, .08, .88);
  let to = clamp(.05 + Math.max(0,-e)*.04 + (row==='pnr' && did==='blitz' ? .06 : 0) + toAdd, 0, .5);
  if (foul) to = 0;
  const ev = foul ? 1.5 : (1-to)*p*(pts + (pts===2 && e>=1 ? .18 : 0));
  return {row, pts, did, e, p, to, foul, ev};
}
function cur(extra){
  const g = S.G, off = g.side==='off';
  const offId = off ? g.myCard.id : g.aiCard.id, defId = off ? g.aiCard.id : g.myCard.id;
  const ids = g.reacts.map(r=>r.id).concat(extra ? [extra] : []);
  return evalCtx(offId, defId, ids, off?'us':'them', off ? g.fam : 0);
}

function mk(P, ids){ P.deck = shuffle(ids.map(id => ({uid: ++S.G.uid, id}))); P.hand = []; P.disc = []; }
function draw(P, n){
  for (let k=0;k<n;k++){
    if (P.hand.length >= HAND_MAX) return;
    if (!P.deck.length){ if (!P.disc.length) return; P.deck = shuffle(P.disc); P.disc = []; }
    P.hand.push(P.deck.pop());
  }
}
function newGame(ti){
  S.G = {ti, uid:0, q:1, idx:0, side:'off', us:0, them:0, me:{}, ai:{}, myPlays:[], myDefs:[], log:[],
         phase:'pre', myCard:null, aiCard:null, reacts:[], peek:false, scout:false, sel:null, fam:0, res:null, flip:false, xUs:0, xThem:0};
  mk(S.G.me, SAVE.deck); mk(S.G.ai, TEAMS[ti].deck);
  draw(S.G.me, 5); draw(S.G.ai, 5);
  S.screen = 'game';
  startPoss();
}
const perLen = g => g.q<=4 ? PER_Q : PER_OT;
const perLabel = g => g.q<=4 ? g.q+'Q' : (g.q===5 ? 'OT' : 'OT'+(g.q-4));
function startPoss(){
  const g = S.G;
  const n = (g.idx===0 && g.side==='off') ? 2 : 1;
  draw(g.me, n); draw(g.ai, n);
  Object.assign(g, {myCard:null, aiCard:null, reacts:[], peek:false, scout:false, sel:null, fam:0, res:null, phase:'pre', aiMsg:''});
  aiCommit();
  render();
}
function softPick(cands, score, temp){
  const s = cands.map(score), m = Math.max(...s);
  const w = s.map(v => Math.exp((v-m)/temp));
  let r = rnd()*w.reduce((a,b)=>a+b,0);
  for (let i=0;i<w.length;i++){ r -= w[i]; if (r<=0) return cands[i]; }
  return cands[cands.length-1];
}
function deckCounts(kind){ const m = {}; SAVE.deck.forEach(id => { if (C[id].kind===kind) m[id] = (m[id]||0)+1; }); return m; }
function aiCommit(){
  const g = S.G, t = T(), off = g.side==='off'; // off = human attacks, AI defends
  let pick;
  if (off){
    const m = deckCounts('play'); m.free = (m.free||0) + .5;
    g.myPlays.slice(-6).forEach(p => m[p] = (m[p]||0) + t.adapt);
    const W = norm(Object.entries(m));
    const cands = uniq(g.ai.hand.filter(c=>C[c.id].kind==='def').map(c=>c.id)).concat(['d_base']);
    pick = softPick(cands, d => -W.reduce((a,[p,w]) => a + w*evalCtx(p,d,[],'us',0).ev, 0), t.temp);
  } else {
    const m = deckCounts('def'); m.d_base = (m.d_base||0) + .5;
    g.myDefs.slice(-6).forEach(d => m[d] = (m[d]||0) + t.adapt);
    const W = norm(Object.entries(m));
    const cands = uniq(g.ai.hand.filter(c=>C[c.id].kind==='play').map(c=>c.id)).concat(['free']);
    pick = softPick(cands, p => W.reduce((a,[d,w]) => a + w*evalCtx(p,d,[],'them',0).ev, 0), t.temp);
  }
  const i = g.ai.hand.findIndex(c => c.id===pick);
  g.aiCard = i>=0 ? g.ai.hand.splice(i,1)[0] : {uid:0, id:pick};
}
function aiReact(role){
  const g = S.G, base = cur().ev;
  const cands = uniq(g.ai.hand.filter(c => C[c.id].kind==='tac' && C[c.id].when==='react' && C[c.id].side===role).map(c=>c.id));
  let best = null, bg = role==='off' ? .1 : .12;
  for (const id of cands){ const ev = cur(id).ev, gain = role==='off' ? ev-base : base-ev; if (gain > bg){ bg = gain; best = id; } }
  if (!best) return;
  const i = g.ai.hand.findIndex(c => c.id===best), inst = g.ai.hand.splice(i,1)[0];
  g.ai.disc.push(inst); g.reacts.push({id:best, who:'ai'});
  g.aiMsg = `상대가 <b>${C[best].name}</b> 카드를 썼습니다.`;
}
function selCard(){ const g = S.G; if (g.sel==='base') return {uid:0, id: g.side==='off' ? 'free' : 'd_base'}; return g.me.hand.find(c => c.uid===g.sel); }
function canMain(c){ const k = C[c.id].kind; return S.G.phase==='pre' && k===(S.G.side==='off' ? 'play' : 'def'); }
function canPre(c){ const d = C[c.id]; return S.G.phase==='pre' && d.kind==='tac' && d.when==='pre'; }
function canReact(c){ const d = C[c.id], g = S.G; return g.phase==='react' && d.kind==='tac' && d.when==='react' && d.side===g.side; }
function takeFromHand(uid){ const P = S.G.me, i = P.hand.findIndex(c=>c.uid===uid); return i>=0 ? P.hand.splice(i,1)[0] : null; }
function usePre(){
  const g = S.G, c = selCard(); if (!c || !canPre(c)) return;
  takeFromHand(c.uid); g.me.disc.push(c); g.sel = null;
  if (c.id==='timeout'){ g.peek = true; g.flip = true; }
  else if (c.id==='scout') g.scout = true;
  else if (c.id==='memo') draw(g.me, 2);
  render();
}
function commit(){
  const g = S.G, c = selCard(); if (!c || !canMain(c)) return;
  if (c.uid) takeFromHand(c.uid);
  g.myCard = c; g.sel = null;
  if (g.side==='off'){ g.fam = c.id==='free' ? 0 : g.myPlays.slice(-2).filter(x=>x===c.id).length*.05; g.myPlays.push(c.id); }
  else g.myDefs.push(c.id);
  if (!g.peek) g.flip = true;
  g.phase = 'react';
  if (g.side==='def') aiReact('off');
  if (!g.me.hand.some(canReact)) return pass();
  render();
}
function react(){
  const g = S.G, c = selCard(); if (!c || !canReact(c)) return;
  takeFromHand(c.uid); g.me.disc.push(c); g.reacts.push({id:c.id, who:'me'}); g.sel = null;
  pass();
}
function pass(){
  const g = S.G; if (g.phase!=='react') return;
  if (g.side==='off') aiReact('def');
  resolve();
}
function resolve(){
  const g = S.G, off = g.side==='off', x = cur();
  let kind, pts = 0, and1 = false;
  if (x.foul){ pts = (rnd()<.75) + (rnd()<.75); kind = 'ft'; }
  else if (rnd() < x.to) kind = 'to';
  else if (rnd() < x.p){ kind = 'make'; pts = x.pts; if (x.pts===2 && x.e>=1 && rnd()<.18){ pts++; and1 = true; } }
  else kind = 'miss';
  if (off){ g.us += pts; g.xUs += x.ev; } else { g.them += pts; g.xThem += x.ev; }
  const offC = off ? g.myCard : g.aiCard, defC = off ? g.aiCard : g.myCard;
  let isNew = false;
  if (x.row!=='free'){ const key = x.row+'|'+x.did; isNew = !SAVE.note[key]; SAVE.note[key] = 1; persist(); }
  if (g.myCard.uid) g.me.disc.push(g.myCard);
  if (g.aiCard.uid) g.ai.disc.push(g.aiCard);
  g.res = {kind, pts, and1, x, isNew, offName:C[offC.id].name, defName:C[defC.id].name};
  const reacts = g.reacts.map(r=>C[r.id].name).join('·');
  g.log.unshift({per:perLabel(g), off, txt:`${C[offC.id].name} vs ${C[defC.id].name}${reacts?' ('+reacts+')':''}`,
                 res: kind==='to' ? '턴오버' : kind==='miss' ? '실패' : kind==='ft' ? `FT ${pts}` : `+${pts}`});
  g.phase = 'result'; g.flip = false;
  render();
}
function nextPoss(){
  const g = S.G;
  if (g.side==='off'){ g.side = 'def'; return startPoss(); }
  g.side = 'off'; g.idx++;
  if (g.idx >= perLen(g)){
    if (g.q < 4 || g.us===g.them){ g.q++; g.idx = 0; }
    else return endGame();
  }
  startPoss();
}
function endGame(){
  const g = S.G, win = g.us > g.them;
  if (win && SAVE.stage===g.ti){ SAVE.stage++; persist(); }
  if (win && SAVE.stage < TEAMS.length){ S.offer = ['play','def','tac'].map(k => POOL[k][Math.floor(rnd()*POOL[k].length)]); S.screen = 'draft'; }
  else S.screen = win ? 'champ' : 'over';
  render();
}

      <li>손패에서 맞는 카드를 내면 함께 공개되고, 상성에 따라 성공 확률이 정해집니다.</li>
      <li>공개 후 공격 → 수비 순서로 반응 카드를 한 장씩 쓸 수 있습니다.</li>
      <li>상대 덱 목록은 공개입니다. 남은 카드를 세며 다음 카드를 추리하세요. 상대도 내 덱 구성을 알고 있습니다.</li>
      <li>이기면 카드 한 장을 얻고 한 장을 뺄 수 있습니다. 덱은 다음 라운드로 이어집니다.</li>
    </ul>
    ${bracketHTML()}
    <p class="hint">${deckLine}</p>
    <div class="actions">${st>=TEAMS.length ? `<button class="btn" data-act="reset">새 시즌 (덱 초기화, 노트 유지)</button>` : `<button class="btn" data-act="scout">${TEAMS[st].round} 스카우팅 리포트</button>`}
      <button class="btn sec" data-act="deck">내 덱 보기</button></div>`;
  }
  if (S.screen==='scout'){
    const t = TEAMS[st];
    return `<p class="eyebrow">${t.round} 스카우팅 리포트</p>
    <h2>${esc(t.name)} <span class="stars">${'★'.repeat(t.rating+1)}</span></h2>
    <p>${esc(t.scout)}</p>
    <p class="hint">상대 덱 ${t.deck.length}장${t.rating?` · 전력이 ${t.rating}단계 위라 성공률이 조금씩 차이 납니다`:''}. 쿼터마다 공격 ${PER_Q}번, 수비 ${PER_Q}번, 동점이면 연장.</p>
    <h3>상대 덱</h3>${deckList(sortIds(t.deck))}
    <div class="row"><button class="btn" data-act="tip">팁오프</button><button class="btn sec" data-act="home">돌아가기</button></div>`;
  }
  if (S.screen==='draft'){
    return `<p class="eyebrow">${TEAMS[st-1].round} 승리 · 보상</p><h2>카드 한 장을 덱에 넣으세요</h2>
    <p class="hint">${deckLine}</p>
    <div class="row center">${S.offer.map(id=>`<div style="display:flex;flex-direction:column;gap:8px;align-items:center">${cardHTML(id,{big:true})}<button class="btn" data-act="draft" data-id="${id}">이 카드 받기</button></div>`).join('')}</div>`;
  }
  if (S.screen==='trim'){
    const can = SAVE.deck.length > MIN_DECK;
    return `<p class="eyebrow">덱 정리</p><h2>한 장을 뺄 수 있습니다</h2>
    <p class="hint">${deckLine}. ${can ? '덱이 얇을수록 좋은 카드가 자주 돌아옵니다. 빼지 않아도 됩니다.' : `덱은 최소 ${MIN_DECK}장이어야 합니다.`}</p>
    <div class="row"><button class="btn" data-act="skiptrim">빼지 않고 계속</button></div>
    ${deckList(SAVE.deck, can ? 'trim' : null)}`;
  }
  const g = S.G;
  const stats = g ? `<div class="stat"><div><span>최종 점수</span><b>${g.us} : ${g.them}</b></div><div><span>기대 득점</span><b>${g.xUs.toFixed(1)} : ${g.xThem.toFixed(1)}</b></div><div><span>운</span><b>${(((g.us-g.xUs)-(g.them-g.xThem))>=0?'+':'')+((g.us-g.xUs)-(g.them-g.xThem)).toFixed(1)}</b></div></div>` : '';
  if (S.screen==='champ') return `<p class="eyebrow">결승 승리</p><h2>우승! 컵을 들어 올렸습니다</h2>${stats}<p>${deckLine}. 이 덱으로 세 팀을 모두 꺾었습니다.</p><div class="actions"><button class="btn" data-act="reset">새 시즌 시작</button><button class="btn sec" data-act="deck">우승 덱 보기</button></div>`;
  return `<p class="eyebrow">${T().round} · 경기 종료</p><h2>패배 ${g.us} : ${g.them}</h2>${stats}
    <p>덱은 그대로 남아 있습니다. 상대 남은 카드 기록과 작전 노트를 보고 다시 도전하세요.</p>
    <div class="actions"><button class="btn" data-act="retry">다시 도전</button><button class="btn sec" data-act="deck">내 덱 보기</button></div>`;
}
function deckHTML(){
  return `<p class="eyebrow">내 덱 · ${SAVE.deck.length}장</p><h2>내 덱</h2>${deckList(sortIds(SAVE.deck))}<div class="row"><button class="btn" data-act="close">닫기</button></div>`;
}
function noteHTML(){
  const n = Object.keys(SAVE.note).length;
  const head = DEFS.map(d=>`<th>${d.name}</th>`).join('');
  const body = PLAYS.map(p=>`<tr><th class="r">${p.name}</th>${DEFS.map(d=>{
    if (!SAVE.note[p.id+'|'+d.id]) return '<td class="q">?</td>';
    const e = edge(p.id,d.id), c = e>0?'u':e<0?'d':'e', s = e>=2?'▲▲':e===1?'▲':e===0?'●':e===-1?'▼':'▼▼';
    return `<td class="${c}" title="${esc(why(p.id,d.id))}">${s}</td>`;
  }).join('')}</tr>`).join('');
  return `<p class="eyebrow">공격 작전 × 수비 전술</p><h2>작전 노트 <span class="hint" style="font-family:var(--f-ui);font-size:14px;font-weight:400">${n}/${PLAYS.length*DEFS.length} 발견</span></h2>
    <p class="hint">맞붙어 본 조합만 기록됩니다. 공격 입장의 상성이며 칸에 마우스를 올리면 이유가 보입니다.</p>
    <div class="scroll"><table class="mx"><tr><th></th>${head}</tr>${body}</table></div>
    <div class="row"><button class="btn" data-act="close">닫기</button></div>`;
}

// ---------- card art ----------
const cv = document.createElement('canvas'); cv.width = 440; cv.height = 300;
const x = cv.getContext('2d');
let K = {}, KKEY = '', ART = {};
function readColors(){
  const cs = getComputedStyle(document.documentElement);
  for (const k of ['board','court','us','them','ball','dim','line']) K[k] = cs.getPropertyValue('--'+k).trim();
  const key = Object.values(K).join(); if (key!==KKEY){ KKEY = key; ART = {}; }
}
function head(x1,y1,x2,y2,s=11){ const a = Math.atan2(y2-y1,x2-x1);
  x.beginPath(); x.moveTo(x2,y2); x.lineTo(x2-s*Math.cos(a-.45), y2-s*Math.sin(a-.45)); x.moveTo(x2,y2); x.lineTo(x2-s*Math.cos(a+.45), y2-s*Math.sin(a+.45)); x.stroke(); }
function trim(p,q,a,b){ const d = dist(p,q)||1; return [[p[0]+(q[0]-p[0])/d*a, p[1]+(q[1]-p[1])/d*a],[q[0]-(q[0]-p[0])/d*b, q[1]-(q[1]-p[1])/d*b]]; }
function path(p,q,type,col){
  if (dist(p,q) < 28) return;
  const [a,b] = trim(p,q,17,type==='screen'?4:17);
  x.strokeStyle = col; x.lineWidth = 5.5; x.setLineDash(type==="pass"?[11,10]:[]);
  x.beginPath();
  if (type==='dribble'){
    const L = dist(a,b), ux=(b[0]-a[0])/L, uy=(b[1]-a[1])/L, n = Math.max(2, Math.floor((L-14)/11));
    x.moveTo(a[0],a[1]); for (let i=1;i<=n;i++){ const t=i*11, s=(i%2?1:-1)*6; x.lineTo(a[0]+ux*t-uy*s, a[1]+uy*t+ux*s); } x.lineTo(b[0],b[1]);
  } else { x.moveTo(a[0],a[1]); x.lineTo(b[0],b[1]); }
  x.stroke(); x.setLineDash([]);
  if (type==='screen'){ const g = Math.atan2(b[1]-a[1], b[0]-a[0]), px = -Math.sin(g)*12, py = Math.cos(g)*12; x.beginPath(); x.moveTo(b[0]+px,b[1]+py); x.lineTo(b[0]-px,b[1]-py); x.stroke(); }
  else head(a[0],a[1],b[0],b[1],17);
}
function drawO(p,n,col){ x.strokeStyle = col; x.lineWidth = 5.5; x.beginPath(); x.arc(p[0],p[1],17,0,2*Math.PI); x.stroke();
  x.fillStyle = col; x.font = '600 21px Oswald, sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(n, p[0], p[1]+1); }
function drawX(p,col){ x.strokeStyle = col; x.lineWidth = 6; const r = 13; x.beginPath(); x.moveTo(p[0]-r,p[1]-r); x.lineTo(p[0]+r,p[1]+r); x.moveTo(p[0]+r,p[1]-r); x.lineTo(p[0]-r,p[1]+r); x.stroke(); }
function drawBall(p){ x.fillStyle = K.ball; x.beginPath(); x.arc(p[0]+10,p[1]-10,6.5,0,2*Math.PI); x.fill(); }
function courtArt(){
  x.strokeStyle = K.court; x.lineWidth = 3.6; x.setLineDash([]);
  x.strokeRect(1,1,498,345); x.strokeRect(170,1,160,189);
  x.beginPath(); x.arc(250,190,60,0,Math.PI); x.stroke();
  x.beginPath(); x.arc(250,52,40,0,Math.PI); x.stroke();
  x.beginPath(); x.moveTo(30,1); x.lineTo(30,141.5); x.arc(250,52,237.5,2.756,0.386,true); x.lineTo(470,1); x.stroke();
  x.lineWidth = 4; x.beginPath(); x.moveTo(220,40); x.lineTo(280,40); x.stroke();
  x.strokeStyle = K.ball; x.lineWidth = 3; x.beginPath(); x.arc(250,52,9,0,2*Math.PI); x.stroke();
}
function playArt(p){
  let P = p.start, h = 0;
  p.steps.forEach(st => {
    const N = P.map(q=>q.slice()); for (const i in st.mv) N[i] = st.mv[i];
    const nh = st.b!==undefined ? st.b : h;
    for (let i=0;i<5;i++){ if (N[i][0]===P[i][0] && N[i][1]===P[i][1]) continue;
      path(P[i], N[i], st.scr && st.scr.includes(i) ? 'screen' : (i===h && nh===h ? 'dribble' : 'cut'), K.us); }
    if (nh!==h) path(N[h], N[nh], 'pass', K.us);
    P = N; h = nh;
  });
  const [a,b] = trim(P[h],[B.x,B.y],17,14);
  x.strokeStyle = K.us; x.lineWidth = 4; x.setLineDash([4,9]); x.beginPath(); x.moveTo(a[0],a[1]); x.lineTo(b[0],b[1]); x.stroke(); x.setLineDash([]);
  p.start.forEach((q,i)=>drawO(q,i+1,K.us)); drawBall(p.start[0]);
}
function defArt(d){
  if (ZS[d]){ S0.forEach((q,i)=>drawO(q,i+1,K.dim)); drawBall(S0[0]); defPos(S0,S0[0],-1,d,null,0).forEach(q=>drawX(q,K.them)); return; }
  const O = [[250,330],[455,70],[45,70],[80,240],[282,322]], pnr = PLAY.pnr;
  O.forEach((q,i)=>drawO(q,i+1,K.dim)); drawBall(O[0]);
  const plain = defPos(O,O[0],1.1,'man',pnr,0), act = defPos(O,O[0],1.1,d,pnr,0);
  act.forEach((q,i) => { if (dist(q,plain[i]) > 28) path(plain[i], q, 'cut', K.them); drawX(q,K.them); });
  x.strokeStyle = K.them; x.lineWidth = 3;
  if (d==='switch'){ const a = [214,268], b = [318,268]; x.beginPath(); x.moveTo(a[0],a[1]); x.quadraticCurveTo(266,236,b[0],b[1]); x.stroke(); head(266,236,b[0],b[1],13); head(266,236,a[0],a[1],13); }
  if (d==='blitz'){ x.beginPath(); x.ellipse(262,318,46,30,0,0,2*Math.PI); x.stroke(); }
}
function tacArt(c){
  x.fillStyle = K.ball; x.font = '700 120px Gaegu, cursive'; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText(c.icon, 250, 160);
  x.strokeStyle = K.ball; x.lineWidth = 5; x.beginPath(); x.moveTo(110,250);
  for (let i=1;i<=14;i++) x.lineTo(110+i*20, 250+(i%2?-9:9)); x.stroke();
}
function freeArt(){
  S0.forEach((q,i)=>drawO(q,i+1,K.us)); drawBall(S0[0]);
  path(S0[0],[270,120],'dribble',K.us);
}
function art(id){
  readColors();
  if (ART[id]) return ART[id];
  x.setTransform(1,0,0,1,0,0); x.fillStyle = K.board; x.fillRect(0,0,440,300);
  x.setTransform(.88,0,0,.88,0,0); x.lineCap = 'round'; x.lineJoin = 'round';
  const c = C[id];
  if (c.kind!=='tac') courtArt();
  if (c.kind==='play') c.base ? freeArt() : playArt(PLAY[id]);
  else if (c.kind==='def') defArt(c.def);
  else tacArt(c);
  return ART[id] = cv.toDataURL('image/png');
}

// ---------- events ----------
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, g = S.G;
  if (a==='sel'){ const u = el.dataset.uid==='base' ? 'base' : +el.dataset.uid; g.sel = g.sel===u ? null : u; render(); }
  else if (a==='commit') commit();
  else if (a==='pre') usePre();
  else if (a==='react') react();
  else if (a==='pass') pass();
  else if (a==='next') nextPoss();
  else if (a==='scout'){ S.screen='scout'; S.G=null; render(); }
  else if (a==='tip') newGame(Math.min(SAVE.stage, TEAMS.length-1));
  else if (a==='retry') newGame(g.ti);
  else if (a==='home'){ if (S.screen==='game' && !confirmLeave(el)) return; S.screen='title'; S.G=null; S.modal=null; render(); }
  else if (a==='reset'){ SAVE.stage=0; SAVE.deck=START.slice(); persist(); S.screen='title'; S.G=null; render(); }
  else if (a==='draft'){ SAVE.deck.push(el.dataset.id); persist(); S.screen='trim'; render(); }
  else if (a==='trim'){ SAVE.deck.splice(+el.dataset.i,1); persist(); S.screen='scout'; S.G=null; render(); }
  else if (a==='skiptrim'){ S.screen='scout'; S.G=null; render(); }
  else if (a==='deck'){ S.modal='deck'; render(); }
  else if (a==='note'){ S.modal='note'; render(); }
  else if (a==='close'){ S.modal=null; render(); }
});
// leaving a game needs a second tap, since the viewer has no confirm()
function confirmLeave(el){
  if (el.dataset.armed){ return true; }
  el.dataset.armed = '1'; el.textContent = '한 번 더 누르면 경기 포기'; setTimeout(()=>{ if (el.isConnected){ delete el.dataset.armed; el.textContent='대진표'; } }, 2500);
  return false;
}
$('#modal').addEventListener('click', e => { if (e.target.id==='modal'){ S.modal=null; render(); } });
document.addEventListener('keydown', e => { if (e.key==='Escape' && S.modal){ S.modal=null; render(); } });

function start(data){
  if (data && data.S){ S = data.S; }
  render();
}
window.claude?.hot?.snapshot?.(() => ({S: JSON.parse(JSON.stringify(S))}));
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => render());
new MutationObserver(() => render()).observe(document.documentElement, {attributes:true, attributeFilter:['data-theme']});
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { ART = {}; KKEY = ''; render(); });
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
</body>
</html>
